<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الخوارزمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #020617; --card: #0f172a; --text: #f8fafc; --accent: #3b82f6; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); height: 100dvh; margin: 0; overflow: hidden; }
        .glass { background: var(--card); border: 1px solid rgba(255,255,255,0.05); }
        .page { display: none; height: calc(100% - 130px); flex-direction: column; padding: 1rem; overflow-y: auto; }
        .active-page { display: flex; }
        @media (min-width: 769px) { .page { height: calc(100% - 70px); } .sidebar-desktop { display: flex; width: 260px; } .bottom-nav { display: none; } }
        .btn-nav { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; gap: 4px; color: gray; cursor: pointer; }
        .btn-nav.active { color: var(--accent); }
        .chat-bubble { max-width: 80%; padding: 10px 14px; border-radius: 18px; font-size: 14px; margin-bottom: 4px; }
        .my-msg { background: var(--accent); color: white; align-self: flex-start; border-bottom-right-radius: 4px; }
        .other-msg { background: rgba(255,255,255,0.1); color: var(--text); align-self: flex-end; border-bottom-left-radius: 4px; }
    </style>
</head>
<body class="flex flex-col md:flex-row">

    <div id="authPage" class="fixed inset-0 z-[2000] bg-slate-950 flex items-center justify-center p-6 text-center">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-sm border border-blue-500/20 shadow-2xl">
            <h2 id="authTitle" class="text-2xl font-bold mb-6 text-blue-500">الخوارزمية</h2>
            <div class="space-y-3">
                <input type="text" id="uName" placeholder="اسم المستخدم" class="w-full p-4 rounded-2xl bg-slate-900 border border-white/5 outline-none text-center focus:border-blue-500">
                <input type="password" id="uPass" placeholder="كلمة السر" class="w-full p-4 rounded-2xl bg-slate-900 border border-white/5 outline-none text-center focus:border-blue-500">
                <button onclick="handleAuth()" id="authBtn" class="w-full bg-blue-600 p-4 rounded-2xl font-bold hover:bg-blue-500 active:scale-95 transition-all">دخول</button>
                <button onclick="toggleAuth()" id="toggleBtn" class="text-xs text-gray-400 underline mt-4 block mx-auto">ليس لديك حساب؟ سجل الآن</button>
            </div>
        </div>
    </div>

    <aside class="sidebar-desktop glass border-l border-white/5 flex-col p-6 hidden md:flex">
        <h1 class="text-xl font-bold text-blue-500 mb-10"><i class="fas fa-terminal ml-2"></i>الخوارزمية</h1>
        <nav class="flex flex-col gap-2 flex-1">
            <button onclick="showPage('dashboard')" class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/5 w-full text-right"><i class="fas fa-home"></i> الرئيسية</button>
            <button onclick="showPage('chat-select')" class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/5 w-full text-right"><i class="fas fa-comment-dots"></i> الدردشة</button>
            <button onclick="showPage('members')" class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/5 w-full text-right"><i class="fas fa-users"></i> الأعضاء</button>
            <button onclick="showPage('library')" class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/5 w-full text-right"><i class="fas fa-book"></i> المكتبة</button>
        </nav>
        <button onclick="logout()" class="flex items-center gap-3 p-3 rounded-xl text-red-500 hover:bg-red-500/10 w-full text-right font-bold mt-auto pt-4 border-t border-white/5">
            <i class="fas fa-sign-out-alt"></i> تسجيل الخروج
        </button>
    </aside>

    <main class="flex-1 relative h-full flex flex-col">
        <header class="p-4 glass border-b border-white/5 flex justify-between items-center md:hidden">
            <span class="font-bold text-blue-500">الخوارزمية</span>
            <button onclick="logout()" class="text-red-500 text-xs font-bold">خروج</button>
        </header>

        <div id="p-dashboard" class="page active-page">
            <h2 id="helloUser" class="text-2xl font-bold mb-4 pt-4"></h2>
            <div class="glass p-6 rounded-3xl border-r-4 border-blue-500 shadow-lg">
                <p id="userCount" class="text-4xl font-black">0</p>
                <p class="text-xs opacity-50 uppercase tracking-widest mt-1">عضو مسجل</p>
            </div>
        </div>

        <div id="p-chat-select" class="page">
            <h2 class="text-xl font-bold mb-4">ابدأ دردشة</h2>
            <div id="chatUserList" class="space-y-2"></div>
        </div>

        <div id="p-members" class="page">
            <h2 class="text-xl font-bold mb-4 text-blue-400">أعضاء الفريق</h2>
            <div id="memberList" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
        </div>

        <div id="p-chat-room" class="page !p-0">
            <div class="p-3 bg-slate-900 border-b border-white/5 flex items-center gap-3">
                <button onclick="showPage('chat-select')" class="text-blue-500 px-2"><i class="fas fa-arrow-right"></i></button>
                <span id="chattingWith" class="font-bold text-sm">...</span>
            </div>
            <div id="chatBox" class="flex-1 overflow-y-auto p-4 flex flex-col"></div>
            <div class="p-3 glass border-t border-white/10 flex gap-2">
                <input type="text" id="chatInput" placeholder="اكتب رسالة..." class="flex-1 bg-white/5 p-3 rounded-xl outline-none text-sm focus:bg-white/10 transition-all">
                <button onclick="sendMsg()" class="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center hover:bg-blue-500 transition-all active:scale-90"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>

        <div id="p-library" class="page">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">المكتبة 📚</h2>
                <div id="adminTools" class="hidden">
                    <input type="file" id="libFile" class="hidden" onchange="uploadFile()">
                    <button onclick="document.getElementById('libFile').click()" class="bg-blue-600 px-4 py-2 rounded-xl text-[10px] font-bold shadow-lg shadow-blue-600/30 active:scale-95 transition-all">
                         رفع ملف
                    </button>
                </div>
            </div>
            <div id="libraryList" class="grid gap-3 pb-20"></div>
        </div>

        <nav class="bottom-nav fixed bottom-0 left-0 right-0 h-16 glass border-t border-white/10 flex items-center justify-around z-50">
            <button onclick="showPage('dashboard')" class="btn-nav active"><i class="fas fa-home"></i><span>الرئيسية</span></button>
            <button onclick="showPage('chat-select')" class="btn-nav"><i class="fas fa-comment-dots"></i><span>الدردشة</span></button>
            <button onclick="showPage('members')" class="btn-nav"><i class="fas fa-users"></i><span>الأعضاء</span></button>
            <button onclick="showPage('library')" class="btn-nav"><i class="fas fa-book"></i><span>المكتبة</span></button>
        </nav>
    </main>

    <script>
        // بيانات سوبابيز الخاصة بمشروعك
        const supabaseUrl = 'https://xhyfprrvpzasbywehzid.supabase.co';
        const supabaseKey = 'sb_publishable_lJ85dVr8A5dOvXWRZ6SWvw_rSwSfp1J';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let currentUser = null, targetUser = null, isLogin = true;

        window.onload = () => {
            const saved = localStorage.getItem('algo_user');
            if(saved) { currentUser = JSON.parse(saved); loginSuccess(); }
        };

        function toggleAuth() {
            isLogin = !isLogin;
            document.getElementById('authTitle').innerText = isLogin ? 'دخول الخوارزمية' : 'إنشاء حساب جديد';
            document.getElementById('authBtn').innerText = isLogin ? 'دخول' : 'تسجيل';
            document.getElementById('toggleBtn').innerText = isLogin ? 'ليس لديك حساب؟ سجل الآن' : 'لديك حساب؟ سجل دخولك';
        }

        async function handleAuth() {
            const user = document.getElementById('uName').value.trim(), pass = document.getElementById('uPass').value;
            if(!user || !pass) return alert('البيانات ناقصة!');
            
            if(isLogin) {
                const { data, error } = await _supabase.from('profiles').select('*').eq('username', user).eq('password', pass).single();
                if(data) { currentUser = data; localStorage.setItem('algo_user', JSON.stringify(data)); loginSuccess(); }
                else alert('الاسم أو كلمة السر غلط!');
            } else {
                const { error } = await _supabase.from('profiles').insert([{ username: user, password: pass, role: 'USER' }]);
                if(!error) { alert('تم إنشاء حسابك! سجل دخولك دلوقتي'); toggleAuth(); }
                else alert('الاسم ده محجوز لواحد تاني');
            }
        }

        function loginSuccess() {
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('helloUser').innerText = `أهلاً بك يا ${currentUser.username}`;
            if(currentUser.role === 'ADMIN') document.getElementById('adminTools').classList.remove('hidden');
            initApp();
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById('p-' + id).classList.add('active-page');
            document.querySelectorAll('.btn-nav').forEach(b => b.classList.remove('active'));
            const map = { 'dashboard':0, 'chat-select':1, 'chat-room':1, 'members':2, 'library':3 };
            document.querySelectorAll('.btn-nav')[map[id]]?.classList.add('active');
        }

        function initApp() {
            updateUI();
            _supabase.channel('room').on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, () => updateUI()).subscribe();
        }

        async function updateUI() {
            // تحديث قائمة الأعضاء
            const { data: users } = await _supabase.from('profiles').select('*');
            if(users) {
                document.getElementById('userCount').innerText = users.length;
                document.getElementById('chatUserList').innerHTML = users.filter(u => u.username !== currentUser.username).map(u => `
                    <div onclick="targetUser='${u.username}'; document.getElementById('chattingWith').innerText='${u.username}'; showPage('chat-room'); updateUI();" class="glass p-4 rounded-xl flex items-center gap-3 cursor-pointer hover:bg-white/5 transition-all active:scale-[0.98] border border-white/5">
                        <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center font-bold text-sm shadow-inner">${u.username[0]}</div>
                        <span class="text-sm font-bold">${u.username}</span>
                    </div>`).join('');
                document.getElementById('memberList').innerHTML = users.map(u => `<div class="glass p-3 rounded-xl border-r-2 ${u.username === currentUser.username ? 'border-green-500' : 'border-blue-500/30'} shadow-sm"><p class="font-bold text-xs">${u.username}</p><p class="text-[8px] opacity-50 uppercase tracking-tighter">${u.role}</p></div>`).join('');
            }

            // تحديث الرسائل والمكتبة
            const { data: msgs } = await _supabase.from('messages').select('*').order('created_at', { ascending: true });
            if(msgs) {
                if(targetUser) {
                    const filtered = msgs.filter(m => (m.username === currentUser.username && m.receiver === targetUser) || (m.username === targetUser && m.receiver === currentUser.username));
                    document.getElementById('chatBox').innerHTML = filtered.map(m => `<div class="chat-bubble ${m.username === currentUser.username ? 'my-msg' : 'other-msg'} shadow-md"><p class="text-[8px] opacity-40 mb-1">${m.username}</p><p>${m.content}</p></div>`).join('');
                    document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
                }
                
                // عرض ملفات المكتبة
                document.getElementById('libraryList').innerHTML = msgs.filter(m => m.content && m.content.startsWith('ALGO_FILE:')).map(m => {
                    const parts = m.content.replace('ALGO_FILE:', '').split('|');
                    const url = parts[0], name = parts[1], storageName = parts[2];
                    return `
                        <div class="glass p-4 rounded-2xl flex justify-between items-center border border-white/5 hover:border-blue-500/20 transition-all shadow-lg">
                            <div class="flex items-center gap-3 truncate max-w-[60%]">
                                <i class="fas fa-file-pdf text-red-500 text-xl"></i>
                                <span class="text-xs font-bold truncate">${name}</span>
                            </div>
                            <div class="flex gap-2">
                                <a href="${url}" target="_blank" class="bg-blue-600/20 text-blue-400 px-3 py-1 rounded-lg text-[10px] font-bold">فتح</a>
                                ${currentUser.role === 'ADMIN' ? `<button onclick="deleteFile(${m.id}, '${storageName}')" class="bg-red-600/20 text-red-500 px-3 py-1 rounded-lg text-[10px] font-bold">حذف</button>` : ''}
                            </div>
                        </div>`;
                }).join('');
            }
        }

        async function uploadFile() {
            const fileInput = document.getElementById('libFile');
            const file = fileInput.files[0];
            if (!file) return;

            try {
                // اسم ملف عشوائي لتجنب مشاكل الأسماء العربي في الروابط
                const fileExt = file.name.split('.').pop();
                const storageName = `algo_${Date.now()}.${fileExt}`;
                
                // الرفع لـ سوبابيز
                const { data, error: storageError } = await _supabase.storage
                    .from('files')
                    .upload(storageName, file);

                if (storageError) throw storageError;

                // الحصول على الرابط
                const { data: { publicUrl } } = _supabase.storage.from('files').getPublicUrl(storageName);
                
                // تسجيله في المكتبة (جدول الرسائل)
                const { error: dbError } = await _supabase.from('messages').insert([{
                    username: currentUser.username,
                    content: `ALGO_FILE:${publicUrl}|${file.name}|${storageName}`,
                    receiver: 'LIBRARY'
                }]);

                if (!dbError) {
                    alert('تم إضافة الملف للمكتبة يا بطل! ✅');
                    updateUI();
                }
            } catch (err) {
                alert('خطأ في الرفع: ' + err.message);
            }
        }

        async function deleteFile(msgId, storageName) {
            if(!confirm('أكيد عايز تمسح الملف ده؟')) return;
            try {
                await _supabase.storage.from('files').remove([storageName]);
                await _supabase.from('messages').delete().eq('id', msgId);
                alert('تم الحذف ✅');
                updateUI();
            } catch (err) {
                alert('فشل الحذف');
            }
        }

        async function sendMsg() {
            const input = document.getElementById('chatInput');
            if(!input.value.trim() || !targetUser) return;
            await _supabase.from('messages').insert([{ username: currentUser.username, content: input.value, receiver: targetUser }]);
            input.value = '';
        }

        function logout() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
