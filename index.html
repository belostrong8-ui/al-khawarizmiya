<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخوارزمية Ultimate - V30.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #020617; --card: #0f172a; --text: #f8fafc; --accent: #3b82f6; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); height: 100vh; overflow: hidden; margin: 0; }
        .glass { background: var(--card); border: 1px solid rgba(255,255,255,0.05); }
        .page { display: none; height: 100%; flex-direction: column; padding: 1.5rem; overflow-y: auto; }
        .active-page { display: flex; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .sidebar-btn { width: 100%; text-align: right; padding: 1rem; border-radius: 1rem; display: flex; align-items: center; gap: 1rem; cursor: pointer; transition: 0.2s; }
        .sidebar-btn:hover, .sidebar-btn.active { background: var(--accent); color: white; }
        #previewModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; padding: 20px; }
    </style>
</head>
<body class="flex">

    <div id="previewModal">
        <div class="flex justify-between mb-4 text-white">
            <h3 id="previewTitle">معاينة</h3>
            <button onclick="closePreview()" class="text-2xl text-red-500 font-bold">&times; إغلاق</button>
        </div>
        <iframe id="previewFrame" class="w-full h-[90%] rounded-xl bg-white"></iframe>
    </div>

    <div id="authPage" class="fixed inset-0 z-[500] bg-slate-950 flex items-center justify-center p-4">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-md text-center border-blue-500/30 border shadow-2xl">
            <h2 id="authTitle" class="text-2xl font-bold mb-6 text-blue-500">الخوارزمية - دخول</h2>
            <div class="space-y-4">
                <input type="text" id="uName" placeholder="اسم المستخدم" class="w-full p-4 rounded-xl text-center bg-slate-900 border border-white/10 outline-none text-white">
                <input type="password" id="uPass" placeholder="كلمة السر" class="w-full p-4 rounded-xl text-center bg-slate-900 border border-white/10 outline-none text-white">
                <button onclick="handleAuth()" id="authMainBtn" class="w-full bg-blue-600 p-4 rounded-xl font-bold hover:bg-blue-700 transition text-white">دخول</button>
                <button onclick="toggleAuthMode()" id="toggleAuthBtn" class="text-blue-400 text-xs mt-2 underline cursor-pointer">إنشاء حساب جديد</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden flex w-full h-full">
        <aside class="w-64 glass flex flex-col p-4 border-l border-white/5">
            <div class="mb-8 px-2 flex items-center gap-3"><i class="fas fa-terminal text-2xl text-blue-500"></i><h1 class="font-bold text-xl">الخوارزمية</h1></div>
            <nav class="flex-1 space-y-1">
                <button onclick="showPage('dashboard')" id="btn-dashboard" class="sidebar-btn active"><i class="fas fa-home"></i> الرئيسية</button>
                <button onclick="showPage('chat')" id="btn-chat" class="sidebar-btn"><i class="fas fa-comments"></i> المحادثة</button>
                <button onclick="showPage('library')" id="btn-library" class="sidebar-btn"><i class="fas fa-book"></i> المكتبة</button>
                <button id="adminLink" onclick="showPage('admin')" class="hidden sidebar-btn text-yellow-500"><i class="fas fa-crown"></i> لوحة القائد</button>
            </nav>
            <button onclick="requestNotify()" class="p-2 mb-2 text-[10px] glass rounded-lg text-blue-400">تفعيل إشعارات الهاتف 🔔</button>
            <button onclick="logout()" class="w-full p-3 bg-red-500/10 text-red-500 rounded-xl font-bold">خروج</button>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <div id="p-dashboard" class="page active-page">
                <h2 id="helloUser" class="text-3xl font-bold mb-8"></h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="glass p-8 rounded-3xl border-r-8 border-blue-500"><p class="opacity-60 mb-2">الأعضاء</p><p id="userCount" class="text-6xl font-black">0</p></div>
                    <div class="glass p-8 rounded-3xl border-r-8 border-red-500"><p class="opacity-60 mb-2">الملفات</p><p id="fileCount" class="text-6xl font-black">0</p></div>
                </div>
            </div>

            <div id="p-chat" class="page">
                <div id="chatBox" class="flex-1 glass rounded-2xl p-4 mb-4 overflow-y-auto flex flex-col gap-3"></div>
                <div class="flex gap-2 p-2 glass rounded-2xl">
                    <input type="text" id="chatInput" class="flex-1 bg-transparent p-4 outline-none text-white" placeholder="اكتب رسالة...">
                    <button onclick="sendMsg()" class="bg-blue-600 h-12 w-12 rounded-xl"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

            <div id="p-library" class="page">
                <div class="flex flex-col md:flex-row justify-between gap-4 mb-6">
                    <h2 class="text-2xl font-bold">المكتبة الرقمية</h2>
                    <input type="text" id="libSearch" oninput="renderFiles()" placeholder="بحث في الملفات..." class="bg-slate-900 border border-white/10 p-2 rounded-lg outline-none w-full md:w-64 text-white">
                    <input type="file" id="libFile" accept="application/pdf" class="hidden" onchange="uploadFile()">
                    <button id="upBtn" onclick="document.getElementById('libFile').click()" class="hidden bg-blue-600 px-6 py-2 rounded-xl font-bold text-sm">رفع ملف جديد</button>
                </div>
                <div id="fileList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 text-white"></div>
            </div>

            <div id="p-admin" class="page">
                <h2 class="text-2xl font-bold text-yellow-500 mb-6">إدارة النظام</h2>
                <div class="glass p-6 rounded-3xl max-w-md">
                    <h3 class="font-bold mb-4">إضافة عضو يدوياً</h3>
                    <input type="text" id="addU" placeholder="الاسم" class="w-full p-4 mb-2 rounded-xl bg-slate-900 border border-white/10 outline-none text-white">
                    <input type="password" id="addP" placeholder="الباسورد" class="w-full p-4 mb-4 rounded-xl bg-slate-900 border border-white/10 outline-none text-white">
                    <button onclick="addUser()" class="w-full bg-blue-600 p-4 rounded-xl font-bold">إضافة للفريق</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        let users = JSON.parse(localStorage.getItem('alg_db_v30') || '[{"name":"belal","pass":"159078@1#","role":"ADMIN"}]');
        let session = JSON.parse(localStorage.getItem('alg_session_v30') || 'null');
        let msgs = JSON.parse(localStorage.getItem('alg_msgs_v30') || '[]');
        let files = JSON.parse(localStorage.getItem('alg_files_v30') || '[]');
        let isLoginMode = true;

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('authTitle').innerText = isLoginMode ? 'الخوارزمية - دخول' : 'الخوارزمية - حساب جديد';
            document.getElementById('authMainBtn').innerText = isLoginMode ? 'دخول' : 'إنشاء حساب';
            document.getElementById('toggleAuthBtn').innerText = isLoginMode ? 'إنشاء حساب جديد' : 'لديك حساب؟ دخول';
        }

        function handleAuth() {
            const n = document.getElementById('uName').value.trim().toLowerCase();
            const p = document.getElementById('uPass').value;
            if(!n || !p) return alert('أكمل البيانات!');

            if(isLoginMode) {
                const u = users.find(x => x.name === n && x.pass === p);
                if(u) { localStorage.setItem('alg_session_v30', JSON.stringify(u)); location.reload(); }
                else alert('خطأ في الاسم أو كلمة السر!');
            } else {
                if(users.find(x => x.name === n)) return alert('الاسم مستخدم بالفعل!');
                users.push({name: n, pass: p, role: 'USER'});
                localStorage.setItem('alg_db_v30', JSON.stringify(users));
                alert('تم إنشاء الحساب بنجاح! سجل دخولك الآن.');
                toggleAuthMode();
            }
        }

        function updateUI() {
            if(!session) return;
            document.getElementById('helloUser').innerText = `أهلاً ${session.name === 'belal' ? 'بالقائد Belal 👑' : session.name}`;
            document.getElementById('userCount').innerText = users.length;
            document.getElementById('fileCount').innerText = files.length;
            if(session.role === 'ADMIN') {
                document.getElementById('adminLink').classList.remove('hidden');
                document.getElementById('upBtn').classList.remove('hidden');
            }
            renderChat(); renderFiles();
        }

        function requestNotify() {
            Notification.requestPermission().then(p => { if(p === 'granted') alert('🔔 الإشعارات مفعلة!'); });
        }

        function sendNotify(title, body) {
            if(Notification.permission === 'granted') { new Notification(title, { body: body }); }
        }

        function renderFiles() {
            const term = document.getElementById('libSearch').value.toLowerCase();
            const list = document.getElementById('fileList');
            const filtered = files.filter(f => f.name.toLowerCase().includes(term));
            list.innerHTML = filtered.map(f => `
                <div class="glass p-4 rounded-xl flex justify-between items-center">
                    <div class="cursor-pointer flex-1" onclick="previewPDF('${f.url}', '${f.name}')">
                        <p class="font-bold text-sm truncate">📄 ${f.name}</p>
                        <p class="text-[10px] opacity-40">بواسطة: ${f.sender}</p>
                    </div>
                    ${session.role === 'ADMIN' ? `<button onclick="delFile(${f.id})" class="text-red-500 mr-2"><i class="fas fa-trash"></i></button>` : ''}
                </div>
            `).join('');
        }

        function previewPDF(url, name) {
            document.getElementById('previewTitle').innerText = name;
            document.getElementById('previewFrame').src = url;
            document.getElementById('previewModal').style.display = 'block';
        }

        function closePreview() { document.getElementById('previewModal').style.display = 'none'; document.getElementById('previewFrame').src = ''; }

        function uploadFile() {
            const file = document.getElementById('libFile').files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                files.push({ id: Date.now(), name: file.name, url: e.target.result, sender: session.name });
                if(files.length > 20) files.shift();
                localStorage.setItem('alg_files_v30', JSON.stringify(files));
                sendNotify("ملف جديد في المكتبة", `قام ${session.name} برفع ${file.name}`);
                renderFiles();
                document.getElementById('fileCount').innerText = files.length;
            };
            reader.readAsDataURL(file);
        }

        function sendMsg() {
            const input = document.getElementById('chatInput');
            if(!input.value.trim()) return;
            msgs.push({id: Date.now(), user: session.name, text: input.value});
            if(msgs.length > 50) msgs.shift();
            localStorage.setItem('alg_msgs_v30', JSON.stringify(msgs));
            input.value = ''; renderChat();
        }

        function renderChat() {
            const box = document.getElementById('chatBox');
            box.innerHTML = msgs.map(m => `
                <div class="p-3 glass rounded-xl ${m.user === session.name ? 'mr-auto bg-blue-500/10' : 'ml-auto'} max-w-[80%]">
                    <p class="text-[10px] font-bold text-blue-400">${m.user}</p>
                    <p class="text-sm text-white">${m.text}</p>
                </div>
            `).join('');
            box.scrollTop = box.scrollHeight;
        }

        function delFile(id) {
            if(confirm('حذف الملف؟')) {
                files = files.filter(f => f.id !== id);
                localStorage.setItem('alg_files_v30', JSON.stringify(files));
                renderFiles();
                document.getElementById('fileCount').innerText = files.length;
            }
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('p-'+id).classList.add('active-page');
            document.getElementById('btn-'+id).classList.add('active');
        }

        function addUser() {
            const n = document.getElementById('addU').value.trim().toLowerCase();
            const p = document.getElementById('addP').value;
            if(n && p) {
                users.push({name:n, pass:p, role:'USER'});
                localStorage.setItem('alg_db_v30', JSON.stringify(users));
                alert('تم إضافة العضو بنجاح!');
                document.getElementById('userCount').innerText = users.length;
            }
        }

        function logout() { localStorage.removeItem('alg_session_v30'); location.reload(); }
        
        if(session) {
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            updateUI();
        }
    </script>
</body>
</html>
