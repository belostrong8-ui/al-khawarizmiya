<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الخوارزمية - V18.0 Emergency Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #020617; --card: #0f172a; --text: #f8fafc; --accent: #3b82f6; }
        .light-mode { --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --accent: #2563eb; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); height: 100vh; overflow: hidden; margin: 0; }
        .glass { background: var(--card); border: 1px solid rgba(128,128,128,0.2); }
        .page { display: none; height: 100%; flex-direction: column; padding: 1.5rem; overflow-y: auto; }
        .active-page { display: flex; }
        .sidebar-btn { width: 100%; text-align: right; padding: 0.8rem; border-radius: 0.8rem; display: flex; align-items: center; gap: 0.8rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .sidebar-btn:hover, .sidebar-btn.active { background: var(--accent); color: white; }
    </style>
</head>
<body class="flex">

    <div id="authPage" class="fixed inset-0 z-[500] bg-slate-950 flex items-center justify-center p-4">
        <div class="glass p-8 rounded-[2rem] w-full max-w-md text-center border-blue-500/50 border shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 text-blue-500">دخول الخوارزمية</h2>
            <div class="space-y-4">
                <input type="text" id="uName" placeholder="اسم المستخدم" class="w-full p-4 rounded-xl text-center bg-slate-900 text-white outline-none border border-white/5">
                <input type="password" id="uPass" placeholder="كلمة السر" class="w-full p-4 rounded-xl text-center bg-slate-900 text-white outline-none border border-white/5">
                <button onclick="handleAuth()" class="w-full bg-blue-600 p-4 rounded-xl font-bold">دخول</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden flex w-full h-full">
        <aside class="w-64 glass flex flex-col p-4 border-l border-white/10">
            <div class="mb-8 px-2 flex items-center gap-3"><i class="fas fa-terminal text-blue-500 text-2xl"></i><h1 class="font-bold text-xl">الخوارزمية</h1></div>
            <nav class="flex-1 space-y-1">
                <button onclick="showPage('dashboard')" id="btn-dashboard" class="sidebar-btn active"><i class="fas fa-home"></i> الرئيسية</button>
                <button onclick="showPage('chat')" id="btn-chat" class="sidebar-btn"><i class="fas fa-comments"></i> المحادثة</button>
                <button onclick="showPage('library')" id="btn-library" class="sidebar-btn"><i class="fas fa-book"></i> المكتبة</button>
                <button id="adminLink" onclick="showPage('admin')" class="hidden sidebar-btn text-yellow-500"><i class="fas fa-crown"></i> لوحة القائد</button>
            </nav>
            <button onclick="logout()" class="mt-auto w-full p-2 bg-red-500/10 text-red-500 rounded-xl font-bold">خروج</button>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <div id="p-dashboard" class="page active-page">
                <h2 id="helloUser" class="text-3xl font-bold"></h2>
            </div>

            <div id="p-chat" class="page">
                <div id="chatBox" class="flex-1 glass rounded-2xl p-4 mb-4 overflow-y-auto flex flex-col gap-3"></div>
                <div class="flex gap-2 bg-slate-900/50 p-2 rounded-2xl border border-white/5">
                    <input type="text" id="chatInput" class="flex-1 bg-transparent p-2 outline-none text-white" placeholder="اكتب رسالة...">
                    <button onclick="sendMsg()" class="bg-blue-600 px-6 py-2 rounded-xl text-white"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

            <div id="p-library" class="page">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">المكتبة</h2>
                    <div id="adminLib" class="hidden">
                        <input type="file" id="libFileInput" class="hidden" onchange="uploadToLibrary()">
                        <button onclick="document.getElementById('libFileInput').click()" class="bg-blue-600 px-4 py-2 rounded-lg font-bold text-xs">رفع ملف</button>
                    </div>
                </div>
                <div id="libraryList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>

            <div id="p-admin" class="page">
                <h2 class="text-2xl font-bold text-yellow-500 mb-6">لوحة القائد بلال</h2>
                <div class="glass p-6 rounded-2xl border-yellow-500/20 border">
                    <p class="text-xs opacity-60 mb-4">أدخل الـ ID الخاص بالرسالة/الملف لحذفه نهائياً في حال تعطل الأزرار:</p>
                    <input type="number" id="forceDeleteId" class="w-full p-4 bg-slate-800 rounded-xl mb-4 outline-none text-white" placeholder="رقم الـ ID...">
                    <button onclick="forceDelete()" class="w-full bg-red-600 p-4 rounded-xl font-bold text-white">حذف إجباري</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const supabaseUrl = 'https://xhyfprrvpzasbywehzid.supabase.co';
        const supabaseKey = 'sb_publishable_lJ85dVr8A5dOvXWRZ6SWvw_rSwSfp1J';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);
        let currentUser = null;

        window.onload = () => {
            const saved = localStorage.getItem('algo_user');
            if(saved) { currentUser = JSON.parse(saved); loginSuccess(); }
        };

        async function handleAuth() {
            const n = document.getElementById('uName').value.trim().toLowerCase();
            const p = document.getElementById('uPass').value;
            const { data } = await _supabase.from('profiles').select('*').eq('username', n).eq('password', p).single();
            if(data) { currentUser = data; localStorage.setItem('algo_user', JSON.stringify(data)); loginSuccess(); } else alert('خطأ!');
        }

        function loginSuccess() {
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            if(currentUser.username === 'belal') { document.getElementById('adminLink').classList.remove('hidden'); document.getElementById('adminLib').classList.remove('hidden'); }
            initApp();
        }

        function initApp() {
            updateUI();
            _supabase.channel('room').on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, () => updateUI()).subscribe();
        }

        async function updateUI() {
            if(!currentUser) return;
            document.getElementById('helloUser').innerText = `أهلاً ${currentUser.username === 'belal' ? 'بالقائد بلال 👑' : currentUser.username}`;
            
            const { data: msgs } = await _supabase.from('messages').select('*').order('created_at', { ascending: false });
            if(msgs) {
                // الشات
                document.getElementById('chatBox').innerHTML = msgs
                    .filter(m => !m.content.startsWith('LIB_FILE:') && m.content.length < 1000) 
                    .reverse().map(m => {
                        const isMy = m.username === currentUser.username;
                        return `<div class="p-3 glass rounded-xl ${isMy ? 'mr-auto bg-blue-500/20' : 'ml-auto'} max-w-[80%] relative group shadow-sm">
                            <span class="text-[10px] text-blue-400 font-bold">${m.username} (ID: ${m.id})</span>
                            <p class="text-sm">${m.content}</p>
                            <button onclick="deleteMsg(${m.id})" class="absolute -top-2 -right-2 bg-red-600 text-white w-5 h-5 rounded-full text-[10px] hidden group-hover:block"><i class="fas fa-times"></i></button>
                        </div>`;
                    }).join('');
                document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;

                // المكتبة
                const libFiles = msgs.filter(m => m.content.startsWith('LIB_FILE:'));
                document.getElementById('libraryList').innerHTML = libFiles.map(f => {
                    const [mime, url, name] = f.content.replace('LIB_FILE:', '').split('|');
                    return `<div class="glass p-4 rounded-xl border border-white/5 flex flex-col gap-3 shadow-lg">
                        <div class="flex items-center gap-3"><i class="fas fa-file-pdf text-red-500 text-2xl"></i><span class="text-[10px] font-bold truncate w-32">${name} (ID: ${f.id})</span></div>
                        <div class="flex gap-2">
                            <button onclick="openFile('${url}')" class="flex-1 bg-blue-600 py-2 rounded-lg text-[10px] text-white">فتح</button>
                            <button onclick="deleteMsg(${f.id})" class="bg-red-500/20 text-red-500 px-3 rounded-lg"><i class="fas fa-trash text-xs"></i></button>
                        </div>
                    </div>`;
                }).join('');
            }
        }

        async function deleteMsg(id) {
            if(!id) return;
            const { error } = await _supabase.from('messages').delete().eq('id', id);
            if(error) alert('فشل الحذف: ' + error.message);
            else updateUI();
        }

        async function forceDelete() {
            const id = document.getElementById('forceDeleteId').value;
            if(!id) return;
            await deleteMsg(id);
            document.getElementById('forceDeleteId').value = '';
            alert('تم تنفيذ أمر الحذف الإجباري للـ ID: ' + id);
        }

        function openFile(b64) { const w = window.open(); w.document.write(`<iframe src="${b64}" frameborder="0" style="width:100%; height:100%;"></iframe>`); }
        async function uploadToLibrary() {
            const f = document.getElementById('libFileInput').files[0]; if(!f) return;
            const r = new FileReader(); r.onload = async (e) => { await _supabase.from('messages').insert([{ username: 'SYSTEM', content: `LIB_FILE:${f.type}|${e.target.result}|${f.name}` }]); }; r.readAsDataURL(f);
        }
        async function sendMsg() { const t = document.getElementById('chatInput').value.trim(); if(t) await _supabase.from('messages').insert([{ username: currentUser.username, content: t }]); document.getElementById('chatInput').value = ''; }
        function showPage(id) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page')); document.getElementById('p-'+id).classList.add('active-page'); }
        function logout() { localStorage.removeItem('algo_user'); location.reload(); }
    </script>
</body>
</html>
