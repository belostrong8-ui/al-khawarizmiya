<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="tabTitle">الخوارزمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #020617; --card: #0f172a; --text: #f8fafc; --accent: #3b82f6; }
        .light-mode { --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --accent: #2563eb; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); transition: 0.3s; overflow: hidden; height: 100vh; margin: 0; }
        .glass { background: var(--card); border: 1px solid rgba(255,255,255,0.05); }
        .page { display: none; height: 100%; flex-direction: column; overflow-y: auto; padding: 1.5rem; }
        .active-page { display: flex; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .sidebar-btn { width: 100%; text-align: right; padding: 0.8rem; border-radius: 1rem; display: flex; align-items: center; gap: 1rem; font-weight: bold; transition: 0.2s; cursor: pointer; }
        .sidebar-btn:hover { background: rgba(59, 130, 246, 0.1); color: var(--accent); }
        .news-ticker { background: linear-gradient(90deg, #1e293b, #3b82f633); border-radius: 12px; padding: 12px; margin-bottom: 20px; border: 1px solid #3b82f644; }
        .msg-bubble { background: #1e293b; padding: 12px; border-radius: 15px; margin-bottom: 10px; max-width: 85%; border-right: 3px solid var(--accent); }
        .user-selector { cursor: pointer; transition: 0.3s; border: 2px solid transparent; }
        .user-selector:hover { border-color: var(--accent); transform: scale(1.05); background: rgba(59, 130, 246, 0.05); }
    </style>
</head>
<body class="flex">

    <div id="authPage" class="fixed inset-0 z-[200] bg-slate-950 flex items-center justify-center p-4">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-md text-center border-blue-500/20 border shadow-2xl">
            <h2 class="text-3xl font-bold mb-8">الخوارزمية</h2>
            <div id="loginBox">
                <input type="text" id="uName" placeholder="اسم المستخدم" class="w-full p-4 mb-4 rounded-2xl bg-black/40 border border-white/10 outline-none text-center">
                <input type="password" id="uPass" placeholder="كلمة السر" class="w-full p-4 mb-6 rounded-2xl bg-black/40 border border-white/10 outline-none text-center">
                <button onclick="login()" class="w-full bg-blue-600 p-4 rounded-2xl font-bold text-xl hover:bg-blue-700 transition">دخول</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden flex w-full h-full">
        <aside class="w-64 glass flex flex-col p-5 shadow-2xl border-l border-white/5">
            <div class="mb-10 text-center">
                <div class="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center text-white text-2xl mx-auto mb-2"><i class="fas fa-terminal"></i></div>
                <h1 class="font-bold text-lg">الخوارزمية</h1>
            </div>
            <nav class="space-y-2 flex-1">
                <button onclick="showPage('dashboard')" class="sidebar-btn"><i class="fas fa-home text-blue-500"></i> <span class="lang-txt" data-ar="الرئيسية" data-en="Home">الرئيسية</span></button>
                <button onclick="showPage('chat-init')" class="sidebar-btn"><i class="fas fa-comments text-green-500"></i> <span class="lang-txt" data-ar="المراسلات" data-en="Chat">المراسلات</span></button>
                <button onclick="showPage('library')" class="sidebar-btn"><i class="fas fa-book text-red-500"></i> <span class="lang-txt" data-ar="المكتبة" data-en="Library">المكتبة</span></button>
                <button id="adminLink" onclick="showPage('admin')" class="hidden sidebar-btn text-yellow-500 border border-yellow-500/10"><i class="fas fa-crown"></i> <span class="lang-txt" data-ar="لوحة القائد" data-en="Leader Panel">لوحة القائد</span></button>
            </nav>
            <div class="pt-4 border-t border-white/10 space-y-2">
                <button onclick="toggleTheme()" class="w-full p-3 rounded-xl glass text-xs font-bold flex items-center gap-2 justify-center"><i class="fas fa-adjust"></i> <span class="lang-txt" data-ar="المظهر" data-en="Theme">المظهر</span></button>
                <button onclick="toggleLang()" class="w-full p-3 rounded-xl glass text-xs font-bold flex items-center gap-2 justify-center"><i class="fas fa-language"></i> <span id="langBtn">English</span></button>
                <button onclick="logout()" class="w-full p-3 rounded-xl bg-red-500/10 text-red-500 font-bold"><i class="fas fa-sign-out-alt"></i> <span class="lang-txt" data-ar="خروج" data-en="Logout">خروج</span></button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <div id="p-dashboard" class="page active-page">
                <div class="news-ticker flex items-center gap-4">
                    <span class="bg-blue-600 px-3 py-1 rounded-lg text-xs font-bold">NEWS</span>
                    <marquee id="newsDisplay" class="font-bold">مرحباً بك يا Belal! المنصة حالياً في وضع الاختبار.</marquee>
                </div>
                <h2 id="welcomeHead" class="text-3xl font-bold mb-8 text-blue-500"></h2>
                <div class="grid grid-cols-2 gap-6">
                    <div class="glass p-8 rounded-3xl border-r-4 border-blue-600 shadow-xl text-center">
                        <h3 class="opacity-50 text-sm lang-txt" data-ar="الأعضاء الحاليين" data-en="Current Members">الأعضاء الحاليين</h3>
                        <p id="sUsers" class="text-5xl font-bold">3</p>
                    </div>
                    <div class="glass p-8 rounded-3xl border-r-4 border-red-600 shadow-xl text-center">
                        <h3 class="opacity-50 text-sm lang-txt" data-ar="ملفات المكتبة" data-en="Library Files">ملفات المكتبة</h3>
                        <p id="fCount" class="text-5xl font-bold">0</p>
                    </div>
                </div>
            </div>

            <div id="p-chat-init" class="page items-center justify-center text-center">
                <h2 class="text-2xl font-bold mb-8 lang-txt" data-ar="اختر حساب التيست" data-en="Select Test Account">اختر حساب التيست</h2>
                <div class="grid grid-cols-3 gap-6 max-w-2xl w-full">
                    <div onclick="startChat('Belal')" class="glass p-6 rounded-2xl user-selector border-blue-500/30">
                        <div class="w-12 h-12 bg-blue-600 rounded-full mx-auto mb-3 flex items-center justify-center font-bold">B</div>
                        <p class="font-bold">Belal</p>
                    </div>
                    <div onclick="startChat('Anas')" class="glass p-6 rounded-2xl user-selector border-green-500/30">
                        <div class="w-12 h-12 bg-green-600 rounded-full mx-auto mb-3 flex items-center justify-center font-bold">A</div>
                        <p class="font-bold">Anas</p>
                    </div>
                    <div onclick="startChat('Hamza')" class="glass p-6 rounded-2xl user-selector border-purple-500/30">
                        <div class="w-12 h-12 bg-purple-600 rounded-full mx-auto mb-3 flex items-center justify-center font-bold">H</div>
                        <p class="font-bold">Hamza</p>
                    </div>
                </div>
            </div>

            <div id="p-chat-main" class="page">
                <div id="chatBox" class="flex-1 glass rounded-2xl p-4 mb-4 overflow-y-auto flex flex-col gap-2"></div>
                <div class="flex gap-2">
                    <input type="text" id="chatInput" class="flex-1 p-4 rounded-xl glass outline-none border border-white/5" placeholder="اكتب رسالة تجريبية...">
                    <button onclick="sendMsg()" class="bg-blue-600 px-8 rounded-xl font-bold"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

            <div id="p-library" class="page">
                <h2 class="text-2xl font-bold mb-6 lang-txt" data-ar="رفع ومشاركة الملفات" data-en="Files & PDF">رفع ومشاركة الملفات</h2>
                <input type="file" id="pdfInput" accept="application/pdf" class="hidden" onchange="uploadPDF()">
                <button onclick="document.getElementById('pdfInput').click()" class="bg-red-600 px-6 py-3 rounded-xl font-bold mb-6"><i class="fas fa-file-pdf ml-2"></i> اختر ملف PDF</button>
                <div id="fileList" class="space-y-4"></div>
            </div>

            <div id="p-admin" class="page">
                <h2 class="text-2xl font-bold mb-6 text-yellow-500 lang-txt" data-ar="لوحة التحكم" data-en="Admin Panel">لوحة التحكم</h2>
                <div class="glass p-6 rounded-2xl">
                    <p class="mb-2">تحديث شريط الأخبار:</p>
                    <input type="text" id="newsInput" class="w-full p-4 mb-4 rounded-xl bg-black/20 border border-white/10 outline-none" placeholder="الخبر الجديد هنا...">
                    <button onclick="updateNews()" class="bg-yellow-600 px-6 py-2 rounded-xl font-bold">نشر التحديث</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        let session = JSON.parse(localStorage.getItem('alg_session') || 'null');
        let lang = 'ar';
        let selectedUser = null;
        let msgs = JSON.parse(localStorage.getItem('alg_msgs_final') || '[]');
        let files = JSON.parse(localStorage.getItem('alg_files_final') || '[]');

        function updateUI() {
            document.body.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langBtn').innerText = lang === 'ar' ? 'English' : 'العربية';
            document.querySelectorAll('.lang-txt').forEach(el => el.innerText = el.getAttribute('data-' + lang));
            if(session) {
                document.getElementById('welcomeHead').innerText = (lang === 'ar' ? 'أهلاً يا ' : 'Welcome, ') + session.name;
                if(session.role === 'ADMIN') document.getElementById('adminLink').classList.remove('hidden');
            }
            renderFiles();
        }

        function login() {
            const n = document.getElementById('uName').value.trim();
            const p = document.getElementById('uPass').value;
            if(n.toLowerCase()==='belal' && p==='159078@1#') {
                localStorage.setItem('alg_session', JSON.stringify({name:'Belal', role:'ADMIN'}));
                location.reload();
            }
        }

        function startChat(name) { selectedUser = name; showPage('chat-main'); renderChat(); }

        function sendMsg() {
            const txt = document.getElementById('chatInput').value;
            if(!txt) return;
            msgs.push({user: selectedUser, text: txt, time: new Date().toLocaleTimeString('ar-EG')});
            localStorage.setItem('alg_msgs_final', JSON.stringify(msgs));
            document.getElementById('chatInput').value = '';
            renderChat();
        }

        function renderChat() {
            const box = document.getElementById('chatBox');
            if(!box) return;
            box.innerHTML = msgs.map(m => `
                <div class="msg-bubble ${m.user === selectedUser ? 'border-blue-500 mr-auto' : 'border-slate-600 ml-auto'}">
                    <div class="flex justify-between gap-4 mb-1">
                        <span class="text-blue-400 font-bold text-xs">${m.user}</span>
                        <span class="text-[10px] opacity-40">${m.time}</span>
                    </div>
                    <p class="text-sm">${m.text}</p>
                </div>
            `).join('');
            box.scrollTop = box.scrollHeight;
        }

        function uploadPDF() {
            const f = document.getElementById('pdfInput').files[0];
            if(f) {
                files.push({name: f.name, size: (f.size/1024/1024).toFixed(2) + 'MB'});
                localStorage.setItem('alg_files_final', JSON.stringify(files));
                renderFiles();
            }
        }

        function renderFiles() {
            const list = document.getElementById('fileList');
            if(!list) return;
            list.innerHTML = files.map(f => `
                <div class="glass p-4 rounded-xl flex justify-between border-r-4 border-red-500">
                    <div><p class="font-bold">${f.name}</p><small class="opacity-40">${f.size}</small></div>
                    <i class="fas fa-file-pdf text-red-500 text-2xl"></i>
                </div>
            `).join('');
            document.getElementById('fCount').innerText = files.length;
        }

        function updateNews() {
            const txt = document.getElementById('newsInput').value;
            document.getElementById('newsDisplay').innerText = txt;
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p=>p.classList.remove('active-page'));
            document.getElementById('p-'+id).classList.add('active-page');
        }
        function toggleLang() { lang = (lang === 'ar' ? 'en' : 'ar'); updateUI(); }
        function toggleTheme() { document.body.classList.toggle('light-mode'); }
        function logout() { localStorage.removeItem('alg_session'); location.reload(); }

        if(session) {
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            updateUI();
        }
    </script>
</body>
</html>
