<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الخوارزمية - V8.0 Speed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #020617; --card: #0f172a; --text: #f8fafc; --accent: #3b82f6; }
        .light-mode { --bg: #f8fafc; --card: #ffffff; --text: #020617; --accent: #2563eb; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); height: 100vh; overflow: hidden; margin: 0; transition: 0.3s; }
        .glass { background: var(--card); border: 1px solid rgba(128,128,128,0.2); }
        .page { display: none; height: 100%; flex-direction: column; padding: 1.5rem; overflow-y: auto; }
        .active-page { display: flex; }
        .sidebar-btn { width: 100%; text-align: right; padding: 0.8rem; border-radius: 0.8rem; display: flex; align-items: center; gap: 0.8rem; font-weight: bold; cursor: pointer; }
        .sidebar-btn:hover, .sidebar-btn.active { background: var(--accent); color: white; }
        .news-banner { background: linear-gradient(90deg, #1e3a8a, #3b82f6); padding: 10px; border-radius: 15px; margin-bottom: 20px; overflow: hidden; height: 45px; }
        .news-scroll { display: inline-block; white-space: nowrap; animation: scrollText 12s linear infinite; font-size: 1.1rem; }
        @keyframes scrollText { 0% { transform: translateX(100%); } 100% { transform: translateX(-180%); } }
    </style>
</head>
<body class="flex">

    <div id="authPage" class="fixed inset-0 z-[500] bg-slate-950 flex items-center justify-center p-4">
        <div class="glass p-8 rounded-[2rem] w-full max-w-md text-center border-blue-500/50 border">
            <h2 id="authTitle" class="text-2xl font-bold mb-6 text-blue-500">الخوارزمية - دخول</h2>
            <div class="space-y-4">
                <input type="text" id="uName" placeholder="اسم المستخدم" class="w-full p-4 rounded-xl text-center bg-slate-900 border border-white/10 outline-none text-white">
                <input type="password" id="uPass" placeholder="كلمة السر" class="w-full p-4 rounded-xl text-center bg-slate-900 border border-white/10 outline-none text-white">
                <button onclick="handleAuth()" class="w-full bg-blue-600 p-4 rounded-xl font-bold">دخول</button>
                <button onclick="toggleAuthMode()" class="text-blue-400 text-xs mt-2 underline">إنشاء حساب جديد</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden flex w-full h-full">
        <aside class="w-64 glass flex flex-col p-4 border-l border-white/10">
            <div class="mb-8 px-2 flex items-center gap-3"><i class="fas fa-terminal text-2xl text-blue-500"></i><h1 class="font-bold text-xl">الخوارزمية</h1></div>
            <nav class="flex-1 space-y-1">
                <button onclick="showPage('dashboard')" id="btn-dashboard" class="sidebar-btn active"><i class="fas fa-home"></i> الرئيسية</button>
                <button onclick="showPage('chat')" id="btn-chat" class="sidebar-btn"><i class="fas fa-comments"></i> المحادثة</button>
                <button onclick="showPage('library')" id="btn-library" class="sidebar-btn"><i class="fas fa-book"></i> المكتبة</button>
                <button id="adminLink" onclick="showPage('admin')" class="hidden sidebar-btn text-yellow-500"><i class="fas fa-crown"></i> لوحة القائد</button>
            </nav>
            <div class="mt-auto space-y-2 pt-4 border-t border-white/10">
                <button onclick="toggleTheme()" class="sidebar-btn text-xs"><i class="fas fa-adjust"></i> المود</button>
                <button onclick="requestNotify()" id="notifBtn" class="sidebar-btn text-xs text-green-400"><i class="fas fa-bell"></i> تفعيل الإشعارات</button>
                <button onclick="logout()" class="w-full p-2 bg-red-500/10 text-red-500 rounded-xl font-bold">خروج</button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <div id="p-dashboard" class="page active-page">
                <div class="news-banner"><div id="newsScroll" class="news-scroll text-white font-bold">جاري المزامنة...</div></div>
                <h2 id="helloUser" class="text-3xl font-bold mb-8"></h2>
                <div class="glass p-8 rounded-3xl border-r-8 border-blue-500 w-fit">
                    <p class="opacity-60 mb-2 font-bold">أعضاء الفريق</p>
                    <p id="userCount" class="text-6xl font-black">0</p>
                </div>
            </div>

            <div id="p-chat" class="page">
                <div class="flex gap-4 h-full">
                    <div class="w-48 glass rounded-2xl p-3 overflow-y-auto hidden md:block">
                        <p class="text-[10px] opacity-40 mb-2 text-center">اضغط للمنشن</p>
                        <div id="chatUserList" class="space-y-2"></div>
                    </div>
                    <div class="flex-1 flex flex-col">
                        <div id="chatBox" class="flex-1 glass rounded-2xl p-4 mb-4 overflow-y-auto flex flex-col gap-3"></div>
                        <div class="flex gap-2 p-2 bg-slate-900/50 rounded-2xl">
                            <input type="file" id="mediaInput" class="hidden" accept="image/*,video/*" onchange="sendMedia()">
                            <button onclick="document.getElementById('mediaInput').click()" class="text-blue-400 px-3"><i class="fas fa-camera"></i></button>
                            <input type="text" id="chatInput" class="flex-1 bg-transparent p-2 outline-none text-white" placeholder="اكتب رسالة...">
                            <button onclick="sendMsg()" class="bg-blue-600 px-6 py-2 rounded-xl text-white"><i class="fas fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="p-library" class="page">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">المكتبة</h2>
                    <div id="adminLib" class="hidden"><input type="file" id="fileInput" class="hidden" onchange="uploadFile()"><button onclick="document.getElementById('fileInput').click()" class="bg-blue-600 px-4 py-2 rounded-lg font-bold">رفع PDF</button></div>
                </div>
                <div id="libraryList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>

            <div id="p-admin" class="page">
                <h2 class="text-2xl font-bold text-yellow-500 mb-6">لوحة القائد 👑</h2>
                <div class="glass p-6 rounded-2xl">
                    <h3 class="font-bold mb-2">تغيير الخبر فوراً:</h3>
                    <input type="text" id="newsInput" class="w-full p-4 bg-slate-800 rounded-xl mb-4 outline-none border border-white/5" placeholder="اكتب الخبر الجديد هنا...">
                    <button onclick="setGlobalNews()" class="bg-yellow-600 px-8 py-3 rounded-xl font-bold">تحديث الخبر عند الجميع</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const supabaseUrl = 'https://xhyfprrvpzasbywehzid.supabase.co';
        const supabaseKey = 'sb_publishable_lJ85dVr8A5dOvXWRZ6SWvw_rSwSfp1J';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);
        let currentUser = null; let isLoginMode = true;

        // دالة الإشعارات المعدلة
        function requestNotify() {
            Notification.requestPermission().then(p => {
                if(p === 'granted') {
                    new Notification("تم التفعيل ✅", { body: "ستصلك إشعارات الخوارزمية الآن" });
                    document.getElementById('notifBtn').innerHTML = '<i class="fas fa-check-circle"></i> الإشعارات مفعلة';
                    document.getElementById('notifBtn').className = "sidebar-btn text-xs text-blue-400";
                }
            });
        }

        async function handleAuth() {
            const n = document.getElementById('uName').value.trim().toLowerCase();
            const p = document.getElementById('uPass').value;
            if(isLoginMode) {
                const { data } = await _supabase.from('profiles').select('*').eq('username', n).eq('password', p).single();
                if(data) {
                    currentUser = data;
                    document.getElementById('authPage').classList.add('hidden');
                    document.getElementById('mainApp').classList.remove('hidden');
                    if(n === 'belal') { document.getElementById('adminLink').classList.remove('hidden'); document.getElementById('adminLib').classList.remove('hidden'); }
                    initApp();
                } else alert('خطأ!');
            } else {
                await _supabase.from('profiles').insert([{ username: n, password: p, role: 'USER' }]);
                alert('تم!'); location.reload();
            }
        }

        function initApp() {
            updateUI();
            // ميزة التحديث الفوري (Realtime)
            _supabase.channel('room1').on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, () => {
                updateUI(); // لما أي رسالة أو خبر يتغير، يتحدث فوراً عند الكل
            }).subscribe();
        }

        async function updateUI() {
            if(!currentUser) return;
            document.getElementById('helloUser').innerText = `أهلاً ${currentUser.username === 'belal' ? 'بالقائد بلال' : currentUser.username}`;

            const { data: users } = await _supabase.from('profiles').select('*');
            if(users) {
                document.getElementById('userCount').innerText = users.length;
                document.getElementById('chatUserList').innerHTML = users.map(u => `<button onclick="mention('${u.username}')" class="w-full text-right p-2 glass rounded-lg text-xs font-bold truncate">${u.username}</button>`).join('');
            }

            const { data: msgs } = await _supabase.from('messages').select('*').order('created_at', { ascending: false });
            if(msgs) {
                // تحديث الخبر فوراً
                const news = msgs.find(m => m.content.startsWith('SYS_NEWS:'));
                if(news) document.getElementById('newsScroll').innerText = news.content.replace('SYS_NEWS:', '');

                // تحديث الشات
                document.getElementById('chatBox').innerHTML = msgs.filter(m => !m.content.startsWith('SYS_NEWS:') && !m.content.startsWith('FILE:')).reverse().map(m => {
                    const isMedia = m.content.startsWith('MEDIA:');
                    let contentHTML = isMedia ? (m.content.includes('video') ? `<video src="${m.content.split('|')[1]}" controls class="media-preview"></video>` : `<img src="${m.content.split('|')[1]}" class="media-preview">`) : `<p class="text-sm mt-1">${m.content}</p>`;
                    const isMyMsg = m.username === currentUser.username;
                    return `<div class="p-3 glass rounded-xl ${isMyMsg ? 'mr-auto bg-blue-500/20' : 'ml-auto'} max-w-[80%] relative group shadow-sm">
                        <span class="text-[10px] text-blue-400 font-bold">${m.username}</span>
                        ${contentHTML}
                        ${isMyMsg ? `<button onclick="deleteMsg(${m.id})" class="absolute -top-2 -right-2 bg-red-600 text-white w-5 h-5 rounded-full text-[10px] hidden group-hover:block transition shadow-lg"><i class="fas fa-times"></i></button>` : ''}
                    </div>`;
                }).join('');
                document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;

                // تحديث المكتبة
                const files = msgs.filter(m => m.content.startsWith('FILE:'));
                document.getElementById('libraryList').innerHTML = files.map(f => {
                    const [url, name] = f.content.replace('FILE:', '').split('|');
                    return `<div class="glass p-4 rounded-xl flex justify-between items-center"><span class="text-sm truncate"><i class="fas fa-file-pdf text-red-500 ml-2"></i> ${name}</span><button onclick="window.open('${url}', '_blank')" class="bg-blue-600/30 text-blue-400 px-3 py-1 rounded text-xs">فتح</button></div>`;
                }).join('');
            }
        }

        async function setGlobalNews() {
            const val = document.getElementById('newsInput').value;
            if(val) {
                // مسح الخبر القديم وإضافة الجديد عشان يظهر فوراً
                await _supabase.from('messages').insert([{ username: 'SYSTEM', content: `SYS_NEWS:${val}` }]);
                document.getElementById('newsInput').value = '';
                alert('تم تحديث الخبر عند جميع الأعضاء!');
            }
        }

        function mention(n) { document.getElementById('chatInput').value = `@${n} ` + document.getElementById('chatInput').value; document.getElementById('chatInput').focus(); }
        async function deleteMsg(id) { if(confirm('مسح؟')) await _supabase.from('messages').delete().eq('id', id); }
        async function sendMsg() {
            const t = document.getElementById('chatInput').value.trim();
            if(t) await _supabase.from('messages').insert([{ username: currentUser.username, content: t }]);
            document.getElementById('chatInput').value = '';
        }
        async function sendMedia() {
            const file = document.getElementById('mediaInput').files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                const type = file.type.includes('video') ? 'video' : 'image';
                await _supabase.from('messages').insert([{ username: currentUser.username, content: `MEDIA:${type}|${e.target.result}` }]);
            };
            reader.readAsDataURL(file);
        }
        async function uploadFile() {
            const file = document.getElementById('fileInput').files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                await _supabase.from('messages').insert([{ username: 'SYSTEM', content: `FILE:${e.target.result}|${file.name}` }]);
            };
            reader.readAsDataURL(file);
        }
        function toggleTheme() { document.body.classList.toggle('light-mode'); }
        function showPage(id) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page')); document.getElementById('p-'+id).classList.add('active-page'); }
        function logout() { location.reload(); }
        function toggleAuthMode() { isLoginMode = !isLoginMode; document.getElementById('authTitle').innerText = isLoginMode ? 'الخوارزمية - دخول' : 'إنشاء حساب'; }
    </script>
</body>
</html>
