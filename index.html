<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الخوارزمية V32</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #020617; --card: #0f172a; --text: #f8fafc; --accent: #3b82f6; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); height: 100vh; overflow: hidden; margin: 0; }
        .glass { background: var(--card); border: 1px solid rgba(255,255,255,0.05); }
        .page { display: none; height: 100%; flex-direction: column; padding: 1.5rem; overflow-y: auto; }
        .active-page { display: flex; animation: fadeIn 0.1s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .sidebar-btn { width: 100%; text-align: right; padding: 1rem; border-radius: 1rem; display: flex; align-items: center; gap: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .sidebar-btn:hover { background: rgba(255,255,255,0.05); }
        .sidebar-btn.active { background: var(--accent); color: white; }
    </style>
</head>
<body class="flex">

    <div id="authPage" class="fixed inset-0 z-[500] bg-slate-950 flex items-center justify-center p-4">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-md text-center border-blue-500/30 border shadow-2xl">
            <h2 id="authTitle" class="text-2xl font-bold mb-6 text-blue-500">الخوارزمية - دخول</h2>
            <div class="space-y-4">
                <input type="text" id="uName" placeholder="اسم المستخدم" class="w-full p-4 rounded-xl text-center bg-slate-900 border border-white/10 outline-none text-white focus:border-blue-500">
                <input type="password" id="uPass" placeholder="كلمة السر" class="w-full p-4 rounded-xl text-center bg-slate-900 border border-white/10 outline-none text-white focus:border-blue-500">
                <button onclick="handleAuth()" class="w-full bg-blue-600 hover:bg-blue-700 p-4 rounded-xl font-bold text-white transition">دخول</button>
                <button onclick="toggleAuthMode()" id="toggleAuthBtn" class="text-blue-400 text-xs mt-2 underline">إنشاء حساب جديد</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden flex w-full h-full">
        <aside class="w-64 glass flex flex-col p-4 border-l border-white/5">
            <div class="mb-8 px-2 flex items-center gap-3"><i class="fas fa-terminal text-2xl text-blue-500"></i><h1 class="font-bold text-xl text-white">الخوارزمية</h1></div>
            <nav class="flex-1 space-y-1">
                <button onclick="showPage('dashboard')" id="btn-dashboard" class="sidebar-btn active"><i class="fas fa-home"></i> الرئيسية</button>
                <button onclick="showPage('chat')" id="btn-chat" class="sidebar-btn"><i class="fas fa-comments"></i> المحادثة</button>
                <button onclick="showPage('members')" id="btn-members" class="sidebar-btn"><i class="fas fa-users"></i> الأعضاء</button>
                <button onclick="showPage('library')" id="btn-library" class="sidebar-btn"><i class="fas fa-book"></i> المكتبة</button>
                <button id="adminLink" onclick="showPage('admin')" class="hidden sidebar-btn text-yellow-500 font-bold"><i class="fas fa-crown"></i> لوحة القائد</button>
            </nav>
            <button onclick="logout()" class="w-full p-3 bg-red-500/10 text-red-500 rounded-xl font-bold mt-2 hover:bg-red-500 hover:text-white transition">خروج</button>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <div id="p-dashboard" class="page active-page">
                <div class="bg-blue-600/10 border border-blue-500/20 p-4 rounded-2xl mb-6 overflow-hidden">
                    <marquee id="newsDisplay" class="font-bold text-blue-400">مرحباً بكم في منصة الخوارزمية القائد بلال يرحب بكم..</marquee>
                </div>
                <h2 id="helloUser" class="text-3xl font-bold mb-8 text-white"></h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="glass p-8 rounded-3xl border-r-8 border-blue-500 flex justify-between items-center">
                        <div><p class="opacity-60 font-bold mb-1">أعضاء الفريق</p><p id="userCount" class="text-5xl font-black">0</p></div>
                        <i class="fas fa-users text-4xl opacity-20"></i>
                    </div>
                    <div class="glass p-8 rounded-3xl border-r-8 border-green-500 flex justify-between items-center">
                        <div><p class="opacity-60 font-bold mb-1">ملفات المكتبة</p><p id="fileCount" class="text-5xl font-black">0</p></div>
                        <i class="fas fa-file-pdf text-4xl opacity-20"></i>
                    </div>
                </div>
            </div>

            <div id="p-chat" class="page">
                <div class="flex gap-4 h-full overflow-hidden">
                    <div class="w-48 glass rounded-2xl p-3 overflow-y-auto hidden md:block border border-white/5">
                        <h3 class="text-[10px] font-bold mb-3 opacity-40 text-blue-400">المتواجدون</h3>
                        <div id="chatUserList" class="flex flex-col gap-2"></div>
                    </div>
                    <div class="flex-1 flex flex-col overflow-hidden">
                        <div id="chatBox" class="flex-1 glass rounded-2xl p-4 mb-4 overflow-y-auto flex flex-col gap-3"></div>
                        <div class="flex gap-2 p-2 glass rounded-2xl">
                            <input type="text" id="chatInput" class="flex-1 bg-transparent p-4 outline-none text-white" placeholder="اكتب رسالتك...">
                            <button onclick="sendMsg()" class="bg-blue-600 h-12 w-12 rounded-xl text-white hover:scale-105 transition"><i class="fas fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="p-members" class="page">
                <h2 class="text-2xl font-bold mb-4 text-white underline decoration-blue-500">سجل الفريق</h2>
                <div class="glass rounded-2xl overflow-hidden shadow-xl">
                    <table class="w-full text-right">
                        <thead class="bg-blue-600/20 text-blue-300 text-xs"><tr><th class="p-4">العضو</th><th id="passHeader" class="p-4 hidden text-yellow-500">كلمة السر (للقائد فقط)</th></tr></thead>
                        <tbody id="memberTableBody"></tbody>
                    </table>
                </div>
            </div>

            <div id="p-library" class="page">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-white">المكتبة البرمجية</h2>
                    <label class="bg-blue-600 p-3 rounded-xl cursor-pointer hover:bg-blue-700 font-bold transition">
                        <i class="fas fa-upload ml-2"></i> رفع ملف
                        <input type="file" id="pdfUpload" class="hidden" onchange="uploadFile(this)">
                    </label>
                </div>
                <div id="fileList" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
            </div>

            <div id="p-admin" class="page">
                <h2 class="text-2xl font-bold text-yellow-500 mb-6 flex items-center gap-2"><i class="fas fa-crown"></i> إدارة القائد</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="glass p-6 rounded-3xl border border-yellow-500/20">
                        <h3 class="font-bold mb-4">تغيير شريط الأخبار</h3>
                        <input type="text" id="newsInput" class="w-full p-4 rounded-xl bg-slate-900 border border-white/10 mb-4 outline-none text-center" placeholder="اكتب الخبر هنا...">
                        <button onclick="updateNews()" class="w-full bg-yellow-600 p-4 rounded-xl font-bold hover:bg-yellow-700 transition">تحديث</button>
                    </div>
                    <div class="glass p-6 rounded-3xl border border-blue-500/20">
                        <h3 class="font-bold mb-4">إضافة عضو جديد يدوياً</h3>
                        <input type="text" id="newMemberName" class="w-full p-3 mb-2 rounded-xl bg-slate-900 border border-white/10 outline-none" placeholder="اسم المستخدم">
                        <input type="text" id="newMemberPass" class="w-full p-3 mb-4 rounded-xl bg-slate-900 border border-white/10 outline-none" placeholder="كلمة السر">
                        <button onclick="addNewMember()" class="w-full bg-blue-600 p-4 rounded-xl font-bold hover:bg-blue-700 transition">إضافة للفريق</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const supabaseUrl = 'https://xhyfprrvpzasbywehzid.supabase.co';
        const supabaseKey = 'sb_publishable_lJ85dvR8A5d0vXWRZ6SWvw_rSwSf56A5uK9900';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let session = JSON.parse(localStorage.getItem('alg_session_v32') || 'null');
        let isLoginMode = true;

        async function handleAuth() {
            const n = document.getElementById('uName').value.trim().toLowerCase();
            const p = document.getElementById('uPass').value;
            if(n === 'belal' && p === '159078@1#') {
                const admin = { username: 'belal', role: 'ADMIN' };
                localStorage.setItem('alg_session_v32', JSON.stringify(admin));
                await _supabase.from('profiles').upsert([{ username: n, password: p, role: 'ADMIN' }]);
                location.reload(); return;
            }
            if(isLoginMode) {
                const { data } = await _supabase.from('profiles').select('*').eq('username', n).eq('password', p).single();
                if(data) { localStorage.setItem('alg_session_v32', JSON.stringify(data)); location.reload(); }
                else alert('خطأ في الاسم أو كلمة السر');
            } else {
                const { data: exists } = await _supabase.from('profiles').select('username').eq('username', n).single();
                if(exists) { alert('هذا الاسم محجوز فعلاً'); return; }
                const { error } = await _supabase.from('profiles').insert([{ username: n, password: p, role: 'USER' }]);
                if(!error) { alert('تم إنشاء الحساب بنجاح، يمكنك الدخول الآن'); toggleAuthMode(); }
            }
        }

        async function loadData() {
            const { data: users } = await _supabase.from('profiles').select('*').order('role', { ascending: true });
            if(users) {
                document.getElementById('userCount').innerText = users.length;
                document.getElementById('chatUserList').innerHTML = users.map(u => `<button onclick="mention('${u.username}')" class="p-2 glass rounded-lg text-right text-xs w-full hover:bg-blue-600/20">${u.username === 'belal' ? '👑 القائد بلال' : u.username}</button>`).join('');
                document.getElementById('memberTableBody').innerHTML = users.map(u => `
                    <tr class="border-b border-white/5 hover:bg-white/5 transition">
                        <td class="p-4 font-bold ${u.username === 'belal' ? 'text-yellow-500' : ''}">${u.username === 'belal' ? 'القائد Belal 👑' : u.username}</td>
                        ${session.username === 'belal' ? `<td class="p-4 text-xs text-blue-400 font-mono">${u.password}</td>` : ''}
                    </tr>
                `).join('');
            }
            const { data: news } = await _supabase.from('settings').select('value').eq('key', 'news').single();
            if(news) document.getElementById('newsDisplay').innerText = news.value;
            loadFiles();
        }

        async function uploadFile(input) {
            const file = input.files[0];
            if(!file) return;
            const fName = `${Date.now()}_${file.name}`;
            const { data, error } = await _supabase.storage.from('pdfs').upload(fName, file);
            if(!error) {
                const { data: urlData } = _supabase.storage.from('pdfs').getPublicUrl(fName);
                await _supabase.from('library').insert([{ name: file.name, url: urlData.publicUrl, owner: session.username }]);
                alert('تم رفع الملف بنجاح!'); loadFiles();
            } else alert('حدث خطأ في الرفع');
        }

        async function loadFiles() {
            const { data } = await _supabase.from('library').select('*');
            if(data) {
                document.getElementById('fileCount').innerText = data.length;
                document.getElementById('fileList').innerHTML = data.map(f => `
                    <div class="glass p-4 rounded-2xl border border-white/10 flex flex-col items-center">
                        <i class="fas fa-file-pdf text-4xl text-red-500 mb-3"></i>
                        <p class="text-xs font-bold mb-3 truncate w-full text-center">${f.name}</p>
                        <a href="${f.url}" target="_blank" class="bg-blue-600/20 text-blue-400 px-4 py-2 rounded-lg text-[10px] hover:bg-blue-600 hover:text-white transition">تحميل</a>
                    </div>
                `).join('');
            }
        }

        async function addNewMember() {
            const n = document.getElementById('newMemberName').value.trim().toLowerCase();
            const p = document.getElementById('newMemberPass').value;
            if(!n || !p) return;
            await _supabase.from('profiles').insert([{ username: n, password: p, role: 'USER' }]);
            alert('تمت إضافة العضو بنجاح');
            loadData();
        }

        async function sendMsg() {
            const t = document.getElementById('chatInput').value.trim();
            if(!t) return;
            await _supabase.from('messages').insert([{ username: session.username, content: t }]);
            document.getElementById('chatInput').value = '';
            loadMessages();
        }

        async function loadMessages() {
            const { data } = await _supabase.from('messages').select('*').order('created_at', { ascending: true });
            if(data) {
                document.getElementById('chatBox').innerHTML = data.map(m => `
                    <div class="p-3 glass rounded-xl ${m.username === session.username ? 'mr-auto bg-blue-500/20' : 'ml-auto border border-white/5'} max-w-[80%]">
                        <span class="text-[10px] font-bold ${m.username === 'belal' ? 'text-yellow-500' : 'text-blue-400'}">${m.username === 'belal' ? 'القائد بلال 👑' : m.username}</span>
                        <p class="text-sm text-white mt-1">${m.content}</p>
                    </div>
                `).join('');
                document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
            }
        }

        async function updateNews() {
            const val = document.getElementById('newsInput').value;
            await _supabase.from('settings').upsert([{ key: 'news', value: val }]);
            alert('تم تحديث الشريط'); loadData();
        }

        function mention(n) { document.getElementById('chatInput').value = `@${n} : `; document.getElementById('chatInput').focus(); }
        function showPage(id) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page')); document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active')); document.getElementById('p-'+id).classList.add('active-page'); document.getElementById('btn-'+id).classList.add('active'); }
        function toggleAuthMode() { isLoginMode = !isLoginMode; document.getElementById('authTitle').innerText = isLoginMode ? 'الخوارزمية - دخول' : 'الخوارزمية - حساب جديد'; document.getElementById('toggleAuthBtn').innerText = isLoginMode ? 'إنشاء حساب جديد' : 'لديك حساب؟ دخول'; }
        function logout() { localStorage.removeItem('alg_session_v32'); location.reload(); }

        if(session) {
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('helloUser').innerHTML = `أهلاً بك <span class="text-blue-500">${session.username === 'belal' ? 'يا قائد بلال 👑' : session.username}</span>`;
            if(session.username === 'belal') { document.getElementById('adminLink').classList.remove('hidden'); document.getElementById('passHeader').classList.remove('hidden'); }
            loadData(); loadMessages();
            _supabase.channel('any').on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, () => loadMessages()).subscribe();
        }
    </script>
</body>
</html>
