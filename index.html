<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="tabTitle">الخوارزمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #020617; --card: #0f172a; --text: #f8fafc; --accent: #3b82f6; }
        .light-mode { --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --accent: #2563eb; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); transition: 0.3s; overflow: hidden; height: 100vh; margin: 0; }
        .glass { background: var(--card); border: 1px solid rgba(255,255,255,0.05); }
        .page { display: none; height: 100%; flex-direction: column; overflow-y: auto; padding: 1.5rem; }
        .active-page { display: flex; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .sidebar-btn { width: 100%; text-align: right; padding: 0.8rem; border-radius: 1rem; display: flex; align-items: center; gap: 1rem; font-weight: bold; transition: 0.2s; cursor: pointer; }
        .sidebar-btn:hover { background: rgba(59, 130, 246, 0.1); color: var(--accent); }
        .msg-bubble { background: #1e293b; padding: 12px; border-radius: 15px; margin-bottom: 10px; max-width: 85%; }
        .leader-badge { background: #eab308; color: #000; padding: 2px 6px; border-radius: 6px; font-size: 10px; margin-left: 5px; font-weight: 800; }
    </style>
</head>
<body class="flex">

    <div id="authPage" class="fixed inset-0 z-[200] bg-slate-950 flex items-center justify-center p-4">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-md text-center border-blue-500/20 border shadow-2xl">
            <h2 class="text-3xl font-bold mb-8">الخوارزمية</h2>
            <input type="text" id="uName" placeholder="اسم المستخدم" class="w-full p-4 mb-4 rounded-2xl bg-black/40 border border-white/10 outline-none text-center">
            <input type="password" id="uPass" placeholder="كلمة السر" class="w-full p-4 mb-6 rounded-2xl bg-black/40 border border-white/10 outline-none text-center">
            <button onclick="login()" class="w-full bg-blue-600 p-4 rounded-2xl font-bold text-xl hover:bg-blue-700 transition">دخول</button>
        </div>
    </div>

    <div id="mainApp" class="hidden flex w-full h-full">
        <aside class="w-64 glass flex flex-col p-5 shadow-2xl border-l border-white/5">
            <div class="mb-10 text-center">
                <div class="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center text-white text-2xl mx-auto mb-2"><i class="fas fa-terminal"></i></div>
                <h1 class="font-bold text-lg">الخوارزمية</h1>
            </div>
            <nav class="space-y-2 flex-1">
                <button onclick="showPage('dashboard')" class="sidebar-btn"><i class="fas fa-home text-blue-500"></i> الرئيسية</button>
                <button onclick="initChatSelection()" class="sidebar-btn"><i class="fas fa-comments text-green-500"></i> المراسلات</button>
                <button onclick="showPage('library')" class="sidebar-btn"><i class="fas fa-book text-red-500"></i> المكتبة</button>
                <button id="adminLink" onclick="showPage('admin')" class="hidden sidebar-btn text-yellow-500 border border-yellow-500/10"><i class="fas fa-crown"></i> لوحة القائد</button>
            </nav>
            <div class="pt-4 border-t border-white/10 space-y-2">
                <button onclick="toggleTheme()" class="w-full p-3 rounded-xl glass text-xs font-bold flex items-center gap-2 justify-center"><i class="fas fa-adjust"></i> المظهر</button>
                <button onclick="logout()" class="w-full p-3 rounded-xl bg-red-500/10 text-red-500 font-bold"><i class="fas fa-sign-out-alt"></i> خروج</button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <div id="p-dashboard" class="page active-page">
                <div class="bg-blue-600/10 p-4 rounded-2xl mb-6 border border-blue-500/20">
                    <marquee id="newsDisplay" class="font-bold text-blue-400">تحميل الأخبار...</marquee>
                </div>
                <div class="grid grid-cols-2 gap-6">
                    <div class="glass p-8 rounded-3xl border-r-4 border-blue-600 text-center">
                        <h3 class="opacity-50 text-sm">الأعضاء النشطون</h3>
                        <p id="sUsersCount" class="text-5xl font-bold">0</p>
                    </div>
                    <div class="glass p-8 rounded-3xl border-r-4 border-red-600 text-center">
                        <h3 class="opacity-50 text-sm">ملفات المكتبة</h3>
                        <p id="fCount" class="text-5xl font-bold">0</p>
                    </div>
                </div>
            </div>

            <div id="p-chat-init" class="page text-center">
                <h2 class="text-2xl font-bold mb-8">من يراسل الآن؟</h2>
                <div id="activeUserList" class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-4xl mx-auto w-full"></div>
            </div>

            <div id="p-chat-main" class="page">
                <div id="chatBox" class="flex-1 glass rounded-2xl p-4 mb-4 overflow-y-auto flex flex-col gap-2"></div>
                <div class="flex gap-2">
                    <input type="text" id="chatInput" class="flex-1 p-4 rounded-xl glass outline-none" placeholder="اكتب رسالتك...">
                    <button onclick="sendMsg()" class="bg-blue-600 px-8 rounded-xl font-bold"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

            <div id="p-library" class="page">
                <h2 class="text-2xl font-bold mb-6">المكتبة الرسمية</h2>
                <div id="uploadSection" class="hidden glass p-6 rounded-2xl mb-6 border-dashed border-2 border-blue-500/30">
                    <input type="file" id="pdfInput" accept="application/pdf" class="hidden" onchange="uploadPDF()">
                    <button onclick="document.getElementById('pdfInput').click()" class="bg-blue-600 px-6 py-3 rounded-xl font-bold"><i class="fas fa-upload ml-2"></i> رفع ملف PDF جديد</button>
                </div>
                <div id="fileList" class="space-y-4"></div>
            </div>

            <div id="p-admin" class="page">
                <h2 class="text-2xl font-bold mb-6 text-yellow-500">لوحة القائد</h2>
                <div class="glass p-6 rounded-2xl mb-6"><h3 class="font-bold mb-4">الأعضاء المسجلون:</h3><div id="adminUserList" class="flex flex-wrap gap-2"></div></div>
                <div class="glass p-6 rounded-2xl">
                    <h3 class="font-bold mb-4">تحديث شريط الأخبار الأساسي:</h3>
                    <input type="text" id="newsInput" class="w-full p-4 mb-4 rounded-xl bg-black/20 border border-white/10 outline-none">
                    <button onclick="updateNews()" class="bg-yellow-600 px-6 py-2 rounded-xl font-bold w-full">حفظ ونشر</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        let session = JSON.parse(localStorage.getItem('alg_session') || 'null');
        let registeredUsers = JSON.parse(localStorage.getItem('alg_registered') || []);
        let msgs = JSON.parse(localStorage.getItem('alg_msgs_v6') || []);
        let files = JSON.parse(localStorage.getItem('alg_files_v6') || []);
        let customNews = localStorage.getItem('alg_news') || "أهلاً بك في منصة الخوارزمية!";
        let selectedUser = null;

        function updateUI() {
            if(session) {
                document.getElementById('newsDisplay').innerText = `مرحباً بك يا ${session.name}! | ${customNews}`;
                if(session.role === 'ADMIN') {
                    document.getElementById('adminLink').classList.remove('hidden');
                    document.getElementById('uploadSection').classList.remove('hidden');
                }
            }
            document.getElementById('sUsersCount').innerText = registeredUsers.length + 1;
            renderFiles();
            renderAdminUsers();
        }

        function login() {
            const n = document.getElementById('uName').value.trim();
            const p = document.getElementById('uPass').value;
            if(!n) return;
            if(n.toLowerCase()==='belal' && p==='159078@1#') {
                localStorage.setItem('alg_session', JSON.stringify({name:'Belal', role:'ADMIN'}));
                location.reload();
            } else {
                if(!registeredUsers.includes(n)) { registeredUsers.push(n); localStorage.setItem('alg_registered', JSON.stringify(registeredUsers)); }
                localStorage.setItem('alg_session', JSON.stringify({name:n, role:'USER'}));
                location.reload();
            }
        }

        function initChatSelection() {
            showPage('chat-init');
            const list = document.getElementById('activeUserList');
            const all = ['Belal', ...registeredUsers];
            list.innerHTML = all.map(u => `<div onclick="startChat('${u}')" class="glass p-6 rounded-2xl cursor-pointer hover:border-blue-500 border border-transparent font-bold transition">${u}</div>`).join('');
        }

        function startChat(name) { selectedUser = name; showPage('chat-main'); renderChat(); }

        function sendMsg() {
            const txt = document.getElementById('chatInput').value;
            if(!txt) return;
            msgs.push({user: selectedUser, text: txt, isLeader: selectedUser.toLowerCase() === 'belal'});
            localStorage.setItem('alg_msgs_v6', JSON.stringify(msgs));
            document.getElementById('chatInput').value = '';
            renderChat();
        }

        function renderChat() {
            const box = document.getElementById('chatBox');
            box.innerHTML = msgs.map(m => `
                <div class="msg-bubble ${m.user === selectedUser ? 'mr-auto border-r-4 border-blue-600' : 'ml-auto border-r-4 border-slate-600'}">
                    <span class="font-bold text-xs flex items-center mb-1">
                        ${m.isLeader ? '<span class="leader-badge">القائد</span>' : ''}
                        <span class="text-blue-400">${m.user}</span>
                    </span>
                    <p class="text-sm">${m.text}</p>
                </div>
            `).join('');
            box.scrollTop = box.scrollHeight;
        }

        function uploadPDF() {
            const f = document.getElementById('pdfInput').files[0];
            if(f) { files.push({name: f.name}); localStorage.setItem('alg_files_v6', JSON.stringify(files)); renderFiles(); }
        }

        function renderFiles() {
            const list = document.getElementById('fileList');
            list.innerHTML = files.map(f => `<div class="glass p-4 rounded-xl flex justify-between border-r-4 border-red-500"><span>${f.name}</span> <i class="fas fa-file-pdf text-red-500"></i></div>`).join('');
            document.getElementById('fCount').innerText = files.length;
        }

        function updateNews() {
            const txt = document.getElementById('newsInput').value;
            localStorage.setItem('alg_news', txt);
            location.reload();
        }

        function renderAdminUsers() {
            const list = document.getElementById('adminUserList');
            if(!list) return;
            list.innerHTML = ['Belal', ...registeredUsers].map(u => `<span class="px-3 py-1 bg-white/5 rounded-full text-xs border border-white/10">${u}</span>`).join('');
        }

        function showPage(id) { document.querySelectorAll('.page').forEach(p=>p.classList.remove('active-page')); document.getElementById('p-'+id).classList.add('active-page'); }
        function toggleTheme() { document.body.classList.toggle('light-mode'); }
        function logout() { localStorage.removeItem('alg_session'); location.reload(); }

        if(session) { document.getElementById('authPage').classList.add('hidden'); document.getElementById('mainApp').classList.remove('hidden'); updateUI(); }
    </script>
</body>
</html>
