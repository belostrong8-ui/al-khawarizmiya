<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الخوارزمية</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; background: #060b13; color: #c0c9d6; margin: 0; overflow: hidden; }
        .glass { background: #0c182a; border: 1px solid rgba(255,255,255,0.05); }
        .page { display: none; height: 100vh; padding: 20px; overflow-y: auto; }
        .active-page { display: block; }
        
        /* التجاوب مع الهاتف */
        @media (max-width: 1023px) {
            .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 70px; display: flex; justify-content: space-around; align-items: center; background: #0c182a; border-top: 1px solid #1a2c4e; z-index: 1000; }
            .sidebar { display: none; }
            main { padding-bottom: 80px; }
        }
        @media (min-width: 1024px) {
            .sidebar { position: fixed; right: 0; top: 0; width: 260px; height: 100vh; background: #0c182a; display: flex; flex-direction: column; border-left: 1px solid #1a2c4e; }
            main { margin-right: 260px; }
            .bottom-nav { display: none; }
        }
        .active-link { color: #2c6bed; }
    </style>
</head>
<body>

    <div id="authPage" class="fixed inset-0 z-[2000] bg-[#060b13] flex items-center justify-center p-6">
        <div class="glass p-8 rounded-[2rem] w-full max-w-sm text-center">
            <h2 class="text-2xl font-bold mb-6 text-white">منصة الخوارزمية</h2>
            <input type="text" id="userInp" placeholder="اسم المستخدم" class="w-full p-4 rounded-xl bg-slate-900 border border-slate-700 mb-3 outline-none text-white text-right">
            <input type="password" id="passInp" placeholder="كلمة السر" class="w-full p-4 rounded-xl bg-slate-900 border border-slate-700 mb-4 outline-none text-white text-right">
            <button onclick="handleLogin()" class="w-full bg-blue-600 p-4 rounded-xl font-bold text-white mb-2">دخول</button>
            <button onclick="handleRegister()" class="w-full bg-slate-800 p-4 rounded-xl font-bold text-white text-sm">إنشاء حساب جديد</button>
        </div>
    </div>

    <aside class="sidebar">
        <div class="p-8 text-blue-500 font-bold text-xl text-center">الخوارزمية</div>
        <nav class="flex-1">
            <div onclick="showPage('home')" class="p-4 cursor-pointer border-b border-white/5">الرئيسية</div>
            <div onclick="showPage('lib')" class="p-4 cursor-pointer border-b border-white/5">المكتبة</div>
        </nav>
        <button onclick="supabase.auth.signOut()" class="p-8 text-red-500">خروج</button>
    </aside>

    <main>
        <div id="p-home" class="page active-page">
            <h2 class="text-2xl font-bold mb-4" id="userGreet">أهلاً بك</h2>
            <div class="glass p-6 rounded-2xl">تم تفعيل النظام السحابي بنجاح.</div>
        </div>

        <div id="p-lib" class="page">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">المكتبة السحابية</h2>
                <button onclick="document.getElementById('file').click()" class="bg-blue-600 px-4 py-2 rounded-lg text-sm">رفع ملف</button>
                <input type="file" id="file" class="hidden" onchange="upload(this)">
            </div>
            <div id="list" class="space-y-3"></div>
        </div>
    </main>

    <nav class="bottom-nav">
        <div onclick="showPage('home')"><i class="fas fa-home"></i></div>
        <div onclick="showPage('lib')"><i class="fas fa-book"></i></div>
    </nav>

    <script>
        // استبدل المفاتيح من إعدادات مشروعك
        const S_URL = 'رابط_مشروعك_هنا';
        const S_KEY = 'مفتاح_anon_هنا';
        const _s = supabase.createClient(S_URL, S_KEY);

        async function handleLogin() {
            const u = document.getElementById('userInp').value;
            const p = document.getElementById('passInp').value;
            const { error } = await _s.auth.signInWithPassword({ email: `${u}@algo.com`, password: p });
            if(error) alert("خطأ: تأكد من البيانات");
        }

        async function handleRegister() {
            const u = document.getElementById('userInp').value;
            const p = document.getElementById('passInp').value;
            if(p.length < 6) return alert("كلمة السر يجب أن تكون 6 أرقام على الأقل");
            const { error } = await _s.auth.signUp({ email: `${u}@algo.com`, password: p });
            if(error) alert("فشل التسجيل: " + error.message);
            else alert("تم إنشاء الحساب باسم: " + u);
        }

        async function upload(input) {
            const file = input.files[0];
            const name = Date.now() + "_" + file.name;
            const { data, error } = await _s.storage.from('files').upload(name, file);
            if(error) return alert("خطأ رفع: " + error.message);
            
            const { data: u } = _s.storage.from('files').getPublicUrl(name);
            await _s.from('library_files').insert([{ name: file.name, url: u.publicUrl }]);
            render();
        }

        async function render() {
            const { data } = await _s.from('library_files').select('*').order('created_at', {ascending: false});
            document.getElementById('list').innerHTML = data.map(f => `
                <div class="glass p-4 rounded-xl flex justify-between">
                    <span class="truncate w-48">${f.name}</span>
                    <a href="${f.url}" target="_blank" class="text-blue-400">تحميل</a>
                </div>
            `).join('');
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById('p-'+id).classList.add('active-page');
            if(id === 'lib') render();
        }

        _s.auth.onAuthStateChange((evt, session) => {
            if(session) {
                document.getElementById('authPage').style.display = 'none';
                document.getElementById('userGreet').innerText = "أهلاً: " + session.user.email.split('@')[0];
            } else {
                document.getElementById('authPage').style.display = 'flex';
            }
        });
    </script>
</body>
</html>
