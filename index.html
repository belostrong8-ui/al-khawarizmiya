<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخوارزمية - Leader Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #020617; --card: #0f172a; --text: #f8fafc; --accent: #3b82f6; }
        .light-mode { --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --accent: #2563eb; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); transition: 0.3s; height: 100vh; overflow: hidden; }
        .glass { background: var(--card); border: 1px solid rgba(255,255,255,0.05); }
        .page { display: none; height: 100%; flex-direction: column; overflow-y: auto; padding: 2rem; }
        .active-page { display: flex; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .sidebar-btn { width: 100%; text-align: right; padding: 1rem; border-radius: 1.2rem; display: flex; align-items: center; gap: 1rem; font-weight: bold; cursor: pointer; margin-bottom: 0.5rem; }
        .sidebar-btn:hover { background: rgba(59, 130, 246, 0.1); color: var(--accent); }
        .leader-badge { background: #eab308; color: #000; padding: 2px 8px; border-radius: 6px; font-size: 11px; margin-left: 8px; font-weight: 800; }
    </style>
</head>
<body class="flex">

    <div id="authPage" class="fixed inset-0 z-[300] bg-slate-950 flex items-center justify-center p-4">
        <div class="glass p-10 rounded-[3rem] w-full max-w-md text-center border-blue-500/30 border shadow-2xl">
            <div class="w-20 h-20 bg-blue-600 rounded-3xl flex items-center justify-center text-white text-4xl mx-auto mb-6 shadow-lg rotate-3"><i class="fas fa-terminal"></i></div>
            <h2 class="text-3xl font-bold mb-6">الخوارزمية</h2>
            <input type="text" id="uName" placeholder="اسم المستخدم" class="w-full p-4 mb-4 rounded-2xl text-center font-bold bg-black/20 border border-white/10 outline-none">
            
            <div id="passField" class="hidden mb-4 transition-all">
                <input type="password" id="uPass" placeholder="كلمة سر القائد" class="w-full p-4 rounded-2xl text-center bg-black/20 border border-blue-500/50 outline-none shadow-[0_0_15px_rgba(59,130,246,0.2)]">
            </div>

            <button onclick="handleLogin()" class="w-full bg-blue-600 p-4 rounded-2xl font-bold text-xl hover:bg-blue-700 transition shadow-lg">دخول</button>
            <p id="regHint" class="mt-4 text-[10px] text-blue-400/50">لو اسم جديد، هيتسجل تلقائي في الفريق.</p>
        </div>
    </div>

    <div id="mainApp" class="hidden flex w-full h-full">
        <aside class="w-72 glass flex flex-col p-6 border-l border-white/5 shadow-2xl">
            <div class="mb-10 flex items-center gap-3 px-2">
                <i class="fas fa-shield-alt text-2xl text-blue-500"></i>
                <h1 class="font-bold text-xl">الخوارزمية</h1>
            </div>
            <nav class="flex-1">
                <button onclick="showPage('dashboard')" class="sidebar-btn"><i class="fas fa-th-large"></i> <span data-key="nav-home">الرئيسية</span></button>
                <button onclick="showPage('chat')" class="sidebar-btn"><i class="fas fa-comments"></i> <span data-key="nav-chat">غرفة المراسلة</span></button>
                <button onclick="showPage('library')" class="sidebar-btn"><i class="fas fa-book"></i> <span data-key="nav-lib">المكتبة</span></button>
                <button id="adminLink" onclick="showPage('admin')" class="hidden sidebar-btn text-yellow-500 border border-yellow-500/10"><i class="fas fa-crown"></i> <span data-key="nav-admin">لوحة الإدارة</span></button>
            </nav>
            <div class="pt-6 border-t border-white/5 space-y-3">
                <button onclick="toggleLang()" class="w-full p-3 glass rounded-xl text-xs font-bold hover:bg-white/5"><i class="fas fa-language"></i> <span id="langLabel">English</span></button>
                <button onclick="toggleTheme()" class="w-full p-3 glass rounded-xl text-xs font-bold hover:bg-white/5"><i class="fas fa-adjust"></i> <span data-key="nav-theme">تبديل المظهر</span></button>
                <button onclick="logout()" class="w-full p-4 bg-red-500/10 text-red-500 rounded-2xl font-bold hover:bg-red-500/20"><i class="fas fa-power-off"></i> <span data-key="nav-logout">تسجيل خروج</span></button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <div id="p-dashboard" class="page active-page">
                <div class="bg-blue-600/10 border border-blue-500/20 p-4 rounded-2xl mb-10"><marquee id="newsDisplay" class="font-bold text-blue-400"></marquee></div>
                <h2 id="helloUser" class="text-4xl font-bold mb-10"></h2>
                <div class="grid grid-cols-2 gap-8">
                    <div class="glass p-10 rounded-[2.5rem] border-r-4 border-blue-500">
                        <h3 class="opacity-50 text-sm mb-2" data-key="stat-users">الأعضاء المتصلين</h3>
                        <p id="sUsersCount" class="text-6xl font-black">0</p>
                    </div>
                    <div class="glass p-10 rounded-[2.5rem] border-r-4 border-red-500">
                        <h3 class="opacity-50 text-sm mb-2" data-key="stat-files">الملفات المرفوعة</h3>
                        <p id="fCount" class="text-6xl font-black">0</p>
                    </div>
                </div>
            </div>

            <div id="p-library" class="page">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-3xl font-bold" data-key="nav-lib">المكتبة</h2>
                    <div id="uploadSection" class="hidden">
                        <input type="file" id="pdfInput" accept="application/pdf" class="hidden" onchange="uploadPDF()">
                        <button onclick="document.getElementById('pdfInput').click()" class="bg-blue-600 px-8 py-3 rounded-2xl font-bold shadow-lg hover:bg-blue-500 transition">رفع ملف PDF</button>
                    </div>
                </div>
                <div id="fileList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>

            <div id="p-chat" class="page">
                <div id="chatBox" class="flex-1 glass rounded-[2.5rem] p-6 mb-6 overflow-y-auto flex flex-col gap-4"></div>
                <div class="flex gap-4 p-2 glass rounded-2xl">
                    <input type="text" id="chatInput" class="flex-1 bg-transparent p-4 outline-none" placeholder="اكتب رسالتك...">
                    <button onclick="sendMsg()" class="bg-blue-600 h-14 w-14 rounded-xl text-xl hover:bg-blue-500 transition"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

            <div id="p-admin" class="page">
                <h2 class="text-3xl font-bold text-yellow-500 mb-8">لوحة تحكم القائد</h2>
                <textarea id="newsInput" class="w-full p-6 glass rounded-2xl mb-4 h-32 outline-none" placeholder="اكتب خبر اليوم..."></textarea>
                <button onclick="updateNews()" class="bg-yellow-600 text-black font-bold w-full p-4 rounded-xl hover:bg-yellow-500">تحديث الخبر على الموقع</button>
            </div>
        </main>
    </div>

    <script>
        let session = JSON.parse(localStorage.getItem('alg_session') || 'null');
        let registered = JSON.parse(localStorage.getItem('alg_registered') || '[]');
        let msgs = JSON.parse(localStorage.getItem('alg_msgs_v9') || '[]');
        let files = JSON.parse(localStorage.getItem('alg_files_v9') || '[]');
        let currentLang = localStorage.getItem('alg_lang') || 'ar';
        let news = localStorage.getItem('alg_news') || "أهلاً بكم في منصة الخوارزمية!";

        const dict = {
            ar: { 'nav-home': 'الرئيسية', 'nav-chat': 'المراسلة', 'nav-lib': 'المكتبة', 'nav-admin': 'لوحة الإدارة', 'nav-theme': 'المظهر', 'nav-logout': 'خروج', 'stat-users': 'الأعضاء', 'stat-files': 'الملفات' },
            en: { 'nav-home': 'Home', 'nav-chat': 'Chat', 'nav-lib': 'Library', 'nav-admin': 'Admin', 'nav-theme': 'Theme', 'nav-logout': 'Logout', 'stat-users': 'Members', 'stat-files': 'Files' }
        };

        // إظهار الباسورد للقائد فقط
        document.getElementById('uName').addEventListener('input', (e) => {
            const isBelal = e.target.value.toLowerCase().trim() === 'belal';
            document.getElementById('passField').classList.toggle('hidden', !isBelal);
        });

        function handleLogin() {
            const name = document.getElementById('uName').value.trim();
            const pass = document.getElementById('uPass').value;
            if(!name) return;

            if(name.toLowerCase() === 'belal') {
                if(pass === '159078@1#') {
                    localStorage.setItem('alg_session', JSON.stringify({name: 'Belal', role: 'ADMIN'}));
                    location.reload();
                } else { alert('كلمة سر القائد غلط!'); }
            } else {
                if(!registered.includes(name)) { registered.push(name); localStorage.setItem('alg_registered', JSON.stringify(registered)); }
                localStorage.setItem('alg_session', JSON.stringify({name: name, role: 'USER'}));
                location.reload();
            }
        }

        function updateUI() {
            if(!session) return;
            document.getElementById('helloUser').innerText = (currentLang==='ar'?'أهلاً بك، ':'Welcome, ') + session.name;
            document.getElementById('newsDisplay').innerText = `[${session.name}] : ${news}`;
            if(session.role === 'ADMIN') {
                document.getElementById('adminLink').classList.remove('hidden');
                document.getElementById('uploadSection').classList.remove('hidden');
            }
            document.getElementById('sUsersCount').innerText = registered.length + 1;
            document.getElementById('langLabel').innerText = currentLang === 'ar' ? 'English' : 'العربية';
            document.querySelectorAll('[data-key]').forEach(el => el.innerText = dict[currentLang][el.getAttribute('data-key')]);
            renderFiles(); renderChat();
        }

        function toggleLang() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            localStorage.setItem('alg_lang', currentLang);
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            updateUI();
        }

        function sendMsg() {
            const txt = document.getElementById('chatInput').value;
            if(!txt) return;
            msgs.push({user: session.name, text: txt, isLeader: session.role === 'ADMIN'});
            localStorage.setItem('alg_msgs_v9', JSON.stringify(msgs));
            document.getElementById('chatInput').value = ''; renderChat();
        }

        function renderChat() {
            const box = document.getElementById('chatBox');
            if(!box) return;
            box.innerHTML = msgs.map(m => `
                <div class="p-4 glass rounded-2xl ${m.user === session.name ? 'mr-auto border-r-2 border-blue-500' : 'ml-auto border-r-2 border-slate-500'}">
                    <div class="flex items-center text-[10px] font-bold mb-1">
                        ${m.isLeader ? '<span class="leader-badge">القائد</span>' : ''}
                        <span class="text-blue-400">${m.user}</span>
                    </div>
                    <p class="text-sm">${m.text}</p>
                </div>
            `).join('');
            box.scrollTop = box.scrollHeight;
        }

        function uploadPDF() {
            const f = document.getElementById('pdfInput').files[0];
            if(f) { files.push({name: f.name}); localStorage.setItem('alg_files_v9', JSON.stringify(files)); renderFiles(); }
        }

        function renderFiles() {
            const list = document.getElementById('fileList');
            if(!list) return;
            list.innerHTML = files.map(f => `<div class="glass p-5 rounded-2xl flex justify-between items-center border-r-4 border-red-500"><span>${f.name}</span><i class="fas fa-file-pdf text-red-500 text-xl"></i></div>`).join('');
            document.getElementById('fCount').innerText = files.length;
        }

        function updateNews() {
            localStorage.setItem('alg_news', document.getElementById('newsInput').value);
            location.reload();
        }

        function showPage(id) { document.querySelectorAll('.page').forEach(p=>p.classList.remove('active-page')); document.getElementById('p-'+id).classList.add('active-page'); }
        function toggleTheme() { document.body.classList.toggle('light-mode'); }
        function logout() { localStorage.removeItem('alg_session'); location.reload(); }

        if(session) {
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            updateUI();
        }
    </script>
</body>
</html>
