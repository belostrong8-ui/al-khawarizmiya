<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الخوارزمية - الإصدار الشامل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #020617; --card: #0f172a; --text: #f8fafc; --accent: #3b82f6; }
        .light-mode { --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --accent: #2563eb; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); height: 100vh; overflow: hidden; margin: 0; transition: 0.3s; }
        .glass { background: var(--card); border: 1px solid rgba(128,128,128,0.2); }
        .page { display: none; height: 100%; flex-direction: column; padding: 1.5rem; overflow-y: auto; }
        .active-page { display: flex; }
        .sidebar-btn { width: 100%; text-align: right; padding: 0.8rem; border-radius: 0.8rem; display: flex; align-items: center; gap: 0.8rem; font-weight: bold; cursor: pointer; transition: 0.2s; position: relative; }
        .sidebar-btn:hover, .sidebar-btn.active { background: var(--accent); color: white; }
        
        /* شريط التنقل السفلي للموبايل */
        .mobile-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: var(--card); border-top: 1px solid rgba(255,255,255,0.1); z-index: 100; justify-content: space-around; align-items: center; padding: 0 5px; }
        .mobile-nav .sidebar-btn { flex-direction: column; gap: 4px; padding: 5px; font-size: 10px; width: auto; justify-content: center; }
        .mobile-nav .sidebar-btn i { font-size: 18px; }
        .mobile-nav .badge { position: absolute; top: 2px; right: 2px; margin: 0; }

        @media (max-width: 768px) {
            aside { display: none; } /* إخفاء القائمة الجانبية */
            .mobile-nav { display: flex; } /* إظهار الشريط السفلي */
            .page { padding: 1rem; padding-bottom: 90px; }
            #helloUser { font-size: 1.5rem; margin-bottom: 1.5rem; }
            .user-chip { font-size: 9px; }
            /* جعل جدول الأعضاء متجاوب */
            table, thead, tbody, th, td, tr { display: block; }
            thead { display: none; }
            tr { margin-bottom: 10px; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 15px; }
            td { text-align: right; padding: 5px 0; border: none !important; }
        }

        .news-banner { background: linear-gradient(90deg, #1e3a8a, #3b82f6); padding: 10px; border-radius: 15px; margin-bottom: 20px; overflow: hidden; height: 45px; }
        .news-scroll { display: inline-block; white-space: nowrap; animation: scrollText 15s linear infinite; }
        @keyframes scrollText { 0% { transform: translateX(100%); } 100% { transform: translateX(-150%); } }
        .user-chip { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: bold; cursor: pointer; background: rgba(128,128,128,0.1); border: 1px solid rgba(128,128,128,0.2); white-space: nowrap; }
        .badge { background: #ef4444; color: white; font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-right: auto; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex">

    <div id="authPage" class="fixed inset-0 z-[500] bg-slate-950 flex items-center justify-center p-4">
        <div class="glass p-8 rounded-[2rem] w-full max-w-md text-center border-blue-500/50 border shadow-2xl">
            <h2 id="authTitle" class="text-2xl font-bold mb-6 text-blue-500">دخول الخوارزمية</h2>
            <div class="space-y-4">
                <input type="text" id="uName" placeholder="اسم المستخدم" class="w-full p-4 rounded-xl text-center bg-slate-900 text-white outline-none border border-white/5">
                <input type="password" id="uPass" placeholder="كلمة السر" class="w-full p-4 rounded-xl text-center bg-slate-900 text-white outline-none border border-white/5">
                <button onclick="handleAuth()" class="w-full bg-blue-600 p-4 rounded-xl font-bold hover:bg-blue-700 transition">دخول</button>
                <button onclick="toggleAuthMode()" id="authModeBtn" class="text-blue-400 text-xs mt-2 underline block mx-auto">إنشاء حساب جديد</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden flex w-full h-full">
        <aside class="w-64 glass flex flex-col p-4 border-l border-white/10">
            <div class="mb-8 px-2 flex items-center gap-3"><i class="fas fa-terminal text-blue-500 text-2xl"></i><h1 class="font-bold text-xl">الخوارزمية</h1></div>
            <nav class="flex-1 space-y-1" id="nav-pc">
                </nav>
            <div class="mt-auto pt-4 border-t border-white/10 space-y-2">
                <button onclick="toggleTheme()" class="sidebar-btn text-xs"><i class="fas fa-adjust"></i> تبديل المود</button>
                <button onclick="requestNotify()" id="notifBtn" class="sidebar-btn text-xs text-green-400"><i class="fas fa-bell"></i> الإشعارات</button>
                <button onclick="logout()" class="w-full p-2 bg-red-500/10 text-red-500 rounded-xl font-bold hover:bg-red-500 transition">خروج</button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <div id="p-dashboard" class="page active-page">
                <div class="news-banner"><div id="newsScroll" class="news-scroll text-white font-bold">مرحباً بلال وقادة الخوارزمية..</div></div>
                <h2 id="helloUser" class="text-3xl font-bold mb-8"></h2>
                <div class="glass p-8 rounded-3xl border-r-8 border-blue-500 w-fit shadow-xl"><p class="opacity-60 text-xs font-bold uppercase">قوة الفريق</p><p id="userCount" class="text-6xl font-black">0</p></div>
            </div>

            <div id="p-chat" class="page">
                <div id="chatUserList" class="flex gap-2 p-2 overflow-x-auto mb-2 border-b border-white/5 scrollbar-hide"></div>
                <div id="chatBox" class="flex-1 glass rounded-2xl p-4 mb-4 overflow-y-auto flex flex-col gap-3"></div>
                <div class="flex gap-2 bg-slate-900/50 p-2 rounded-2xl border border-white/5">
                    <input type="file" id="chatFileInput" class="hidden" onchange="sendChatFile()">
                    <button onclick="document.getElementById('chatFileInput').click()" class="text-blue-400 px-3"><i class="fas fa-paperclip text-xl"></i></button>
                    <input type="text" id="chatInput" class="flex-1 bg-transparent p-2 outline-none text-white text-sm" placeholder="اكتب رسالة الفريق...">
                    <button onclick="sendMsg()" class="bg-blue-600 px-6 py-2 rounded-xl text-white hover:bg-blue-700 transition"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

            <div id="p-library" class="page">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                    <h2 class="text-2xl font-bold">المكتبة 📚</h2>
                    <div class="flex w-full md:w-auto gap-2">
                        <div class="relative flex-1">
                            <i class="fas fa-search absolute right-3 top-1/2 -translate-y-1/2 text-gray-500"></i>
                            <input type="text" id="libSearch" oninput="filterLibrary()" placeholder="ابحث..." class="w-full md:w-64 pr-10 pl-4 py-2 bg-slate-900 rounded-xl outline-none border border-white/10">
                        </div>
                        <div id="adminLib" class="hidden">
                            <input type="file" id="libFileInput" class="hidden" onchange="uploadToLibrary()">
                            <button onclick="document.getElementById('libFileInput').click()" class="bg-blue-600 px-4 py-2 rounded-lg font-bold"><i class="fas fa-plus"></i></button>
                        </div>
                    </div>
                </div>
                <div id="libraryList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>

            <div id="p-members" class="page">
                <h2 class="text-2xl font-bold mb-4">إدارة الأعضاء</h2>
                <div class="glass rounded-2xl overflow-hidden shadow-2xl">
                    <table class="w-full text-right">
                        <thead><tr class="bg-slate-800/50 text-xs opacity-60"><th class="p-4">العضو</th><th class="p-4">التحكم</th></tr></thead>
                        <tbody id="memberTableBody"></tbody>
                    </table>
                </div>
            </div>

            <div id="p-admin" class="page">
                <h2 class="text-2xl font-bold text-yellow-500 mb-6 text-center font-black">لوحة القائد 👑</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="glass p-6 rounded-2xl border-yellow-500/20 border text-center">
                        <h3 class="font-bold mb-4">تحديث الأخبار</h3>
                        <input type="text" id="newsInput" class="w-full p-4 bg-slate-800 rounded-xl mb-4 outline-none text-white text-center" placeholder="خبر جديد...">
                        <button onclick="setGlobalNews()" class="w-full bg-yellow-600 p-4 rounded-xl font-bold">تحديث</button>
                    </div>
                </div>
            </div>
        </main>

        <nav class="mobile-nav" id="nav-mobile"></nav>
    </div>

    <script>
        const supabaseUrl = 'https://xhyfprrvpzasbywehzid.supabase.co';
        const supabaseKey = 'sb_publishable_lJ85dVr8A5dOvXWRZ6SWvw_rSwSfp1J';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);
        let currentUser = null; let isLoginMode = true; let allLibFiles = [];

        // تعريف الأزرار عشان نكررها في الموبايل والكمبيوتر
        const menuItems = [
            { id: 'dashboard', icon: 'fa-home', label: 'الرئيسية', badge: null },
            { id: 'chat', icon: 'fa-comments', label: 'المحادثة', badge: null },
            { id: 'library', icon: 'fa-book', label: 'المكتبة', badge: 'libCountBadge' },
            { id: 'members', icon: 'fa-users', label: 'الأعضاء', badge: 'userCountBadge' },
            { id: 'admin', icon: 'fa-crown', label: 'القائد', adminOnly: true }
        ];

        window.onload = () => {
            const saved = localStorage.getItem('algo_user');
            if(saved) { currentUser = JSON.parse(saved); loginSuccess(); }
            if(localStorage.getItem('algo_theme') === 'light') document.body.classList.add('light-mode');
        };

        function buildMenus() {
            const pc = document.getElementById('nav-pc');
            const mobile = document.getElementById('nav-mobile');
            let html = '';
            menuItems.forEach(item => {
                if(item.adminOnly && currentUser.role !== 'ADMIN') return;
                html += `
                <button onclick="showPage('${item.id}')" id="btn-${item.id}" class="sidebar-btn">
                    <i class="fas ${item.icon}"></i> <span>${item.label}</span>
                    ${item.badge ? `<span id="${item.badge}" class="badge">0</span>` : ''}
                </button>`;
            });
            pc.innerHTML = html;
            mobile.innerHTML = html;
        }

        async function handleAuth() {
            const n = document.getElementById('uName').value.trim().toLowerCase();
            const p = document.getElementById('uPass').value;
            if(isLoginMode) {
                const { data } = await _supabase.from('profiles').select('*').eq('username', n).eq('password', p).single();
                if(data) { currentUser = data; localStorage.setItem('algo_user', JSON.stringify(data)); loginSuccess(); } else alert('خطأ!');
            } else {
                await _supabase.from('profiles').insert([{ username: n, password: p, role: 'USER' }]);
                alert('تم!'); isLoginMode = true; toggleAuthMode();
            }
        }

        function loginSuccess() {
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            buildMenus();
            if(currentUser.role === 'ADMIN') document.getElementById('adminLib').classList.remove('hidden');
            initApp();
        }

        function initApp() {
            updateUI();
            _supabase.channel('room').on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, () => updateUI()).subscribe();
            _supabase.channel('profiles').on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => updateUI()).subscribe();
            setInterval(async () => {
                const { data } = await _supabase.from('profiles').select('id').eq('id', currentUser.id);
                if(!data || data.length === 0) logout();
            }, 5000);
        }

        async function updateUI() {
            if(!currentUser) return;
            document.getElementById('helloUser').innerText = `أهلاً ${currentUser.username} ${currentUser.role==='ADMIN'?'👑':''}`;
            
            const { data: users } = await _supabase.from('profiles').select('*');
            if(users) {
                document.getElementById('userCount').innerText = users.length;
                document.querySelectorAll('#userCountBadge').forEach(b => b.innerText = users.length);
                document.getElementById('memberTableBody').innerHTML = users.map(u => `
                    <tr class="border-b border-white/5">
                        <td class="p-4 font-bold">${u.username} ${u.role === 'ADMIN' ? '👑' : ''}</td>
                        <td class="p-4 text-left">
                            ${currentUser.role==='ADMIN' && u.role!=='ADMIN' ? `<button onclick="deleteUser(${u.id})" class="bg-red-500 text-white px-3 py-1 rounded text-xs">طرد</button>` : '<span class="text-green-500 text-[10px]">نشط</span>'}
                        </td>
                    </tr>`).join('');
                document.getElementById('chatUserList').innerHTML = users.map(u => `<div onclick="mention('${u.username}')" class="user-chip">@${u.username}</div>`).join('');
            }

            const { data: msgs } = await _supabase.from('messages').select('*').order('created_at', { ascending: false });
            if(msgs) {
                const news = msgs.find(m => m.content.startsWith('SYS_NEWS:'));
                if(news) document.getElementById('newsScroll').innerText = news.content.replace('SYS_NEWS:', '');

                document.getElementById('chatBox').innerHTML = msgs
                    .filter(m => !m.content.startsWith('LIB_FILE:') && !m.content.startsWith('SYS_NEWS:'))
                    .reverse().map(m => {
                        const isMy = m.username === currentUser.username;
                        return `<div class="p-3 glass rounded-xl ${isMy ? 'mr-auto bg-blue-500/20' : 'ml-auto'} max-w-[85%] relative group">
                            <span class="text-[9px] text-blue-400 font-bold">${m.username}</span>
                            <p class="text-sm">${m.content}</p>
                            ${(isMy || currentUser.role === 'ADMIN') ? `<button onclick="deleteMsg(${m.id})" class="absolute -top-2 -right-2 bg-red-600 text-white w-5 h-5 rounded-full text-[10px] hidden group-hover:block"><i class="fas fa-times"></i></button>` : ''}
                        </div>`;
                    }).join('');
                document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;

                allLibFiles = msgs.filter(m => m.content.startsWith('LIB_FILE:'));
                document.querySelectorAll('#libCountBadge').forEach(b => b.innerText = allLibFiles.length);
                filterLibrary();
            }
        }

        function filterLibrary() {
            const term = document.getElementById('libSearch').value.toLowerCase();
            const filtered = allLibFiles.filter(f => f.content.split('|')[2].toLowerCase().includes(term));
            document.getElementById('libraryList').innerHTML = filtered.map(f => {
                const [mime, url, name] = f.content.replace('LIB_FILE:', '').split('|');
                return `<div class="glass p-4 rounded-xl border border-white/5 flex flex-col gap-2">
                    <span class="text-xs font-bold truncate">${name}</span>
                    <div class="flex gap-2">
                        <button onclick="window.open('${url}')" class="flex-1 bg-blue-600 py-2 rounded-lg text-[10px]">فتح</button>
                        ${currentUser.role === 'ADMIN' ? `<button onclick="deleteMsg(${f.id})" class="text-red-500 px-2"><i class="fas fa-trash"></i></button>` : ''}
                    </div>
                </div>`;
            }).join('');
        }

        async function sendMsg() { const t = document.getElementById('chatInput').value.trim(); if(t) { await _supabase.from('messages').insert([{ username: currentUser.username, content: t }]); document.getElementById('chatInput').value = ''; } }
        async function setGlobalNews() { const v = document.getElementById('newsInput').value; if(v) await _supabase.from('messages').insert([{ username: 'SYSTEM', content: `SYS_NEWS:${v}` }]); document.getElementById('newsInput').value = ''; }
        async function deleteMsg(id) { if(confirm('حذف؟')) await _supabase.from('messages').delete().eq('id', id); }
        async function deleteUser(id) { if(confirm('طرد؟')) await _supabase.from('profiles').delete().eq('id', id); }
        function showPage(id) { 
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page')); 
            document.getElementById('p-'+id).classList.add('active-page'); 
            document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll(`#btn-${id}`).forEach(b => b.classList.add('active'));
        }
        function toggleTheme() { document.body.classList.toggle('light-mode'); localStorage.setItem('algo_theme', document.body.classList.contains('light-mode') ? 'light' : 'dark'); }
        function logout() { localStorage.removeItem('algo_user'); location.reload(); }
        function toggleAuthMode() { isLoginMode = !isLoginMode; document.getElementById('authTitle').innerText = isLoginMode ? 'دخول الخوارزمية' : 'حساب جديد'; }
        function mention(n) { document.getElementById('chatInput').value += `@${n} `; document.getElementById('chatInput').focus(); }
    </script>
</body>
</html>
