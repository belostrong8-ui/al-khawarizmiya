<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="tabTitle">الخوارزمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #020617; --card: #0f172a; --text: #f8fafc; --accent: #3b82f6; }
        .light-mode { --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --accent: #2563eb; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); transition: 0.3s; overflow: hidden; height: 100vh; margin: 0; }
        .glass { background: var(--card); border: 1px solid rgba(255,255,255,0.05); }
        .page { display: none; height: 100%; flex-direction: column; overflow-y: auto; padding: 1.5rem; }
        .active-page { display: flex; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .sidebar-btn { width: 100%; text-align: right; padding: 0.8rem; border-radius: 1rem; display: flex; align-items: center; gap: 1rem; font-weight: bold; transition: 0.2s; cursor: pointer; }
        .sidebar-btn:hover { background: rgba(59, 130, 246, 0.1); color: var(--accent); }
        .msg-bubble { background: #1e293b; padding: 12px; border-radius: 15px; margin-bottom: 10px; max-width: 85%; border-right: 3px solid var(--accent); }
        .user-selector { cursor: pointer; transition: 0.3s; border: 2px solid transparent; }
        .user-selector:hover { border-color: var(--accent); transform: scale(1.02); }
    </style>
</head>
<body class="flex">

    <div id="authPage" class="fixed inset-0 z-[200] bg-slate-950 flex items-center justify-center p-4">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-md text-center border-blue-500/20 border shadow-2xl">
            <h2 class="text-3xl font-bold mb-8">الخوارزمية</h2>
            <div id="loginBox">
                <input type="text" id="uName" placeholder="اسم المستخدم" class="w-full p-4 mb-4 rounded-2xl bg-black/40 border border-white/10 outline-none text-center">
                <input type="password" id="uPass" placeholder="كلمة السر" class="w-full p-4 mb-6 rounded-2xl bg-black/40 border border-white/10 outline-none text-center">
                <button onclick="login()" class="w-full bg-blue-600 p-4 rounded-2xl font-bold text-xl hover:bg-blue-700 transition">دخول</button>
                <p class="mt-4 text-sm text-slate-400">ليس لديك حساب؟ <a href="#" onclick="alert('خاصية التسجيل ستعمل في التحديث القادم!')" class="text-blue-500 font-bold">سجل الآن</a></p>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden flex w-full h-full">
        <aside class="w-64 glass flex flex-col p-5 shadow-2xl border-l border-white/5">
            <div class="mb-10 text-center">
                <div class="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center text-white text-2xl mx-auto mb-2"><i class="fas fa-terminal"></i></div>
                <h1 class="font-bold text-lg">الخوارزمية</h1>
            </div>
            <nav class="space-y-2 flex-1">
                <button onclick="showPage('dashboard')" class="sidebar-btn"><i class="fas fa-home text-blue-500"></i> الرئيسية</button>
                <button onclick="showPage('chat-init')" class="sidebar-btn"><i class="fas fa-comments text-green-500"></i> المراسلات</button>
                <button onclick="showPage('library')" class="sidebar-btn"><i class="fas fa-book text-red-500"></i> المكتبة</button>
                <button id="adminLink" onclick="showPage('admin')" class="hidden sidebar-btn text-yellow-500 border border-yellow-500/10"><i class="fas fa-crown"></i> لوحة القائد</button>
            </nav>
            <div class="pt-4 border-t border-white/10 space-y-2">
                <button onclick="toggleTheme()" class="w-full p-3 rounded-xl glass text-xs font-bold flex items-center gap-2 justify-center"><i class="fas fa-adjust"></i> المظهر</button>
                <button onclick="logout()" class="w-full p-3 rounded-xl bg-red-500/10 text-red-500 font-bold"><i class="fas fa-sign-out-alt"></i> خروج</button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <div id="p-dashboard" class="page active-page">
                <h2 id="welcomeHead" class="text-3xl font-bold mb-8 text-blue-500">أهلاً بك يا بطل</h2>
                <div class="grid grid-cols-2 gap-6">
                    <div class="glass p-8 rounded-3xl border-r-4 border-blue-600 shadow-xl text-center">
                        <h3 class="opacity-50 text-sm">أعضاء الموقع</h3>
                        <p class="text-5xl font-bold">2</p>
                    </div>
                    <div class="glass p-8 rounded-3xl border-r-4 border-red-600 shadow-xl text-center">
                        <h3 class="opacity-50 text-sm">الملفات</h3>
                        <p class="text-5xl font-bold">0</p>
                    </div>
                </div>
            </div>

            <div id="p-chat-init" class="page items-center justify-center text-center">
                <h2 class="text-2xl font-bold mb-8">اختر اسمك للدردشة</h2>
                <div class="grid grid-cols-3 gap-6 max-w-2xl w-full">
                    <div onclick="startChat('بلال')" class="glass p-6 rounded-2xl user-selector">
                        <div class="w-16 h-16 bg-blue-600 rounded-full mx-auto mb-4 flex items-center justify-center text-2xl">ب</div>
                        <p class="font-bold">بلال</p>
                    </div>
                    <div onclick="startChat('أنس')" class="glass p-6 rounded-2xl user-selector">
                        <div class="w-16 h-16 bg-green-600 rounded-full mx-auto mb-4 flex items-center justify-center text-2xl">أ</div>
                        <p class="font-bold">أنس</p>
                    </div>
                    <div onclick="startChat('حمزة')" class="glass p-6 rounded-2xl user-selector">
                        <div class="w-16 h-16 bg-purple-600 rounded-full mx-auto mb-4 flex items-center justify-center text-2xl">ح</div>
                        <p class="font-bold">حمزة</p>
                    </div>
                </div>
            </div>

            <div id="p-chat-main" class="page">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold">غرفة المراسلات</h2>
                    <span id="currentChatUser" class="bg-blue-600/20 text-blue-500 px-4 py-1 rounded-full font-bold"></span>
                </div>
                <div id="chatBox" class="flex-1 glass rounded-2xl p-4 mb-4 overflow-y-auto flex flex-col gap-2"></div>
                <div class="flex gap-2">
                    <input type="text" id="chatInput" class="flex-1 p-4 rounded-xl glass outline-none border border-white/5" placeholder="اكتب رسالتك...">
                    <button onclick="sendMsg()" class="bg-blue-600 px-8 rounded-xl font-bold hover:bg-blue-700 transition"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

            </main>
    </div>

    <script>
        let session = JSON.parse(localStorage.getItem('alg_session') || 'null');
        let selectedUser = null;
        let msgs = JSON.parse(localStorage.getItem('alg_msgs_v2') || '[]');

        function login() {
            const n = document.getElementById('uName').value.trim();
            const p = document.getElementById('uPass').value;
            if(n.toLowerCase()==='belal' && p==='159078@1#') {
                localStorage.setItem('alg_session', JSON.stringify({name:'Belal', role:'ADMIN'}));
                location.reload();
            } else if(n && p) {
                localStorage.setItem('alg_session', JSON.stringify({name:n, role:'USER'}));
                location.reload();
            }
        }

        function startChat(name) {
            selectedUser = name;
            document.getElementById('currentChatUser').innerText = "متصل باسم: " + name;
            showPage('chat-main');
            renderChat();
        }

        function sendMsg() {
            const txt = document.getElementById('chatInput').value;
            if(!txt || !selectedUser) return;
            msgs.push({user: selectedUser, text: txt, time: new Date().toLocaleTimeString('ar-EG')});
            localStorage.setItem('alg_msgs_v2', JSON.stringify(msgs));
            document.getElementById('chatInput').value = '';
            renderChat();
        }

        function renderChat() {
            const box = document.getElementById('chatBox');
            if(!box) return;
            box.innerHTML = msgs.map(m => `
                <div class="msg-bubble ${m.user === selectedUser ? 'mr-auto border-blue-500' : 'ml-auto border-slate-500'}">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-blue-400 font-bold text-xs">${m.user}</span>
                        <span class="text-[10px] opacity-40">${m.time}</span>
                    </div>
                    <p class="text-sm">${m.text}</p>
                </div>
            `).join('');
            box.scrollTop = box.scrollHeight;
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p=>p.classList.remove('active-page'));
            document.getElementById('p-'+id).classList.add('active-page');
        }

        function toggleTheme() { document.body.classList.toggle('light-mode'); }
        function logout() { localStorage.removeItem('alg_session'); location.reload(); }

        if(session) {
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('welcomeHead').innerText = "أهلاً يا " + session.name;
            if(session.role === 'ADMIN') document.getElementById('adminLink').classList.remove('hidden');
        }
    </script>
</body>
</html>
