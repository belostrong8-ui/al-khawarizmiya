<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الخوارزمية - V30 Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #020617; --card: #0f172a; --text: #f8fafc; --accent: #3b82f6; }
        .light-mode { --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --accent: #2563eb; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); height: 100vh; overflow: hidden; margin: 0; transition: 0.3s; }
        .glass { background: var(--card); border: 1px solid rgba(255,255,255,0.05); }
        .page { display: none; height: 100%; flex-direction: column; padding: 1.5rem; overflow-y: auto; }
        .active-page { display: flex; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .sidebar-btn { width: 100%; text-align: right; padding: 1rem; border-radius: 1rem; display: flex; align-items: center; gap: 1rem; font-weight: bold; cursor: pointer; }
        .sidebar-btn.active { background: var(--accent); color: white; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4); }
        .marquee-box { background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.2); border-radius: 15px; padding: 10px; overflow: hidden; margin-bottom: 2rem; }
        .marquee-text { display: inline-block; white-space: nowrap; animation: scroll 15s linear infinite; font-weight: bold; color: #60a5fa; }
        @keyframes scroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-150%); } }
    </style>
</head>
<body class="flex">

    <div id="authPage" class="fixed inset-0 z-[500] bg-slate-950 flex items-center justify-center p-4">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-md text-center border-blue-500/30 border shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 text-blue-500">دخول القائد</h2>
            <div class="space-y-4">
                <input type="text" id="uName" placeholder="اسم المستخدم" class="w-full p-4 rounded-xl text-center bg-slate-900 border border-white/10 outline-none text-white focus:border-blue-500">
                <input type="password" id="uPass" placeholder="كلمة السر" class="w-full p-4 rounded-xl text-center bg-slate-900 border border-white/10 outline-none text-white focus:border-blue-500">
                <button onclick="handleAuth()" class="w-full bg-blue-600 p-4 rounded-xl font-bold hover:bg-blue-700 transition text-white">دخول للمنصة</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden flex w-full h-full">
        <aside class="w-64 glass flex flex-col p-4 border-l border-white/5">
            <div class="mb-8 px-2 flex items-center gap-3 cursor-pointer" onclick="showPage('dashboard')">
                <i class="fas fa-terminal text-2xl text-blue-500"></i>
                <h1 class="font-bold text-xl text-white">الخوارزمية</h1>
            </div>
            <nav class="flex-1 space-y-1">
                <button onclick="showPage('dashboard')" id="btn-dashboard" class="sidebar-btn active"><i class="fas fa-home"></i> الرئيسية</button>
                <button onclick="showPage('chat')" id="btn-chat" class="sidebar-btn"><i class="fas fa-comments"></i> المحادثة</button>
                <button onclick="showPage('members')" id="btn-members" class="sidebar-btn"><i class="fas fa-users"></i> الأعضاء</button>
                <button id="adminLink" onclick="showPage('admin')" class="hidden sidebar-btn text-yellow-500"><i class="fas fa-crown"></i> لوحة القائد</button>
            </nav>
            <button onclick="logout()" class="w-full p-3 bg-red-500/10 text-red-500 rounded-xl font-bold mt-2">خروج</button>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <div id="p-dashboard" class="page active-page">
                <div class="marquee-box"><div id="newsDisplay" class="marquee-text">مرحباً بالقائد بلال في منصة الخوارزمية أونلاين</div></div>
                <h2 id="helloUser" class="text-3xl font-bold mb-8 text-white"></h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 text-white">
                    <div class="glass p-8 rounded-3xl border-r-8 border-blue-500 shadow-xl"><p class="opacity-60 font-bold mb-2 text-sm">حالة السيرفر</p><p id="serverStatus" class="text-4xl font-black text-green-500">Online</p></div>
                    <div class="glass p-8 rounded-3xl border-r-8 border-yellow-500 shadow-xl"><p class="opacity-60 font-bold mb-2 text-sm">الرتبة</p><p id="userRole" class="text-4xl font-black">--</p></div>
                </div>
            </div>

            <div id="p-chat" class="page">
                <div id="chatBox" class="flex-1 glass rounded-2xl p-4 mb-4 overflow-y-auto flex flex-col gap-3"></div>
                <div class="flex gap-2">
                    <input type="text" id="chatInput" class="flex-1 bg-slate-900 p-4 rounded-xl outline-none text-white border border-white/5" placeholder="اكتب رسالتك...">
                    <button onclick="sendMsg()" class="bg-blue-600 px-6 rounded-xl text-white hover:bg-blue-700"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

            <div id="p-members" class="page">
                <h2 class="text-2xl font-bold mb-4 text-white">أعضاء الفريق أونلاين</h2>
                <div id="membersList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>

            <div id="p-admin" class="page">
                <h2 class="text-2xl font-bold text-yellow-500 mb-6">غرفة القيادة 👑</h2>
                <div class="glass p-6 rounded-3xl max-w-md border border-yellow-500/20">
                    <h3 class="font-bold mb-4 text-white">تغيير الخبر العاجل</h3>
                    <input type="text" id="newsInput" class="w-full p-4 rounded-xl bg-slate-900 border border-white/10 mb-4 text-white text-center" placeholder="...">
                    <button onclick="updateNews()" class="w-full bg-yellow-600 p-4 rounded-xl font-bold text-slate-950 hover:bg-yellow-500">تحديث</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // إعدادات السيرفر
        const supabaseUrl = 'https://xhyfprrvpzasbywehzid.supabase.co';
        const supabaseKey = 'sb_publishable_lJ85dvR8A5d0vXWRZ6SWvw_rSwSf56A5uK9900';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let session = JSON.parse(localStorage.getItem('alg_session_v30') || 'null');

        // --- نظام التحقق المدمج ببياناتك يا بلال ---
        async function handleAuth() {
            const n = document.getElementById('uName').value.trim().toLowerCase();
            const p = document.getElementById('uPass').value;

            // التأكد من بيانات القائد بلال (أوفلاين وأونلاين)
            if (n === 'belal' && p === '159078@1#') {
                saveSession('belal', 'ADMIN');
                return;
            }

            // محاولة الدخول لباقي الأعضاء من السيرفر
            const { data, error } = await _supabase.from('profiles').select('*').eq('username', n).eq('password', p).single();
            if (data) {
                saveSession(n, data.role);
            } else {
                alert('خطأ في البيانات! تأكد من الاسم والباسورد');
            }
        }

        function saveSession(name, role) {
            localStorage.setItem('alg_session_v30', JSON.stringify({name, role}));
            location.reload();
        }

        async function loadData() {
            if(!session) return;
            
            // تحميل الرسائل
            const { data: msgs } = await _supabase.from('messages').select('*').order('created_at', { ascending: true });
            if(msgs) {
                document.getElementById('chatBox').innerHTML = msgs.map(m => `
                    <div class="p-3 glass rounded-xl ${m.username === session.name ? 'mr-auto bg-blue-500/10' : 'ml-auto'} max-w-[80%]">
                        <span class="text-[10px] font-bold text-blue-400">${m.username === 'belal' ? 'القائد بلال 👑' : m.username}</span>
                        <p class="text-sm text-white mt-1">${m.content}</p>
                    </div>
                `).join('');
                document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
            }

            // تحميل الأعضاء
            const { data: users } = await _supabase.from('profiles').select('username, role');
            if(users) {
                document.getElementById('membersList').innerHTML = users.map(u => `
                    <div class="glass p-4 rounded-xl flex justify-between items-center border-r-4 ${u.username === 'belal' ? 'border-yellow-500' : 'border-blue-500'}">
                        <span class="font-bold text-white">${u.username === 'belal' ? 'القائد بلال 👑' : u.username}</span>
                        <span class="text-[10px] opacity-50">${u.role}</span>
                    </div>
                `).join('');
            }
            
            // تحميل الأخبار
            const { data: news } = await _supabase.from('settings').select('value').eq('key', 'news').single();
            if(news) document.getElementById('newsDisplay').innerText = news.value;
        }

        async function sendMsg() {
            const t = document.getElementById('chatInput').value.trim();
            if(!t) return;
            await _supabase.from('messages').insert([{ username: session.name, content: t }]);
            document.getElementById('chatInput').value = '';
            loadData();
        }

        async function updateNews() {
            const val = document.getElementById('newsInput').value;
            await _supabase.from('settings').upsert([{ key: 'news', value: val }]);
            alert('تم التحديث!'); loadData();
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('p-'+id).classList.add('active-page');
            document.getElementById('btn-'+id).classList.add('active');
        }

        function logout() { localStorage.removeItem('alg_session_v30'); location.reload(); }

        if(session) {
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('helloUser').innerText = `أهلاً يا ${session.name === 'belal' ? 'بلال' : session.name}`;
            document.getElementById('userRole').innerText = session.role;
            if(session.role === 'ADMIN') document.getElementById('adminLink').classList.remove('hidden');
            loadData();
            // تحديث لحظي
            _supabase.channel('any').on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, () => loadData()).subscribe();
        }
    </script>
</body>
</html>
