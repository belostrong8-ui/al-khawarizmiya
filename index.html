<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الخوارزمية - Online Edition</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');

        :root {
            --bg: #020617;
            --card: #0f172a;
            --text: #f8fafc;
            --accent: #3b82f6;
        }

        .light-mode {
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #0f172a;
            --accent: #2563eb;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            height: 100vh;
            overflow: hidden;
            transition: .3s;
        }

        .glass {
            background: var(--card);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .page {
            display: none;
            height: 100%;
            padding: 1.5rem;
            overflow-y: auto;
            flex-direction: column;
        }

        .active-page {
            display: flex;
        }

        .sidebar-btn {
            width: 100%;
            padding: 1rem;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: right;
        }

        .sidebar-btn:hover,
        .sidebar-btn.active {
            background: var(--accent);
            color: white;
        }

        .msg-box {
            max-width: 80%;
            word-break: break-word;
        }

        .marquee-box {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 15px;
            padding: 10px;
            overflow: hidden;
            margin-bottom: 2rem;
        }

        .marquee-text {
            display: inline-block;
            white-space: nowrap;
            animation: scroll 15s linear infinite;
            font-weight: bold;
            color: #60a5fa;
        }

        @keyframes scroll {
            0% {
                transform: translateX(100%);
            }

            100% {
                transform: translateX(-150%);
            }
        }
    </style>
</head>

<body class="flex">

    <!-- LOGIN -->

    <div id="authPage"
        class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4">

        <div
            class="glass p-8 rounded-[2rem] w-full max-w-md text-center border border-blue-500/20">

            <h1 class="text-3xl font-black mb-6 text-blue-500">
                الخوارزمية
            </h1>

            <div class="space-y-4">

                <input id="uName"
                    type="text"
                    placeholder="اسم المستخدم"
                    class="w-full p-4 rounded-xl bg-slate-900 outline-none text-center text-white">

                <input id="uPass"
                    type="password"
                    placeholder="كلمة السر"
                    class="w-full p-4 rounded-xl bg-slate-900 outline-none text-center text-white">

                <button onclick="handleAuth()"
                    id="authBtn"
                    class="w-full bg-blue-600 hover:bg-blue-700 p-4 rounded-xl font-bold">
                    دخول
                </button>

                <button onclick="toggleAuthMode()"
                    id="toggleBtn"
                    class="text-blue-400 text-sm underline">
                    إنشاء حساب
                </button>

            </div>

        </div>

    </div>

    <!-- APP -->

    <div id="mainApp" class="hidden flex w-full h-full">

        <!-- SIDEBAR -->

        <aside class="w-64 glass p-4 flex flex-col border-l border-white/5">

            <div class="mb-8 flex items-center gap-3">

                <i class="fas fa-terminal text-blue-500 text-2xl"></i>

                <h1 class="font-black text-xl">
                    الخوارزمية
                </h1>

            </div>

            <nav class="flex-1 space-y-2">

                <button onclick="showPage('dashboard')"
                    id="btn-dashboard"
                    class="sidebar-btn active">

                    <i class="fas fa-home"></i>
                    الرئيسية

                </button>

                <button onclick="showPage('chat')"
                    id="btn-chat"
                    class="sidebar-btn">

                    <i class="fas fa-comments"></i>
                    المحادثة

                </button>

                <button onclick="showPage('members')"
                    id="btn-members"
                    class="sidebar-btn">

                    <i class="fas fa-users"></i>
                    الأعضاء

                </button>

            </nav>

            <button onclick="logout()"
                class="bg-red-500/10 text-red-500 p-3 rounded-xl font-bold">
                خروج
            </button>

        </aside>

        <!-- MAIN -->

        <main class="flex-1 overflow-hidden flex flex-col">

            <!-- DASHBOARD -->

            <div id="p-dashboard"
                class="page active-page">

                <div class="marquee-box">
                    <div class="marquee-text">
                        مرحباً بكم في منصة الخوارزمية 🚀
                    </div>
                </div>

                <h2 id="helloUser"
                    class="text-3xl font-black mb-8">
                </h2>

                <div class="grid md:grid-cols-2 gap-6">

                    <div class="glass p-8 rounded-3xl border-r-8 border-blue-500">

                        <p class="opacity-50 mb-2">
                            عدد الأعضاء
                        </p>

                        <h1 id="userCount"
                            class="text-6xl font-black">
                            0
                        </h1>

                    </div>

                    <div class="glass p-8 rounded-3xl border-r-8 border-green-500">

                        <p class="opacity-50 mb-2">
                            عدد الرسائل
                        </p>

                        <h1 id="msgCount"
                            class="text-6xl font-black">
                            0
                        </h1>

                    </div>

                </div>

            </div>

            <!-- CHAT -->

            <div id="p-chat"
                class="page">

                <div class="flex gap-4 h-full overflow-hidden">

                    <!-- USERS -->

                    <div
                        class="hidden md:block w-48 glass rounded-2xl p-3 overflow-y-auto">

                        <h3 class="text-xs opacity-40 mb-3">
                            الأعضاء
                        </h3>

                        <div id="chatUserList"
                            class="space-y-2">
                        </div>

                    </div>

                    <!-- CHAT -->

                    <div class="flex-1 flex flex-col overflow-hidden">

                        <div id="chatBox"
                            class="flex-1 glass rounded-2xl p-4 mb-4 overflow-y-auto flex flex-col gap-3">
                        </div>

                        <div class="glass p-2 rounded-2xl flex gap-2">

                            <input id="chatInput"
                                type="text"
                                placeholder="اكتب رسالة..."
                                class="flex-1 bg-transparent p-4 outline-none text-white">

                            <button onclick="sendMsg()"
                                class="bg-blue-600 h-12 w-12 rounded-xl">

                                <i class="fas fa-paper-plane"></i>

                            </button>

                        </div>

                    </div>

                </div>

            </div>

            <!-- MEMBERS -->

            <div id="p-members"
                class="page">

                <h2 class="text-2xl font-black mb-6">
                    سجل الأعضاء
                </h2>

                <div class="glass rounded-2xl overflow-hidden">

                    <table class="w-full text-right">

                        <thead>

                            <tr class="bg-white/5">

                                <th class="p-4">
                                    الاسم
                                </th>

                                <th class="p-4">
                                    الرتبة
                                </th>

                            </tr>

                        </thead>

                        <tbody id="memberTableBody">
                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>

    <script>

        // =========================
        // SUPABASE
        // =========================

        const SUPABASE_URL = "PUT_YOUR_URL";
        const SUPABASE_KEY = "PUT_YOUR_ANON_KEY";

        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );

        // =========================
        // DATA
        // =========================

        let session =
            JSON.parse(
                localStorage.getItem('alg_session') || 'null'
            );

        let users = [];
        let msgs = [];

        let isLoginMode = true;

        // =========================
        // ESCAPE
        // =========================

        function escapeHTML(str) {

            return str.replace(/[&<>"']/g, function (m) {

                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[m];

            });

        }

        // =========================
        // AUTH MODE
        // =========================

        function toggleAuthMode() {

            isLoginMode = !isLoginMode;

            document.getElementById('authBtn').innerText =
                isLoginMode
                    ? 'دخول'
                    : 'إنشاء حساب';

            document.getElementById('toggleBtn').innerText =
                isLoginMode
                    ? 'إنشاء حساب'
                    : 'لديك حساب؟ دخول';

        }

        // =========================
        // AUTH
        // =========================

        async function handleAuth() {

            const n =
                document.getElementById('uName')
                    .value
                    .trim()
                    .toLowerCase();

            const p =
                document.getElementById('uPass')
                    .value
                    .trim();

            if (!n || !p)
                return alert('أكمل البيانات');

            // LOGIN

            if (isLoginMode) {

                const { data } =
                    await supabaseClient
                        .from('users')
                        .select('*')
                        .eq('name', n)
                        .eq('pass', p)
                        .single();

                if (!data)
                    return alert('بيانات خاطئة');

                session = data;

                localStorage.setItem(
                    'alg_session',
                    JSON.stringify(data)
                );

                startApp();

            }

            // REGISTER

            else {

                const { data: exists } =
                    await supabaseClient
                        .from('users')
                        .select('*')
                        .eq('name', n);

                if (exists.length > 0)
                    return alert('الاسم مستخدم');

                await supabaseClient
                    .from('users')
                    .insert([
                        {
                            name: n,
                            pass: p,
                            role: 'USER'
                        }
                    ]);

                alert('تم إنشاء الحساب');

                toggleAuthMode();

            }

        }

        // =========================
        // LOAD DATA
        // =========================

        async function loadData() {

            // USERS

            const usersRes =
                await supabaseClient
                    .from('users')
                    .select('*');

            users = usersRes.data || [];

            // MSGS

            const msgsRes =
                await supabaseClient
                    .from('messages')
                    .select('*')
                    .order('id');

            msgs = msgsRes.data || [];

            updateUI();

        }

        // =========================
        // UPDATE UI
        // =========================

        function updateUI() {

            if (!session)
                return;

            document.getElementById('helloUser')
                .innerHTML =
                `أهلاً يا ${escapeHTML(session.name)} 👋`;

            document.getElementById('userCount')
                .innerText = users.length;

            document.getElementById('msgCount')
                .innerText = msgs.length;

            renderMembers();
            renderChat();
            renderChatUsers();

        }

        // =========================
        // MEMBERS
        // =========================

        function renderMembers() {

            document.getElementById('memberTableBody')
                .innerHTML =
                users.map(u => `

                <tr class="border-b border-white/5">

                    <td class="p-4">
                        ${escapeHTML(u.name)}
                    </td>

                    <td class="p-4 text-blue-400">
                        ${escapeHTML(u.role)}
                    </td>

                </tr>

            `).join('');

        }

        // =========================
        // CHAT
        // =========================

        function renderChat() {

            const box =
                document.getElementById('chatBox');

            box.innerHTML =
                msgs.map(m => `

                <div class="
                    msg-box p-3 rounded-xl glass
                    ${m.user === session.name
                        ? 'mr-auto bg-blue-500/10'
                        : 'ml-auto'}
                ">

                    <div class="text-xs text-blue-400 font-bold mb-1">

                        ${escapeHTML(m.user)}

                    </div>

                    <div class="text-sm">

                        ${escapeHTML(m.text)}

                    </div>

                </div>

            `).join('');

            box.scrollTop = box.scrollHeight;

        }

        // =========================
        // SEND
        // =========================

        async function sendMsg() {

            const input =
                document.getElementById('chatInput');

            const text =
                input.value.trim();

            if (!text)
                return;

            await supabaseClient
                .from('messages')
                .insert([
                    {
                        user: session.name,
                        text: text
                    }
                ]);

            input.value = '';

        }

        // ENTER SEND

        document.addEventListener('keydown', e => {

            if (
                e.key === 'Enter' &&
                document.activeElement.id === 'chatInput'
            ) {
                sendMsg();
            }

        });

        // =========================
        // USERS SIDEBAR
        // =========================

        function renderChatUsers() {

            document.getElementById('chatUserList')
                .innerHTML =
                users.map(u => `

                <button
                    onclick="mention('${u.name}')"
                    class="
                        p-2 glass rounded-lg
                        text-right w-full text-sm
                    "
                >

                    ${escapeHTML(u.name)}

                </button>

            `).join('');

        }

        function mention(name) {

            const input =
                document.getElementById('chatInput');

            input.value = `@${name} `;

            input.focus();

        }

        // =========================
        // PAGES
        // =========================

        function showPage(id) {

            document.querySelectorAll('.page')
                .forEach(p =>
                    p.classList.remove('active-page')
                );

            document.querySelectorAll('.sidebar-btn')
                .forEach(b =>
                    b.classList.remove('active')
                );

            document.getElementById('p-' + id)
                .classList.add('active-page');

            document.getElementById('btn-' + id)
                .classList.add('active');

        }

        // =========================
        // LOGOUT
        // =========================

        function logout() {

            localStorage.removeItem('alg_session');

            location.reload();

        }

        // =========================
        // REALTIME
        // =========================

        supabaseClient
            .channel('room1')
            .on(
                'postgres_changes',
                {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'messages'
                },
                payload => {

                    msgs.push(payload.new);

                    renderChat();

                    document.getElementById('msgCount')
                        .innerText = msgs.length;

                }
            )
            .subscribe();

        // =========================
        // START
        // =========================

        function startApp() {

            document.getElementById('authPage')
                .classList.add('hidden');

            document.getElementById('mainApp')
                .classList.remove('hidden');

            loadData();

        }

        if (session)
            startApp();

    </script>

</body>

</html>
