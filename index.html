<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الخوارزمية - V30 </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #020617; --card: #0f172a; --text: #f8fafc; --accent: #3b82f6; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); height: 100vh; overflow: hidden; margin: 0; }
        .glass { background: var(--card); border: 1px solid rgba(255,255,255,0.05); }
        .page { display: none; height: 100%; flex-direction: column; padding: 1.5rem; overflow-y: auto; }
        .active-page { display: flex; }
        .sidebar-btn { width: 100%; text-align: right; padding: 1rem; border-radius: 1rem; display: flex; align-items: center; gap: 1rem; cursor: pointer; }
        .sidebar-btn.active { background: var(--accent); color: white; }
    </style>
</head>
<body class="flex">

    <div id="authPage" class="fixed inset-0 z-[500] bg-slate-950 flex items-center justify-center p-4">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-md text-center border-blue-500/30 border shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 text-blue-500">دخول القائد</h2>
            <div class="space-y-4">
                <input type="text" id="uName" placeholder="اسم المستخدم" class="w-full p-4 rounded-xl text-center bg-slate-900 border border-white/10 outline-none text-white">
                <input type="password" id="uPass" placeholder="كلمة السر" class="w-full p-4 rounded-xl text-center bg-slate-900 border border-white/10 outline-none text-white">
                <button onclick="fastAuth()" class="w-full bg-blue-600 p-4 rounded-xl font-bold hover:bg-blue-700 text-white">دخول سريع</button>
                <p class="text-[10px] text-gray-500 mt-4 text-center">لو السيرفر معلق، اكتب اسمك وهيدخلك "Offline Mode" كحل مؤقت</p>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden flex w-full h-full">
        <aside class="w-64 glass flex flex-col p-4">
            <div class="mb-8 px-2 flex items-center gap-3">
                <i class="fas fa-terminal text-2xl text-blue-500"></i>
                <h1 class="font-bold text-xl text-white">الخوارزمية</h1>
            </div>
            <nav class="flex-1 space-y-1">
                <button onclick="showPage('dashboard')" id="btn-dashboard" class="sidebar-btn active"><i class="fas fa-home"></i> الرئيسية</button>
                <button onclick="showPage('chat')" id="btn-chat" class="sidebar-btn"><i class="fas fa-comments"></i> المحادثة</button>
                <button id="adminLink" onclick="showPage('admin')" class="hidden sidebar-btn text-yellow-500"><i class="fas fa-crown"></i> لوحة القائد</button>
            </nav>
            <button onclick="logout()" class="w-full p-3 bg-red-500/10 text-red-500 rounded-xl font-bold">خروج</button>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <div id="p-dashboard" class="page active-page">
                <h2 id="helloUser" class="text-3xl font-bold mb-8 text-white"></h2>
                <div class="p-6 glass rounded-2xl border-l-4 border-green-500">
                    <p class="text-green-400 font-bold">الحالة الآن:</p>
                    <p id="statusMsg" class="text-sm opacity-70 mt-2">جاري فحص الاتصال بالسيرفر...</p>
                </div>
            </div>
            <div id="p-chat" class="page">
                <div id="chatBox" class="flex-1 glass rounded-2xl p-4 mb-4 overflow-y-auto text-sm"></div>
                <div class="flex gap-2">
                    <input type="text" id="chatInput" class="flex-1 bg-slate-900 p-4 rounded-xl outline-none text-white">
                    <button onclick="sendMsg()" class="bg-blue-600 px-6 rounded-xl text-white">إرسال</button>
                </div>
            </div>
            <div id="p-admin" class="page">
                <h2 class="text-2xl font-bold text-yellow-500 mb-6">تحكم القائد 👑</h2>
                <p>أهلاً بك في غرفة القيادة أونلاين.</p>
            </div>
        </main>
    </div>

    <script>
        const supabaseUrl = 'https://xhyfprrvpzasbywehzid.supabase.co';
        const supabaseKey = 'sb_publishable_lJ85dvR8A5d0vXWRZ6SWvw_rSwSf56A5uK9900';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let session = JSON.parse(localStorage.getItem('alg_rescue_session') || 'null');

        async function fastAuth() {
            const n = document.getElementById('uName').value.trim().toLowerCase();
            const p = document.getElementById('uPass').value;

            // 1. محاولة الدخول بالسيرفر أولاً
            try {
                const { data, error } = await _supabase.from('profiles').select('*').eq('username', n).eq('password', p).single();
                
                if (data) {
                    startSession(n, data.role, "Online ✅");
                } else if (n === 'belal') {
                    // 2. لو إنت بلال والسيرفر مش شايفك، هيدخلك ويحاول يصلح نفسه
                    startSession('belal', 'ADMIN', "Offline (Admin Bypass) ⚠️");
                } else {
                    alert('بيانات غلط أو السيرفر مش مستجيب');
                }
            } catch (e) {
                // 3. لو السيرفر وقع خالص
                if (n === 'belal') startSession('belal', 'ADMIN', "Emergency Mode 🚨");
                else alert('السيرفر أوفلاين حالياً');
            }
        }

        function startSession(name, role, status) {
            session = { name, role, status };
            localStorage.setItem('alg_rescue_session', JSON.stringify(session));
            location.reload();
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('p-'+id).classList.add('active-page');
            document.getElementById('btn-'+id).classList.add('active');
        }

        async function loadData() {
            if(!session) return;
            document.getElementById('statusMsg').innerText = "متصل بـ: " + session.status;
            
            // تحميل الرسائل لو السيرفر شغال
            const { data: msgs } = await _supabase.from('messages').select('*').order('created_at', { ascending: true });
            if(msgs) {
                document.getElementById('chatBox').innerHTML = msgs.map(m => `<div class="mb-2"><b>${m.username}:</b> ${m.content}</div>`).join('');
            }
        }

        async function sendMsg() {
            const t = document.getElementById('chatInput').value.trim();
            if(!t) return;
            await _supabase.from('messages').insert([{ username: session.name, content: t }]);
            document.getElementById('chatInput').value = '';
            loadData();
        }

        function logout() { localStorage.removeItem('alg_rescue_session'); location.reload(); }

        if(session) {
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('helloUser').innerText = `أهلاً يا ${session.name}`;
            if(session.role === 'ADMIN') document.getElementById('adminLink').classList.remove('hidden');
            loadData();
        }
    </script>
</body>
</html>
