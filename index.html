<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الخوارزمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #020617; --card: #0f172a; --text: #f8fafc; --accent: #3b82f6; }
        .light-mode { --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --accent: #2563eb; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); height: 100dvh; margin: 0; overflow: hidden; transition: 0.3s; }
        .glass { background: var(--card); border: 1px solid rgba(255,255,255,0.05); }
        .page { display: none; height: calc(100% - 70px); flex-direction: column; padding: 1rem; overflow-y: auto; }
        .active-page { display: flex; }
        
        /* تحسينات الموبايل */
        @media (max-width: 768px) {
            .sidebar-desktop { display: none; }
            .bottom-nav { display: flex; }
            .page { height: calc(100% - 70px); padding-bottom: 80px; }
        }
        @media (min-width: 769px) {
            .bottom-nav { display: none; }
            .sidebar-desktop { display: flex; width: 260px; }
            .page { height: 100%; }
        }

        .btn-nav { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 10px; gap: 4px; transition: 0.2s; color: gray; }
        .btn-nav.active { color: var(--accent); }
        .chat-bubble { max-width: 85%; padding: 10px 14px; border-radius: 18px; position: relative; font-size: 14px; line-height: 1.5; }
        .my-msg { background: var(--accent); color: white; align-self: flex-start; border-bottom-right-radius: 4px; }
        .other-msg { background: rgba(255,255,255,0.1); color: var(--text); align-self: flex-end; border-bottom-left-radius: 4px; }
    </style>
</head>
<body class="flex flex-col md:flex-row">

    <div id="authPage" class="fixed inset-0 z-[2000] bg-slate-950 flex items-center justify-center p-6">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-sm text-center border-blue-500/20 border shadow-2xl">
            <div class="w-16 h-16 bg-blue-600/20 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-code text-blue-500 text-2xl"></i>
            </div>
            <h2 id="authTitle" class="text-xl font-bold mb-6">دخول الخوارزمية</h2>
            <div class="space-y-3">
                <input type="text" id="uName" placeholder="اسم المستخدم" class="w-full p-4 rounded-2xl bg-slate-900 border border-white/5 outline-none focus:border-blue-500 text-center text-sm">
                <input type="password" id="uPass" placeholder="كلمة السر" class="w-full p-4 rounded-2xl bg-slate-900 border border-white/5 outline-none focus:border-blue-500 text-center text-sm">
                <button onclick="handleAuth()" class="w-full bg-blue-600 p-4 rounded-2xl font-bold shadow-lg shadow-blue-900/20">دخول</button>
                <button onclick="toggleAuthMode()" id="authModeBtn" class="text-xs text-gray-400 underline">ليس لديك حساب؟ سجل الآن</button>
            </div>
        </div>
    </div>

    <aside class="sidebar-desktop glass border-l border-white/5 flex-col p-6">
        <h1 class="text-xl font-bold text-blue-500 mb-10 flex items-center gap-2">
            <i class="fas fa-terminal"></i> الخوارزمية
        </h1>
        <nav class="flex flex-col gap-2 flex-1">
            <button onclick="showPage('dashboard')" class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/5 transition"><i class="fas fa-home"></i> الرئيسية</button>
            <button onclick="showPage('chat')" class="flex items-center gap-3 p-3 rounded-xl bg-blue-600/10 text-blue-500"><i class="fas fa-comments"></i> المحادثة</button>
            <button onclick="showPage('library')" class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/5 transition"><i class="fas fa-book"></i> المكتبة</button>
            <button onclick="showPage('members')" class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/5 transition"><i class="fas fa-users"></i> الأعضاء</button>
        </nav>
        <button onclick="logout()" class="text-red-500 text-sm font-bold p-3"><i class="fas fa-sign-out-alt ml-2"></i> خروج</button>
    </aside>

    <main class="flex-1 relative h-full overflow-hidden">
        
        <div id="p-dashboard" class="page active-page">
            <h2 id="helloUser" class="text-2xl font-bold mb-4 pt-4"></h2>
            <div class="glass p-6 rounded-3xl border-r-4 border-blue-500">
                <p class="text-xs opacity-50 mb-1">الأعضاء المتصلون</p>
                <p id="userCount" class="text-4xl font-black">0</p>
            </div>
        </div>

        <div id="p-chat" class="page !p-0">
            <div id="chatBox" class="flex-1 overflow-y-auto p-4 flex flex-col gap-4"></div>
            <div class="p-3 glass border-t border-white/5 flex gap-2 items-center">
                <input type="text" id="chatInput" placeholder="رسالتك هنا..." class="flex-1 bg-white/5 p-3 rounded-2xl outline-none text-sm border border-white/5">
                <button onclick="sendMsg()" class="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center shadow-lg"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>

        <div id="p-library" class="page">
            <h2 class="text-xl font-bold mb-4">المكتبة 📚</h2>
            <div id="libraryList" class="grid grid-cols-1 gap-3"></div>
        </div>

        <div id="p-members" class="page">
            <h2 class="text-xl font-bold mb-4">الأعضاء</h2>
            <div id="memberList" class="space-y-2"></div>
        </div>

        <nav class="bottom-nav fixed bottom-0 left-0 right-0 h-16 glass border-t border-white/10 flex items-center justify-around px-2 z-50">
            <button onclick="showPage('dashboard')" class="btn-nav"><i class="fas fa-home text-lg"></i><span>الرئيسية</span></button>
            <button onclick="showPage('chat')" class="btn-nav active"><i class="fas fa-comments text-lg"></i><span>الدردشة</span></button>
            <button onclick="showPage('library')" class="btn-nav"><i class="fas fa-book text-lg"></i><span>المكتبة</span></button>
            <button onclick="showPage('members')" class="btn-nav"><i class="fas fa-users text-lg"></i><span>الأعضاء</span></button>
        </nav>
    </main>

    <script>
        // إعدادات Supabase - تأكد أن الروابط صحيحة من مشروعك
        const supabaseUrl = 'https://xhyfprrvpzasbywehzid.supabase.co';
        const supabaseKey = 'sb_publishable_lJ85dVr8A5dOvXWRZ6SWvw_rSwSfp1J';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let currentUser = null;
        let isLoginMode = true;

        // التحقق من الجلسة عند فتح التطبيق
        window.onload = () => {
            const saved = localStorage.getItem('algo_user');
            if(saved) {
                currentUser = JSON.parse(saved);
                loginSuccess();
            }
        };

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('authTitle').innerText = isLoginMode ? 'دخول الخوارزمية' : 'إنشاء حساب';
            document.getElementById('authModeBtn').innerText = isLoginMode ? 'ليس لديك حساب؟ سجل الآن' : 'لديك حساب؟ دخول';
        }

        async function handleAuth() {
            const user = document.getElementById('uName').value.trim();
            const pass = document.getElementById('uPass').value;

            if(!user || !pass) return alert('برجاء إدخال البيانات');

            if(isLoginMode) {
                const { data, error } = await _supabase.from('profiles').select('*').eq('username', user).eq('password', pass).single();
                if(data) {
                    currentUser = data;
                    localStorage.setItem('algo_user', JSON.stringify(data));
                    loginSuccess();
                } else {
                    alert('خطأ في اسم المستخدم أو كلمة السر');
                }
            } else {
                const { error } = await _supabase.from('profiles').insert([{ username: user, password: pass, role: 'USER' }]);
                if(!error) {
                    alert('تم التسجيل بنجاح! يمكنك الدخول الآن');
                    toggleAuthMode();
                } else {
                    alert('اسم المستخدم محجوز مسبقاً');
                }
            }
        }

        function loginSuccess() {
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('helloUser').innerText = `أهلاً، ${currentUser.username}`;
            initApp();
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById('p-' + id).classList.add('active-page');
            
            document.querySelectorAll('.btn-nav').forEach(b => b.classList.remove('active'));
            // تحديد الزر النشط في الموبايل
            event?.currentTarget?.classList?.add('active');
        }

        function initApp() {
            updateUI();
            // تفعيل التحديث اللحظي للرسائل
            _supabase.channel('custom-all-channel')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, () => updateUI())
            .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => updateUI())
            .subscribe();
        }

        async function updateUI() {
            // تحديث الأعضاء
            const { data: users } = await _supabase.from('profiles').select('*');
            if(users) {
                document.getElementById('userCount').innerText = users.length;
                document.getElementById('memberList').innerHTML = users.map(u => `
                    <div class="glass p-3 rounded-2xl flex justify-between items-center">
                        <span class="text-sm font-bold">${u.username}</span>
                        <span class="text-[10px] bg-green-500/20 text-green-500 px-2 py-1 rounded-lg">نشط</span>
                    </div>
                `).join('');
            }

            // تحديث الدردشة
            const { data: msgs } = await _supabase.from('messages').select('*').order('created_at', { ascending: true });
            if(msgs) {
                const chatBox = document.getElementById('chatBox');
                chatBox.innerHTML = msgs.map(m => {
                    const isMy = m.username === currentUser.username;
                    return `
                        <div class="chat-bubble ${isMy ? 'my-msg' : 'other-msg'}">
                            <div class="text-[10px] opacity-70 mb-1">${m.username}</div>
                            <div>${m.content}</div>
                        </div>
                    `;
                }).join('');
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        async function sendMsg() {
            const input = document.getElementById('chatInput');
            if(!input.value.trim()) return;
            
            const msg = input.value;
            input.value = '';
            
            await _supabase.from('messages').insert([{ username: currentUser.username, content: msg }]);
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }
    </script>
</body>
</html>
