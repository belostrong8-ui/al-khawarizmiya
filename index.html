<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخوارزمية - الإدارة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #020617; --card: #0f172a; --text: #f8fafc; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); transition: 0.3s; overflow: hidden; height: 100vh; margin: 0; }
        .glass { background: var(--card); border: 1px solid rgba(255,255,255,0.05); }
        .page { display: none; height: 100%; flex-direction: column; overflow-y: auto; padding: 2rem; }
        .active-page { display: flex; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .sidebar-btn { width: 100%; text-align: right; padding: 1rem; border-radius: 1rem; display: flex; align-items: center; gap: 1rem; font-weight: bold; transition: 0.2s; }
        .sidebar-btn:hover { background: rgba(59, 130, 246, 0.1); color: #3b82f6; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; background: rgba(0,0,0,0.2); border-radius: 1rem; overflow: hidden; }
        th, td { padding: 1rem; text-align: right; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
    </style>
</head>
<body class="flex">

    <div id="authPage" class="fixed inset-0 z-[100] bg-slate-950 flex items-center justify-center p-4">
        <div class="glass p-10 rounded-[3rem] w-full max-w-md text-center">
            <div id="loginForm">
                <i class="fas fa-user-shield text-5xl text-blue-500 mb-6"></i>
                <h2 class="text-3xl font-bold mb-8">دخول الخوارزمية</h2>
                <input type="text" id="uName" placeholder="اسم المستخدم" class="w-full p-4 mb-4 rounded-2xl bg-black/40 border border-white/10 outline-none text-center">
                <input type="password" id="uPass" placeholder="كلمة السر" class="w-full p-4 mb-6 rounded-2xl bg-black/40 border border-white/10 outline-none text-center">
                <button onclick="login()" class="w-full bg-blue-600 p-4 rounded-2xl font-bold text-xl">دخول</button>
                <button onclick="toggleAuth(true)" class="mt-4 text-sm text-slate-400 underline">إنشاء حساب جديد</button>
            </div>
            <div id="regForm" class="hidden">
                <h2 class="text-2xl font-bold mb-8">عضوية جديدة</h2>
                <input type="text" id="rName" placeholder="اسم المستخدم الجديد" class="w-full p-4 mb-4 rounded-2xl bg-black/40 border border-white/10 outline-none text-center">
                <input type="password" id="rPass" placeholder="كلمة السر" class="w-full p-4 mb-6 rounded-2xl bg-black/40 border border-white/10 outline-none text-center">
                <button onclick="register()" class="w-full bg-green-600 p-4 rounded-2xl font-bold text-xl">تسجيل</button>
                <button onclick="toggleAuth(false)" class="mt-4 text-sm text-slate-400">رجوع</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden flex w-full h-full">
        <aside class="w-72 glass flex flex-col p-6">
            <div class="mb-10 text-center cursor-pointer" onclick="showPage('dashboard')">
                <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center text-white text-3xl mx-auto mb-2"><i class="fas fa-terminal"></i></div>
                <h1 class="font-bold text-xl">الخوارزمية</h1>
            </div>
            <nav class="space-y-2 flex-1">
                <button onclick="showPage('dashboard')" class="sidebar-btn"><i class="fas fa-home text-blue-500"></i> الرئيسية</button>
                <button onclick="showPage('library')" class="sidebar-btn"><i class="fas fa-book text-red-500"></i> مكتبتي</button>
                <button onclick="showPage('chat')" class="sidebar-btn"><i class="fas fa-comments text-green-500"></i> المراسلات</button>
                <button id="adminLink" onclick="showPage('admin')" class="hidden sidebar-btn border border-yellow-500/20 text-yellow-500 mt-4"><i class="fas fa-crown"></i> لوحة Belal</button>
            </nav>
            <button onclick="logout()" class="w-full p-3 rounded-xl bg-red-500/10 text-red-500 font-bold mt-auto"><i class="fas fa-sign-out-alt"></i> خروج</button>
        </aside>

        <main class="flex-1 overflow-hidden">
            <div id="p-dashboard" class="page active-page">
                <h2 id="wHead" class="text-3xl font-bold mb-10"></h2>
                <div class="grid grid-cols-2 gap-8">
                    <div class="glass p-10 rounded-[2.5rem] border-l-8 border-blue-600 shadow-xl">
                        <h3 class="opacity-60">الأعضاء</h3>
                        <p id="sUsers" class="text-6xl font-bold">0</p>
                    </div>
                    <div class="glass p-10 rounded-[2.5rem] border-l-8 border-red-600 shadow-xl">
                        <h3 class="opacity-60">الملفات</h3>
                        <p id="sFiles" class="text-6xl font-bold">0</p>
                    </div>
                </div>
            </div>

            <div id="p-admin" class="page">
                <h2 class="text-3xl font-bold mb-6 text-yellow-500"><i class="fas fa-user-shield ml-3"></i> إدارة أعضاء الخوارزمية</h2>
                <div class="glass rounded-3xl p-6 overflow-hidden">
                    <table>
                        <thead>
                            <tr>
                                <th>اسم المستخدم</th>
                                <th>كلمة السر (الخاصة)</th>
                                <th>الصلاحية</th>
                                <th>إجراء</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody">
                            </tbody>
                    </table>
                </div>
            </div>
            
            <div id="p-library" class="page"><h2>مكتبة الملفات</h2><div id="lGrid" class="grid grid-cols-3 gap-4"></div></div>
            <div id="p-chat" class="page"><h2>المراسلات</h2><p class="opacity-50 mt-4 text-center">اختر عضواً من الرئيسية لمراسلته (قيد التطوير)</p></div>

        </main>
    </div>

    <script>
        let users = JSON.parse(localStorage.getItem('alg_users') || '[]');
        let library = JSON.parse(localStorage.getItem('alg_lib') || '[]');
        let session = JSON.parse(localStorage.getItem('alg_session') || 'null');

        function toggleAuth(reg) {
            document.getElementById('loginForm').classList.toggle('hidden', reg);
            document.getElementById('regForm').classList.toggle('hidden', !reg);
        }

        function register() {
            const n = document.getElementById('rName').value.trim();
            const p = document.getElementById('rPass').value;
            if(!n || !p) return alert("اكمل البيانات");
            users.push({name: n, pass: p, role: 'USER'});
            localStorage.setItem('alg_users', JSON.stringify(users));
            alert("تم التسجيل!"); toggleAuth(false);
        }

        function login() {
            const n = document.getElementById('uName').value.trim();
            const p = document.getElementById('uPass').value;
            let current;
            if(n.toLowerCase() === 'belal' && p === '159078@1#') current = {name: 'Belal', role: 'ADMIN'};
            else current = users.find(x => x.name === n && x.pass === p);

            if(current) {
                localStorage.setItem('alg_session', JSON.stringify(current));
                location.reload();
            } else alert("خطأ في البيانات!");
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById('p-' + id).classList.add('active-page');
            if(id === 'admin') renderUserTable();
        }

        function renderUserTable() {
            const tbody = document.getElementById('userTableBody');
            // عرض كل المستخدمين + عرض الباسوردات
            tbody.innerHTML = users.map((u, index) => `
                <tr>
                    <td class="font-bold text-blue-400">${u.name}</td>
                    <td class="font-mono text-yellow-500">${u.pass}</td>
                    <td><span class="bg-blue-500/20 text-blue-400 px-3 py-1 rounded-full text-xs">عضو</span></td>
                    <td><button onclick="deleteUser(${index})" class="text-red-500 hover:scale-110 transition"><i class="fas fa-trash"></i></button></td>
                </tr>
            `).join('');
            if(users.length === 0) tbody.innerHTML = '<tr><td colspan="4" class="text-center opacity-50">لا يوجد أعضاء مسجلين بعد</td></tr>';
        }

        function deleteUser(index) {
            if(confirm("هل أنت متأكد من طرد هذا العضو؟")) {
                users.splice(index, 1);
                localStorage.setItem('alg_users', JSON.stringify(users));
                renderUserTable();
                updateStats();
            }
        }

        function updateStats() {
            document.getElementById('sUsers').innerText = users.length + 1;
            document.getElementById('sFiles').innerText = library.length;
        }

        function logout() { localStorage.removeItem('alg_session'); location.reload(); }

        if(session) {
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('wHead').innerText = "أهلاً يا " + session.name;
            if(session.role === 'ADMIN') document.getElementById('adminLink').classList.remove('hidden');
            updateStats();
        }
    </script>
</body>
</html>
