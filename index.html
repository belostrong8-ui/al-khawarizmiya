<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخوارزمية | Al-Khawarizmiya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #020617; --card: rgba(30, 41, 59, 0.5); --text: #f8fafc; --border: rgba(255, 255, 255, 0.05); }
        .light-mode { --bg: #f1f5f9; --card: rgba(255, 255, 255, 0.9); --text: #0f172a; --border: rgba(0, 0, 0, 0.1); }
        
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); transition: 0.3s; overflow-x: hidden; }
        .page { display: none; }
        .active-page { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        .glass { background: var(--card); backdrop-filter: blur(12px); border: 1px solid var(--border); }
        .btn-primary { background: linear-gradient(45deg, #3b82f6, #1d4ed8); color: white; }
    </style>
</head>
<body class="">

    <div id="authScreen" class="fixed inset-0 flex items-center justify-center z-[100] p-4 bg-slate-950">
        <div class="glass p-10 rounded-[2.5rem] shadow-2xl w-full max-w-md">
            <div id="loginForm">
                <div class="text-center mb-8">
                    <h2 class="text-4xl font-bold mb-2">الخوارزمية</h2>
                    <p class="text-blue-500 font-bold uppercase tracking-tighter">Secure Access</p>
                </div>
                <input type="text" id="logUser" placeholder="اسم المستخدم" class="w-full p-4 mb-4 rounded-2xl bg-black/20 border border-white/10 outline-none focus:border-blue-500 text-lg">
                <input type="password" id="logPass" placeholder="كلمة السر" class="w-full p-4 mb-8 rounded-2xl bg-black/20 border border-white/10 outline-none focus:border-blue-500 text-lg">
                <button onclick="handleLogin()" class="w-full btn-primary p-4 rounded-2xl font-bold text-xl shadow-xl hover:scale-[1.02] transition">دخول</button>
                <p class="mt-6 text-center text-sm">ليس لديك حساب؟ <button onclick="toggleAuth()" class="text-blue-500 font-bold">سجل هنا</button></p>
            </div>
            <div id="registerForm" class="hidden">
                <h2 class="text-3xl font-bold text-center mb-8">عضوية جديدة</h2>
                <input type="text" id="regUser" placeholder="اسم المستخدم" class="w-full p-4 mb-4 rounded-2xl bg-black/20 border border-white/10 outline-none text-lg">
                <input type="password" id="regPass" placeholder="كلمة السر" class="w-full p-4 mb-8 rounded-2xl bg-black/20 border border-white/10 outline-none text-lg">
                <button onclick="handleRegister()" class="w-full bg-green-600 p-4 rounded-2xl font-bold text-xl text-white">تأكيد</button>
                <button onclick="toggleAuth()" class="w-full mt-4 text-slate-400">رجوع</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden flex h-screen">
        <aside class="w-72 glass border-l flex flex-col p-6">
            <div class="flex items-center gap-3 mb-10 p-2">
                <div class="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center text-white shadow-lg"><i class="fas fa-code"></i></div>
                <span class="text-2xl font-bold tracking-tighter">ALGO</span>
            </div>
            <nav class="space-y-4 flex-1">
                <button onclick="showPage('dashboard')" class="w-full text-right p-4 rounded-2xl hover:bg-blue-500/10 flex items-center gap-3 text-lg transition"><i class="fas fa-home text-blue-500"></i> الرئيسية</button>
                <button onclick="showPage('stories')" class="w-full text-right p-4 rounded-2xl hover:bg-blue-500/10 flex items-center gap-3 text-lg transition"><i class="fas fa-book text-blue-500"></i> المكتبة</button>
                <button id="adminBtn" onclick="showPage('users')" class="hidden w-full text-right p-4 rounded-2xl hover:bg-yellow-500/10 flex items-center gap-3 text-lg text-yellow-500 transition"><i class="fas fa-shield-alt"></i> الإدارة</button>
            </nav>
            <button onclick="toggleTheme()" class="mb-4 p-4 rounded-2xl glass flex items-center justify-center gap-3 font-bold">
                <i class="fas fa-moon dark:hidden"></i>
                <i class="fas fa-sun hidden dark:block text-yellow-500"></i>
                تبديل الوضع
            </button>
            <button onclick="logout()" class="text-red-500 p-4 flex items-center gap-3 font-bold"><i class="fas fa-sign-out-alt"></i> خروج</button>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto">
            <header class="flex justify-between items-center mb-8">
                <div class="relative w-1/3">
                    <i class="fas fa-search absolute right-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="mainSearch" oninput="handleSearch()" placeholder="ابحث عن ملفات أو أعضاء..." class="w-full pr-12 p-3 rounded-2xl glass outline-none focus:border-blue-500">
                </div>
                <div class="flex items-center gap-4">
                    <span id="userNameDisplay" class="font-bold text-xl"></span>
                    <div class="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center text-white text-xl shadow-lg"><i class="fas fa-user"></i></div>
                </div>
            </header>

            <div id="page-dashboard" class="page active-page">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <div class="glass p-8 rounded-[2rem] border-b-4 border-blue-500">
                        <h3 class="text-slate-500 font-bold mb-2">الملفات</h3>
                        <p id="count-stories" class="text-5xl font-bold">0</p>
                    </div>
                    <div class="glass p-8 rounded-[2rem] border-b-4 border-green-500">
                        <h3 class="text-slate-500 font-bold mb-2">الأعضاء</h3>
                        <p id="count-users" class="text-5xl font-bold">0</p>
                    </div>
                </div>
                <div class="glass p-8 rounded-[2rem]">
                    <h3 class="text-2xl font-bold mb-4 flex items-center gap-2 text-blue-500"><i class="fas fa-bullhorn"></i> تنبيهات النظام</h3>
                    <div id="newsFeed" class="space-y-4">
                        <div class="p-4 bg-blue-500/10 rounded-xl border-r-4 border-blue-500 text-lg">مرحباً بك يا قائد في لوحة التحكم الجديدة!</div>
                    </div>
                </div>
            </div>

            <div id="page-stories" class="page">
                <div class="flex justify-between mb-8">
                    <h2 class="text-3xl font-bold">المكتبة</h2>
                    <div id="adminUpload" class="hidden">
                        <label class="btn-primary px-8 py-3 rounded-xl cursor-pointer font-bold block shadow-lg">
                            رفع PDF <input type="file" id="pdfInput" accept=".pdf" class="hidden" onchange="uploadPDF()">
                        </label>
                    </div>
                </div>
                <div id="pdfContainer" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
            </div>

            <div id="page-users" class="page">
                <h2 class="text-3xl font-bold mb-8 text-yellow-500">إدارة الفريق</h2>
                <div class="glass rounded-3xl overflow-hidden shadow-xl">
                    <table class="w-full text-right"><thead class="bg-blue-500/10"><tr><th class="p-6 text-xl">العضو</th><th class="p-6 text-xl text-center">تحكم</th></tr></thead><tbody id="usersTableBody"></tbody></table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const ADMIN_NAME = "belal";
        const ADMIN_PASS = "159078@1#";
        let users = JSON.parse(localStorage.getItem('kh_users') || '[]');
        let pdfs = JSON.parse(localStorage.getItem('kh_pdfs') || '[]');
        let currentUser = JSON.parse(localStorage.getItem('kh_session') || 'null');

        window.onload = function() {
            if(currentUser) renderApp();
            // استرجاع المود المفضل
            if(localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');
        };

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        }

        function handleLogin() {
            const u = document.getElementById('logUser').value.trim().toLowerCase();
            const p = document.getElementById('logPass').value;
            if(u === ADMIN_NAME && p === ADMIN_PASS) currentUser = { name: "Belal", role: "ADMIN" };
            else { let found = users.find(x => x.name === u && x.pass === p); if(found) currentUser = { name: found.name, role: "MEMBER" }; }
            if(currentUser) { localStorage.setItem('kh_session', JSON.stringify(currentUser)); renderApp(); } else alert("خطأ!");
        }

        function handleRegister() {
            const u = document.getElementById('regUser').value.trim().toLowerCase();
            const p = document.getElementById('regPass').value;
            if(!u || !p || u === ADMIN_NAME) return alert("خطأ!");
            users.push({ name: u, pass: p }); localStorage.setItem('kh_users', JSON.stringify(users));
            addNews(`انضم عضو جديد للفريق: ${u}`);
            alert("تم التسجيل!"); toggleAuth();
        }

        function uploadPDF() {
            const file = document.getElementById('pdfInput').files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                pdfs.push({ id: Date.now(), name: file.name, data: e.target.result });
                localStorage.setItem('kh_pdfs', JSON.stringify(pdfs));
                addNews(`تم رفع مستند جديد: ${file.name}`);
                updateUI();
            };
            reader.readAsDataURL(file);
        }

        function handleSearch() {
            const term = document.getElementById('mainSearch').value.toLowerCase();
            updateUI(term);
        }

        function addNews(msg) {
            const news = JSON.parse(localStorage.getItem('kh_news') || '[]');
            news.unshift({ text: msg, time: new Date().toLocaleTimeString('ar-EG') });
            localStorage.setItem('kh_news', JSON.stringify(news.slice(0, 5)));
            renderNews();
        }

        function renderNews() {
            const news = JSON.parse(localStorage.getItem('kh_news') || '[]');
            document.getElementById('newsFeed').innerHTML = news.map(n => `
                <div class="p-4 bg-blue-500/5 rounded-xl border-r-4 border-blue-500 text-lg flex justify-between">
                    <span>${n.text}</span>
                    <span class="text-sm text-slate-500">${n.time}</span>
                </div>
            `).join('') || '<p class="text-slate-500">لا يوجد تنبيهات حالية.</p>';
        }

        function updateUI(searchTerm = "") {
            document.getElementById('count-users').innerText = users.length + 1;
            document.getElementById('count-stories').innerText = pdfs.length;
            
            const filteredPDFs = pdfs.filter(p => p.name.toLowerCase().includes(searchTerm));
            document.getElementById('pdfContainer').innerHTML = filteredPDFs.map(p => `
                <div class="glass p-6 rounded-3xl text-center group relative">
                    ${currentUser.role==='ADMIN' ? `<button onclick="deletePDF(${p.id})" class="absolute top-4 left-4 text-red-500"><i class="fas fa-trash"></i></button>` : ''}
                    <div class="w-16 h-16 bg-red-500/10 text-red-500 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl"><i class="fas fa-file-pdf"></i></div>
                    <h4 class="font-bold text-lg truncate mb-4">${p.name}</h4>
                    <a href="${p.data}" download="${p.name}" class="btn-primary block w-full py-3 rounded-xl font-bold">تحميل</a>
                </div>
            `).join('');

            const filteredUsers = users.filter(u => u.name.toLowerCase().includes(searchTerm));
            document.getElementById('usersTableBody').innerHTML = `<tr><td class="p-6 font-bold text-yellow-500 text-xl"><i class="fas fa-crown"></i> Belal (القائد)</td><td class="p-6 text-center">-</td></tr>` +
            filteredUsers.map((u, i) => `<tr class="border-t border-white/5"><td class="p-6 font-bold text-xl">${u.name}</td><td class="p-6 text-center"><button onclick="deleteUser(${i})" class="text-red-500 text-xl"><i class="fas fa-user-times"></i></button></td></tr>`).join('');
            renderNews();
        }

        function deletePDF(id) { if(confirm("حذف؟")) { pdfs = pdfs.filter(p=>p.id!==id); localStorage.setItem('kh_pdfs', JSON.stringify(pdfs)); updateUI(); } }
        function deleteUser(i) { if(confirm("طرد؟")) { users.splice(i,1); localStorage.setItem('kh_users', JSON.stringify(users)); updateUI(); } }
        function showPage(id) { document.querySelectorAll('.page').forEach(p=>p.classList.remove('active-page')); document.getElementById('page-'+id).classList.add('active-page'); }
        function toggleAuth() { document.getElementById('loginForm').classList.toggle('hidden'); document.getElementById('registerForm').classList.toggle('hidden'); }
        function renderApp() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('userNameDisplay').innerText = currentUser.name;
            if(currentUser.role === "ADMIN") { document.getElementById('adminBtn').classList.remove('hidden'); document.getElementById('adminUpload').classList.remove('hidden'); }
            updateUI();
        }
        function logout() { localStorage.removeItem('kh_session'); location.reload(); }
    </script>
</body>
</html>
