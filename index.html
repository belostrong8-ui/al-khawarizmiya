<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخوارزمية | Al-Khawarizmiya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #020617; color: white; overflow-x: hidden; }
        .page { display: none; }
        .active-page { display: block; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .glass { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .btn-blue { background: linear-gradient(45deg, #3b82f6, #1d4ed8); }
        .input-group { position: relative; width: 100%; }
        .eye-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #64748b; transition: 0.3s; }
        .logo-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="authScreen" class="fixed inset-0 flex items-center justify-center bg-[#020617] z-50 p-4">
        <div class="glass p-10 rounded-[2rem] shadow-2xl w-full max-w-md border border-white/5">
            
            <div id="loginForm">
                <div class="text-center mb-8">
                    <div class="w-20 h-20 bg-blue-600/20 rounded-3xl flex items-center justify-center mx-auto mb-4 border border-blue-500/30">
                        <i class="fas fa-user-shield text-3xl text-blue-500"></i>
                    </div>
                    <h2 class="text-3xl font-bold text-white">الخوارزمية</h2>
                    <p class="text-slate-500 text-sm mt-2">نظام الإدارة المركزي</p>
                </div>
                <input type="text" id="logUser" placeholder="اسم المستخدم" class="w-full p-4 mb-4 rounded-2xl bg-slate-900 border border-slate-800 outline-none text-white focus:border-blue-500 transition-all">
                <div class="input-group mb-8">
                    <input type="password" id="logPass" placeholder="كلمة السر" class="w-full p-4 rounded-2xl bg-slate-900 border border-slate-800 outline-none text-white focus:border-blue-500 transition-all">
                    <i class="fas fa-eye eye-icon" onclick="togglePass('logPass', this)"></i>
                </div>
                <button onclick="handleLogin()" class="w-full btn-blue p-4 rounded-2xl font-bold shadow-lg shadow-blue-500/20 hover:scale-[1.02] transition">دخول النظام</button>
                <p class="mt-6 text-center text-slate-400 text-sm">عضو جديد؟ <button onclick="toggleAuth()" class="text-blue-500 font-bold hover:underline">انضم للفريق</button></p>
            </div>

            <div id="registerForm" class="hidden">
                <div class="text-center mb-8">
                    <div class="w-20 h-20 bg-green-600/20 rounded-3xl flex items-center justify-center mx-auto mb-4 border border-green-500/30">
                        <i class="fas fa-user-plus text-3xl text-green-500"></i>
                    </div>
                    <h2 class="text-3xl font-bold text-white">عضوية جديدة</h2>
                    <p class="text-slate-500 text-sm mt-2">سجل بياناتك للانضمام</p>
                </div>
                <input type="text" id="regUser" placeholder="اختر اسم مستخدم" class="w-full p-4 mb-4 rounded-2xl bg-slate-900 border border-slate-800 outline-none text-white focus:border-green-500 transition-all">
                <div class="input-group mb-8">
                    <input type="password" id="regPass" placeholder="اختر كلمة سر" class="w-full p-4 rounded-2xl bg-slate-900 border border-slate-800 outline-none text-white focus:border-green-500 transition-all">
                    <i class="fas fa-eye eye-icon" onclick="togglePass('regPass', this)"></i>
                </div>
                <button onclick="handleRegister()" class="w-full bg-green-600 p-4 rounded-2xl font-bold shadow-lg shadow-green-500/20 hover:scale-[1.02] transition">تأكيد التسجيل</button>
                <p class="mt-6 text-center text-slate-400 text-sm"><button onclick="toggleAuth()" class="text-blue-500 font-bold hover:underline">رجوع للدخول</button></p>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden flex h-screen overflow-hidden">
        <aside class="w-72 bg-slate-950 border-l border-white/5 p-8 flex flex-col">
            <div onclick="showPage('dashboard')" class="logo-btn flex items-center gap-3 mb-12 cursor-pointer hover:opacity-80 transition-all group">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg group-hover
