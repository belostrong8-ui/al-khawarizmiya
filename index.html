<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخوارزمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #020617; --card: rgba(30, 41, 59, 0.5); --text: #f8fafc; --accent: #3b82f6; }
        .light-mode { --bg: #f8fafc; --card: rgba(255, 255, 255, 0.9); --text: #0f172a; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); transition: 0.3s; overflow: hidden; }
        .glass { background: var(--card); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); }
        .page { display: none; }
        .active-page { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .btn-action { background: linear-gradient(45deg, #3b82f6, #1d4ed8); color: white; transition: 0.2s; border: none; cursor: pointer; }
        .btn-action:active { scale: 0.95; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <div id="authScreen" class="fixed inset-0 z-[200] flex items-center justify-center bg-slate-950">
        <div class="glass p-12 rounded-[3rem] w-full max-w-md text-center border-blue-500/20 border shadow-2xl">
            <i class="fas fa-microchip text-6xl text-blue-500 mb-6"></i>
            <h2 class="text-4xl font-bold mb-8 tracking-tighter">الخوارزمية</h2>
            <div class="space-y-4">
                <input type="text" id="logUser" placeholder="اسم المستخدم" class="w-full p-4 rounded-2xl bg-black/40 border border-white/10 outline-none text-center text-xl focus:border-blue-500">
                <input type="password" id="logPass" placeholder="كلمة السر" class="w-full p-4 rounded-2xl bg-black/40 border border-white/10 outline-none text-center text-xl focus:border-blue-500">
                <button onclick="handleLogin()" class="w-full btn-action p-4 rounded-2xl font-bold text-xl shadow-lg shadow-blue-500/20">دخول النظام</button>
            </div>
            <p class="mt-8 text-slate-500 text-sm italic underline">النظام مغلق للأعضاء المعتمدين فقط</p>
        </div>
    </div>

    <div id="mainApp" class="hidden flex flex-1 overflow-hidden">
        <aside class="w-72 glass border-l flex flex-col p-6 overflow-y-auto">
            <div class="mb-12 text-center">
                <div class="w-20 h-20 bg-blue-600 rounded-[2rem] flex items-center justify-center text-white text-3xl mx-auto mb-4 shadow-xl shadow-blue-500/20 rotate-3"><i class="fas fa-terminal"></i></div>
                <h1 class="font-bold text-2xl tracking-widest">الخوارزمية</h1>
            </div>
            
            <nav class="space-y-3 flex-1">
                <button onclick="showPage('dashboard')" class="w-full text-right p-4 rounded-2xl hover:bg-blue-500/10 flex items-center gap-4 transition text-lg font-bold"><i class="fas fa-th-large w-6 text-blue-500"></i> الرئيسية</button>
                <button onclick="showPage('library')" class="w-full text-right p-4 rounded-2xl hover:bg-red-500/10 flex items-center gap-4 transition text-lg font-bold"><i class="fas fa-folder-open w-6 text-red-500"></i> مكتبتي</button>
                <button onclick="showPage('messages')" class="w-full text-right p-4 rounded-2xl hover:bg-green-500/10 flex items-center gap-4 transition text-lg font-bold"><i class="fas fa-envelope w-6 text-green-500"></i> المراسلات</button>
                <button id="adminBtn" onclick="showPage('admin')" class="hidden w-full text-right p-4 rounded-2xl border-2 border-yellow-500/20 text-yellow-500 flex items-center gap-4 font-bold shadow-lg shadow-yellow-500/5 mt-4"><i class="fas fa-crown w-6"></i> لوحة Belal</button>
            </nav>

            <div class="mt-auto space-y-3 pt-6 border-t border-white/5">
                <button onclick="toggleTheme()" class="w-full p-3 rounded-xl glass text-xs font-bold flex items-center justify-center gap-2"><i class="fas fa-moon"></i> المظهر</button>
                <button onclick="logout()" class="w-full p-3 rounded-xl bg-red-500/10 text-red-500 font-bold flex items-center justify-center gap-2"><i class="fas fa-power-off"></i> تسجيل خروج</button>
            </div>
        </aside>

        <main class="flex-1 p-10 overflow-y-auto">
            <div id="page-dashboard" class="page active-page">
                <div class="max-w-4xl">
                    <h2 id="welcomeHeader" class="text-4xl font-bold mb-4"></h2>
                    <p class="text-slate-400 text-xl mb-10">مرحباً بك في مركز التحكم الخاص بنظام الخوارزمية.</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="glass p-8 rounded-3xl border-r-8 border-blue-500">
                            <h3 class="font-bold text-xl mb-2">إحصائيات المكتبة</h3>
                            <p id="libCount" class="text-3xl font-bold text-blue-500">0 ملف</p>
                        </div>
                        <div class="glass p-8 rounded-3xl border-r-8 border-green-500">
                            <h3 class="font-bold text-xl mb-2">الرسائل الجديدة</h3>
                            <p id="msgCount" class="text-3xl font-bold text-green-500">0 رسالة</p>
                        </div>
                    </div>
                </div>
            </div>

            <div id="page-library" class="page">
                <div class="flex justify-between items-center mb-10">
                    <h2 class="text-3xl font-bold"><i class="fas fa-book text-red-500 ml-3"></i> مكتبة ملفات القائد</h2>
                    <div id="leaderOnlyUpload" class="hidden">
                        <label for="libFile" class="btn-action px-8 py-3 rounded-2xl font-bold flex items-center gap-2 cursor-pointer shadow-lg">
                            <i class="fas fa-upload"></i> رفع PDF جديد
                        </label>
                        <input type="file" id="libFile" accept="application/pdf" class="hidden" onchange="uploadPDF(this)">
                    </div>
                </div>
                <div id="libraryGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
            </div>

            <div id="page-messages" class="page">
                <div class="max-w-3xl mx-auto">
                    <div id="userMsgBox" class="glass p-8 rounded-3xl mb-8">
                        <h3 class="font-bold text-xl mb-4 text-blue-400">أرسل رسالة مباشرة إلى القائد Belal</h3>
                        <textarea id="msgInput" placeholder="اكتب استفسارك أو طلبك هنا..." class="w-full h-40 p-4 rounded-2xl bg-black/20 border border-white/10 outline-none mb-4 resize-none"></textarea>
                        <button onclick="sendMsg()" class="btn-action w-full p-4 rounded-2xl font-bold">إرسال الآن</button>
                    </div>
                    <div id="msgHistory" class="space-y-4"></div>
                </div>
            </div>

            <div id="page-admin" class="page">
                <div class="grid grid-cols-1 gap-10">
                    <div class="glass p-8 rounded-3xl">
                        <h3 class="font-bold text-yellow-500 text-2xl mb-6"><i class="fas fa-users-cog ml-2"></i> إدارة الأعضاء</h3>
                        <div class="flex gap-4 mb-8">
                            <input type="text" id="newU" placeholder="اسم العضو" class="flex-1 p-4 rounded-2xl bg-black/20 border border-white/10">
                            <input type="text" id="newP" placeholder="كلمة السر" class="flex-1 p-4 rounded-2xl bg-black/20 border border-white/10">
                            <button onclick="addUser()" class="btn-action px-10 rounded-2xl font-bold">إضافة</button>
                        </div>
                        <div id="usersList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                    </div>
                    <div class="glass p-8 rounded-3xl">
                        <h3 class="font-bold text-green-500 text-2xl mb-6"><i class="fas fa-inbox ml-2"></i> الرسائل الواردة من الأعضاء</h3>
                        <div id="adminInbox" class="space-y-4"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let users = JSON.parse(localStorage.getItem('alg_users') || '[]');
        let library = JSON.parse(localStorage.getItem('alg_lib') || '[]');
        let messages = JSON.parse(localStorage.getItem('alg_msgs') || '[]');
        let currentUser = JSON.parse(localStorage.getItem('alg_session') || 'null');

        function handleLogin() {
            const u = document.getElementById('logUser').value.trim();
            const p = document.getElementById('logPass').value;
            // تسجيل دخول القائد Belal
            if(u.toLowerCase() === 'belal' && p === '159078@1#') {
                currentUser = {name: 'Belal', role: 'ADMIN'};
            } else {
                let f = users.find(x => x.name === u && x.pass === p);
                if(f) currentUser = {name: f.name, role: 'USER'};
            }

            if(currentUser) {
                localStorage.setItem('alg_session', JSON.stringify(currentUser));
                startApp();
            } else alert("بيانات غير مصرح بها!");
        }

        function startApp() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('welcomeHeader').innerText = "أهلاً بك يا " + currentUser.name;
            if(currentUser.role === 'ADMIN') {
                document.getElementById('adminBtn').classList.remove('hidden');
                document.getElementById('leaderOnlyUpload').classList.remove('hidden');
            }
            updateUI();
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById('page-' + id).classList.add('active-page');
            updateUI();
        }

        // --- المكتبة ---
        function uploadPDF(input) {
            const file = input.files[0];
            if(!file || file.type !== 'application/pdf') return;
            const reader = new FileReader();
            reader.onload = function(e) {
                library.push({id: Date.now(), name: file.name, data: e.target.result});
                localStorage.setItem('alg_lib', JSON.stringify(library));
                updateUI();
            };
            reader.readAsDataURL(file);
        }

        function deletePDF(id) {
            if(!confirm("حذف الملف نهائياً؟")) return;
            library = library.filter(l => l.id !== id);
            localStorage.setItem('alg_lib', JSON.stringify(library));
            updateUI();
        }

        // --- الرسائل ---
        function sendMsg() {
            const txt = document.getElementById('msgInput').value.trim();
            if(!txt) return;
            messages.push({id: Date.now(), from: currentUser.name, to: 'Belal', text: txt, reply: null});
            localStorage.setItem('alg_msgs', JSON.stringify(messages));
            document.getElementById('msgInput').value = "";
            alert("تم إرسال رسالتك للقائد!");
            updateUI();
        }

        function replyMsg(id) {
            const rep = prompt("رد القائد:");
            if(!rep) return;
            let m = messages.find(x => x.id === id);
            if(m) { m.reply = rep; localStorage.setItem('alg_msgs', JSON.stringify(messages)); updateUI(); }
        }

        // --- الإدارة ---
        function addUser() {
            const u = document.getElementById('newU').value.trim();
            const p = document.getElementById('newP').value;
            if(u && p) {
                users.push({name: u, pass: p});
                localStorage.setItem('alg_users', JSON.stringify(users));
                updateUI();
            }
        }

        function updateUI() {
            // تحديث المكتبة
            document.getElementById('libraryGrid').innerHTML = library.map(f => `
                <div class="glass p-6 rounded-[2rem] text-center border-t-4 border-red-500">
                    <i class="fas fa-file-pdf text-4xl text-red-500 mb-3"></i>
                    <h4 class="font-bold mb-4 truncate">${f.name}</h4>
                    <div class="flex gap-2">
                        <a href="${f.data}" target="_blank" class="flex-1 bg-blue-500/20 text-blue-500 py-2 rounded-xl font-bold text-sm">فتح</a>
                        ${currentUser.role === 'ADMIN' ? `<button onclick="deletePDF(${f.id})" class="bg-red-500/20 text-red-500 px-4 rounded-xl"><i class="fas fa-trash"></i></button>` : ''}
                    </div>
                </div>`).join('');

            // تحديث الرسائل (للعضو)
            if(currentUser.role === 'USER') {
                document.getElementById('msgHistory').innerHTML = messages.filter(m => m.from === currentUser.name).map(m => `
                    <div class="glass p-5 rounded-2xl border-r-4 border-blue-500">
                        <p class="text-sm opacity-80">${m.text}</p>
                        ${m.reply ? `<div class="mt-3 p-3 bg-yellow-500/10 text-yellow-500 rounded-xl text-sm italic font-bold">رد Belal: ${m.reply}</div>` : ''}
                    </div>`).join('');
            }

            // تحديث لوحة التحكم (للقائد)
            if(currentUser.role === 'ADMIN') {
                document.getElementById('adminInbox').innerHTML = messages.filter(m => m.to === 'Belal').map(m => `
                    <div class="p-4 glass rounded-2xl flex justify-between items-center border-r-4 border-green-500">
                        <div><p class="font-bold text-blue-400">${m.from}</p><p>${m.text}</p></div>
                        <button onclick="replyMsg(${m.id})" class="bg-yellow-500 text-black px-4 py-2 rounded-xl font-bold text-xs">رد</button>
                    </div>`).join('');
                document.getElementById('usersList').innerHTML = users.map(u => `<div class="p-3 glass rounded-xl flex justify-between"><span>${u.name}</span><span class="font-mono text-blue-500">${u.pass}</span></div>`).join('');
            }

            document.getElementById('libCount').innerText = library.length + " ملف";
            document.getElementById('msgCount').innerText = messages.filter(m => m.to === currentUser.name || (currentUser.role === 'ADMIN' && !m.reply)).length + " رسالة";
        }

        function toggleTheme() { document.body.classList.toggle('light-mode'); }
        function logout() { localStorage.removeItem('alg_session'); location.reload(); }
        if(currentUser) startApp();
    </script>
</body>
</html>
