<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخوارزمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #020617; --card: #0f172a; --text: #f8fafc; }
        .light-mode { --bg: #f8fafc; --card: #ffffff; --text: #0f172a; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); transition: 0.3s; overflow: hidden; }
        .glass { background: var(--card); border: 1px solid rgba(255,255,255,0.05); }
        .page { display: none; }
        .active-page { display: flex; flex-direction: column; animation: fadeIn 0.4s ease; height: 100%; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .btn-action { background: #2563eb; color: white; border: none; cursor: pointer; transition: 0.2s; }
        .user-online { width: 10px; height: 10px; background: #22c55e; border-radius: 50%; }
    </style>
</head>
<body class="h-screen flex">

    <aside class="w-72 glass flex flex-col p-6 shadow-2xl">
        <div class="mb-10 text-center cursor-pointer" onclick="showPage('dashboard')">
            <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center text-white text-3xl mx-auto mb-2 shadow-lg"><i class="fas fa-terminal"></i></div>
            <h1 class="font-bold text-xl tracking-widest lang-txt" data-ar="الخوارزمية" data-en="ALGO">الخوارزمية</h1>
        </div>
        
        <nav class="space-y-2 flex-1">
            <button onclick="showPage('dashboard')" class="w-full text-right p-4 rounded-xl hover:bg-white/5 flex items-center gap-4 transition"><i class="fas fa-home text-blue-500"></i> <span class="lang-txt" data-ar="الرئيسية" data-en="Home">الرئيسية</span></button>
            <button onclick="showPage('library')" class="w-full text-right p-4 rounded-xl hover:bg-white/5 flex items-center gap-4 transition"><i class="fas fa-book text-red-500"></i> <span class="lang-txt" data-ar="مكتبتي" data-en="Library">مكتبتي</span></button>
            <button onclick="showPage('chat')" class="w-full text-right p-4 rounded-xl hover:bg-white/5 flex items-center gap-4 transition"><i class="fas fa-comments text-green-500"></i> <span class="lang-txt" data-ar="المراسلات" data-en="Messages">المراسلات</span></button>
            <button id="adminBtn" onclick="showPage('admin')" class="hidden w-full text-right p-4 rounded-xl border border-yellow-500/20 text-yellow-500 flex items-center gap-4 mt-4 font-bold"><i class="fas fa-crown"></i> <span class="lang-txt" data-ar="لوحة Belal" data-en="Belal Panel">لوحة Belal</span></button>
        </nav>

        <div class="mt-auto space-y-2 border-t border-white/5 pt-4">
            <button onclick="toggleLang()" class="w-full p-3 rounded-lg glass text-xs font-bold flex items-center justify-center gap-2"><i class="fas fa-language"></i> <span id="langBtnTxt">English</span></button>
            <button onclick="toggleTheme()" class="w-full p-3 rounded-lg glass text-xs font-bold flex items-center justify-center gap-2"><i class="fas fa-sun"></i> <span class="lang-txt" data-ar="تبديل الوضع" data-en="Theme">تبديل الوضع</span></button>
            <button onclick="logout()" class="w-full p-3 rounded-lg bg-red-500/10 text-red-500 font-bold flex items-center justify-center gap-2 mt-2"><i class="fas fa-sign-out-alt"></i> <span class="lang-txt" data-ar="خروج" data-en="Exit">خروج</span></button>
        </div>
    </aside>

    <main class="flex-1 p-8 overflow-y-auto">
        
        <div id="page-chat" class="page">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 h-[80vh]">
                <div class="glass rounded-3xl p-4 flex flex-col">
                    <h3 class="font-bold mb-4 text-blue-400 lang-txt" data-ar="مين موجود؟" data-en="Who's Online?">مين موجود؟</h3>
                    <div id="onlineList" class="space-y-3 overflow-y-auto">
                        </div>
                </div>
                <div class="md:col-span-3 glass rounded-3xl flex flex-col overflow-hidden">
                    <div id="chatTargetName" class="p-4 bg-white/5 font-bold border-b border-white/5">اختر شخصاً لمراسلته</div>
                    <div id="chatMessages" class="flex-1 p-6 overflow-y-auto space-y-4"></div>
                    <div id="chatInputArea" class="p-4 border-t border-white/5 flex gap-2 hidden">
                        <input type="text" id="chatInput" placeholder="اكتب رسالتك..." class="flex-1 p-4 rounded-2xl bg-black/20 border border-white/10 outline-none">
                        <button onclick="sendChatMessage()" class="btn-action px-8 rounded-2xl"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <div id="page-dashboard" class="page active-page">
            <h2 id="welcomeHeader" class="text-4xl font-bold mb-8"></h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="glass p-8 rounded-[2.5rem] border-l-8 border-green-500 shadow-xl">
                    <h3 class="text-xl font-bold mb-2 lang-txt" data-ar="الأعضاء" data-en="Members">الأعضاء</h3>
                    <p id="userCount" class="text-5xl font-bold">1</p>
                </div>
                <div class="glass p-8 rounded-[2.5rem] border-l-8 border-blue-500 shadow-xl">
                    <h3 class="text-xl font-bold mb-2 lang-txt" data-ar="الملفات" data-en="Files">الملفات</h3>
                    <p id="fileCount" class="text-5xl font-bold">0</p>
                </div>
            </div>
        </div>
        
        <div id="page-library" class="page">
             <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-bold lang-txt" data-ar="مكتبتي" data-en="Library">مكتبتي</h2>
                <div id="adminUpload" class="hidden">
                    <label class="btn-action px-6 py-2 rounded-xl cursor-pointer"><i class="fas fa-plus"></i> رفع PDF <input type="file" class="hidden" onchange="uploadPDF(this)"></label>
                </div>
             </div>
             <div id="libGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </div>

    </main>

    <script>
        let users = JSON.parse(localStorage.getItem('alg_users') || '[]');
        let currentU = JSON.parse(localStorage.getItem('alg_session') || 'null');
        let chats = JSON.parse(localStorage.getItem('alg_chats') || '[]');
        let selectedUser = null;

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById('page-' + id).classList.add('active-page');
            if(id === 'chat') renderOnline();
            updateUI();
        }

        function renderOnline() {
            const list = document.getElementById('onlineList');
            // القائد Belal دايماً متاح، وباقي الأعضاء المسجلين
            let all = [{name: 'Belal', role: 'ADMIN'}, ...users].filter(u => u.name !== currentU.name);
            list.innerHTML = all.map(u => `
                <div onclick="selectChat('${u.name}')" class="flex items-center gap-3 p-3 rounded-xl hover:bg-white/5 cursor-pointer transition">
                    <div class="user-online"></div>
                    <span class="font-bold">${u.name}</span>
                    ${u.role === 'ADMIN' ? '<i class="fas fa-crown text-yellow-500 text-[10px]"></i>' : ''}
                </div>
            `).join('');
        }

        function selectChat(name) {
            selectedUser = name;
            document.getElementById('chatTargetName').innerText = "مراسلة: " + name;
            document.getElementById('chatInputArea').classList.remove('hidden');
            renderMessages();
        }

        function sendChatMessage() {
            const txt = document.getElementById('chatInput').value.trim();
            if(!txt) return;
            chats.push({ from: currentU.name, to: selectedUser, text: txt, time: new Date().toLocaleTimeString() });
            localStorage.setItem('alg_chats', JSON.stringify(chats));
            document.getElementById('chatInput').value = "";
            renderMessages();
        }

        function renderMessages() {
            const box = document.getElementById('chatMessages');
            const myMsgs = chats.filter(c => (c.from === currentU.name && c.to === selectedUser) || (c.from === selectedUser && c.to === currentU.name));
            box.innerHTML = myMsgs.map(m => `
                <div class="flex flex-col ${m.from === currentU.name ? 'items-start' : 'items-end'}">
                    <div class="p-3 rounded-2xl ${m.from === currentU.name ? 'bg-blue-600' : 'bg-white/10'} max-w-[80%]">
                        <p class="text-sm">${m.text}</p>
                        <span class="text-[9px] opacity-50">${m.time}</span>
                    </div>
                </div>
            `).join('');
            box.scrollTop = box.scrollHeight;
        }

        function updateUI() {
            document.getElementById('userCount').innerText = users.length + 1; // +1 عشان Belal
            if(currentU.role === 'ADMIN') document.getElementById('adminBtn').classList.remove('hidden');
            document.getElementById('welcomeHeader').innerText = "أهلاً، " + currentU.name;
        }

        function startApp() {
            if(!currentU) return; // حماية
            document.getElementById('mainApp').classList.remove('hidden');
            updateUI();
        }
        
        function logout() { localStorage.removeItem('alg_session'); location.reload(); }
        startApp();
    </script>
</body>
</html>
