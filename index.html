<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الخوارزمية - V21 Speed & Media</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #020617; --card: #0f172a; --text: #f8fafc; --accent: #3b82f6; }
        .light-mode { --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --accent: #2563eb; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); height: 100vh; overflow: hidden; margin: 0; transition: 0.3s; }
        .glass { background: var(--card); border: 1px solid rgba(255,255,255,0.05); }
        .page { display: none; height: 100%; flex-direction: column; padding: 1.5rem; overflow-y: auto; }
        .active-page { display: flex; animation: fadeIn 0.1s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .sidebar-btn { width: 100%; text-align: right; padding: 1rem; border-radius: 1rem; display: flex; align-items: center; gap: 1rem; font-weight: bold; cursor: pointer; }
        .sidebar-btn:hover, .sidebar-btn.active { background: var(--accent); color: white; }
        .marquee-box { overflow: hidden; position: relative; background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.2); padding: 10px; border-radius: 15px; }
        .animate-fast { display: inline-block; white-space: nowrap; animation: marquee 10s linear infinite; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-110%); } }
    </style>
</head>
<body class="flex">

    <div id="authPage" class="fixed inset-0 z-[500] bg-slate-950 flex items-center justify-center p-4">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-md text-center border-blue-500/30 border shadow-2xl">
            <h2 id="authTitle" class="text-2xl font-bold mb-6 text-blue-500">الخوارزمية - دخول</h2>
            <div class="space-y-4">
                <input type="text" id="uName" placeholder="اسم المستخدم" class="w-full p-4 rounded-xl text-center bg-slate-900 border border-white/10 outline-none">
                <input type="password" id="uPass" placeholder="كلمة السر" class="w-full p-4 rounded-xl text-center bg-slate-900 border border-white/10 outline-none">
                <button onclick="handleAuth()" class="w-full bg-blue-600 p-4 rounded-xl font-bold hover:bg-blue-700 transition">دخول</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden flex w-full h-full">
        <aside class="w-64 glass flex flex-col p-4 border-l border-white/5">
            <div class="mb-10 px-2 flex items-center gap-3">
                <i class="fas fa-terminal text-2xl text-blue-500"></i>
                <h1 class="font-bold text-xl" id="logoText">الخوارزمية</h1>
            </div>
            <nav class="flex-1 space-y-1">
                <button onclick="showPage('dashboard')" id="btn-dashboard" class="sidebar-btn"><i class="fas fa-home"></i> <span class="nav-home">الرئيسية</span></button>
                <button onclick="showPage('chat')" id="btn-chat" class="sidebar-btn"><i class="fas fa-comments"></i> <span class="nav-chat">المراسلات</span></button>
                <button onclick="showPage('members')" id="btn-members" class="sidebar-btn"><i class="fas fa-users"></i> <span class="nav-members">الأعضاء</span></button>
                <button onclick="showPage('library')" id="btn-library" class="sidebar-btn"><i class="fas fa-book"></i> <span class="nav-lib">المكتبة</span></button>
                <button id="adminLink" onclick="showPage('admin')" class="hidden sidebar-btn text-yellow-500"><i class="fas fa-crown"></i> <span class="nav-admin">لوحة القائد</span></button>
            </nav>
            <div class="pt-4 border-t border-white/5 space-y-2">
                <button onclick="toggleLang()" class="w-full p-3 glass rounded-xl text-xs"><i class="fas fa-language"></i> English / عربي</button>
                <button onclick="toggleTheme()" class="w-full p-3 glass rounded-xl text-xs"><i class="fas fa-adjust"></i> <span id="themeText">الوضع المضيء</span></button>
                <button onclick="logout()" class="w-full p-3 bg-red-500/10 text-red-500 rounded-xl font-bold">خروج</button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <div id="p-dashboard" class="page active-page">
                <div class="marquee-box mb-8">
                    <div id="newsDisplay" class="animate-fast font-bold text-blue-400"></div>
                </div>
                <h2 id="helloUser" class="text-3xl font-bold mb-4"></h2>
                <div class="glass p-6 rounded-3xl border-r-4 border-blue-500 w-fit">
                    <p class="opacity-50 text-xs" id="totalMembersTxt">إجمالي الأعضاء</p>
                    <p id="userCount" class="text-4xl font-black mt-1">0</p>
                </div>
            </div>

            <div id="p-chat" class="page">
                <div class="flex-1 glass rounded-2xl p-4 mb-4 overflow-y-auto flex flex-col gap-3" id="chatBox"></div>
                <div class="flex gap-2 p-2 glass rounded-2xl">
                    <input type="file" id="chatFile" accept="application/pdf" class="hidden" onchange="uploadFromChat()">
                    <button id="chatMediaBtn" onclick="document.getElementById('chatFile').click()" class="hidden bg-slate-700 h-12 w-12 rounded-xl text-xl hover:bg-blue-600 transition">
                        <i class="fas fa-paperclip"></i>
                    </button>
                    <input type="text" id="chatInput" class="flex-1 bg-transparent p-4 outline-none" placeholder="اكتب رسالة...">
                    <button onclick="sendMsg()" class="bg-blue-600 h-12 w-12 rounded-xl"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

            <div id="p-members" class="page">
                <h2 class="text-2xl font-bold mb-4 text-blue-400">سجل الفريق</h2>
                <div class="glass p-4 rounded-2xl overflow-x-auto">
                    <table class="w-full text-right text-sm">
                        <thead class="opacity-40 border-b border-white/5"><tr><th>الاسم</th><th>كلمة السر</th><th id="adminHead" class="hidden">حذف</th></tr></thead>
                        <tbody id="memberTableBody"></tbody>
                    </table>
                </div>
            </div>

            <div id="p-library" class="page">
                <h2 class="text-2xl font-bold mb-8">المكتبة الرقمية</h2>
                <div id="fileList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>

            <div id="p-admin" class="page">
                <h2 class="text-2xl font-bold text-yellow-500 mb-6">لوحة القائد</h2>
                <div class="glass p-6 rounded-2xl">
                    <h3 class="font-bold mb-4">تغيير الخبر العاجل</h3>
                    <div class="flex gap-2">
                        <input type="text" id="newsInput" class="flex-1 p-4 rounded-xl bg-slate-900 border border-white/10" placeholder="ما الجديد؟">
                        <button onclick="updateNews()" class="bg-blue-600 px-8 rounded-xl font-bold">نشر الآن</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let currentLang = 'ar';
        let users = JSON.parse(localStorage.getItem('alg_db_v21') || '[{"name":"belal","pass":"159078@1#","role":"ADMIN"}]');
        let session = JSON.parse(localStorage.getItem('alg_session_v21') || 'null');
        let msgs = JSON.parse(localStorage.getItem('alg_msgs_v21') || '[]');
        let files = JSON.parse(localStorage.getItem('alg_files_v21') || '[]');
        let newsText = localStorage.getItem('alg_news_v21') || "مرحباً بكم في منصة الخوارزمية العظيمة";

        function handleAuth() {
            const name = document.getElementById('uName').value.trim().toLowerCase();
            const pass = document.getElementById('uPass').value;
            const user = users.find(u => u.name === name && u.pass === pass);
            if(user) { localStorage.setItem('alg_session_v21', JSON.stringify(user)); location.reload(); }
            else alert('بيانات خطأ!');
        }

        function updateUI() {
            if(!session) return;
            document.getElementById('newsDisplay').innerText = newsText;
            document.getElementById('helloUser').innerText = `أهلاً يا ${session.name}`;
            document.getElementById('userCount').innerText = users.length;
            if(session.role === 'ADMIN') {
                document.getElementById('adminLink').classList.remove('hidden');
                document.getElementById('adminHead').classList.remove('hidden');
                document.getElementById('chatMediaBtn').classList.remove('hidden');
            }
            renderChat(); renderMembers(); renderFiles();
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            document.getElementById('themeText').innerText = isLight ? "الوضع المظلم" : "الوضع المضيء";
        }

        function toggleLang() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            const dictionary = {
                ar: { home: "الرئيسية", chat: "المراسلات", members: "الأعضاء", lib: "المكتبة", admin: "لوحة القائد" },
                en: { home: "Home", chat: "Messages", members: "Members", lib: "Library", admin: "Admin Panel" }
            };
            document.querySelector('.nav-home').innerText = dictionary[currentLang].home;
            document.querySelector('.nav-chat').innerText = dictionary[currentLang].chat;
            document.querySelector('.nav-members').innerText = dictionary[currentLang].members;
            document.querySelector('.nav-lib').innerText = dictionary[currentLang].lib;
            document.querySelector('.nav-admin').innerText = dictionary[currentLang].admin;
        }

        function uploadFromChat() {
            const f = document.getElementById('chatFile').files[0];
            if(f) {
                const fileData = {id: Date.now(), name: f.name, sender: session.name};
                files.push(fileData);
                msgs.push({id: Date.now(), user: session.name, text: `📎 ملف مرفق: ${f.name}`, isFile: true});
                localStorage.setItem('alg_files_v21', JSON.stringify(files));
                localStorage.setItem('alg_msgs_v21', JSON.stringify(msgs));
                renderChat(); renderFiles();
            }
        }

        function sendMsg() {
            const txt = document.getElementById('chatInput').value.trim();
            if(!txt) return;
            msgs.push({id: Date.now(), user: session.name, text: txt, isLeader: session.role==='ADMIN'});
            localStorage.setItem('alg_msgs_v21', JSON.stringify(msgs));
            document.getElementById('chatInput').value = ''; renderChat();
        }

        function renderChat() {
            const box = document.getElementById('chatBox');
            box.innerHTML = msgs.map(m => `
                <div class="p-3 glass rounded-xl ${m.user === session.name ? 'mr-auto bg-blue-500/10' : 'ml-auto'} max-w-[85%] group">
                    <div class="flex justify-between gap-4">
                        <span class="text-[10px] font-bold text-blue-400">${m.user}</span>
                        ${session.role==='ADMIN' ? `<button onclick="deleteMsg(${m.id})" class="text-red-500 opacity-0 group-hover:opacity-100 text-xs"><i class="fas fa-times"></i></button>` : ''}
                    </div>
                    <p class="text-sm mt-1 ${m.isFile ? 'text-green-400 font-bold' : ''}">${m.text}</p>
                </div>
            `).join('');
            box.scrollTop = box.scrollHeight;
        }

        function deleteMsg(id) {
            msgs = msgs.filter(m => m.id !== id);
            localStorage.setItem('alg_msgs_v21', JSON.stringify(msgs)); renderChat();
        }

        function updateNews() {
            const val = document.getElementById('newsInput').value;
            localStorage.setItem('alg_news_v21', val);
            newsText = val;
            document.getElementById('newsDisplay').innerText = val;
            alert('تم التحديث!');
        }

        function renderMembers() {
            const body = document.getElementById('memberTableBody');
            body.innerHTML = users.map(u => `
                <tr class="border-b border-white/5"><td class="p-3 font-bold">${u.name}</td><td class="p-3 opacity-60">${u.pass}</td>
                <td class="p-3">${(session.role==='ADMIN' && u.name!=='belal') ? `<button onclick="deleteUser('${u.name}')" class="text-red-500"><i class="fas fa-user-minus"></i></button>` : '-'}</td></tr>
            `).join('');
        }

        function deleteUser(name) {
            users = users.filter(u => u.name !== name);
            localStorage.setItem('alg_db_v21', JSON.stringify(users)); renderMembers();
        }

        function renderFiles() {
            const list = document.getElementById('fileList');
            list.innerHTML = files.map(f => `<div class="glass p-4 rounded-xl flex items-center justify-between border-r-4 border-blue-500"><span>${f.name}</span><i class="fas fa-file-pdf text-red-500"></i></div>`).join('');
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('p-'+id).classList.add('active-page');
            document.getElementById('btn-'+id).classList.add('active');
        }

        function logout() { localStorage.removeItem('alg_session_v21'); location.reload(); }
        if(session) { document.getElementById('authPage').classList.add('hidden'); document.getElementById('mainApp').classList.remove('hidden'); updateUI(); }
    </script>
</body>
</html>
