<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الخوارزمية - V24 Advanced</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #020617; --card: #0f172a; --text: #f8fafc; --accent: #3b82f6; }
        .light-mode { --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --accent: #2563eb; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); height: 100vh; overflow: hidden; transition: 0.3s; margin: 0; }
        .glass { background: var(--card); border: 1px solid rgba(255,255,255,0.05); }
        .page { display: none; height: 100%; flex-direction: column; padding: 1.5rem; overflow-y: auto; }
        .active-page { display: flex; animation: fadeIn 0.1s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .sidebar-btn { width: 100%; text-align: right; padding: 1rem; border-radius: 1rem; display: flex; align-items: center; gap: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .sidebar-btn:hover, .sidebar-btn.active { background: var(--accent); color: white; }
    </style>
</head>
<body class="flex">

    <div id="authPage" class="fixed inset-0 z-[500] bg-slate-950 flex items-center justify-center p-4">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-md text-center border-blue-500/30 border shadow-2xl">
            <h2 id="authTitle" class="text-2xl font-bold mb-6 text-blue-500">الخوارزمية - دخول</h2>
            <div class="space-y-4">
                <input type="text" id="uName" placeholder="اسم المستخدم" class="w-full p-4 rounded-xl text-center bg-slate-900 border border-white/10 outline-none">
                <input type="password" id="uPass" placeholder="كلمة السر" class="w-full p-4 rounded-xl text-center bg-slate-900 border border-white/10 outline-none">
                <button onclick="handleAuth()" id="authBtn" class="w-full bg-blue-600 p-4 rounded-xl font-bold hover:bg-blue-700 transition">دخول</button>
                <button onclick="toggleAuthMode()" id="toggleAuthBtn" class="text-blue-400 text-xs mt-2 underline">ليس لديك حساب؟ إنشاء حساب جديد</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden flex w-full h-full">
        <aside class="w-64 glass flex flex-col p-4 border-l border-white/5">
            <div class="mb-10 px-2 flex items-center gap-3">
                <i class="fas fa-shield-alt text-2xl text-blue-500"></i>
                <h1 class="font-bold text-xl" id="logoName">الخوارزمية</h1>
            </div>
            <nav class="flex-1 space-y-1">
                <button onclick="showPage('dashboard')" class="sidebar-btn active"><i class="fas fa-home"></i> <span class="lang-txt" data-ar="الرئيسية" data-en="Home">الرئيسية</span></button>
                <button onclick="showPage('chat')" class="sidebar-btn"><i class="fas fa-comments"></i> <span class="lang-txt" data-ar="المراسلة" data-en="Chat">المراسلة</span></button>
                <button onclick="showPage('members')" class="sidebar-btn"><i class="fas fa-users"></i> <span class="lang-txt" data-ar="الأعضاء" data-en="Members">الأعضاء</span></button>
                <button onclick="showPage('library')" class="sidebar-btn"><i class="fas fa-book"></i> <span class="lang-txt" data-ar="المكتبة" data-en="Library">المكتبة</span></button>
                <button id="adminLink" onclick="showPage('admin')" class="hidden sidebar-btn text-yellow-500"><i class="fas fa-crown"></i> <span class="lang-txt" data-ar="لوحة القائد" data-en="Admin Panel">لوحة القائد</span></button>
            </nav>
            <div class="pt-4 border-t border-white/5 space-y-2">
                <button onclick="toggleLang()" class="w-full p-3 glass rounded-xl text-xs"><i class="fas fa-language"></i> EN / AR</button>
                <button onclick="toggleTheme()" class="w-full p-3 glass rounded-xl text-xs"><i class="fas fa-adjust"></i> <span id="themeBtnTxt">الوضع المضيء</span></button>
                <button onclick="logout()" class="w-full p-3 bg-red-500/10 text-red-500 rounded-xl font-bold">خروج</button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <div id="p-dashboard" class="page active-page">
                <h2 id="helloUser" class="text-3xl font-bold mb-8"></h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="glass p-8 rounded-3xl border-r-8 border-red-500 shadow-xl">
                        <p class="opacity-60 font-bold mb-2">الملفات المرفوعة</p>
                        <p id="fileCount" class="text-6xl font-black">0</p>
                    </div>
                    <div class="glass p-8 rounded-3xl border-r-8 border-blue-500 shadow-xl">
                        <p class="opacity-60 font-bold mb-2">أعضاء الفريق</p>
                        <p id="userCount" class="text-6xl font-black">0</p>
                    </div>
                </div>
            </div>

            <div id="p-chat" class="page">
                <div class="flex-1 glass rounded-3xl p-6 mb-4 overflow-y-auto flex flex-col gap-4" id="chatBox"></div>
                <div class="flex gap-3 p-3 glass rounded-2xl">
                    <input type="text" id="chatInput" class="flex-1 bg-transparent p-2 outline-none" placeholder="اكتب رسالتك...">
                    <button onclick="sendMsg()" class="bg-blue-600 h-12 w-12 rounded-xl"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

            <div id="p-admin" class="page">
                <h2 class="text-2xl font-bold text-yellow-500 mb-6">لوحة التحكم في الفريق</h2>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="glass p-6 rounded-3xl">
                        <h3 class="font-bold mb-4">إضافة قائد جديد</h3>
                        <div class="space-y-3">
                            <input type="text" id="newAdminName" placeholder="اسم القائد الجديد" class="w-full p-4 rounded-xl bg-slate-900 border border-white/10 outline-none">
                            <input type="password" id="newAdminPass" placeholder="كلمة السر" class="w-full p-4 rounded-xl bg-slate-900 border border-white/10 outline-none">
                            <button onclick="addLeader()" class="w-full bg-yellow-600 p-4 rounded-xl font-bold">تعيين كقائد 👑</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="p-library" class="page">
                <h2 class="text-2xl font-bold mb-6">المكتبة</h2>
                <div id="fileList" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
            </div>

            <div id="p-members" class="page">
                <h2 class="text-2xl font-bold mb-4">سجل الفريق</h2>
                <div class="glass rounded-2xl overflow-hidden">
                    <table class="w-full text-right">
                        <thead class="bg-white/5 opacity-50"><tr><th class="p-4">الاسم</th><th class="p-4">الرتبة</th><th class="p-4">إجراء</th></tr></thead>
                        <tbody id="memberTableBody"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        let isLoginMode = true;
        let lang = 'ar';
        let users = JSON.parse(localStorage.getItem('alg_db_v24') || '[{"name":"belal","pass":"159078@1#","role":"ADMIN"}]');
        let session = JSON.parse(localStorage.getItem('alg_session_v24') || 'null');
        let msgs = JSON.parse(localStorage.getItem('alg_msgs_v24') || '[]');
        let files = JSON.parse(localStorage.getItem('alg_files_v24') || '[]');

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('authTitle').innerText = isLoginMode ? 'دخول' : 'حساب جديد';
            document.getElementById('authBtn').innerText = isLoginMode ? 'دخول' : 'إنشاء الحساب';
            document.getElementById('toggleAuthBtn').innerText = isLoginMode ? 'ليس لديك حساب؟ إنشاء حساب جديد' : 'لديك حساب بالفعل؟ سجل دخولك';
        }

        function handleAuth() {
            const n = document.getElementById('uName').value.trim().toLowerCase();
            const p = document.getElementById('uPass').value;
            if(!n || !p) return alert('برجاء ملء البيانات');

            if(isLoginMode) {
                const u = users.find(x => x.name === n && x.pass === p);
                if(u) { localStorage.setItem('alg_session_v24', JSON.stringify(u)); location.reload(); }
                else alert('خطأ في البيانات!');
            } else {
                if(users.find(x => x.name === n)) return alert('الاسم موجود مسبقاً!');
                users.push({name: n, pass: p, role: 'USER'});
                localStorage.setItem('alg_db_v24', JSON.stringify(users));
                alert('تم إنشاء الحساب! سجل دخولك الآن.');
                toggleAuthMode();
            }
        }

        function updateUI() {
            if(!session) return;
            document.getElementById('helloUser').innerText = lang === 'ar' ? `مرحباً بالقائد ${session.name}` : `Welcome Commander ${session.name}`;
            document.getElementById('userCount').innerText = users.length;
            document.getElementById('fileCount').innerText = files.length;
            if(session.role === 'ADMIN') document.getElementById('adminLink').classList.remove('hidden');
            renderChat(); renderMembers(); renderFiles();
        }

        function addLeader() {
            const n = document.getElementById('newAdminName').value.trim().toLowerCase();
            const p = document.getElementById('newAdminPass').value;
            if(!n || !p) return alert('أكمل البيانات');
            users.push({name: n, pass: p, role: 'ADMIN'});
            localStorage.setItem('alg_db_v24', JSON.stringify(users));
            alert('تم إضافة قائد جديد للفريق! 👑');
            location.reload();
        }

        function toggleLang() {
            lang = lang === 'ar' ? 'en' : 'ar';
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.querySelectorAll('.lang-txt').forEach(t => t.innerText = t.getAttribute('data-'+lang));
            updateUI();
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isL = document.body.classList.contains('light-mode');
            document.getElementById('themeBtnTxt').innerText = isL ? "الوضع المظلم" : "الوضع المضيء";
        }

        function sendMsg() {
            const t = document.getElementById('chatInput').value.trim();
            if(!t) return;
            msgs.push({id: Date.now(), user: session.name, text: t, role: session.role});
            localStorage.setItem('alg_msgs_v24', JSON.stringify(msgs));
            document.getElementById('chatInput').value = ''; renderChat();
        }

        function renderChat() {
            const b = document.getElementById('chatBox');
            b.innerHTML = msgs.map(m => `
                <div class="p-4 glass rounded-2xl ${m.user === session.name ? 'mr-auto bg-blue-500/10' : 'ml-auto'} max-w-[80%]">
                    <span class="text-[10px] font-bold text-blue-400">${m.user} ${m.role==='ADMIN'?'👑':''}</span>
                    <p class="text-sm mt-1">${m.text}</p>
                </div>
            `).join('');
            b.scrollTop = b.scrollHeight;
        }

        function renderMembers() {
            document.getElementById('memberTableBody').innerHTML = users.map(u => `
                <tr class="border-b border-white/5"><td class="p-4">${u.name}</td><td class="p-4">${u.role==='ADMIN'?'قائد':'عضو'}</td>
                <td class="p-4">${(session.role==='ADMIN' && u.name!=='belal') ? `<button onclick="delUser('${u.name}')" class="text-red-500"><i class="fas fa-trash"></i></button>` : '-'}</td></tr>
            `).join('');
        }

        function delUser(n) { users = users.filter(x => x.name !== n); localStorage.setItem('alg_db_v24', JSON.stringify(users)); renderMembers(); }
        function renderFiles() { document.getElementById('fileList').innerHTML = files.map(f => `<div class="glass p-4 rounded-xl">📄 ${f.name}</div>`).join(''); }
        function showPage(id) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page')); document.getElementById('p-'+id).classList.add('active-page'); }
        function logout() { localStorage.removeItem('alg_session_v24'); location.reload(); }
        if(session) { document.getElementById('authPage').classList.add('hidden'); document.getElementById('mainApp').classList.remove('hidden'); updateUI(); }
    </script>
</body>
</html>
