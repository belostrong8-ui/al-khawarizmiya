<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخوارزمية | Al-Khawarizmiya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #020617; color: white; overflow-x: hidden; }
        .page { display: none; }
        .active-page { display: block; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .glass { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .btn-blue { background: linear-gradient(45deg, #3b82f6, #1d4ed8); }
        .input-group { position: relative; width: 100%; }
        .eye-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #64748b; transition: 0.3s; }
        .logo-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="authScreen" class="fixed inset-0 flex items-center justify-center bg-[#020617] z-[100] p-4">
        <div class="glass p-10 rounded-[2rem] shadow-2xl w-full max-w-md border border-white/5">
            <div id="loginForm">
                <div class="text-center mb-8">
                    <div class="w-20 h-20 bg-blue-600/20 rounded-3xl flex items-center justify-center mx-auto mb-4 border border-blue-500/30">
                        <i class="fas fa-user-shield text-3xl text-blue-500"></i>
                    </div>
                    <h2 class="text-3xl font-bold">الخوارزمية</h2>
                    <p class="text-slate-500 text-sm mt-2 font-bold uppercase">Central System</p>
                </div>
                <input type="text" id="logUser" placeholder="اسم المستخدم" class="w-full p-4 mb-4 rounded-2xl bg-slate-900 border border-slate-800 outline-none text-white focus:border-blue-500 transition-all">
                <div class="input-group mb-8">
                    <input type="password" id="logPass" placeholder="كلمة السر" class="w-full p-4 rounded-2xl bg-slate-900 border border-slate-800 outline-none text-white focus:border-blue-500 transition-all">
                    <i class="fas fa-eye eye-icon" onclick="togglePass('logPass', this)"></i>
                </div>
                <button onclick="handleLogin()" class="w-full btn-blue p-4 rounded-2xl font-bold shadow-lg hover:scale-[1.02] active:scale-95 transition-all">دخول النظام</button>
                <p class="mt-6 text-center text-slate-400 text-sm">عضو جديد؟ <button onclick="toggleAuth()" class="text-blue-500 font-bold hover:underline">انضم للفريق</button></p>
            </div>

            <div id="registerForm" class="hidden">
                <div class="text-center mb-8">
                    <div class="w-20 h-20 bg-green-600/20 rounded-3xl flex items-center justify-center mx-auto mb-4 border border-green-500/30">
                        <i class="fas fa-user-plus text-3xl text-green-500"></i>
                    </div>
                    <h2 class="text-3xl font-bold">عضوية جديدة</h2>
                </div>
                <input type="text" id="regUser" placeholder="اختر اسم مستخدم" class="w-full p-4 mb-4 rounded-2xl bg-slate-900 border border-slate-800 outline-none text-white focus:border-green-500">
                <div class="input-group mb-8">
                    <input type="password" id="regPass" placeholder="اختر كلمة سر" class="w-full p-4 rounded-2xl bg-slate-900 border border-slate-800 outline-none text-white focus:border-green-500">
                    <i class="fas fa-eye eye-icon" onclick="togglePass('regPass', this)"></i>
                </div>
                <button onclick="handleRegister()" class="w-full bg-green-600 p-4 rounded-2xl font-bold transition">تأكيد الانضمام</button>
                <p class="mt-6 text-center text-slate-400 text-sm"><button onclick="toggleAuth()" class="text-blue-500 font-bold hover:underline">رجوع للدخول</button></p>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden flex h-screen overflow-hidden">
        <aside class="w-72 bg-slate-950 border-l border-white/5 p-8 flex flex-col">
            <div onclick="showPage('dashboard')" class="logo-btn flex items-center gap-3 mb-12 cursor-pointer hover:opacity-80 transition group">
                <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg group-hover:shadow-blue-500/50">
                    <i class="fas fa-terminal text-white text-sm"></i>
                </div>
                <span class="text-xl font-bold uppercase tracking-wider">Algorithm</span>
            </div>
            <nav class="space-y-3 flex-1">
                <button onclick="showPage('dashboard')" class="w-full text-right p-4 rounded-2xl hover:bg-white/5 flex items-center gap-3 transition">
                    <i class="fas fa-th-large w-6 text-blue-500"></i>الرئيسية
                </button>
                <button onclick="showPage('stories')" class="w-full text-right p-4 rounded-2xl hover:bg-white/5 flex items-center gap-3 transition">
                    <i class="fas fa-folder-open w-6 text-blue-500"></i>المكتبة التقنية
                </button>
                <button id="adminBtn" onclick="showPage('users')" class="hidden w-full text-right p-4 rounded-2xl text-yellow-500 hover:bg-yellow-500/10 flex items-center gap-3 transition font-bold">
                    <i class="fas fa-user-lock w-6"></i>إدارة المنصة
                </button>
            </nav>
            <button onclick="logout()" class="text-red-500 p-4 flex items-center gap-3 hover:bg-red-500/10 rounded-xl transition font-bold"><i class="fas fa-power-off"></i>خروج آمن</button>
        </aside>

        <main class="flex-1 p-10 overflow-y-auto">
            <header class="flex justify-between items-center mb-12 border-b border-white/5 pb-6">
                <h1 id="pageTitle" class="text-3xl font-bold">الرئيسية</h1>
                <div class="flex items-center gap-4 bg-slate-900/50 p-2 pr-5 rounded-2xl border border-white/5 shadow-inner">
                    <span id="userNameDisplay" class="font-bold text-slate-200 text-sm"></span>
                    <div class="w-10 h-10 bg-gradient-to-tr from-blue-600 to-cyan-400 rounded-xl flex items-center justify-center shadow-lg">
                        <i class="fas fa-user-astronaut text-white text-sm"></i>
                    </div>
                </div>
            </header>

            <div id="page-dashboard" class="page active-page">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="glass p-10 rounded-[2.5rem] border-b-4 border-blue-600 shadow-xl"><h3 class="text-slate-500 font-bold mb-4">الملفات المرفوعة</h3><p id="count-stories" class="text-6xl font-bold text-white">0</p></div>
                    <div class="glass p-10 rounded-[2.5rem] border-b-4 border-green-600 shadow-xl"><h3 class="text-slate-500 font-bold mb-4">أعضاء الفريق</h3><p id="count-users" class="text-6xl font-bold text-white">0</p></div>
                </div>
            </div>

            <div id="page-stories" class="page">
                <div class="flex justify-between items-center mb-10">
                    <p class="text-slate-400">مكتبة المستندات المشفرة</p>
                    <div id="adminUpload" class="hidden">
                        <label class="btn-blue px-6 py-3 rounded-2xl cursor-pointer font-bold shadow-lg hover:scale-105 transition-all block">
                            <i class="fas fa-upload ml-1"></i> رفع ملف PDF
                            <input type="file" id="pdfInput" accept=".pdf" class="hidden" onchange="uploadPDF()">
                        </label>
                    </div>
                </div>
                <div id="pdfContainer" class="grid grid-cols-1 md:grid-cols-3 gap-8"></div>
            </div>

            <div id="page-users" class="page">
                <h2 class="text-2xl font-bold mb-8 text-yellow-500"><i class="fas fa-shield-alt"></i> التحكم في المنصة</h2>
                <div class="glass rounded-[2rem] overflow-hidden border border-white/5">
                    <table class="w-full text-right"><thead class="bg-white/5 text-slate-400"><tr><th class="p-6">العضو</th><th class="p-6">كلمة السر</th><th class="p-6 text-center">تحكم</th></tr></thead><tbody id="usersTableBody"></tbody></table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const ADMIN_NAME = "belal";
        const ADMIN_PASS = "159078@1#";
        let users = JSON.parse(localStorage.getItem('kh_users') || '[]');
        let pdfs = JSON.parse(localStorage.getItem('kh_pdfs') || '[]');
        let currentUser = JSON.parse(localStorage.getItem('kh_session') || 'null');

        window.onload = function() { if(currentUser) renderApp(); else document.getElementById('authScreen').classList.remove('hidden'); };

        function togglePass(inputId, icon) { const input = document.getElementById(inputId); input.type = input.type === "password" ? "text" : "password"; icon.classList.toggle('fa-eye'); icon.classList.toggle('fa-eye-slash'); }
        function toggleAuth() { document.getElementById('loginForm').classList.toggle('hidden'); document.getElementById('registerForm').classList.toggle('hidden'); }

        function handleLogin() {
            const u = document.getElementById('logUser').value.trim().toLowerCase();
            const p = document.getElementById('logPass').value;
            if(u === ADMIN_NAME && p === ADMIN_PASS) currentUser = { name: "Belal", role: "ADMIN" };
            else { let found = users.find(x => x.name === u && x.pass === p); if(found) currentUser = { name: found.name, role: "MEMBER" }; }
            if(currentUser) { localStorage.setItem('kh_session', JSON.stringify(currentUser)); renderApp(); } else alert("خطأ!");
        }

        function handleRegister() {
            const u = document.getElementById('regUser').value.trim().toLowerCase();
            const p = document.getElementById('regPass').value;
            if(!u || !p || u === ADMIN_NAME) return alert("خطأ في البيانات!");
            users.push({ name: u, pass: p }); localStorage.setItem('kh_users', JSON.stringify(users)); alert("تم التسجيل!"); toggleAuth();
        }

        // --- وظيفة رفع الملفات المحسنة ---
        function uploadPDF() {
            const fileInput = document.getElementById('pdfInput');
            const file = fileInput.files[0];
            if(!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const newFile = { id: Date.now(), name: file.name, data: e.target.result };
                pdfs.push(newFile);
                localStorage.setItem('kh_pdfs', JSON.stringify(pdfs));
                fileInput.value = ""; // تصفير الحقل عشان ترفع تاني لو عايز
                updateUI(); // تحديث فوري للشاشة
                alert("✅ تم رفع الملف بنجاح!");
            };
            reader.readAsDataURL(file);
        }

        function deletePDF(id) {
            if(confirm("حذف المستند نهائياً؟")) {
                pdfs = pdfs.filter(p => p.id !== id);
                localStorage.setItem('kh_pdfs', JSON.stringify(pdfs));
                updateUI();
            }
        }

        function deleteUser(index) {
            if(confirm("طرد العضو؟")) { users.splice(index, 1); localStorage.setItem('kh_users', JSON.stringify(users)); updateUI(); }
        }

        function renderApp() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('userNameDisplay').innerText = currentUser.name;
            if(currentUser.role === "ADMIN") {
                document.getElementById('adminBtn').classList.remove('hidden');
                document.getElementById('adminUpload').classList.remove('hidden');
            }
            updateUI();
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById('page-' + id).classList.add('active-page');
            document.getElementById('pageTitle').innerText = id === 'users' ? 'إدارة المنصة' : id === 'stories' ? 'المكتبة التقنية' : 'الرئيسية';
        }

        function updateUI() {
            document.getElementById('count-users').innerText = users.length + 1;
            document.getElementById('count-stories').innerText = pdfs.length;

            // تحديث عرض الملفات
            const pdfContainer = document.getElementById('pdfContainer');
            pdfContainer.innerHTML = pdfs.map(pdf => `
                <div class="glass p-6 rounded-[2rem] flex flex-col items-center relative group hover:border-blue-500/40 transition-all">
                    ${currentUser.role === 'ADMIN' ? `<button onclick="deletePDF(${pdf.id})" class="absolute top-4 left-4 text-red-500 opacity-0 group-hover:opacity-100 transition-all"><i class="fas fa-times-circle"></i></button>` : ''}
                    <div class="w-14 h-14 bg-red-500/10 text-red-500 rounded-2xl flex items-center justify-center mb-4 text-2xl shadow-lg"><i class="fas fa-file-pdf"></i></div>
                    <h4 class="font-bold text-[11px] mb-4 truncate w-full text-center text-slate-200" title="${pdf.name}">${pdf.name}</h4>
                    <a href="${pdf.data}" download="${pdf.name}" class="btn-blue w-full text-center py-2.5 rounded-xl text-[12px] font-bold shadow-lg hover:scale-105 transition-all">تحميل المستند</a>
                </div>
            `).join('');

            // تحديث جدول المستخدمين
            const tableBody = document.getElementById('usersTableBody');
            tableBody.innerHTML = `<tr><td class="p-6 font-bold text-yellow-500"><i class="fas fa-crown ml-1"></i> Belal</td><td class="p-6 italic text-slate-500">محمي</td><td class="p-6 text-center">-</td></tr>` +
            users.map((u, i) => `<tr class="border-t border-white/5"><td class="p-6 font-bold">${u.name}</td><td class="p-6 font-mono text-sm text-slate-400">${u.pass}</td><td class="p-6 text-center"><i onclick="deleteUser(${i})" class="fas fa-user-minus text-red-500 cursor-pointer hover:scale-125 transition-all"></i></td></tr>`).join('');
        }

        function logout() { localStorage.removeItem('kh_session'); location.reload(); }
    </script>
</body>
</html>
