<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخوارزمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #020617; --card: #0f172a; --text: #f8fafc; }
        .light-mode { --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); transition: 0.3s; overflow: hidden; height: 100vh; margin: 0; }
        .glass { background: var(--card); border: 1px solid rgba(255,255,255,0.05); }
        .page { display: none; height: 100%; flex-direction: column; overflow-y: auto; }
        .active-page { display: flex; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .sidebar-btn { width: 100%; text-align: right; padding: 1rem; border-radius: 1rem; display: flex; align-items: center; gap: 1rem; font-weight: bold; transition: 0.2s; }
        .sidebar-btn:hover { background: rgba(59, 130, 246, 0.1); color: #3b82f6; }
        .msg-bubble { max-width: 70%; padding: 0.8rem 1.2rem; border-radius: 1.5rem; margin-bottom: 0.5rem; }
        .my-msg { background: #2563eb; color: white; align-self: flex-start; border-bottom-right-radius: 0; }
        .their-msg { background: rgba(255,255,255,0.1); align-self: flex-end; border-bottom-left-radius: 0; }
    </style>
</head>
<body class="flex">

    <div id="authPage" class="fixed inset-0 z-[100] bg-slate-950 flex items-center justify-center p-4">
        <div class="glass p-10 rounded-[3rem] w-full max-w-md text-center border-blue-500/20 border shadow-2xl">
            <div id="loginForm">
                <i class="fas fa-terminal text-5xl text-blue-500 mb-6"></i>
                <h2 class="text-3xl font-bold mb-8">الخوارزمية</h2>
                <input type="text" id="uName" placeholder="اسم المستخدم" class="w-full p-4 mb-4 rounded-2xl bg-black/40 border border-white/10 outline-none text-center">
                <input type="password" id="uPass" placeholder="كلمة السر" class="w-full p-4 mb-6 rounded-2xl bg-black/40 border border-white/10 outline-none text-center">
                <button onclick="login()" class="w-full bg-blue-600 p-4 rounded-2xl font-bold text-xl hover:bg-blue-700 transition">دخول</button>
                <button onclick="toggleAuth(true)" class="mt-4 text-sm text-slate-400">إنشاء حساب جديد</button>
            </div>
            <div id="regForm" class="hidden">
                <h2 class="text-2xl font-bold mb-8">عضوية جديدة</h2>
                <input type="text" id="rName" placeholder="اسمك بالكامل" class="w-full p-4 mb-4 rounded-2xl bg-black/40 border border-white/10 outline-none text-center">
                <input type="password" id="rPass" placeholder="كلمة سر قوية" class="w-full p-4 mb-6 rounded-2xl bg-black/40 border border-white/10 outline-none text-center">
                <button onclick="register()" class="w-full bg-green-600 p-4 rounded-2xl font-bold text-xl">تأكيد التسجيل</button>
                <button onclick="toggleAuth(false)" class="mt-4 text-sm text-slate-400">رجوع للدخول</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden flex w-full h-full">
        <aside class="w-72 glass flex flex-col p-6 shadow-2xl">
            <div class="mb-10 text-center cursor-pointer" onclick="goHome()">
                <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center text-white text-3xl mx-auto mb-2 shadow-lg"><i class="fas fa-code"></i></div>
                <h1 class="font-bold text-xl tracking-tighter lang-txt" data-ar="الخوارزمية" data-en="Algorithm">الخوارزمية</h1>
            </div>
            <nav class="space-y-2 flex-1">
                <button onclick="showPage('dashboard')" class="sidebar-btn"><i class="fas fa-home text-blue-500"></i> <span class="lang-txt" data-ar="الرئيسية" data-en="Home">الرئيسية</span></button>
                <button onclick="showPage('library')" class="sidebar-btn"><i class="fas fa-book text-red-500"></i> <span class="lang-txt" data-ar="مكتبتي" data-en="Library">مكتبتي</span></button>
                <button onclick="showPage('chat')" class="sidebar-btn"><i class="fas fa-comments text-green-500"></i> <span class="lang-txt" data-ar="المراسلات" data-en="Messages">المراسلات</span></button>
            </nav>
            <div class="pt-4 border-t border-white/10 space-y-2">
                <button onclick="toggleLang()" class="w-full p-3 rounded-xl glass text-xs font-bold"><i class="fas fa-language"></i> <span id="lBtn">English</span></button>
                <button onclick="logout()" class="w-full p-3 rounded-xl bg-red-500/10 text-red-500 font-bold"><i class="fas fa-sign-out-alt"></i> خروج</button>
            </div>
        </aside>

        <main class="flex-1 p-8 overflow-hidden">
            <div id="p-dashboard" class="page active-page">
                <h2 id="wHead" class="text-4xl font-bold mb-10"></h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="glass p-10 rounded-[3rem] border-r-8 border-blue-600">
                        <h3 class="text-xl font-bold opacity-60">الأعضاء</h3>
                        <p id="sUsers" class="text-6xl font-bold">1</p>
                    </div>
                    <div class="glass p-10 rounded-[3rem] border-r-8 border-red-600">
                        <h3 class="text-xl font-bold opacity-60">الملفات</h3>
                        <p id="sFiles" class="text-6xl font-bold">0</p>
                    </div>
                </div>
            </div>

            <div id="p-library" class="page">
                <div class="flex justify-between items-center mb-10">
                    <h2 class="text-3xl font-bold">مكتبتي</h2>
                    <div id="adminUp" class="hidden">
                        <label class="bg-blue-600 px-6 py-2 rounded-xl font-bold cursor-pointer">رفع PDF <input type="file" onchange="upload(this)" class="hidden"></label>
                    </div>
                </div>
                <div id="lGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
            </div>

            <div id="p-chat" class="page">
                <div class="flex h-full gap-6">
                    <div class="w-1/3 glass rounded-3xl p-4 flex flex-col">
                        <h4 class="font-bold mb-4 p-2 border-b border-white/5">مين موجود؟</h4>
                        <div id="uOnline" class="flex-1 overflow-y-auto space-y-2"></div>
                    </div>
                    <div class="flex-1 glass rounded-3xl flex flex-col overflow-hidden">
                        <div id="cHead" class="p-4 bg-white/5 font-bold border-b border-white/5">اختر عضواً</div>
                        <div id="mBox" class="flex-1 p-6 overflow-y-auto flex flex-col"></div>
                        <div id="cInp" class="p-4 flex gap-2 hidden">
                            <input type="text" id="mInp" class="flex-1 bg-black/40 p-4 rounded-2xl outline-none" placeholder="اكتب هنا...">
                            <button onclick="send()" class="bg-blue-600 px-6 rounded-2xl"><i class="fas fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let users = JSON.parse(localStorage.getItem('alg_users') || '[]');
        let library = JSON.parse(localStorage.getItem('alg_lib') || '[]');
        let chats = JSON.parse(localStorage.getItem('alg_chats') || '[]');
        let user = JSON.parse(localStorage.getItem('alg_session') || 'null');
        let target = null;

        function toggleAuth(reg) {
            document.getElementById('loginForm').classList.toggle('hidden', reg);
            document.getElementById('regForm').classList.toggle('hidden', !reg);
        }

        function register() {
            const n = document.getElementById('rName').value;
            const p = document.getElementById('rPass').value;
            if(!n || !p) return alert("امسح البيانات!");
            users.push({name: n, pass: p, role: 'USER'});
            localStorage.setItem('alg_users', JSON.stringify(users));
            alert("تم! سجل دخولك دلوقتي."); toggleAuth(false);
        }

        function login() {
            const n = document.getElementById('uName').value;
            const p = document.getElementById('uPass').value;
            if(n.toLowerCase() === 'belal' && p === '159078@1#') user = {name: 'Belal', role: 'ADMIN'};
            else user = users.find(x => x.name === n && x.pass === p);
            
            if(user) {
                localStorage.setItem('alg_session', JSON.stringify(user));
                location.reload();
            } else alert("بيانات غلط!");
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById('p-' + id).classList.add('active-page');
            if(id === 'chat') renderOnline();
        }

        function renderOnline() {
            const list = document.getElementById('uOnline');
            let pool = [{name: 'Belal'}, ...users].filter(x => x.name !== user.name);
            list.innerHTML = pool.map(u => `<div onclick="startChat('${u.name}')" class="p-4 rounded-2xl hover:bg-white/5 cursor-pointer flex items-center gap-3"><span class="w-3 h-3 bg-green-500 rounded-full"></span> <b>${u.name}</b></div>`).join('');
        }

        function startChat(name) {
            target = name;
            document.getElementById('cHead').innerText = "شات مع: " + name;
            document.getElementById('cInp').classList.remove('hidden');
            renderMsgs();
        }

        function send() {
            const val = document.getElementById('mInp').value;
            if(!val) return;
            chats.push({from: user.name, to: target, text: val});
            localStorage.setItem('alg_chats', JSON.stringify(chats));
            document.getElementById('mInp').value = "";
            renderMsgs();
        }

        function renderMsgs() {
            const box = document.getElementById('mBox');
            const msgs = chats.filter(c => (c.from === user.name && c.to === target) || (c.from === target && c.to === user.name));
            box.innerHTML = msgs.map(m => `<div class="msg-bubble ${m.from === user.name ? 'my-msg' : 'their-msg'}"><b>${m.from}:</b><br>${m.text}</div>`).join('');
            box.scrollTop = box.scrollHeight;
        }

        function upload(input) {
            const file = input.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                library.push({id: Date.now(), name: file.name, data: e.target.result});
                localStorage.setItem('alg_lib', JSON.stringify(library));
                location.reload();
            };
            reader.readAsDataURL(file);
        }

        function goHome() { showPage('dashboard'); }

        if(user) {
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('wHead').innerText = "أهلاً يا " + user.name;
            document.getElementById('sUsers').innerText = users.length + 1;
            document.getElementById('sFiles').innerText = library.length;
            if(user.role === 'ADMIN') document.getElementById('adminUp').classList.remove('hidden');
            
            document.getElementById('lGrid').innerHTML = library.map(f => `
                <div class="glass p-6 rounded-[2rem] text-center">
                    <i class="fas fa-file-pdf text-4xl text-red-500 mb-4"></i>
                    <h4 class="font-bold truncate">${f.name}</h4>
                    <a href="${f.data}" target="_blank" class="block bg-blue-600 mt-4 py-2 rounded-xl">عرض</a>
                </div>`).join('');
        }

        function logout() { localStorage.removeItem('alg_session'); location.reload(); }
    </script>
</body>
</html>
