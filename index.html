<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخوارزمية - الإصدار الاحترافي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #020617; --card: #0f172a; --text: #f8fafc; --accent: #3b82f6; }
        .light-mode { --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --accent: #2563eb; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); transition: 0.3s; overflow: hidden; height: 100vh; margin: 0; }
        .glass { background: var(--card); border: 1px solid rgba(255,255,255,0.05); }
        .page { display: none; height: 100%; flex-direction: column; overflow-y: auto; padding: 1.5rem; }
        .active-page { display: flex; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* شريط الأخبار */
        .news-ticker { background: rgba(59, 130, 246, 0.1); border-bottom: 1px solid rgba(59, 130, 246, 0.2); height: 40px; display: flex; align-items: center; overflow: hidden; white-space: nowrap; }
        .news-content { display: inline-block; animation: marquee 20s linear infinite; padding-right: 100%; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        .sidebar-btn { width: 100%; text-align: right; padding: 1rem; border-radius: 1rem; display: flex; align-items: center; gap: 1rem; font-weight: bold; transition: 0.2s; }
        .sidebar-btn:hover { background: rgba(59, 130, 246, 0.1); color: var(--accent); }
        .msg-bubble { max-width: 75%; padding: 0.8rem 1.2rem; border-radius: 1.2rem; margin-bottom: 0.4rem; font-size: 0.95rem; }
        .my-msg { background: var(--accent); color: white; align-self: flex-start; border-bottom-right-radius: 4px; }
        .their-msg { background: rgba(255,255,255,0.08); align-self: flex-end; border-bottom-left-radius: 4px; }
    </style>
</head>
<body class="flex">

    <div id="authPage" class="fixed inset-0 z-[100] bg-slate-950 flex items-center justify-center p-4">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-md text-center border-blue-500/20 border">
            <div id="loginForm">
                <i class="fas fa-terminal text-5xl text-blue-500 mb-6"></i>
                <h2 class="text-3xl font-bold mb-8">الخوارزمية</h2>
                <input type="text" id="uName" placeholder="اسم المستخدم" class="w-full p-4 mb-4 rounded-2xl bg-black/40 border border-white/10 outline-none text-center">
                <input type="password" id="uPass" placeholder="كلمة السر" class="w-full p-4 mb-6 rounded-2xl bg-black/40 border border-white/10 outline-none text-center">
                <button onclick="login()" class="w-full bg-blue-600 p-4 rounded-2xl font-bold text-xl hover:bg-blue-700 transition">دخول</button>
                <button onclick="toggleAuth(true)" class="mt-4 text-sm text-slate-400">حساب جديد</button>
            </div>
            <div id="regForm" class="hidden">
                <h2 class="text-2xl font-bold mb-8">عضوية جديدة</h2>
                <input type="text" id="rName" placeholder="اسمك" class="w-full p-4 mb-4 rounded-2xl bg-black/40 border border-white/10 outline-none text-center text-white">
                <input type="password" id="rPass" placeholder="كلمة السر" class="w-full p-4 mb-6 rounded-2xl bg-black/40 border border-white/10 outline-none text-center text-white">
                <button onclick="register()" class="w-full bg-green-600 p-4 rounded-2xl font-bold text-xl">تأكيد</button>
                <button onclick="toggleAuth(false)" class="mt-4 text-sm text-slate-400">رجوع</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden flex w-full h-full">
        <aside class="w-72 glass flex flex-col p-6 shadow-2xl">
            <div class="mb-6 text-center cursor-pointer" onclick="showPage('dashboard')">
                <div class="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center text-white text-2xl mx-auto mb-2"><i class="fas fa-code"></i></div>
                <h1 class="font-bold text-lg">الخوارزمية</h1>
            </div>
            
            <nav class="space-y-2 flex-1">
                <button onclick="showPage('dashboard')" class="sidebar-btn"><i class="fas fa-home text-blue-500"></i> الرئيسية</button>
                <button onclick="showPage('library')" class="sidebar-btn"><i class="fas fa-book text-red-500"></i> مكتبتي</button>
                <button onclick="showPage('chat')" class="sidebar-btn"><i class="fas fa-comments text-green-500"></i> المراسلات</button>
                <button id="adminLink" onclick="showPage('admin')" class="hidden sidebar-btn border border-yellow-500/20 text-yellow-500 mt-4"><i class="fas fa-crown"></i> لوحة الإدارة</button>
            </nav>

            <div class="pt-4 border-t border-white/10 space-y-2">
                <button onclick="toggleTheme()" class="w-full p-3 rounded-xl glass text-xs font-bold"><i class="fas fa-moon"></i> تبديل المظهر</button>
                <button onclick="logout()" class="w-full p-3 rounded-xl bg-red-500/10 text-red-500 font-bold"><i class="fas fa-power-off"></i> خروج</button>
            </div>
        </aside>

        <main class="flex-1 overflow-hidden flex flex-col">
            <div class="news-ticker">
                <div class="bg-blue-600 h-full px-4 flex items-center font-bold text-xs z-10 shadow-lg">أحدث الأخبار</div>
                <div class="news-content text-sm" id="tickerText">أهلاً بك في منصة الخوارزمية.. تابعونا لكل جديد!</div>
            </div>

            <div class="flex-1 overflow-hidden relative">
                <div id="p-dashboard" class="page active-page">
                    <h2 id="wHead" class="text-3xl font-bold mb-8 text-blue-500"></h2>
                    <div class="grid grid-cols-2 gap-6">
                        <div class="glass p-8 rounded-3xl border-r-4 border-blue-600">
                            <h3 class="opacity-50">الأعضاء</h3>
                            <p id="sUsers" class="text-5xl font-bold">0</p>
                        </div>
                        <div class="glass p-8 rounded-3xl border-r-4 border-red-600">
                            <h3 class="opacity-50">الملفات</h3>
                            <p id="sFiles" class="text-5xl font-bold">0</p>
                        </div>
                    </div>
                </div>

                <div id="p-library" class="page">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold">المكتبة الرقمية</h2>
                        <div id="adminUp" class="hidden">
                            <label class="bg-blue-600 px-5 py-2 rounded-xl cursor-pointer">رفع PDF <input type="file" onchange="upload(this)" class="hidden"></label>
                        </div>
                    </div>
                    <div id="lGrid" class="grid grid-cols-3 gap-6"></div>
                </div>

                <div id="p-chat" class="page flex-row gap-6 p-4">
                    <div class="w-1/3 glass rounded-3xl p-4 flex flex-col overflow-hidden">
                        <h4 class="font-bold border-b border-white/5 pb-2 mb-2">الأعضاء</h4>
                        <div id="uList" class="flex-1 overflow-y-auto space-y-1"></div>
                    </div>
                    <div class="flex-1 glass rounded-3xl flex flex-col overflow-hidden">
                        <div id="cHead" class="p-4 bg-white/5 border-b border-white/5 font-bold">اختر زميلاً</div>
                        <div id="mBox" class="flex-1 p-4 overflow-y-auto flex flex-col"></div>
                        <div id="cInputArea" class="p-4 flex gap-2 hidden">
                            <input type="text" id="msgIn" class="flex-1 bg-black/20 p-4 rounded-2xl outline-none" placeholder="اكتب رسالة (اضغط Enter للإرسال)...">
                            <button onclick="send()" class="bg-blue-600 w-12 rounded-xl"><i class="fas fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>

                <div id="p-admin" class="page">
                    <h2 class="text-2xl font-bold mb-4">إدارة المنصة</h2>
                    <div class="glass rounded-2xl p-4 mb-6">
                        <h4 class="mb-2 font-bold">تغيير شريط الأخبار:</h4>
                        <div class="flex gap-2">
                            <input type="text" id="newTicker" class="flex-1 bg-black/40 p-2 rounded-lg outline-none" placeholder="اكتب الخبر الجديد هنا...">
                            <button onclick="updateTicker()" class="bg-blue-600 px-4 rounded-lg">تحديث</button>
                        </div>
                    </div>
                    <div class="glass rounded-2xl overflow-hidden">
                        <table class="w-full text-right">
                            <thead class="bg-white/5 text-blue-400"><tr><th class="p-4">الاسم</th><th class="p-4">الباسورد</th><th class="p-4">حذف</th></tr></thead>
                            <tbody id="adminTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let users = JSON.parse(localStorage.getItem('alg_users') || '[]');
        let lib = JSON.parse(localStorage.getItem('alg_lib') || '[]');
        let chats = JSON.parse(localStorage.getItem('alg_chats') || '[]');
        let user = JSON.parse(localStorage.getItem('alg_session') || 'null');
        let ticker = localStorage.getItem('alg_ticker') || "أهلاً بك في منصة الخوارزمية.. تابعونا لكل جديد!";
        let target = null;

        // تشغيل زر الـ Enter للإرسال
        document.getElementById('msgIn').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });

        function updateTicker() {
            const val = document.getElementById('newTicker').value;
            if(!val) return;
            ticker = val;
            localStorage.setItem('alg_ticker', ticker);
            document.getElementById('tickerText').innerText = ticker;
            alert("تم تحديث الخبر!");
        }

        function login() {
            const n = document.getElementById('uName').value.trim();
            const p = document.getElementById('uPass').value;
            let cur = (n.toLowerCase()==='belal' && p==='159078@1#') ? {name:'Belal',role:'ADMIN'} : users.find(x=>x.name===n && x.pass===p);
            if(cur) { localStorage.setItem('alg_session', JSON.stringify(cur)); location.reload(); }
            else alert("غلط!");
        }

        function register() {
            const n = document.getElementById('rName').value.trim();
            const p = document.getElementById('rPass').value;
            if(!n || !p) return;
            users.push({name:n, pass:p});
            localStorage.setItem('alg_users', JSON.stringify(users));
            alert("تمام! سجل دخولك."); toggleAuth(false);
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p=>p.classList.remove('active-page'));
            document.getElementById('p-'+id).classList.add('active-page');
            if(id==='chat') renderU();
            if(id==='admin') renderA();
        }

        function renderU() {
            const list = document.getElementById('uList');
            let p = [{name:'Belal'}, ...users].filter(x=>x.name!==user.name);
            list.innerHTML = p.map(u => `<div onclick="startC('${u.name}')" class="p-3 rounded-xl hover:bg-white/5 cursor-pointer"><b>${u.name}</b></div>`).join('');
        }

        function startC(n) {
            target = n;
            document.getElementById('cHead').innerText = "شات مع: " + n;
            document.getElementById('cInputArea').classList.remove('hidden');
            renderM();
        }

        function send() {
            const v = document.getElementById('msgIn').value.trim();
            if(!v) return;
            chats.push({f:user.name, t:target, txt:v, time:new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})});
            localStorage.setItem('alg_chats', JSON.stringify(chats));
            document.getElementById('msgIn').value = "";
            renderM();
        }

        function renderM() {
            const b = document.getElementById('mBox');
            const filtered = chats.filter(c=>(c.f===user.name && c.t===target)||(c.f===target && c.t===user.name));
            b.innerHTML = filtered.map(m=>`<div class="flex flex-col ${m.f===user.name?'items-start':'items-end'}"><div class="msg-bubble ${m.f===user.name?'my-msg':'their-msg'}">${m.txt}<br><span class="text-[9px] opacity-40">${m.time}</span></div></div>`).join('');
            b.scrollTop = b.scrollHeight;
        }

        function upload(i) {
            const f = i.files[0];
            const r = new FileReader();
            r.onload = (e) => { lib.push({id:Date.now(), n:f.name, d:e.target.result}); localStorage.setItem('alg_lib', JSON.stringify(lib)); location.reload(); };
            r.readAsDataURL(f);
        }

        function renderA() {
            document.getElementById('adminTable').innerHTML = users.map((u,i)=>`<tr><td class="p-4">${u.name}</td><td class="p-4 text-yellow-500">${u.pass}</td><td class="p-4"><button onclick="delU(${i})" class="text-red-500"><i class="fas fa-trash"></i></button></td></tr>`).join('');
        }

        function delU(i) { users.splice(i,1); localStorage.setItem('alg_users', JSON.stringify(users)); renderA(); }
        function toggleAuth(r) { document.getElementById('loginForm').classList.toggle('hidden',r); document.getElementById('regForm').classList.toggle('hidden',!r); }
        function toggleTheme() { document.body.classList.toggle('light-mode'); }
        function logout() { localStorage.removeItem('alg_session'); location.reload(); }

        if(user) {
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('wHead').innerText = "أهلاً يا " + user.name;
            document.getElementById('tickerText').innerText = ticker;
            document.getElementById('sUsers').innerText = users.length + 1;
            document.getElementById('sFiles').innerText = lib.length;
            if(user.role==='ADMIN') {
                document.getElementById('adminLink').classList.remove('hidden');
                document.getElementById('adminUp').classList.remove('hidden');
            }
            document.getElementById('lGrid').innerHTML = lib.map(f=>`<div class="glass p-4 rounded-3xl text-center"><i class="fas fa-file-pdf text-4xl text-red-500 mb-2"></i><h4 class="text-xs truncate">${f.n}</h4><a href="${f.d}" target="_blank" class="block bg-blue-600 mt-2 py-2 rounded-xl text-xs font-bold">عرض</a></div>`).join('');
        }
    </script>
</body>
</html>
