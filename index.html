<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الخوارزمية | V28 Ultra Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #020617; --card: #0f172a; --accent: #3b82f6; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: white; height: 100vh; overflow: hidden; margin: 0; }
        .glass { background: var(--card); border: 1px solid rgba(255,255,255,0.05); }
        .page { display: none; height: 100%; padding: 20px; flex-direction: column; overflow-y: auto; }
        .active-page { display: flex; }
        .sidebar-btn { width: 100%; text-align: right; padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: 0.3s; }
        .sidebar-btn:hover, .sidebar-btn.active { background: var(--accent); box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); }
    </style>
</head>
<body class="flex">

    <div id="authPage" class="fixed inset-0 z-[999] bg-slate-950 flex items-center justify-center p-4">
        <div class="glass p-10 rounded-[2.5rem] w-full max-w-md text-center border-blue-500/30 border shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 text-blue-500">دخول منصة الخوارزمية</h2>
            <input type="text" id="uName" placeholder="اسم المستخدم" class="w-full p-4 mb-4 rounded-xl bg-slate-900 border border-white/5 text-center outline-none focus:border-blue-500">
            <input type="password" id="uPass" placeholder="كلمة السر" class="w-full p-4 mb-6 rounded-xl bg-slate-900 border border-white/5 text-center outline-none focus:border-blue-500">
            <button onclick="handleAuth()" class="w-full bg-blue-600 p-4 rounded-xl font-bold hover:bg-blue-700 transition transform active:scale-95">دخول</button>
        </div>
    </div>

    <div id="mainApp" class="hidden flex w-full h-full">
        <aside class="w-64 glass p-5 flex flex-col border-l border-white/5">
            <h1 class="text-xl font-black mb-10 text-center text-blue-500 tracking-tighter">ALGORITHM</h1>
            <nav class="flex-1 space-y-2">
                <div onclick="showPage('dashboard')" id="btn-dashboard" class="sidebar-btn active"><i class="fas fa-home"></i> الرئيسية</div>
                <div onclick="showPage('chat')" id="btn-chat" class="sidebar-btn"><i class="fas fa-comments"></i> المحادثة</div>
                <div onclick="showPage('members')" id="btn-members" class="sidebar-btn"><i class="fas fa-users-gear"></i> إدارة الفريق</div>
            </nav>
            <button onclick="logout()" class="w-full p-3 bg-red-500/10 text-red-500 rounded-xl font-bold">تسجيل خروج</button>
        </aside>

        <main class="flex-1 relative">
            <div id="p-dashboard" class="page active-page">
                <h2 id="helloUser" class="text-4xl font-black mb-8"></h2>
                <div class="glass p-10 rounded-3xl border-r-8 border-blue-600 shadow-2xl w-fit">
                    <p class="opacity-50 text-xs mb-2">إجمالي الأعضاء</p>
                    <h3 id="userCount" class="text-7xl font-black">0</h3>
                </div>
            </div>

            <div id="p-chat" class="page">
                <div id="chatBox" class="flex-1 glass rounded-2xl p-4 mb-4 overflow-y-auto flex flex-col gap-3"></div>
                <div class="flex gap-2 bg-slate-900 p-2 rounded-xl">
                    <input type="text" id="chatInput" class="flex-1 bg-transparent p-2 outline-none" placeholder="اكتب رسالتك...">
                    <button onclick="sendMsg()" class="bg-blue-600 px-6 py-2 rounded-lg font-bold hover:bg-blue-700">إرسال</button>
                </div>
            </div>

            <div id="p-members" class="page">
                <h2 class="text-2xl font-bold mb-6">قائمة الفريق والتحكم</h2>
                <div class="glass rounded-2xl overflow-hidden shadow-2xl">
                    <table class="w-full text-right">
                        <thead class="bg-blue-600/10">
                            <tr><th class="p-4">العضو</th><th class="p-4">الإجراء</th></tr>
                        </thead>
                        <tbody id="memberList"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        // إعدادات الاتصال
        const supabaseUrl = 'https://xhyfprrvpzasbywehzid.supabase.co';
        const supabaseKey = 'sb_publishable_lJ85dVr8A5dOvXWRZ6SWvw_rSwSfp1J';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);
        let currentUser = null;

        window.onload = () => {
            const saved = localStorage.getItem('algo_user');
            if(saved) { currentUser = JSON.parse(saved); loginSuccess(); }
        };

        // الدخول
        async function handleAuth() {
            const n = document.getElementById('uName').value.trim().toLowerCase();
            const p = document.getElementById('uPass').value;
            const { data } = await _supabase.from('profiles').select('*').eq('username', n).eq('password', p).single();
            if(data) { currentUser = data; localStorage.setItem('algo_user', JSON.stringify(data)); loginSuccess(); }
            else alert('البيانات غير صحيحة!');
        }

        function loginSuccess() {
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            initSystem();
        }

        // نظام الطرد اللحظي الجبار
        function initSystem() {
            updateUI();
            
            // 1. استقبال إشارة الحذف من السيرفر فوراً (Realtime)
            _supabase.channel('global_system')
            .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'profiles' }, (payload) => {
                // إذا كان الـ ID المحذوف هو نفس ID الشخص الذي يفتح الصفحة حالياً
                if (currentUser && payload.old && payload.old.id == currentUser.id) {
                    alert('🚫 تم إنهاء جلستك وطردك من قبل القائد بلال.');
                    logout();
                }
                updateUI();
            })
            .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, () => updateUI())
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'profiles' }, () => updateUI())
            .subscribe();

            // 2. نظام الرادار (الأمان) - يفحص كل 3 ثواني كخطة بديلة
            setInterval(async () => {
                if (currentUser) {
                    const { data } = await _supabase.from('profiles').select('id').eq('id', currentUser.id);
                    if (!data || data.length === 0) {
                        logout(); // طرد تلقائي إذا لم يجد الاسم في قاعدة البيانات
                    }
                }
            }, 3000);
        }

        async function updateUI() {
            if(!currentUser) return;
            document.getElementById('helloUser').innerText = `أهلاً ${currentUser.username}`;
            
            // تحديث قائمة الأعضاء
            const { data: users } = await _supabase.from('profiles').select('*');
            if(users) {
                document.getElementById('userCount').innerText = users.length;
                document.getElementById('memberList').innerHTML = users.map(u => `
                    <tr class="border-b border-white/5">
                        <td class="p-4 font-bold ${u.username === 'belal' ? 'text-yellow-500' : ''}">${u.username}</td>
                        <td class="p-4">
                            ${(currentUser.username === 'belal' && u.username !== 'belal') ? 
                            `<button onclick="kickNow(${u.id})" class="bg-red-600 px-4 py-1 rounded-lg text-xs font-bold hover:bg-red-700">طرد نهائي</button>` : 
                            '<span class="text-green-500 text-[10px]">نشط</span>'}
                        </td>
                    </tr>`).join('');
            }

            // تحديث الشات
            const { data: msgs } = await _supabase.from('messages').select('*').order('created_at', { ascending: false }).limit(30);
            if(msgs) {
                document.getElementById('chatBox').innerHTML = msgs.reverse().map(m => `
                    <div class="p-3 rounded-2xl bg-slate-800 w-fit max-w-[80%] ${m.username === currentUser.username ? 'mr-auto bg-blue-600' : 'ml-auto'}">
                        <div class="text-[9px] opacity-50 mb-1">${m.username}</div>
                        <p class="text-sm">${m.content}</p>
                    </div>`).join('');
                document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
            }
        }

        // تنفيذ عملية الطرد (المسح من السيرفر)
        async function kickNow(id) {
            if(confirm('هل أنت متأكد من طرد هذا العضو نهائياً؟')) {
                await _supabase.from('profiles').delete().eq('id', id);
                updateUI();
            }
        }

        async function sendMsg() {
            const inp = document.getElementById('chatInput');
            if(inp.value.trim()) {
                await _supabase.from('messages').insert([{ username: currentUser.username, content: inp.value }]);
                inp.value = '';
            }
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById('p-'+id).classList.add('active-page');
            document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-'+id).classList.add('active');
        }

        function logout() {
            localStorage.removeItem('algo_user');
            location.reload();
        }
    </script>
</body>
</html>
