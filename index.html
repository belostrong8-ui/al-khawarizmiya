<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Algorithm | الخوارزمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #020617; --card: rgba(30, 41, 59, 0.5); --text: #f8fafc; --border: rgba(255, 255, 255, 0.05); }
        .light-mode { --bg: #f1f5f9; --card: rgba(255, 255, 255, 0.9); --text: #0f172a; --border: rgba(0, 0, 0, 0.1); }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); transition: 0.3s; }
        .page { display: none; }
        .active-page { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .glass { background: var(--card); backdrop-filter: blur(12px); border: 1px solid var(--border); }
        .btn-primary { background: linear-gradient(45deg, #3b82f6, #1d4ed8); color: white; }
    </style>
</head>
<body>

    <div id="authScreen" class="fixed inset-0 flex items-center justify-center z-[100] p-4 bg-slate-950">
        <div class="glass p-10 rounded-[2.5rem] w-full max-w-md shadow-2xl border border-white/5 text-center">
            <div id="loginForm">
                <div class="w-24 h-24 bg-blue-600/20 rounded-3xl flex items-center justify-center mx-auto mb-6 border border-blue-500/30">
                    <i class="fas fa-microchip text-4xl text-blue-500"></i>
                </div>
                <h2 class="text-4xl font-bold mb-2">The Algorithm</h2>
                <p class="text-slate-500 font-bold mb-8 tracking-widest uppercase">Central Command</p>
                <input type="text" id="logUser" placeholder="اسم المستخدم" class="w-full p-4 mb-4 rounded-2xl bg-black/20 border border-white/10 outline-none text-xl focus:border-blue-500 transition-all">
                <input type="password" id="logPass" placeholder="كلمة السر" class="w-full p-4 mb-8 rounded-2xl bg-black/20 border border-white/10 outline-none text-xl focus:border-blue-500 transition-all">
                <button onclick="handleLogin()" class="w-full btn-primary p-4 rounded-2xl font-bold text-xl shadow-lg shadow-blue-500/20 active:scale-95 transition">دخول النظام</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden flex h-screen overflow-hidden">
        <aside class="w-80 glass border-l flex flex-col p-6">
            <div onclick="showPage('dashboard')" class="flex items-center gap-3 mb-12 p-2 cursor-pointer hover:scale-105 transition">
                <div class="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center text-white text-xl shadow-lg"><i class="fas fa-terminal"></i></div>
                <span class="text-2xl font-bold tracking-tighter uppercase">The Algorithm</span>
            </div>
            <nav class="space-y-4 flex-1">
                <button onclick="showPage('dashboard')" class="w-full text-right p-4 rounded-2xl hover:bg-blue-500/10 flex items-center gap-4 text-xl transition"><i class="fas fa-layer-group text-blue-500 w-6"></i> الرئيسية</button>
                <button onclick="showPage('stories')" class="w-full text-right p-4 rounded-2xl hover:bg-blue-500/10 flex items-center gap-4 text-xl transition"><i class="fas fa-code-branch text-blue-500 w-6"></i> المكتبة التقنية</button>
                <button onclick="showPage('contact')" class="w-full text-right p-4 rounded-2xl hover:bg-blue-500/10 flex items-center gap-4 text-xl transition"><i class="fas fa-comment-dots text-blue-500 w-6"></i> تواصل مع القائد</button>
                <button id="adminBtn" onclick="showPage('users')" class="hidden w-full text-right p-4 rounded-2xl hover:bg-yellow-500/10 flex items-center gap-4 text-xl text-yellow-500 transition font-bold border border-yellow-500/20"><i class="fas fa-user-shield w-6"></i> الإدارة</button>
            </nav>
            <button onclick="toggleTheme()" class="mb-4 p-4 rounded-2xl glass font-bold text-lg hover:bg-white/5 transition"><i class="fas fa-adjust ml-2"></i> تبديل المظهر</button>
            <button onclick="logout()" class="text-red-500 p-4 flex items-center gap-3 font-bold text-lg hover:bg-red-500/5 rounded-xl transition"><i class="fas fa-power-off"></i> خروج من النظام</button>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto">
            <header class="flex justify-between items-center mb-10 bg-black/5 p-4 rounded-[2rem] border border-white/5">
                <div class="relative w-1/3">
                    <i class="fas fa-search absolute right-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    <input type="text" oninput="handleSearch()" id="mainSearch" placeholder="بحث سريع..." class="w-full pr-12 p-3 rounded-2xl glass outline-none text-lg border border-transparent focus:border-blue-500/50">
                </div>
                <div onclick="showPage('dashboard')" class="flex items-center gap-4 cursor-pointer hover:opacity-80 transition group">
                    <span id="userNameDisplay" class="font-bold text-2xl group-hover:text-blue-500 transition"></span>
                    <div class="w-12 h-12 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-2xl flex items-center justify-center text-white text-2xl shadow-lg"><i class="fas fa-user-secret"></i></div>
                </div>
            </header>

            <div id="page-dashboard" class="page active-page">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-10">
                    <div class="glass p-10 rounded-[2.5rem] border-b-8 border-blue-500 shadow-xl"><h3 class="text-slate-400 text-xl font-bold mb-2 uppercase">Files</h3><p id="count-stories" class="text-7xl font-bold">0</p></div>
                    <div class="glass p-10 rounded-[2.5rem] border-b-8 border-green-500 shadow-xl"><h3 class="text-slate-400 text-xl font-bold mb-2 uppercase">Team Members</h3><p id="count-users" class="text-7xl font-bold">0</p></div>
                </div>
                <div class="glass p-8 rounded-[2.5rem] shadow-2xl border border-blue-500/10">
                    <h3 class="text-2xl font-bold mb-6 text-blue-500 flex items-center gap-3"><i class="fas fa-satellite-dish"></i> تحديثات النظام</h3>
                    <div id="newsFeed" class="space-y-4 text-xl"></div>
                </div>
            </div>

            <div id="page-stories" class="page">
                <div class="flex justify-between items-center mb-10"><h2 class="text-4xl font-bold">المستندات المرفوعة</h2><div id="adminUpload" class="hidden"><label class="btn-primary px-8 py-4 rounded-2xl cursor-pointer font-bold block shadow-blue-500/20 shadow-lg hover:scale-105 transition">رفع ملف جديد <input type="file" id="pdfInput" accept=".pdf" class="hidden" onchange="uploadPDF()"></label></div></div>
                <div id="pdfContainer" class="grid grid-cols-1 md:grid-cols-3 gap-8"></div>
            </div>

            <div id="page-contact" class="page">
                <h2 class="text-4xl font-bold mb-10 text-blue-500">صندوق الرسائل المشفرة</h2>
                <div class="glass p-10 rounded-[3rem] max-w-3xl mx-auto border border-blue-500/10 shadow-2xl">
                    <p class="text-slate-400 mb-6 text-center text-lg italic">اكتب رسالتك وستصل إلى القائد بلال فوراً</p>
                    <textarea id="msgContent" placeholder="اكتب رسالتك هنا..." class="w-full h-48 p-6 mb-6 rounded-[2rem] bg-black/20 border border-white/10 outline-none text-xl focus:border-blue-500 transition-all" dir="rtl"></textarea>
                    <button onclick="sendMessage()" class="w-full btn-primary py-5 rounded-[2rem] font-bold text-2xl shadow-xl hover:scale-[1.01] transition">تشفير وإرسال <i class="fas fa-lock ml-2"></i></button>
                </div>
            </div>

            <div id="page-users" class="page">
                <div class="flex justify-between items-center mb-10">
                    <h2 class="text-4xl font-bold text-yellow-500 uppercase tracking-tighter">Control Center</h2>
                    <div class="flex gap-4">
                        <button onclick="addNewsPrompt()" class="bg-blue-600 px-8 py-3 rounded-2xl font-bold shadow-lg hover:bg-blue-500 transition">نشر تحديث</button>
                        <button onclick="addUserPrompt()" class="bg-green-600 px-8 py-3 rounded-2xl font-bold shadow-lg hover:bg-green-500 transition">إضافة عضو</button>
                    </div>
                </div>
                
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                    <div class="glass rounded-[2.5rem] p-8 border border-white/5">
                        <h3 class="text-2xl font-bold mb-6 text-green-500 border-b border-white/10 pb-4 flex justify-between"><span>الفريق الحالي</span> <i class="fas fa-users"></i></h3>
                        <div id="usersList" class="space-y-4"></div>
                    </div>
                    <div class="glass rounded-[2.5rem] p-8 border border-white/5">
                        <h3 class="text-2xl font-bold mb-6 text-blue-500 border-b border-white/10 pb-4 flex justify-between"><span>الرسائل المستلمة</span> <i class="fas fa-envelope-open-text"></i></h3>
                        <div id="messagesList" class="space-y-4"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const ADMIN_NAME = "belal"; const ADMIN_PASS = "159078@1#";
        let users = JSON.parse(localStorage.getItem('kh_users') || '[]');
        let pdfs = JSON.parse(localStorage.getItem('kh_pdfs') || '[]');
        let news = JSON.parse(localStorage.getItem('kh_news') || '[]');
        let msgs = JSON.parse(localStorage.getItem('kh_msgs') || '[]');
        let currentUser = JSON.parse(localStorage.getItem('kh_session') || 'null');

        window.onload = function() {
            if(currentUser) renderApp();
            if(localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');
        };

        function handleLogin() {
            const u = document.getElementById('logUser').value.trim().toLowerCase();
            const p = document.getElementById('logPass').value;
            if(u === ADMIN_NAME && p === ADMIN_PASS) currentUser = { name: "Belal", role: "ADMIN" };
            else { let found = users.find(x => x.name === u && x.pass === p); if(found) currentUser = { name: found.name, role: "MEMBER" }; }
            if(currentUser) { localStorage.setItem('kh_session', JSON.stringify(currentUser)); renderApp(); } else alert("Access Denied!");
        }

        function addNewsPrompt() {
            const txt = prompt("اكتب التحديث الجديد:");
            if(txt) { news.unshift({ text: txt, time: new Date().toLocaleString('ar-EG') }); localStorage.setItem('kh_news', JSON.stringify(news)); updateUI(); }
        }

        function addUserPrompt() {
            const u = prompt("اسم المستخدم:");
            const p = prompt("الباسورد:");
            if(u && p) { users.push({ name: u.toLowerCase(), pass: p }); localStorage.setItem('kh_users', JSON.stringify(users)); updateUI(); }
        }

        function sendMessage() {
            const txt = document.getElementById('msgContent').value.trim();
            if(!txt) return;
            msgs.unshift({ from: currentUser.name, text: txt, time: new Date().toLocaleString('ar-EG') });
            localStorage.setItem('kh_msgs', JSON.stringify(msgs));
            alert("تم الإرسال بنجاح!");
            document.getElementById('msgContent').value = "";
        }

        function updateUI(searchTerm = "") {
            document.getElementById('count-users').innerText = users.length + 1;
            document.getElementById('count-stories').innerText = pdfs.length;
            
            document.getElementById('newsFeed').innerHTML = news.map(n => `
                <div class="p-5 bg-blue-500/10 rounded-2xl border-r-8 border-blue-600 mb-4 shadow-sm">
                    <p class="font-bold">${n.text}</p><span class="text-sm text-slate-500">${n.time}</span>
                </div>`).join('') || "في انتظار تعليمات القائد...";

            if(currentUser.role === 'ADMIN') {
                document.getElementById('messagesList').innerHTML = msgs.map((m, i) => `
                    <div class="p-5 glass rounded-2xl mb-4 border border-blue-500/10">
                        <div class="flex justify-between font-bold mb-2"><span class="text-blue-400 text-lg">من: ${m.from}</span> <button onclick="deleteMsg(${i})" class="text-red-500 hover:scale-125 transition"><i class="fas fa-trash-alt"></i></button></div>
                        <p class="text-slate-200">${m.text}</p><span class="text-[11px] text-slate-500 mt-2 block">${m.time}</span>
                    </div>`).join('') || "لا توجد رسائل واردة.";
                
                const filteredUsers = users.filter(u => u.name.includes(searchTerm));
                document.getElementById('usersList').innerHTML = filteredUsers.map((u, i) => `
                    <div class="p-5 glass rounded-2xl flex justify-between items-center mb-3">
                        <div><p class="text-xl font-bold">${u.name}</p><p class="text-sm text-slate-500 italic">Pass: ${u.pass}</p></div>
                        <button onclick="deleteUser(${i})" class="text-red-500 text-2xl hover:rotate-12 transition"><i class="fas fa-user-minus"></i></button>
                    </div>`).join('');
            }

            const filteredPDFs = pdfs.filter(p => p.name.toLowerCase().includes(searchTerm));
            document.getElementById('pdfContainer').innerHTML = filteredPDFs.map(p => `
                <div class="glass p-8 rounded-[2.5rem] text-center relative group hover:shadow-blue-500/10 transition-all">
                    ${currentUser.role==='ADMIN' ? `<button onclick="deletePDF(${p.id})" class="absolute top-5 left-5 text-red-500 text-xl"><i class="fas fa-minus-circle"></i></button>` : ''}
                    <div class="w-24 h-24 bg-red-500/10 text-red-500 rounded-[2rem] flex items-center justify-center mx-auto mb-6 text-5xl shadow-inner"><i class="fas fa-file-invoice"></i></div>
                    <h4 class="font-bold text-xl truncate mb-6 px-2">${p.name}</h4>
                    <a href="${p.data}" download="${p.name}" class="btn-primary block w-full py-4 rounded-2xl font-bold text-lg hover:shadow-lg transition">تحميل الملف</a>
                </div>`).join('');
        }

        function deleteMsg(i) { msgs.splice(i,1); localStorage.setItem('kh_msgs', JSON.stringify(msgs)); updateUI(); }
        function deleteUser(i) { if(confirm("حذف العضو؟")) { users.splice(i,1); localStorage.setItem('kh_users', JSON.stringify(users)); updateUI(); } }
        function deletePDF(id) { if(confirm("حذف الملف؟")) { pdfs = pdfs.filter(p=>p.id!==id); localStorage.setItem('kh_pdfs', JSON.stringify(pdfs)); updateUI(); } }
        function uploadPDF() {
            const file = document.getElementById('pdfInput').files[0];
            const r = new FileReader();
            r.onload = function(e) { pdfs.push({id:Date.now(), name:file.name, data:e.target.result}); localStorage.setItem('kh_pdfs', JSON.stringify(pdfs)); updateUI(); };
            r.readAsDataURL(file);
        }

        function showPage(id) { document.querySelectorAll('.page').forEach(p=>p.classList.remove('active-page')); document.getElementById('page-'+id).classList.add('active-page'); }
        function toggleTheme() { document.body.classList.toggle('light-mode'); localStorage.setItem('theme', document.body.classList.contains('light-mode')?'light':'dark'); }
        function renderApp() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('userNameDisplay').innerText = currentUser.name;
            if(currentUser.role==='ADMIN'){ document.getElementById('adminBtn').classList.remove('hidden'); document.getElementById('adminUpload').classList.remove('hidden'); }
            updateUI();
        }
        function logout() { localStorage.removeItem('kh_session'); location.reload(); }
        function handleSearch() { const t = document.getElementById('mainSearch').value.toLowerCase(); updateUI(t); }
    </script>
</body>
</html>
