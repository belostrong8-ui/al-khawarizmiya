<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ALGORITHM V30 - ONLINE FIXED</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; background: #020617; color: white; height: 100vh; overflow: hidden; margin: 0; }
        .glass { background: #0f172a; border: 1px solid rgba(255,255,255,0.05); }
        .page { display: none; height: 100%; flex-direction: column; padding: 1.5rem; overflow-y: auto; }
        .active-page { display: flex; }
        .sidebar-btn { width: 100%; text-align: right; padding: 1rem; border-radius: 1rem; display: flex; align-items: center; gap: 1rem; cursor: pointer; }
        .sidebar-btn.active { background: #3b82f6; }
    </style>
</head>
<body class="flex">

    <div id="authPage" class="fixed inset-0 z-[1000] bg-slate-950 flex items-center justify-center p-4">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-md text-center border-blue-500/30 border">
            <h2 class="text-2xl font-bold mb-6 text-blue-500">تسجيل دخول أونلاين</h2>
            <div class="space-y-4">
                <input type="text" id="loginU" placeholder="اسم المستخدم" class="w-full p-4 rounded-xl bg-slate-900 border border-white/10 outline-none">
                <input type="password" id="loginP" placeholder="كلمة السر" class="w-full p-4 rounded-xl bg-slate-900 border border-white/10 outline-none">
                <button onclick="realLogin()" class="w-full bg-blue-600 p-4 rounded-xl font-bold">دخول</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden flex w-full h-full">
        <aside class="w-64 glass flex flex-col p-4 border-l border-white/5">
            <div class="mb-10 px-2 flex items-center gap-3"><i class="fas fa-terminal text-blue-500"></i><h1 class="font-bold text-xl">الخوارزمية</h1></div>
            <nav class="flex-1 space-y-1">
                <button onclick="showPage('dashboard')" id="btn-dashboard" class="sidebar-btn active"><i class="fas fa-home"></i> الرئيسية</button>
                <button onclick="showPage('chat')" id="btn-chat" class="sidebar-btn"><i class="fas fa-comments"></i> المحادثة</button>
                <button onclick="showPage('members')" id="btn-members" class="sidebar-btn"><i class="fas fa-users"></i> الأعضاء</button>
                <button onclick="showPage('library')" id="btn-library" class="sidebar-btn"><i class="fas fa-book"></i> المكتبة</button>
                <button id="adminLink" onclick="showPage('admin')" class="hidden sidebar-btn text-yellow-500"><i class="fas fa-crown"></i> لوحة القائد</button>
            </nav>
            <button onclick="location.reload()" class="w-full p-3 bg-red-500/10 text-red-500 rounded-xl font-bold">خروج</button>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <div id="p-dashboard" class="page active-page">
                <h2 id="helloUser" class="text-3xl font-bold mb-8">أهلاً بك</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="glass p-8 rounded-3xl border-r-8 border-blue-500">
                        <p class="opacity-50 font-bold mb-2">أعضاء الفريق أونلاين</p>
                        <p id="userCount" class="text-6xl font-black">0</p>
                    </div>
                </div>
            </div>

            <div id="p-chat" class="page">
                <div class="flex gap-4 h-full">
                    <div id="chatUserList" class="w-48 glass rounded-2xl p-3 overflow-y-auto"></div>
                    <div class="flex-1 flex flex-col">
                        <div id="chatBox" class="flex-1 glass rounded-2xl p-4 mb-4 overflow-y-auto flex flex-col gap-3"></div>
                        <div class="flex gap-2">
                            <input type="text" id="chatInput" class="flex-1 glass p-4 rounded-xl" placeholder="اكتب رسالتك...">
                            <button onclick="sendMsg()" class="bg-blue-600 px-6 rounded-xl"><i class="fas fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="p-members" class="page">
                <h2 class="text-2xl font-bold mb-6">سجل الهوية</h2>
                <div class="glass rounded-2xl overflow-hidden">
                    <table class="w-full text-right">
                        <thead><tr class="bg-white/5 opacity-50"><th class="p-4">العضو</th><th id="passH" class="p-4 hidden">كلمة السر</th><th class="p-4">الإجراء</th></tr></thead>
                        <tbody id="memberList"></tbody>
                    </table>
                </div>
            </div>

            <div id="p-library" class="page">
                <div class="flex justify-between mb-6">
                    <h2 class="text-2xl font-bold">المكتبة</h2>
                    <input type="text" id="libSearch" oninput="searchFiles()" placeholder="بحث في الملفات..." class="glass p-2 rounded-lg">
                </div>
                <div id="fileList" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
            </div>
        </main>
    </div>

    <script>
        const supabaseUrl = 'https://xhyfprrvpzasbywehzid.supabase.co';
        const supabaseKey = 'sb_publishable_lJ85dvR8A5d0vXWRZ6SWvw_rSwSf56A5uK9900';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);
        let currentUser = null;

        async function realLogin() {
            const u = document.getElementById('loginU').value.trim();
            const p = document.getElementById('loginP').value;

            const { data, error } = await _supabase.from('profiles').select('*').eq('username', u).eq('password', p).single();
            
            if (data) {
                currentUser = data;
                document.getElementById('authPage').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                initApp();
            } else {
                alert("بياناتك غلط يا بطل.. تأكد من الاسم والباسورد");
            }
        }

        async function initApp() {
            document.getElementById('helloUser').innerText = `أهلاً يا ${currentUser.username === 'belal' ? 'القائد بلال 👑' : currentUser.username}`;
            if(currentUser.role === 'ADMIN') document.getElementById('adminLink').classList.remove('hidden');
            if(currentUser.username === 'belal') document.getElementById('passH').classList.remove('hidden');
            
            updateData();
            // تحديث لحظي للرسائل
            _supabase.channel('any').on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, () => updateData()).subscribe();
        }

        async function updateData() {
            // 1. الأعضاء وعدادهم
            const { data: users } = await _supabase.from('profiles').select('*');
            if(users) {
                document.getElementById('userCount').innerText = users.length;
                document.getElementById('memberList').innerHTML = users.map(u => `
                    <tr class="border-b border-white/5">
                        <td class="p-4">${u.username === 'belal' ? 'بلال 👑' : u.username}</td>
                        ${currentUser.username === 'belal' ? `<td class="p-4 text-blue-400 font-mono">${u.password}</td>` : ''}
                        <td class="p-4">${(currentUser.username === 'belal' && u.username !== 'belal') ? '<button class="text-red-500">حذف</button>' : '--'}</td>
                    </tr>
                `).join('');
                document.getElementById('chatUserList').innerHTML = users.map(u => `
                    <button onclick="mention('${u.username}')" class="w-full p-2 glass rounded-lg mb-2 text-sm text-right hover:bg-blue-600/20">${u.username}</button>
                `).join('');
            }

            // 2. المحادثة
            const { data: msgs } = await _supabase.from('messages').select('*').order('created_at', { ascending: true });
            if(msgs) {
                document.getElementById('chatBox').innerHTML = msgs.map(m => `
                    <div class="p-3 glass rounded-xl ${m.username === currentUser.username ? 'mr-auto bg-blue-500/10' : 'ml-auto'} max-w-[80%]">
                        <span class="text-[10px] text-blue-400 font-bold">${m.username}</span>
                        <p class="text-sm mt-1">${m.content}</p>
                    </div>
                `).join('');
                document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
            }
        }

        function mention(name) { document.getElementById('chatInput').value = `@${name} : `; document.getElementById('chatInput').focus(); }
        async function sendMsg() {
            const val = document.getElementById('chatInput').value.trim();
            if(!val) return;
            await _supabase.from('messages').insert([{ username: currentUser.username, content: val }]);
            document.getElementById('chatInput').value = '';
            updateData();
        }
        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('p-'+id).classList.add('active-page');
            document.getElementById('btn-'+id).classList.add('active');
        }
    </script>
</body>
</html>
