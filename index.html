<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخوارزمية </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #020617; --card: #0f172a; --text: #f8fafc; --accent: #3b82f6; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); height: 100vh; overflow: hidden; margin: 0; }
        .glass { background: var(--card); border: 1px solid rgba(255,255,255,0.05); }
        .page { display: none; height: 100%; flex-direction: column; padding: 2rem; overflow-y: auto; }
        .active-page { display: flex; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .sidebar-btn { width: 100%; text-align: right; padding: 1rem; border-radius: 1rem; display: flex; align-items: center; gap: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .sidebar-btn:hover { background: rgba(59, 130, 246, 0.1); color: var(--accent); }
        .leader-badge { background: #eab308; color: #000; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 800; }
        input { background: rgba(0,0,0,0.3) !important; border: 1px solid rgba(255,255,255,0.1) !important; color: white; outline: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 1rem; text-align: right; border-bottom: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="flex">

    <div id="authPage" class="fixed inset-0 z-[500] bg-slate-950 flex items-center justify-center p-4">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-md text-center border-blue-500/30 border shadow-2xl">
            <h2 id="authTitle" class="text-2xl font-bold mb-6">تسجيل الدخول</h2>
            <div class="space-y-4">
                <input type="text" id="uName" placeholder="اسم المستخدم" class="w-full p-4 rounded-xl text-center font-bold">
                <input type="password" id="uPass" placeholder="كلمة السر" class="w-full p-4 rounded-xl text-center">
                <button onclick="handleAuth()" id="mainBtn" class="w-full bg-blue-600 p-4 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg">دخول</button>
                <button onclick="toggleAuthMode()" id="toggleBtn" class="text-blue-400 text-sm hover:underline block w-full mt-4">ليس لديك حساب؟ إنشاء حساب جديد</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden flex w-full h-full">
        <aside class="w-64 glass flex flex-col p-4 border-l border-white/5 shadow-2xl">
            <div class="mb-10 flex items-center gap-3 px-2">
                <i class="fas fa-terminal text-2xl text-blue-500"></i>
                <h1 class="font-bold text-xl">الخوارزمية</h1>
            </div>
            <nav class="flex-1 space-y-1">
                <button onclick="showPage('dashboard')" class="sidebar-btn"><i class="fas fa-home w-5"></i> الرئيسية</button>
                <button onclick="showPage('chat')" class="sidebar-btn"><i class="fas fa-comments w-5"></i> المراسلات</button>
                <button onclick="showPage('library')" class="sidebar-btn"><i class="fas fa-book w-5"></i> المكتبة</button>
                <button id="adminLink" onclick="showPage('admin')" class="hidden sidebar-btn text-yellow-500 border border-yellow-500/10"><i class="fas fa-crown w-5"></i> لوحة القائد</button>
            </nav>
            <div class="pt-4 border-t border-white/5 space-y-2">
                <button onclick="logout()" class="w-full p-3 bg-red-500/10 text-red-500 rounded-xl font-bold hover:bg-red-500/20"><i class="fas fa-power-off"></i> خروج</button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <div id="p-dashboard" class="page active-page">
                <h2 id="helloUser" class="text-3xl font-bold mb-8"></h2>
                <div class="grid grid-cols-2 gap-6">
                    <div class="glass p-8 rounded-3xl border-r-4 border-blue-500">
                        <p class="opacity-50 text-xs">الأعضاء المسجلين</p>
                        <p id="userCount" class="text-5xl font-black mt-2">0</p>
                    </div>
                    <div class="glass p-8 rounded-3xl border-r-4 border-red-500">
                        <p class="opacity-50 text-xs">رسائل المجموعة</p>
                        <p id="msgCount" class="text-5xl font-black mt-2">0</p>
                    </div>
                </div>
            </div>

            <div id="p-chat" class="page">
                <div id="chatBox" class="flex-1 glass rounded-3xl p-6 mb-4 overflow-y-auto flex flex-col gap-4 shadow-inner"></div>
                <div class="flex gap-4 p-2 glass rounded-2xl border border-white/5">
                    <input type="text" id="chatInput" class="flex-1 bg-transparent p-4 outline-none" placeholder="اكتب رسالتك يا بطل...">
                    <button onclick="sendMsg()" class="bg-blue-600 h-14 w-14 rounded-xl text-xl hover:bg-blue-500 transition shadow-lg"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

            <div id="p-admin" class="page">
                <h2 class="text-2xl font-bold text-yellow-500 mb-6">لوحة تحكم القائد</h2>
                <div class="glass p-6 rounded-3xl mb-8">
                    <h3 class="font-bold mb-4 flex items-center gap-2"><i class="fas fa-users-cog"></i> إدارة الأعضاء وباسورداتهم</h3>
                    <div class="overflow-x-auto">
                        <table>
                            <thead>
                                <tr class="text-blue-400">
                                    <th>الاسم</th>
                                    <th>كلمة السر</th>
                                    <th>الرتبة</th>
                                </tr>
                            </thead>
                            <tbody id="userTableBody"></tbody>
                        </table>
                    </div>
                </div>
                <div class="glass p-6 rounded-3xl">
                    <h3 class="font-bold mb-4">تحديث أخبار الموقع</h3>
                    <input type="text" id="newsInput" class="w-full p-4 mb-4 rounded-xl" placeholder="اكتب الخبر الجديد هنا...">
                    <button onclick="updateNews()" class="bg-yellow-600 w-full p-4 rounded-xl font-bold text-black hover:bg-yellow-500">نشر الخبر</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        let isLoginMode = true;
        // قاعدة البيانات المخزنة
        let users = JSON.parse(localStorage.getItem('alg_db_v12') || '[{"name":"belal","pass":"159078@1#","role":"ADMIN"}]');
        let session = JSON.parse(localStorage.getItem('alg_session') || 'null');
        let msgs = JSON.parse(localStorage.getItem('alg_msgs_v12') || '[]');

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('authTitle').innerText = isLoginMode ? 'تسجيل الدخول' : 'إنشاء حساب جديد';
            document.getElementById('mainBtn').innerText = isLoginMode ? 'دخول' : 'تسجيل';
            document.getElementById('toggleBtn').innerText = isLoginMode ? 'ليس لديك حساب؟ إنشاء حساب جديد' : 'لديك حساب بالفعل؟ سجل دخولك';
        }

        function handleAuth() {
            const name = document.getElementById('uName').value.trim().toLowerCase();
            const pass = document.getElementById('uPass').value;
            if(!name || !pass) return alert('كمل البيانات يا بطل!');

            if(isLoginMode) {
                const user = users.find(u => u.name === name && u.pass === pass);
                if(user) {
                    localStorage.setItem('alg_session', JSON.stringify(user));
                    location.reload();
                } else { alert('الاسم أو الباسورد غلط!'); }
            } else {
                if(users.find(u => u.name === name)) return alert('الاسم ده محجوز فعلاً!');
                users.push({name: name, pass: pass, role: 'USER'});
                localStorage.setItem('alg_db_v12', JSON.stringify(users));
                alert('تم إنشاء الحساب! سجل دخولك دلوقتي.');
                toggleAuthMode();
            }
        }

        function updateUI() {
            if(!session) return;
            document.getElementById('helloUser').innerText = `أهلاً بك يا ${session.name === 'belal' ? 'قائد بلال' : session.name}`;
            document.getElementById('userCount').innerText = users.length;
            document.getElementById('msgCount').innerText = msgs.length;
            
            if(session.role === 'ADMIN') {
                document.getElementById('adminLink').classList.remove('hidden');
                renderUserTable();
            }
            renderChat();
        }

        function renderUserTable() {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = users.map(u => `
                <tr>
                    <td class="font-bold">${u.name}</td>
                    <td class="text-blue-300 font-mono">${u.pass}</td>
                    <td>${u.role === 'ADMIN' ? '<span class="leader-badge">القائد</span>' : 'عضو'}</td>
                </tr>
            `).join('');
        }

        function sendMsg() {
            const txt = document.getElementById('chatInput').value.trim();
            if(!txt) return;
            msgs.push({user: session.name, text: txt, isLeader: session.role === 'ADMIN'});
            localStorage.setItem('alg_msgs_v12', JSON.stringify(msgs));
            document.getElementById('chatInput').value = '';
            renderChat();
        }

        function renderChat() {
            const box = document.getElementById('chatBox');
            if(!box) return;
            box.innerHTML = msgs.map(m => `
                <div class="p-4 glass rounded-2xl ${m.user === session.name ? 'mr-auto border-r-2 border-blue-500 bg-blue-500/5' : 'ml-auto border-r-2 border-slate-500'} max-w-[85%]">
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-[11px] font-bold text-blue-400">${m.user}</span>
                        ${m.isLeader ? '<span class="leader-badge">الخوارزمية</span>' : ''}
                    </div>
                    <p class="text-sm leading-relaxed">${m.text}</p>
                </div>
            `).join('');
            box.scrollTop = box.scrollHeight;
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById('p-'+id).classList.add('active-page');
        }

        function logout() { localStorage.removeItem('alg_session'); location.reload(); }

        if(session) {
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            updateUI();
        }
    </script>
</body>
</html>
