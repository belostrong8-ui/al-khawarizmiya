<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الخوارزمية - V3.0 Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #020617; --card: #0f172a; --text: #f8fafc; --accent: #3b82f6; }
        .light-mode { --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --accent: #2563eb; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); height: 100vh; overflow: hidden; margin: 0; transition: 0.3s; }
        .glass { background: var(--card); border: 1px solid rgba(255,255,255,0.05); }
        .page { display: none; height: 100%; flex-direction: column; padding: 1.5rem; overflow-y: auto; }
        .active-page { display: flex; }
        .sidebar-btn { width: 100%; text-align: right; padding: 0.8rem; border-radius: 0.8rem; display: flex; align-items: center; gap: 0.8rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .sidebar-btn:hover, .sidebar-btn.active { background: var(--accent); color: white; }
        .news-card { border-right: 4px solid var(--accent); padding: 1rem; margin-bottom: 1rem; border-radius: 0.5rem; background: rgba(255,255,255,0.02); }
    </style>
</head>
<body class="flex">

    <div id="authPage" class="fixed inset-0 z-[500] bg-slate-950 flex items-center justify-center p-4">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-md text-center border-blue-500/30 border shadow-2xl">
            <h2 id="authTitle" class="text-2xl font-bold mb-6 text-blue-500">الخوارزمية - دخول</h2>
            <div class="space-y-4">
                <input type="text" id="uName" placeholder="اسم المستخدم" class="w-full p-4 rounded-xl text-center bg-slate-900 border border-white/10 outline-none text-white">
                <input type="password" id="uPass" placeholder="كلمة السر" class="w-full p-4 rounded-xl text-center bg-slate-900 border border-white/10 outline-none text-white">
                <button onclick="handleAuth()" id="authMainBtn" class="w-full bg-blue-600 p-4 rounded-xl font-bold hover:bg-blue-700 transition text-white">دخول</button>
                <button onclick="toggleAuthMode()" id="toggleAuthBtn" class="text-blue-400 text-xs mt-2 underline">إنشاء حساب جديد</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden flex w-full h-full">
        <aside class="w-64 glass flex flex-col p-4 border-l border-white/5">
            <div class="mb-8 px-2 flex items-center gap-3">
                <i class="fas fa-terminal text-2xl text-blue-500"></i>
                <h1 class="font-bold text-xl">الخوارزمية</h1>
            </div>
            <nav class="flex-1 space-y-1 overflow-y-auto">
                <button onclick="showPage('dashboard')" id="btn-dashboard" class="sidebar-btn active"><i class="fas fa-home"></i> <span class="lang-ar">الرئيسية</span><span class="lang-en hidden">Home</span></button>
                <button onclick="showPage('chat')" id="btn-chat" class="sidebar-btn"><i class="fas fa-comments"></i> <span class="lang-ar">المحادثة</span><span class="lang-en hidden">Chat</span></button>
                <button onclick="showPage('news')" id="btn-news" class="sidebar-btn"><i class="fas fa-newspaper"></i> <span class="lang-ar">الأخبار</span><span class="lang-en hidden">News</span></button>
                <button onclick="showPage('library')" id="btn-library" class="sidebar-btn"><i class="fas fa-book"></i> <span class="lang-ar">المكتبة</span><span class="lang-en hidden">Library</span></button>
                <button onclick="showPage('members')" id="btn-members" class="sidebar-btn"><i class="fas fa-users"></i> <span class="lang-ar">الأعضاء</span><span class="lang-en hidden">Members</span></button>
                <button id="adminLink" onclick="showPage('admin')" class="hidden sidebar-btn text-yellow-500"><i class="fas fa-crown"></i> <span class="lang-ar">لوحة القائد</span><span class="lang-en hidden">Admin</span></button>
            </nav>
            
            <div class="mt-4 space-y-2 border-t border-white/10 pt-4">
                <button onclick="toggleTheme()" class="sidebar-btn text-xs"><i class="fas fa-moon"></i> <span class="lang-ar">تبديل الوضع</span><span class="lang-en hidden">Toggle Theme</span></button>
                <button onclick="toggleLanguage()" class="sidebar-btn text-xs"><i class="fas fa-language"></i> <span class="lang-ar">English</span><span class="lang-en hidden">العربية</span></button>
                <button onclick="logout()" class="w-full p-2 bg-red-500/10 text-red-500 rounded-xl font-bold text-xs">خروج</button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <div id="p-dashboard" class="page active-page">
                <h2 id="helloUser" class="text-3xl font-bold mb-8"></h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="glass p-8 rounded-3xl border-r-8 border-blue-500">
                        <p class="opacity-60 font-bold mb-2">أعضاء الفريق</p>
                        <p id="userCount" class="text-6xl font-black">0</p>
                    </div>
                </div>
            </div>

            <div id="p-news" class="page">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">آخر الأخبار التقنية</h2>
                    <button id="addNewsBtn" onclick="openNewsModal()" class="hidden bg-blue-600 px-4 py-2 rounded-lg text-sm">+ رفع خبر</button>
                </div>
                <div id="newsList"></div>
            </div>

            <div id="p-library" class="page">
                <h2 class="text-2xl font-bold mb-6">مكتبة الخوارزمية الممتازة</h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="glass p-4 rounded-xl text-center">
                        <i class="fas fa-file-pdf text-4xl text-red-500 mb-2"></i>
                        <p class="text-sm font-bold">كتاب تعلم Linux</p>
                    </div>
                    <div class="glass p-4 rounded-xl text-center">
                        <i class="fas fa-code text-4xl text-green-500 mb-2"></i>
                        <p class="text-sm font-bold">أكواد جاهزة</p>
                    </div>
                </div>
                <p class="mt-8 opacity-50 text-center">المجلدات المرفوعة: 0</p>
            </div>

            <div id="p-chat" class="page">
                <div id="chatBox" class="flex-1 glass rounded-2xl p-4 mb-4 overflow-y-auto flex flex-col gap-3"></div>
                <div class="flex gap-2">
                    <input type="text" id="chatInput" class="flex-1 glass p-4 rounded-xl outline-none" placeholder="اكتب رسالتك...">
                    <button onclick="sendMsg()" class="bg-blue-600 px-6 rounded-xl text-white"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

            <div id="p-members" class="page">
                <h2 class="text-2xl font-bold mb-4">سجل الأعضاء</h2>
                <div class="glass rounded-2xl overflow-hidden">
                    <table class="w-full text-right">
                        <thead><tr class="bg-white/5 opacity-50"><th class="p-4">الاسم</th><th id="passHeader" class="p-4 hidden text-yellow-500">الباسورد</th><th class="p-4">الحالة</th><th id="adminActionHeader" class="p-4 hidden text-left">إجراء</th></tr></thead>
                        <tbody id="memberTableBody"></tbody>
                    </table>
                </div>
            </div>

            <div id="p-admin" class="page">
                <h2 class="text-2xl font-bold text-yellow-500 mb-6">لوحة القائد بلال 👑</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="glass p-6 rounded-2xl border border-yellow-500/20">
                        <h3 class="font-bold mb-4">رفع خبر جديد</h3>
                        <input type="text" id="newsTitle" placeholder="عنوان الخبر" class="w-full p-3 mb-2 rounded-lg bg-slate-800 outline-none">
                        <textarea id="newsContent" placeholder="محتوى الخبر..." class="w-full p-3 mb-2 rounded-lg bg-slate-800 outline-none h-24"></textarea>
                        <button onclick="postNews()" class="w-full bg-yellow-600 p-2 rounded-lg font-bold">نشر الخبر</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const supabaseUrl = 'https://xhyfprrvpzasbywehzid.supabase.co';
        const supabaseKey = 'sb_publishable_lJ85dVr8A5dOvXWRZ6SWvw_rSwSfp1J'; 
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let currentUser = null;
        let isLoginMode = true;
        let currentLang = 'ar';

        function toggleTheme() { document.body.classList.toggle('light-mode'); }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            document.querySelectorAll('.lang-ar').forEach(el => el.classList.toggle('hidden', currentLang === 'en'));
            document.querySelectorAll('.lang-en').forEach(el => el.classList.toggle('hidden', currentLang === 'ar'));
        }

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('authTitle').innerText = isLoginMode ? 'الخوارزمية - دخول' : 'الخوارزمية - حساب جديد';
            document.getElementById('authMainBtn').innerText = isLoginMode ? 'دخول' : 'إنشاء حساب';
        }

        async function handleAuth() {
            const n = document.getElementById('uName').value.trim().toLowerCase();
            const p = document.getElementById('uPass').value;
            if(!n || !p) return alert('كمل البيانات!');

            if(isLoginMode) {
                const { data } = await _supabase.from('profiles').select('*').eq('username', n).eq('password', p).single();
                if(data) {
                    currentUser = data;
                    document.getElementById('authPage').classList.add('hidden');
                    document.getElementById('mainApp').classList.remove('hidden');
                    initApp();
                } else { alert('خطأ في البيانات!'); }
            } else {
                const { error } = await _supabase.from('profiles').insert([{ username: n, password: p, role: 'USER' }]);
                if(error) alert('الاسم مستخدم!');
                else { alert('تم بنجاح!'); toggleAuthMode(); }
            }
        }

        async function initApp() {
            updateUI();
            _supabase.channel('any').on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, () => updateUI()).subscribe();
            _supabase.channel('any').on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => updateUI()).subscribe();
        }

        async function updateUI() {
            if(!currentUser) return;
            document.getElementById('helloUser').innerText = `أهلاً يا ${currentUser.username === 'belal' ? 'القائد بلال 👑' : currentUser.username}`;

            const { data: users } = await _supabase.from('profiles').select('*');
            if(users) {
                document.getElementById('userCount').innerText = users.length;
                document.getElementById('memberTableBody').innerHTML = users.map(u => `
                    <tr class="border-b border-white/5">
                        <td class="p-4 font-bold">${u.username === 'belal' ? 'بلال 👑' : u.username}</td>
                        ${currentUser.username === 'belal' ? `<td class="p-4 text-xs text-blue-400 font-mono">${u.password}</td>` : ''}
                        <td class="p-4"><span class="text-green-500 text-[10px]">● متصل</span></td>
                        ${currentUser.username === 'belal' && u.username !== 'belal' ? `<td class="p-4 text-left"><button onclick="deleteUser(${u.id})" class="text-red-500"><i class="fas fa-trash"></i></button></td>` : '<td></td>'}
                    </tr>
                `).join('');
            }

            if(currentUser.username === 'belal') {
                document.getElementById('adminLink').classList.remove('hidden');
                document.getElementById('passHeader').classList.remove('hidden');
                document.getElementById('adminActionHeader').classList.remove('hidden');
            }
        }

        async function deleteUser(id) {
            if(confirm('يا قائد، هل أنت متأكد من طرد هذا العضو؟')) {
                await _supabase.from('profiles').delete().eq('id', id);
                updateUI();
            }
        }

        async function sendMsg() {
            const t = document.getElementById('chatInput').value.trim();
            if(!t) return;
            await _supabase.from('messages').insert([{ username: currentUser.username, content: t }]);
            document.getElementById('chatInput').value = '';
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('p-'+id).classList.add('active-page');
            document.getElementById('btn-'+id).classList.add('active');
        }

        function logout() { location.reload(); }
    </script>
</body>
</html>
