<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الخوارزمية - V30 Online</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #020617; --card: #0f172a; --text: #f8fafc; --accent: #3b82f6; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); height: 100vh; overflow: hidden; margin: 0; }
        .glass { background: var(--card); border: 1px solid rgba(255,255,255,0.05); }
        .page { display: none; height: 100%; flex-direction: column; padding: 1.5rem; overflow-y: auto; }
        .active-page { display: flex; }
        .sidebar-btn { width: 100%; text-align: right; padding: 1rem; border-radius: 1rem; display: flex; align-items: center; gap: 1rem; cursor: pointer; }
        .sidebar-btn.active { background: var(--accent); color: white; }
    </style>
</head>
<body class="flex">

    <div id="mainApp" class="flex w-full h-full">
        <aside class="w-64 glass flex flex-col p-4">
            <div class="mb-8 px-2 flex items-center gap-3">
                <i class="fas fa-terminal text-2xl text-blue-500"></i>
                <h1 class="font-bold text-xl">الخوارزمية</h1>
            </div>
            <nav class="flex-1 space-y-1">
                <button onclick="showPage('dashboard')" id="btn-dashboard" class="sidebar-btn active"><i class="fas fa-home"></i> الرئيسية</button>
                <button onclick="showPage('chat')" id="btn-chat" class="sidebar-btn"><i class="fas fa-comments"></i> المحادثة</button>
                <button onclick="showPage('members')" id="btn-members" class="sidebar-btn"><i class="fas fa-users"></i> الأعضاء</button>
                <button onclick="showPage('library')" id="btn-library" class="sidebar-btn"><i class="fas fa-book"></i> المكتبة</button>
                <button id="adminLink" onclick="showPage('admin')" class="hidden sidebar-btn text-yellow-500"><i class="fas fa-crown"></i> لوحة القائد</button>
            </nav>
            <button onclick="logout()" class="w-full p-3 bg-red-500/10 text-red-500 rounded-xl font-bold mt-2">خروج</button>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <div id="p-dashboard" class="page active-page">
                <h2 id="helloUser" class="text-3xl font-bold mb-8">أهلاً يا قائد بلال 👑</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="glass p-8 rounded-3xl border-r-8 border-red-500">
                        <p class="opacity-60 font-bold mb-2">الملفات</p>
                        <p id="fileCount" class="text-6xl font-black">0</p>
                    </div>
                    <div class="glass p-8 rounded-3xl border-r-8 border-blue-500">
                        <p class="opacity-60 font-bold mb-2">عدد أعضاء الفريق</p>
                        <p id="userCount" class="text-6xl font-black">0</p>
                    </div>
                </div>
            </div>

            <div id="p-chat" class="page">
                <div class="flex gap-4 h-full overflow-hidden">
                    <div class="w-48 glass rounded-2xl p-3 overflow-y-auto">
                        <h3 class="text-[10px] font-bold mb-3 opacity-40 uppercase">اختر عضواً</h3>
                        <div id="chatUserList" class="flex flex-col gap-2"></div>
                    </div>
                    <div class="flex-1 flex flex-col overflow-hidden">
                        <div id="chatBox" class="flex-1 glass rounded-2xl p-4 mb-4 overflow-y-auto flex flex-col gap-3"></div>
                        <div class="flex gap-2">
                            <input type="text" id="chatInput" class="flex-1 glass p-4 rounded-xl outline-none" placeholder="اكتب رسالتك...">
                            <button onclick="sendMsg()" class="bg-blue-600 w-14 rounded-xl"><i class="fas fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="p-members" class="page">
                <h2 class="text-2xl font-bold mb-4">سجل الفريق أونلاين</h2>
                <div class="glass rounded-2xl overflow-hidden">
                    <table class="w-full text-right">
                        <thead class="bg-white/5"><tr class="text-xs opacity-50"><th class="p-4">العضو</th><th id="passHeader" class="p-4 hidden">كلمة السر</th><th class="p-4 text-left">الإجراء</th></tr></thead>
                        <tbody id="memberTableBody"></tbody>
                    </table>
                </div>
            </div>

            <div id="p-library" class="page">
                <div class="flex justify-between mb-6">
                    <h2 class="text-2xl font-bold">المكتبة</h2>
                    <input type="text" id="libSearch" oninput="renderFiles()" placeholder="بحث عن ملف..." class="glass p-2 rounded-lg text-sm">
                </div>
                <div id="fileList" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
            </div>

            <div id="p-admin" class="page">
                <h2 class="text-2xl font-bold text-yellow-500 mb-6">لوحة القائد 👑</h2>
                <div class="glass p-6 rounded-3xl max-w-md">
                    <p class="mb-4">تحديث أخبار المنصة</p>
                    <input type="text" id="newsInput" class="w-full p-4 glass rounded-xl mb-4" placeholder="اكتب الخبر العاجل...">
                    <button onclick="updateNews()" class="w-full bg-yellow-600 p-4 rounded-xl font-bold">تحديث</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const supabaseUrl = 'https://xhyfprrvpzasbywehzid.supabase.co';
        const supabaseKey = 'sb_publishable_lJ85dvR8A5d0vXWRZ6SWvw_rSwSf56A5uK9900';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // سيشن ثابت للتجربة باسمك
        let session = {name: 'belal', role: 'ADMIN'}; 

        async function updateUI() {
            if(session.role === 'ADMIN') document.getElementById('adminLink').classList.remove('hidden');
            if(session.name === 'belal') document.getElementById('passHeader').classList.remove('hidden');

            // 1. جلب الأعضاء وتحديث العدد
            const { data: users } = await _supabase.from('profiles').select('*');
            if(users) {
                document.getElementById('userCount').innerText = users.length;
                document.getElementById('memberTableBody').innerHTML = users.map(u => `
                    <tr class="border-b border-white/5">
                        <td class="p-4 font-bold">${u.username === 'belal' ? 'بلال (القائد) 👑' : u.username}</td>
                        ${session.name === 'belal' ? `<td class="p-4 text-blue-400 font-mono">${u.password}</td>` : ''}
                        <td class="p-4 text-left">${(session.name === 'belal' && u.username !== 'belal') ? '<button class="text-red-500">حذف</button>' : ''}</td>
                    </tr>
                `).join('');

                // قائمة اختيار الشخص للمحادثة
                document.getElementById('chatUserList').innerHTML = users.map(u => `
                    <button onclick="mention('${u.username}')" class="p-2 glass rounded-lg text-sm text-right hover:bg-blue-600/20">${u.username}</button>
                `).join('');
            }

            // 2. جلب الرسائل
            const { data: msgs } = await _supabase.from('messages').select('*').order('created_at', { ascending: true });
            if(msgs) {
                document.getElementById('chatBox').innerHTML = msgs.map(m => `
                    <div class="p-3 glass rounded-xl ${m.username === session.name ? 'mr-auto bg-blue-500/10' : 'ml-auto'} max-w-[80%]">
                        <span class="text-[10px] text-blue-400 font-bold">${m.username}</span>
                        <p class="text-sm mt-1">${m.content}</p>
                    </div>
                `).join('');
                document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
            }
        }

        function mention(name) {
            document.getElementById('chatInput').value = `@${name} : `;
            document.getElementById('chatInput').focus();
        }

        async function sendMsg() {
            const val = document.getElementById('chatInput').value.trim();
            if(!val) return;
            await _supabase.from('messages').insert([{ username: session.name, content: val }]);
            document.getElementById('chatInput').value = '';
            updateUI();
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('p-'+id).classList.add('active-page');
            document.getElementById('btn-'+id).classList.add('active');
        }

        function logout() { location.reload(); }

        // تشغيل التحديث التلقائي
        updateUI();
        _supabase.channel('any').on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, () => updateUI()).subscribe();
    </script>
</body>
</html>
