<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الخوارزمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #020617; --card: #0f172a; --text: #f8fafc; --accent: #3b82f6; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); height: 100vh; overflow: hidden; margin: 0; }
        .glass { background: var(--card); border: 1px solid rgba(255,255,255,0.05); }
        .page { display: none; height: 100%; flex-direction: column; padding: 1.5rem; overflow-y: auto; }
        .active-page { display: flex; animation: fadeIn 0.1s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .sidebar-btn { width: 100%; text-align: right; padding: 1rem; border-radius: 1rem; display: flex; align-items: center; gap: 1rem; font-weight: bold; cursor: pointer; }
        .sidebar-btn.active { background: var(--accent); color: white; }
        .marquee-box { background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.2); border-radius: 15px; padding: 10px; overflow: hidden; margin-bottom: 2rem; }
        .marquee-text { display: inline-block; white-space: nowrap; animation: scroll 15s linear infinite; font-weight: bold; color: #60a5fa; }
        @keyframes scroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-150%); } }
    </style>
</head>
<body class="flex">

    <div id="authPage" class="fixed inset-0 z-[500] bg-slate-950 flex items-center justify-center p-4">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-md text-center border-blue-500/30 border shadow-2xl">
            <h2 id="authTitle" class="text-2xl font-bold mb-6 text-blue-500">الخوارزمية - دخول</h2>
            <div class="space-y-4">
                <input type="text" id="uName" placeholder="اسم المستخدم" class="w-full p-4 rounded-xl text-center bg-slate-900 border border-white/10 outline-none text-white">
                <input type="password" id="uPass" placeholder="كلمة السر" class="w-full p-4 rounded-xl text-center bg-slate-900 border border-white/10 outline-none text-white">
                <button onclick="handleAuth()" class="w-full bg-blue-600 p-4 rounded-xl font-bold text-white">دخول</button>
                <button onclick="toggleAuthMode()" id="toggleAuthBtn" class="text-blue-400 text-xs mt-2 underline">إنشاء حساب جديد</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden flex w-full h-full">
        <aside class="w-64 glass flex flex-col p-4 border-l border-white/5">
            <div class="mb-8 px-2 flex items-center gap-3"><i class="fas fa-terminal text-2xl text-blue-500"></i><h1 class="font-bold text-xl text-white">الخوارزمية</h1></div>
            <nav class="flex-1 space-y-1">
                <button onclick="showPage('dashboard')" id="btn-dashboard" class="sidebar-btn active"><i class="fas fa-home"></i> الرئيسية</button>
                <button onclick="showPage('chat')" id="btn-chat" class="sidebar-btn"><i class="fas fa-comments"></i> المحادثة</button>
                <button onclick="showPage('members')" id="btn-members" class="sidebar-btn"><i class="fas fa-users"></i> الأعضاء</button>
                <button onclick="showPage('library')" id="btn-library" class="sidebar-btn"><i class="fas fa-book"></i> المكتبة</button>
                <button id="adminLink" onclick="showPage('admin')" class="hidden sidebar-btn text-yellow-500"><i class="fas fa-crown"></i> لوحة القائد</button>
            </nav>
            <button onclick="logout()" class="w-full p-3 bg-red-500/10 text-red-500 rounded-xl font-bold mt-2">خروج</button>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <div id="p-dashboard" class="page active-page">
                <div class="marquee-box"><div id="newsDisplay" class="marquee-text">مرحباً بكم في منصة الخوارزمية.. القائد بلال يرحب بكم</div></div>
                <h2 id="helloUser" class="text-3xl font-bold mb-8 text-white"></h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="glass p-8 rounded-3xl border-r-8 border-blue-500"><p class="opacity-60 font-bold mb-2">أعضاء الفريق</p><p id="userCount" class="text-6xl font-black">0</p></div>
                </div>
            </div>

            <div id="p-chat" class="page">
                <div class="flex gap-4 h-full overflow-hidden">
                    <div class="w-48 glass rounded-2xl p-3 overflow-y-auto hidden md:block">
                        <h3 class="text-[10px] font-bold mb-3 opacity-40 text-white">منشن عضواً</h3>
                        <div id="chatUserList" class="flex flex-col gap-2"></div>
                    </div>
                    <div class="flex-1 flex flex-col overflow-hidden">
                        <div id="chatBox" class="flex-1 glass rounded-2xl p-4 mb-4 overflow-y-auto flex flex-col gap-3"></div>
                        <div class="flex gap-2 p-2 glass rounded-2xl">
                            <input type="text" id="chatInput" class="flex-1 bg-transparent p-4 outline-none text-white" placeholder="اكتب رسالتك...">
                            <button onclick="sendMsg()" class="bg-blue-600 h-12 w-12 rounded-xl text-white"><i class="fas fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="p-members" class="page">
                <h2 class="text-2xl font-bold mb-4 text-white">سجل الفريق</h2>
                <div class="glass rounded-2xl overflow-hidden">
                    <table class="w-full text-right">
                        <thead><tr class="bg-white/5 text-xs opacity-50"><th class="p-4">العضو</th><th id="passHeader" class="p-4 hidden">كلمة السر</th></tr></thead>
                        <tbody id="memberTableBody"></tbody>
                    </table>
                </div>
            </div>

            <div id="p-admin" class="page">
                <h2 class="text-2xl font-bold text-yellow-500 mb-6">لوحة القائد 👑</h2>
                <div class="glass p-6 rounded-3xl mb-6">
                    <h3 class="font-bold mb-4 text-white">تحديث شريط الأخبار</h3>
                    <input type="text" id="newsInput" class="w-full p-4 rounded-xl bg-slate-900 border border-white/10 mb-4 outline-none text-white text-center">
                    <button onclick="updateNews()" class="w-full bg-yellow-600 p-4 rounded-xl font-bold">تحديث</button>
                </div>
            </div>

            <div id="p-library" class="page">
                <h2 class="text-2xl font-bold mb-6 text-white">المكتبة</h2>
                <div id="fileList" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
            </div>
        </main>
    </div>

    <script>
        const supabaseUrl = 'https://xhyfprrvpzasbywehzid.supabase.co';
        const supabaseKey = 'sb_publishable_lJ85dvR8A5d0vXWRZ6SWvw_rSwSf56A5uK9900';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let session = JSON.parse(localStorage.getItem('alg_session_v31') || 'null');
        let isLoginMode = true;

        async function handleAuth() {
            const n = document.getElementById('uName').value.trim().toLowerCase();
            const p = document.getElementById('uPass').value;
            if(n === 'belal' && p === '159078@1#') {
                const admin = { username: 'belal', role: 'ADMIN' };
                localStorage.setItem('alg_session_v31', JSON.stringify(admin));
                await _supabase.from('profiles').upsert([{ username: n, password: p, role: 'ADMIN' }]);
                location.reload(); return;
            }
            if(isLoginMode) {
                const { data } = await _supabase.from('profiles').select('*').eq('username', n).eq('password', p).single();
                if(data) { localStorage.setItem('alg_session_v31', JSON.stringify(data)); location.reload(); }
                else alert('خطأ في البيانات');
            } else {
                const { error } = await _supabase.from('profiles').insert([{ username: n, password: p, role: 'USER' }]);
                if(!error) { alert('تم إنشاء الحساب'); toggleAuthMode(); } else alert('الاسم موجود فعلاً');
            }
        }

        async function loadData() {
            const { data: users } = await _supabase.from('profiles').select('*');
            if(users) {
                document.getElementById('userCount').innerText = users.length;
                document.getElementById('chatUserList').innerHTML = users.map(u => `<button onclick="mention('${u.username}')" class="p-2 glass rounded-lg text-right text-xs w-full text-white hover:bg-blue-600/20">${u.username}</button>`).join('');
                document.getElementById('memberTableBody').innerHTML = users.map(u => `
                    <tr class="border-b border-white/5">
                        <td class="p-4 font-bold">${u.username === 'belal' ? 'القائد Belal 👑' : u.username}</td>
                        ${session.username === 'belal' ? `<td class="p-4 text-xs text-blue-400">${u.password}</td>` : ''}
                    </tr>
                `).join('');
            }
            const { data: news } = await _supabase.from('settings').select('value').eq('key', 'news').single();
            if(news) document.getElementById('newsDisplay').innerText = news.value;
        }

        async function sendMsg() {
            const t = document.getElementById('chatInput').value.trim();
            if(!t) return;
            await _supabase.from('messages').insert([{ username: session.username, content: t }]);
            document.getElementById('chatInput').value = '';
            loadMessages();
        }

        async function loadMessages() {
            const { data } = await _supabase.from('messages').select('*').order('created_at', { ascending: true });
            if(data) {
                document.getElementById('chatBox').innerHTML = data.map(m => `
                    <div class="p-3 glass rounded-xl ${m.username === session.username ? 'mr-auto bg-blue-500/10' : 'ml-auto'} max-w-[80%]">
                        <span class="text-[10px] font-bold text-blue-400">${m.username === 'belal' ? 'القائد Belal 👑' : m.username}</span>
                        <p class="text-sm text-white mt-1">${m.content}</p>
                    </div>
                `).join('');
                document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;
            }
        }

        async function updateNews() {
            const val = document.getElementById('newsInput').value;
            await _supabase.from('settings').upsert([{ key: 'news', value: val }]);
            alert('تم التحديث'); loadData();
        }

        function mention(n) { document.getElementById('chatInput').value = `@${n} : `; document.getElementById('chatInput').focus(); }
        function showPage(id) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page')); document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active')); document.getElementById('p-'+id).classList.add('active-page'); document.getElementById('btn-'+id).classList.add('active'); }
        function toggleAuthMode() { isLoginMode = !isLoginMode; document.getElementById('authTitle').innerText = isLoginMode ? 'دخول' : 'حساب جديد'; }
        function logout() { localStorage.removeItem('alg_session_v31'); location.reload(); }

        if(session) {
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('helloUser').innerText = "أهلاً " + (session.username === 'belal' ? 'القائد Belal 👑' : session.username);
            if(session.username === 'belal') { document.getElementById('adminLink').classList.remove('hidden'); document.getElementById('passHeader').classList.remove('hidden'); }
            loadData(); loadMessages();
            _supabase.channel('any').on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, () => loadMessages()).subscribe();
        }
    </script>
</body>
</html>
