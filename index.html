<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الخوارزمية | الاحترافية</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #060b13; --card: #0c182a; --accent: #2c6bed; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: #c0c9d6; margin: 0; overflow: hidden; display: flex; flex-direction: column; }
        .glass { background: var(--card); border: 1px solid rgba(255,255,255,0.05); }
        .page { display: none; flex: 1; padding: 1.5rem; overflow-y: auto; height: calc(100vh - 75px); }
        .active-page { display: flex; flex-direction: column; }
        
        /* ضبط الشاشات (موبايل + كمبيوتر) */
        @media (min-width: 1024px) {
            body { flex-direction: row-reverse; }
            .sidebar { width: 280px; height: 100vh; display: flex !important; flex-direction: column; border-left: 1px solid #1a2c4e; }
            .bottom-nav { display: none !important; }
            .page { height: 100vh; padding: 2.5rem; margin-right: 280px; }
        }
        @media (max-width: 1023px) {
            .sidebar { display: none; }
            .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 75px; display: flex; justify-content: space-around; align-items: center; background: var(--card); z-index: 1000; border-top: 1px solid #1a2c4e; }
        }
        .active { color: var(--accent) !important; }
    </style>
</head>
<body>

    <div id="authPage" class="fixed inset-0 z-[2000] bg-[#060b13] flex items-center justify-center p-6 text-right">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-sm border-blue-500/20 border shadow-2xl">
            <h2 class="text-2xl font-bold mb-6 text-center text-white">منصة الخوارزمية</h2>
            <div class="space-y-4">
                <div>
                    <label class="block mb-2 text-sm">اسم المستخدم</label>
                    <input type="text" id="username" placeholder="اكتب اسمك هنا" class="w-full p-4 rounded-2xl bg-slate-900 border border-slate-700 outline-none text-white text-right">
                </div>
                <div>
                    <label class="block mb-2 text-sm">كلمة السر</label>
                    <input type="password" id="password" placeholder="كلمة السر" class="w-full p-4 rounded-2xl bg-slate-900 border border-slate-700 outline-none text-white text-right">
                </div>
                <button onclick="login()" class="w-full bg-blue-600 p-4 rounded-2xl font-bold text-white shadow-lg shadow-blue-900/20">دخول</button>
                <button onclick="register()" class="w-full bg-slate-800 p-3 rounded-2xl font-bold text-white text-sm">إنشاء حساب جديد</button>
            </div>
        </div>
    </div>

    <aside class="sidebar glass fixed right-0 top-0">
        <div class="p-8 text-blue-500 font-bold text-xl"><i class="fas fa-terminal ml-2"></i> الخوارزمية</div>
        <nav class="flex-1">
            <div onclick="showPage('dashboard')" id="nav-dashboard" class="p-4 m-2 rounded-xl cursor-pointer active"><i class="fas fa-home ml-3"></i>الرئيسية</div>
            <div onclick="showPage('library')" id="nav-library" class="p-4 m-2 rounded-xl cursor-pointer"><i class="fas fa-book ml-3"></i>المكتبة</div>
        </nav>
        <button onclick="logout()" class="p-8 text-red-500 text-right"><i class="fas fa-sign-out-alt"></i> خروج</button>
    </aside>

    <main class="flex-1">
        <div id="p-dashboard" class="page active-page">
            <h2 class="text-2xl font-bold mb-6" id="welcomeMsg">أهلاً بك</h2>
            <div class="glass p-8 rounded-3xl border-r-4 border-blue-600">
                <p class="text-slate-500">مشروعك الآن يعمل بنظام **Supabase** السحابي.</p>
                <p class="text-xs mt-4 opacity-50 italic">لا تقلق، مشكلة الذاكرة (Out of Memory) انتهت للأبد.</p>
            </div>
        </div>

        <div id="p-library" class="page">
            <div class="flex justify-between items-center mb-6 text-right">
                <h2 class="text-xl font-bold">المكتبة السحابية</h2>
                <button onclick="document.getElementById('fileInp').click()" class="bg-blue-600 px-6 py-2 rounded-xl text-sm font-bold">رفع ملف +</button>
                <input type="file" id="fileInp" class="hidden" onchange="uploadFile(this)">
            </div>
            <div id="libraryList" class="space-y-3"></div>
        </div>
    </main>

    <nav class="bottom-nav">
        <div onclick="showPage('dashboard')" class="active" id="b-dashboard"><i class="fas fa-home text-xl"></i></div>
        <div onclick="showPage('library')" id="b-library"><i class="fas fa-book text-xl"></i></div>
    </nav>

    <script>
        // 1. ضع هنا بياناتك من صورة الـ API
        const URL = 'رابط_المشروع_هنا'; 
        const KEY = 'مفتاح_ANON_هنا';

        const _supabase = supabase.createClient(URL, KEY);

        // وظائف الدخول (بتحويل الاسم لبريد وهمي داخلياً)
        async function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            if(!user || !pass) return alert("اكتب الاسم والباسورد");

            const fakeEmail = `${user}@algo.com`;
            const { error } = await _supabase.auth.signInWithPassword({ email: fakeEmail, password: pass });
            if(error) alert("خطأ: تأكد من الاسم والباسورد");
        }

        async function register() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            if(!user || pass.length < 6) return alert("الاسم مطلوب والباسورد لا يقل عن 6 أرقام");

            const fakeEmail = `${user}@algo.com`;
            const { error } = await _supabase.auth.signUp({ email: fakeEmail, password: pass });
            if(error) alert("فشل الإنشاء: " + error.message);
            else alert("تم إنشاء حسابك باسم: " + user);
        }

        function logout() { _supabase.auth.signOut(); }

        // نظام المكتبة السحابي
        async function uploadFile(input) {
            const file = input.files[0];
            if(!file) return;
            
            const fileName = `${Date.now()}_${file.name}`;
            alert("جاري الرفع للسحاب...");

            // الرفع للمخزن الذي أنشأته (files)
            const { data, error } = await _supabase.storage.from('files').upload(fileName, file);
            if(error) return alert("خطأ رفع: " + error.message);

            const { data: urlData } = _supabase.storage.from('files').getPublicUrl(fileName);
            await _supabase.from('library_files').insert([{ name: file.name, url: urlData.publicUrl }]);
            
            alert("تم الرفع بنجاح!");
            renderLibrary();
        }

        async function renderLibrary() {
            const list = document.getElementById('libraryList');
            const { data, error } = await _supabase.from('library_files').select('*').order('created_at', {ascending: false});
            
            if(data) {
                list.innerHTML = data.map(f => `
                    <div class="glass p-4 rounded-2xl flex justify-between items-center">
                        <span class="truncate ml-4 text-sm font-bold text-white">${f.name}</span>
                        <a href="${f.url}" target="_blank" class="text-blue-400 bg-blue-400/10 p-2 px-4 rounded-lg text-xs">تحميل</a>
                    </div>
                `).join('');
            }
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById('p-' + id).classList.add('active-page');
            document.querySelectorAll('.sidebar div, .bottom-nav div').forEach(el => el.classList.remove('active'));
            document.getElementById('nav-'+id)?.classList.add('active');
            document.getElementById('b-'+id)?.classList.add('active');
            if (id === 'library') renderLibrary();
        }

        // مراقبة الدخول
        _supabase.auth.onAuthStateChange((event, session) => {
            if (session) {
                document.getElementById('authPage').style.display = 'none';
                document.getElementById('welcomeMsg').innerText = "أهلاً يا بطل: " + session.user.email.split('@')[0];
            } else {
                document.getElementById('authPage').style.display = 'flex';
            }
        });
    </script>
</body>
</html>
