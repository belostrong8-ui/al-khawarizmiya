<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الخوارزمية - V13.0 Stable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #020617; --card: #0f172a; --text: #f8fafc; --accent: #3b82f6; }
        .light-mode { --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --accent: #2563eb; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); height: 100vh; overflow: hidden; margin: 0; transition: 0.3s; }
        .glass { background: var(--card); border: 1px solid rgba(128,128,128,0.2); }
        .page { display: none; height: 100%; flex-direction: column; padding: 1.5rem; overflow-y: auto; }
        .active-page { display: flex; }
        .sidebar-btn { width: 100%; text-align: right; padding: 0.8rem; border-radius: 0.8rem; display: flex; align-items: center; gap: 0.8rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .sidebar-btn:hover, .sidebar-btn.active { background: var(--accent); color: white; }
        .news-banner { background: linear-gradient(90deg, #1e3a8a, #3b82f6); padding: 10px; border-radius: 15px; margin-bottom: 20px; overflow: hidden; height: 45px; }
        .news-scroll { display: inline-block; white-space: nowrap; animation: scrollText 15s linear infinite; }
        @keyframes scrollText { 0% { transform: translateX(100%); } 100% { transform: translateX(-150%); } }
        .user-chip { padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; cursor: pointer; border: 1px solid rgba(128,128,128,0.3); transition: 0.2s; background: rgba(128,128,128,0.05); }
        .user-chip:hover { background: var(--accent); color: white; }
    </style>
</head>
<body class="flex">

    <div id="authPage" class="fixed inset-0 z-[500] bg-slate-950 flex items-center justify-center p-4 text-center">
        <div class="glass p-8 rounded-[2rem] w-full max-w-md border-blue-500/50 border shadow-2xl">
            <h2 id="authTitle" class="text-2xl font-bold mb-6 text-blue-500">دخول الخوارزمية</h2>
            <div class="space-y-4">
                <input type="text" id="uName" placeholder="اسم المستخدم" class="w-full p-4 rounded-xl text-center bg-slate-900 border border-white/10 outline-none text-white">
                <input type="password" id="uPass" placeholder="كلمة السر" class="w-full p-4 rounded-xl text-center bg-slate-900 border border-white/10 outline-none text-white">
                <button onclick="handleAuth()" class="w-full bg-blue-600 p-4 rounded-xl font-bold hover:bg-blue-700">دخول</button>
                <button onclick="toggleAuthMode()" class="text-blue-400 text-xs mt-2 underline block mx-auto">إنشاء حساب جديد</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden flex w-full h-full">
        <aside class="w-64 glass flex flex-col p-4 border-l border-white/10">
            <div class="mb-8 px-2 flex items-center gap-3"><i class="fas fa-terminal text-2xl text-blue-500"></i><h1 class="font-bold text-xl">الخوارزمية</h1></div>
            <nav class="flex-1 space-y-1">
                <button onclick="showPage('dashboard')" id="btn-dashboard" class="sidebar-btn active"><i class="fas fa-home"></i> الرئيسية</button>
                <button onclick="showPage('chat')" id="btn-chat" class="sidebar-btn"><i class="fas fa-comments"></i> المحادثة</button>
                <button onclick="showPage('library')" id="btn-library" class="sidebar-btn"><i class="fas fa-book"></i> المكتبة</button>
                <button onclick="showPage('members')" id="btn-members" class="sidebar-btn"><i class="fas fa-users"></i> الأعضاء</button>
                <button id="adminLink" onclick="showPage('admin')" class="hidden sidebar-btn text-yellow-500"><i class="fas fa-crown"></i> لوحة القائد</button>
            </nav>
            <div class="mt-auto space-y-2 pt-4 border-t border-white/10">
                <button onclick="toggleTheme()" class="sidebar-btn text-xs"><i class="fas fa-adjust"></i> تبديل المود</button>
                <button onclick="requestNotify()" id="notifBtn" class="sidebar-btn text-xs text-green-400"><i class="fas fa-bell"></i> تفعيل الإشعارات</button>
                <button onclick="logout()" class="w-full p-2 bg-red-500/10 text-red-500 rounded-xl font-bold">خروج</button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <div id="p-dashboard" class="page active-page">
                <div class="news-banner"><div id="newsScroll" class="news-scroll text-white font-bold">جاري مزامنة بيانات الخوارزمية...</div></div>
                <h2 id="helloUser" class="text-3xl font-bold mb-8"></h2>
                <div class="glass p-8 rounded-3xl border-r-8 border-blue-500 w-fit shadow-lg text-center"><p class="opacity-60 mb-2 font-bold uppercase">قوة الفريق</p><p id="userCount" class="text-6xl font-black">0</p></div>
            </div>

            <div id="p-chat" class="page">
                <div class="flex flex-col h-full overflow-hidden">
                    <div id="chatUserList" class="flex gap-2 p-2 overflow-x-auto mb-2 border-b border-white/5 scrollbar-hide">
                        </div>
                    <div id="chatBox" class="flex-1 glass rounded-2xl p-4 mb-4 overflow-y-auto flex flex-col gap-3"></div>
                    <div class="flex gap-2 bg-slate-900/50 p-2 rounded-2xl border border-white/5">
                        <input type="file" id="chatFileInput" class="hidden" onchange="sendChatFile()">
                        <button onclick="document.getElementById('chatFileInput').click()" class="text-blue-400 px-3"><i class="fas fa-paperclip"></i></button>
                        <input type="text" id="chatInput" class="flex-1 bg-transparent p-2 outline-none text-white text-sm" placeholder="اكتب رسالة...">
                        <button onclick="sendMsg()" class="bg-blue-600 px-6 py-2 rounded-xl text-white"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>

            <div id="p-library" class="page">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">مكتبة الملفات</h2>
                    <div id="adminLib" class="hidden"><input type="file" id="libFileInput" class="hidden" onchange="uploadToLibrary()"><button onclick="document.getElementById('libFileInput').click()" class="bg-blue-600 px-4 py-2 rounded-lg font-bold">إضافة ملف</button></div>
                </div>
                <div id="libraryList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>

            <div id="p-members" class="page">
                <h2 class="text-2xl font-bold mb-4">أعضاء الفريق</h2>
                <div class="glass rounded-2xl overflow-hidden shadow-xl"><table class="w-full text-right"><tbody id="memberTableBody"></tbody></table></div>
            </div>

            <div id="p-admin" class="page">
                <h2 class="text-2xl font-bold text-yellow-500 mb-6 font-black text-center">لوحة القائد بلال 👑</h2>
                <div class="glass p-6 rounded-2xl border-yellow-500/20 border text-center">
                    <h3 class="font-bold mb-2">تحديث الأخبار:</h3>
                    <input type="text" id="newsInput" class="w-full p-4 bg-slate-800 rounded-xl mb-4 outline-none text-white text-center" placeholder="اكتب الخبر الجديد...">
                    <button onclick="setGlobalNews()" class="bg-yellow-600 px-8 py-3 rounded-xl font-bold text-white">نشر فوري</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        const supabaseUrl = 'https://xhyfprrvpzasbywehzid.supabase.co';
        const supabaseKey = 'sb_publishable_lJ85dVr8A5dOvXWRZ6SWvw_rSwSfp1J';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);
        let currentUser = null; let isLoginMode = true;

        window.onload = () => {
            const saved = localStorage.getItem('algo_user');
            if(saved) { currentUser = JSON.parse(saved); loginSuccess(); }
            if(localStorage.getItem('algo_theme') === 'light') document.body.classList.add('light-mode');
        };

        async function handleAuth() {
            const n = document.getElementById('uName').value.trim().toLowerCase();
            const p = document.getElementById('uPass').value;
            if(isLoginMode) {
                const { data } = await _supabase.from('profiles').select('*').eq('username', n).eq('password', p).single();
                if(data) { currentUser = data; localStorage.setItem('algo_user', JSON.stringify(data)); loginSuccess(); } else alert('خطأ!');
            } else {
                await _supabase.from('profiles').insert([{ username: n, password: p, role: 'USER' }]);
                alert('تم إنشاء الحساب!'); location.reload();
            }
        }

        function loginSuccess() {
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            if(currentUser.username === 'belal') { document.getElementById('adminLink').classList.remove('hidden'); document.getElementById('adminLib').classList.remove('hidden'); }
            initApp();
        }

        function initApp() {
            updateUI();
            _supabase.channel('room').on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, () => updateUI())
                                    .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => updateUI()).subscribe();
        }

        async function updateUI() {
            if(!currentUser) return;
            document.getElementById('helloUser').innerText = `أهلاً ${currentUser.username === 'belal' ? 'بالقائد بلال 👑' : currentUser.username}`;
            
            const { data: users } = await _supabase.from('profiles').select('*');
            if(users) {
                document.getElementById('userCount').innerText = users.length;
                document.getElementById('memberTableBody').innerHTML = users.map(u => `<tr class="border-b border-white/5"><td class="p-4 font-bold">${u.username}</td><td class="p-4 text-left">${currentUser.username === 'belal' && u.username !== 'belal' ? `<button onclick="deleteUser(${u.id})" class="text-red-500">طرد</button>` : ''}</td></tr>`).join('');
                // تحديث قائمة المنشن في الشات
                document.getElementById('chatUserList').innerHTML = users.map(u => `<div onclick="mention('${u.username}')" class="user-chip">@${u.username}</div>`).join('');
            }

            const { data: msgs } = await _supabase.from('messages').select('*').order('created_at', { ascending: false });
            if(msgs) {
                const news = msgs.find(m => m.content.startsWith('SYS_NEWS:'));
                if(news) document.getElementById('newsScroll').innerText = news.content.replace('SYS_NEWS:', '');

                // تحديث الشات
                document.getElementById('chatBox').innerHTML = msgs.filter(m => !m.content.startsWith('SYS_NEWS:') && !m.content.startsWith('LIB_FILE:')).reverse().map(m => {
                    let c = m.content.startsWith('CHAT_FILE:') ? `<div class="p-2 bg-white/5 rounded-lg border border-white/10 flex items-center gap-2" onclick="window.open('${m.content.split('|')[1]}', '_blank')"><i class="fas fa-file text-blue-400"></i><span class="text-xs truncate">${m.content.split('|')[2]}</span></div>` : `<p class="text-sm">${m.content}</p>`;
                    const isMy = m.username === currentUser.username;
                    return `<div class="p-3 glass rounded-xl ${isMy ? 'mr-auto bg-blue-500/20' : 'ml-auto'} max-w-[80%] relative group">
                        <span class="text-[10px] text-blue-400 font-bold">${m.username}</span>${c}
                        ${isMy ? `<button onclick="deleteMsg(${m.id})" class="absolute -top-2 -right-2 bg-red-600 text-white w-5 h-5 rounded-full text-[10px] hidden group-hover:block"><i class="fas fa-times"></i></button>` : ''}
                    </div>`;
                }).join('');
                document.getElementById('chatBox').scrollTop = document.getElementById('chatBox').scrollHeight;

                // تحديث المكتبة
                const libFiles = msgs.filter(m => m.content.startsWith('LIB_FILE:'));
                document.getElementById('libraryList').innerHTML = libFiles.map(f => {
                    const [mime, url, name] = f.content.replace('LIB_FILE:', '').split('|');
                    return `<div class="glass p-4 rounded-xl flex flex-col gap-3 border border-white/5 shadow-md">
                        <div class="flex items-center gap-3"><i class="fas fa-file-pdf text-2xl text-red-500"></i><span class="text-sm font-bold truncate">${name}</span></div>
                        <div class="flex gap-2"><button onclick="window.open('${url}', '_blank')" class="flex-1 bg-blue-600 text-white py-2 rounded-lg text-xs font-bold">تحميل</button>
                        ${currentUser.username === 'belal' ? `<button onclick="deleteMsg(${f.id})" class="bg-red-500/20 text-red-500 px-3 rounded-lg"><i class="fas fa-trash"></i></button>` : ''}</div>
                    </div>`;
                }).join('');
            }
        }

        async function uploadToLibrary() {
            const f = document.getElementById('libFileInput').files[0]; if(!f) return;
            const r = new FileReader(); r.onload = async (e) => { await _supabase.from('messages').insert([{ username: 'SYSTEM', content: `LIB_FILE:${f.type}|${e.target.result}|${f.name}` }]); }; r.readAsDataURL(f);
        }

        async function sendChatFile() {
            const f = document.getElementById('chatFileInput').files[0]; if(!f) return;
            const r = new FileReader(); r.onload = async (e) => { await _supabase.from('messages').insert([{ username: currentUser.username, content: `CHAT_FILE:${f.type}|${e.target.result}|${f.name}` }]); }; r.readAsDataURL(f);
        }

        async function setGlobalNews() { const v = document.getElementById('newsInput').value; if(v) await _supabase.from('messages').insert([{ username: 'SYSTEM', content: `SYS_NEWS:${v}` }]); document.getElementById('newsInput').value = ''; }
        async function deleteMsg(id) { if(confirm('حذف؟')) await _supabase.from('messages').delete().eq('id', id); }
        async function deleteUser(id) { if(confirm('طرد؟')) await _supabase.from('profiles').delete().eq('id', id); }
        async function sendMsg() { const t = document.getElementById('chatInput').value.trim(); if(t) await _supabase.from('messages').insert([{ username: currentUser.username, content: t }]); document.getElementById('chatInput').value = ''; }
        function mention(n) { document.getElementById('chatInput').value += `@${n} `; document.getElementById('chatInput').focus(); }
        function showPage(id) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page')); document.getElementById('p-'+id).classList.add('active-page'); document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active')); document.getElementById('btn-'+id).classList.add('active'); }
        function logout() { localStorage.removeItem('algo_user'); location.reload(); }
        function toggleTheme() { document.body.classList.toggle('light-mode'); localStorage.setItem('algo_theme', document.body.classList.contains('light-mode') ? 'light' : 'dark'); }
        function requestNotify() { Notification.requestPermission().then(p => { if(p === 'granted') { new Notification("الخوارزمية", { body: "الإشعارات مفعلة ✅" }); document.getElementById('notifBtn').innerText = "تم التفعيل ✅"; } }); }
        function toggleAuthMode() { isLoginMode = !isLoginMode; document.getElementById('authTitle').innerText = isLoginMode ? 'دخول الخوارزمية' : 'حساب جديد'; }
    </script>
</body>
</html>
