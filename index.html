<!DOCTYPE html>
<html lang="en" dir="ltr"> <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="tabTitle">Algorithm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #020617; --card: #0f172a; --text: #f8fafc; --accent: #3b82f6; }
        .light-mode { --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --accent: #2563eb; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); transition: 0.3s; overflow: hidden; height: 100vh; margin: 0; }
        .glass { background: var(--card); border: 1px solid rgba(255,255,255,0.05); }
        .page { display: none; height: 100%; flex-direction: column; overflow-y: auto; padding: 1.5rem; }
        .active-page { display: flex; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .news-ticker { background: rgba(59, 130, 246, 0.1); height: 45px; display: flex; align-items: center; overflow: hidden; border-bottom: 1px solid rgba(59, 130, 246, 0.2); }
        .news-label { background: #3b82f6; color: white; padding: 0 15px; height: 100%; display: flex; align-items: center; font-weight: bold; font-size: 13px; z-index: 10; }
        .news-content { display: inline-block; animation: marquee 20s linear infinite; white-space: nowrap; padding-right: 50px; font-size: 14px; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        .sidebar-btn { width: 100%; text-align: left; padding: 0.8rem; border-radius: 1rem; display: flex; align-items: center; gap: 1rem; font-weight: bold; transition: 0.2s; cursor: pointer; }
        .sidebar-btn:hover { background: rgba(59, 130, 246, 0.1); color: var(--accent); }
        .msg-bubble { max-width: 85%; padding: 10px; border-radius: 15px; position: relative; }
        .my-msg { background: var(--accent); color: white; align-self: flex-start; border-bottom-right-radius: 4px; }
        .their-msg { background: rgba(255,255,255,0.08); align-self: flex-end; border-bottom-left-radius: 4px; }
        .del-btn { opacity: 0; transition: 0.2s; position: absolute; top: -5px; right: -5px; background: #ef4444; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; cursor: pointer; z-index: 20; }
        .msg-bubble:hover .del-btn { opacity: 1; }
        .chat-img { max-width: 100%; border-radius: 10px; margin-top: 5px; cursor: pointer; }
        audio { height: 35px; width: 220px; margin-top: 5px; filter: invert(1); }
        .logo-area:hover { transform: scale(1.05); transition: 0.3s; }
    </style>
</head>
<body class="flex">

    <div id="authPage" class="fixed inset-0 z-[200] bg-slate-950 flex items-center justify-center p-4">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-md text-center border-blue-500/20 border shadow-2xl">
            <i class="fas fa-user-shield text-5xl text-blue-500 mb-6"></i>
            <h2 id="authTitle" class="text-3xl font-bold mb-8 lang-txt" data-ar="الخوارزمية" data-en="Algorithm">Algorithm</h2>
            <div id="authForms">
                <input type="text" id="uName" placeholder="Username" class="w-full p-4 mb-4 rounded-2xl bg-black/40 border border-white/10 outline-none text-center">
                <input type="password" id="uPass" placeholder="Password" class="w-full p-4 mb-6 rounded-2xl bg-black/40 border border-white/10 outline-none text-center">
                <div id="loginBox">
                    <button onclick="login()" class="w-full bg-blue-600 p-4 rounded-2xl font-bold text-xl hover:bg-blue-700 transition lang-txt" data-ar="دخول" data-en="Login">Login</button>
                    <p class="mt-4 text-sm text-slate-400"><span class="lang-txt" data-ar="ليس لديك حساب؟" data-en="Don't have an account?">Don't have an account?</span> <a href="#" onclick="toggleAuth(true)" class="text-blue-500 font-bold lang-txt" data-ar="سجل الآن" data-en="Register Now">Register Now</a></p>
                </div>
                <div id="registerBox" class="hidden">
                    <button onclick="register()" class="w-full bg-green-600 p-4 rounded-2xl font-bold text-xl hover:bg-green-700 transition lang-txt" data-ar="إنشاء حساب" data-en="Create Account">Create Account</button>
                    <p class="mt-4 text-sm text-slate-400"><span class="lang-txt" data-ar="لديك حساب بالفعل؟" data-en="Already have an account?">Already have an account?</span> <a href="#" onclick="toggleAuth(false)" class="text-blue-500 font-bold lang-txt" data-ar="دخول" data-en="Login">Login</a></p>
                </div>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden flex w-full h-full">
        <aside class="w-64 glass flex flex-col p-5 shadow-2xl border-r border-white/5">
            <div class="mb-10 text-center cursor-pointer logo-area" onclick="showPage('dashboard')">
                <div class="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center text-white text-2xl mx-auto mb-2 shadow-lg shadow-blue-500/20"><i class="fas fa-terminal"></i></div>
                <h1 class="font-bold text-lg lang-txt" data-ar="الخوارزمية" data-en="Algorithm">Algorithm</h1>
            </div>
            
            <nav class="space-y-2 flex-1">
                <button onclick="showPage('dashboard')" class="sidebar-btn"><i class="fas fa-home text-blue-500"></i> <span class="lang-txt" data-ar="الرئيسية" data-en="Home">Home</span></button>
                <button onclick="showPage('chat')" class="sidebar-btn"><i class="fas fa-comments text-green-500"></i> <span class="lang-txt" data-ar="المراسلات" data-en="Chat">Chat</span></button>
                <button onclick="showPage('library')" class="sidebar-btn"><i class="fas fa-book text-red-500"></i> <span class="lang-txt" data-ar="المكتبة" data-en="Library">Library</span></button>
                <button id="adminLink" onclick="showPage('admin')" class="hidden sidebar-btn border border-yellow-500/20 text-yellow-500 mt-4"><i class="fas fa-crown"></i> <span class="lang-txt" data-ar="لوحة القائد" data-en="Leader Panel">Leader Panel</span></button>
            </nav>

            <div class="pt-4 border-t border-white/10 space-y-2">
                <button onclick="toggleLang()" class="w-full p-3 rounded-xl glass text-xs font-bold flex items-center justify-center gap-2"><i class="fas fa-language"></i> <span id="langBtn">العربية</span></button>
                <button onclick="toggleTheme()" class="w-full p-3 rounded-xl glass text-xs font-bold flex items-center justify-center gap-2"><i class="fas fa-moon"></i> <span class="lang-txt" data-ar="المظهر" data-en="Theme">Theme</span></button>
                <button onclick="logout()" class="w-full p-3 rounded-xl bg-red-500/10 text-red-500 font-bold"><i class="fas fa-sign-out-alt"></i> <span class="lang-txt" data-ar="خروج" data-en="Logout">Logout</span></button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <div class="news-ticker">
                <div class="news-label lang-txt" data-ar="آخر الأخبار" data-en="News">News</div>
                <div class="news-content" id="tickerText">Welcome to Algorithm Platform.. Secure System</div>
            </div>

            <div class="flex-1 relative">
                <div id="p-dashboard" class="page active-page">
                    <h2 id="welcomeHead" class="text-3xl font-bold mb-8 text-blue-500"></h2>
                    <div class="grid grid-cols-2 gap-6">
                        <div class="glass p-8 rounded-3xl border-l-4 border-blue-600 shadow-xl">
                            <h3 class="opacity-50 text-sm lang-txt" data-ar="أعضاء الموقع" data-en="Site Members">Site Members</h3>
                            <p id="sUsers" class="text-5xl font-bold">0</p>
                        </div>
                        <div class="glass p-8 rounded-3xl border-l-4 border-red-600 shadow-xl">
                            <h3 class="opacity-50 text-sm lang-txt" data-ar="الملفات المرفوعة" data-en="Uploaded Files">Uploaded Files</h3>
                            <p id="sFiles" class="text-5xl font-bold">0</p>
                        </div>
                    </div>
                </div>

                <div id="p-chat" class="page flex-row gap-6 p-4">
                    <div class="w-1/3 glass rounded-3xl p-4 flex flex-col shadow-xl">
                        <h4 class="font-bold border-b border-white/5 pb-2 mb-4 text-xs opacity-50 lang-txt" data-ar="الأعضاء" data-en="Members">Members</h4>
                        <div id="uList" class="space-y-2 overflow-y-auto"></div>
                    </div>
                    <div class="flex-1 glass rounded-3xl flex flex-col overflow-hidden shadow-xl">
                        <div id="chatHeader" class="p-3 bg-white/5 border-b border-white/5 font-bold text-center text-sm">Choose a member...</div>
                        <div id="mBox" class="flex-1 p-4 overflow-y-auto flex flex-col gap-3"></div>
                        <div id="chatInputArea" class="p-4 border-t border-white/5 hidden flex gap-3 items-center">
                            <label class="cursor-pointer text-slate-400 hover:text-blue-500 transition">
                                <i class="fas fa-paperclip text-xl"></i>
                                <input type="file" id="chatFile" class="hidden" onchange="handleFile(this)">
                            </label>
                            <input type="text" id="msgIn" class="flex-1 bg-black/20 p-4 rounded-2xl outline-none" placeholder="Type here...">
                            <button onclick="send()" class="bg-blue-600 w-12 h-12 rounded-2xl shadow-lg"><i class="fas fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>

                <div id="p-library" class="page">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold lang-txt" data-ar="المكتبة الرقمية" data-en="Digital Library">Digital Library</h2>
                        <div id="adminUp" class="hidden"><label class="bg-blue-600 px-5 py-2 rounded-xl cursor-pointer font-bold">Upload PDF <input type="file" onchange="uploadToLib(this)" class="hidden"></label></div>
                    </div>
                    <div id="lGrid" class="grid grid-cols-3 gap-6"></div>
                </div>

                <div id="p-admin" class="page">
                    <h2 class="text-2xl font-bold mb-6 text-yellow-500">Leader Panel</h2>
                    <table class="w-full text-left glass rounded-2xl overflow-hidden shadow-2xl">
                        <thead class="bg-blue-600/20"><tr><th class="p-4 text-sm">User</th><th class="p-4 text-sm">Pass</th><th class="p-4 text-sm">Action</th></tr></thead>
                        <tbody id="aTable"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        let users = JSON.parse(localStorage.getItem('alg_users') || '[]');
        let files = JSON.parse(localStorage.getItem('alg_lib') || '[]');
        let chats = JSON.parse(localStorage.getItem('alg_chats') || '[]');
        let session = JSON.parse(localStorage.getItem('alg_session') || 'null');
        let lang = 'en'; // خليتها تبدأ إنجليزي بناءً على طلبك
        let target = null;

        document.getElementById('msgIn')?.addEventListener('keypress', (e) => { if(e.key==='Enter') send(); });

        function toggleAuth(isReg) {
            document.getElementById('loginBox').classList.toggle('hidden', isReg);
            document.getElementById('registerBox').classList.toggle('hidden', !isReg);
        }

        function register() {
            const n = document.getElementById('uName').value.trim();
            const p = document.getElementById('uPass').value;
            if(!n || !p) return alert("Fill data!");
            if(users.find(u=>u.name===n) || n.toLowerCase()==='belal') return alert("Name exists!");
            users.push({name: n, pass: p, role: 'USER'});
            localStorage.setItem('alg_users', JSON.stringify(users));
            alert("Success! Now login.");
            toggleAuth(false);
        }

        function login() {
            const n = document.getElementById('uName').value.trim();
            const p = document.getElementById('uPass').value;
            let found = (n.toLowerCase()==='belal' && p==='159078@1#') ? {name:'Belal',role:'ADMIN'} : users.find(u=>u.name===n && u.pass===p);
            if(found) { localStorage.setItem('alg_session', JSON.stringify(found)); location.reload(); }
            else alert("Error!");
        }

        function toggleLang() {
            lang = lang === 'ar' ? 'en' : 'ar';
            document.body.dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.getElementById('langBtn').innerText = lang === 'ar' ? 'English' : 'العربية';
            document.getElementById('tabTitle').innerText = lang === 'ar' ? 'الخوارزمية' : 'Algorithm';
            document.querySelectorAll('.lang-txt').forEach(el => el.innerText = el.getAttribute('data-'+lang));
            updateWelcome();
        }

        function updateWelcome() {
            if(!session) return;
            const msg = lang === 'ar' ? 'أهلاً يا ' : 'Welcome, ';
            document.getElementById('welcomeHead').innerText = msg + session.name;
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p=>p.classList.remove('active-page'));
            document.getElementById('p-'+id).classList.add('active-page');
            if(id==='chat') renderUsers();
            if(id==='admin') renderAdmin();
        }

        function handleFile(input) {
            const f = input.files[0]; if(!f) return;
            const r = new FileReader();
            r.onload = (e) => {
                let type = 'file';
                if(f.type.startsWith('image/')) type = 'image';
                else if(f.type.startsWith('audio/')) type = 'audio';
                saveMsg({type, content: e.target.result, fileName: f.name});
            };
            r.readAsDataURL(f);
        }

        function send() {
            const v = document.getElementById('msgIn').value.trim();
            if(!v) return;
            saveMsg({type:'text', content: v});
            document.getElementById('msgIn').value = "";
        }

        function saveMsg(data) {
            chats.push({id: Date.now(), f: session.name, t: target, ...data});
            localStorage.setItem('alg_chats', JSON.stringify(chats));
            renderMsgs();
        }

        function deleteMsg(id) {
            chats = chats.filter(c => c.id !== id);
            localStorage.setItem('alg_chats', JSON.stringify(chats));
            renderMsgs();
        }

        function renderMsgs() {
            const b = document.getElementById('mBox');
            const filtered = chats.filter(c=>(c.f===session.name && c.t===target)||(c.f===target && c.t===session.name));
            b.innerHTML = filtered.map(m=>`
                <div class="flex flex-col ${m.f===session.name?'items-start':'items-end'}">
                    <div class="msg-bubble ${m.f===session.name?'my-msg':'their-msg'}">
                        ${m.f===session.name?`<div class="del-btn" onclick="deleteMsg(${m.id})"><i class="fas fa-times"></i></div>`:''}
                        ${m.type==='text'?`<p class="text-sm">${m.content}</p>` : m.type==='image'?`<img src="${m.content}" class="chat-img" onclick="window.open(this.src)">` : m.type==='audio'?`<audio controls src="${m.content}"></audio>` : `<a href="${m.content}" download="${m.fileName}" class="text-xs underline font-bold"><i class="fas fa-file"></i> ${m.fileName}</a>`}
                    </div>
                </div>`).join('');
            b.scrollTop = b.scrollHeight;
        }

        function renderUsers() {
            let list = [{name:'Belal'}, ...users].filter(x=>x.name!==session.name);
            document.getElementById('uList').innerHTML = list.map(u=>`<div onclick="startC('${u.name}')" class="p-3 rounded-xl hover:bg-white/5 cursor-pointer border border-white/5 text-sm">${u.name}</div>`).join('');
        }

        function startC(n) {
            target = n;
            document.getElementById('chatHeader').innerText = (lang==='ar'?'Chat with: ':'Chat with: ') + n;
            document.getElementById('chatInputArea').classList.remove('hidden');
            renderMsgs();
        }

        function renderAdmin() { document.getElementById('aTable').innerHTML = users.map((u,i)=>`<tr><td class="p-4 text-sm">${u.name}</td><td class="p-4 text-yellow-500 font-mono text-sm">${u.pass}</td><td class="p-4"><button onclick="delU(${i})" class="text-red-500"><i class="fas fa-trash-alt"></i></button></td></tr>`).join(''); }
        function delU(i) { users.splice(i,1); localStorage.setItem('alg_users', JSON.stringify(users)); renderAdmin(); }
        function toggleTheme() { document.body.classList.toggle('light-mode'); }
        function logout() { localStorage.removeItem('alg_session'); location.reload(); }
        function uploadToLib(i) { const f=i.files[0]; const r=new FileReader(); r.onload=(e)=>{files.push({n:f.name, d:e.target.result}); localStorage.setItem('alg_lib', JSON.stringify(files)); location.reload();}; r.readAsDataURL(f); }

        if(session) {
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            updateWelcome();
            document.getElementById('sUsers').innerText = users.length + 1;
            document.getElementById('sFiles').innerText = files.length;
            document.getElementById('tickerText').innerText = localStorage.getItem('alg_tick') || "Welcome to Algorithm!";
            if(session.role==='ADMIN') { document.getElementById('adminLink').classList.remove('hidden'); document.getElementById('adminUp').classList.remove('hidden'); }
            document.getElementById('lGrid').innerHTML = files.map(f=>`<div class="glass p-4 rounded-2xl text-center shadow-lg"><i class="fas fa-file-pdf text-red-500 text-3xl mb-2"></i><p class="text-xs truncate">${f.n}</p><a href="${f.d}" target="_blank" class="block bg-blue-600 mt-2 rounded-lg py-1 text-xs font-bold shadow-md">Open</a></div>`).join('');
        }
    </script>
</body>
</html>
