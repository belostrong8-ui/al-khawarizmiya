<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخوارزمية - Ultimate Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #020617; --card: #0f172a; --text: #f8fafc; --accent: #3b82f6; }
        .light-mode { --bg: #f1f5f9; --card: #ffffff; --text: #0f172a; --accent: #2563eb; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); transition: 0.3s; height: 100vh; margin: 0; overflow: hidden; }
        .glass { background: var(--card); border: 1px solid rgba(255,255,255,0.05); }
        .page { display: none; height: 100%; flex-direction: column; overflow-y: auto; padding: 2rem; }
        .active-page { display: flex; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .sidebar-btn { width: 100%; text-align: right; padding: 1rem; border-radius: 1.2rem; display: flex; align-items: center; gap: 1rem; font-weight: bold; cursor: pointer; margin-bottom: 0.5rem; }
        .sidebar-btn:hover { background: rgba(59, 130, 246, 0.1); color: var(--accent); }
        .leader-badge { background: #eab308; color: #000; padding: 2px 8px; border-radius: 6px; font-size: 11px; margin-left: 8px; font-weight: 800; }
        input { background: rgba(0,0,0,0.2) !important; border: 1px solid rgba(255,255,255,0.1) !important; outline: none; }
    </style>
</head>
<body class="flex">

    <div id="authPage" class="fixed inset-0 z-[300] bg-slate-950 flex items-center justify-center p-4">
        <div class="glass p-10 rounded-[3rem] w-full max-w-md text-center border-blue-500/30 border shadow-2xl">
            <h2 class="text-3xl font-bold mb-6" id="authTitle">الخوارزمية</h2>
            <input type="text" id="uName" placeholder="اسم المستخدم" class="w-full p-4 mb-4 rounded-2xl text-center font-bold">
            <div id="passField" class="hidden mb-4">
                <input type="password" id="uPass" placeholder="كلمة السر" class="w-full p-4 rounded-2xl text-center">
            </div>
            <button onclick="handleAuth()" id="loginBtn" class="w-full bg-blue-600 p-4 rounded-2xl font-bold text-xl hover:bg-blue-700 transition">دخول</button>
            <p id="regHint" class="mt-4 text-xs text-blue-400/50 hidden">اسم جديد؟ سيتم تسجيلك كعضو فور الدخول.</p>
        </div>
    </div>

    <div id="mainApp" class="hidden flex w-full h-full">
        <aside class="w-72 glass flex flex-col p-6 border-l border-white/5 shadow-2xl">
            <div class="mb-10 flex items-center gap-3"><i class="fas fa-terminal text-blue-500"></i><h1 class="font-bold text-xl">الخوارزمية</h1></div>
            <nav class="flex-1">
                <button onclick="showPage('dashboard')" class="sidebar-btn"><i class="fas fa-home"></i> <span data-key="nav-home">الرئيسية</span></button>
                <button onclick="initChatSelection()" class="sidebar-btn"><i class="fas fa-comments"></i> <span data-key="nav-chat">المراسلات</span></button>
                <button onclick="showPage('library')" class="sidebar-btn"><i class="fas fa-book"></i> <span data-key="nav-lib">المكتبة</span></button>
                <button id="adminLink" onclick="showPage('admin')" class="hidden sidebar-btn text-yellow-500 border border-yellow-500/10"><i class="fas fa-crown"></i> <span data-key="nav-admin">لوحة القائد</span></button>
            </nav>
            <div class="pt-6 border-t border-white/5 space-y-3">
                <button onclick="toggleLang()" class="w-full p-3 glass rounded-xl text-xs font-bold"><i class="fas fa-language"></i> <span id="langLabel">English</span></button>
                <button onclick="toggleTheme()" class="w-full p-3 glass rounded-xl text-xs font-bold"><i class="fas fa-adjust"></i> <span data-key="nav-theme">المظهر</span></button>
                <button onclick="logout()" class="w-full p-3 bg-red-500/10 text-red-500 rounded-xl font-bold"><i class="fas fa-sign-out-alt"></i> <span data-key="nav-logout">خروج</span></button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <div id="p-dashboard" class="page active-page text-center">
                <div class="bg-blue-600/10 p-4 rounded-2xl mb-8 border border-blue-500/20"><marquee id="newsDisplay" class="font-bold text-blue-400">تحميل...</marquee></div>
                <h2 id="welcomeMsg" class="text-4xl font-bold mb-10"></h2>
                <div class="grid grid-cols-2 gap-6">
                    <div class="glass p-10 rounded-[2.5rem] border-r-4 border-blue-600">
                        <h3 class="opacity-50 text-sm" data-key="stat-users">الأعضاء</h3>
                        <p id="sUsersCount" class="text-5xl font-bold">0</p>
                    </div>
                    <div class="glass p-10 rounded-[2.5rem] border-r-4 border-red-600">
                        <h3 class="opacity-50 text-sm" data-key="stat-files">الملفات</h3>
                        <p id="fCount" class="text-5xl font-bold">0</p>
                    </div>
                </div>
            </div>

            <div id="p-library" class="page">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-2xl font-bold" data-key="lib-title">المكتبة الرسمية</h2>
                    <div id="uploadSection" class="hidden">
                        <input type="file" id="pdfInput" accept="application/pdf" class="hidden" onchange="uploadPDF()">
                        <button onclick="document.getElementById('pdfInput').click()" class="bg-blue-600 px-6 py-2 rounded-xl font-bold text-sm">رفع PDF</button>
                    </div>
                </div>
                <div id="fileList" class="space-y-4"></div>
            </div>

            <div id="p-chat-main" class="page">
                <div id="chatBox" class="flex-1 glass rounded-2xl p-6 mb-4 overflow-y-auto flex flex-col gap-3"></div>
                <div class="flex gap-2">
                    <input type="text" id="chatInput" class="flex-1 p-4 rounded-xl glass" placeholder="رسالتك...">
                    <button onclick="sendMsg()" class="bg-blue-600 px-8 rounded-xl"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
            
            <div id="p-admin" class="page">
                 <h2 class="text-2xl font-bold mb-6 text-yellow-500">لوحة القائد</h2>
                 <input type="text" id="newsInput" class="w-full p-4 mb-4 rounded-xl glass" placeholder="تغيير خبر اليوم...">
                 <button onclick="updateNews()" class="bg-yellow-600 w-full p-4 rounded-xl font-bold">تحديث الأخبار</button>
            </div>
        </main>
    </div>

    <script>
        let session = JSON.parse(localStorage.getItem('alg_session') || 'null');
        let registered = JSON.parse(localStorage.getItem('alg_registered') || []);
        let msgs = JSON.parse(localStorage.getItem('alg_msgs_v8') || []);
        let files = JSON.parse(localStorage.getItem('alg_files_v8') || []);
        let currentLang = localStorage.getItem('alg_lang') || 'ar';
        let customNews = localStorage.getItem('alg_news') || "أهلاً بك في عالم الخوارزمية!";

        const dict = {
            ar: { 'nav-home': 'الرئيسية', 'nav-chat': 'المراسلات', 'nav-lib': 'المكتبة', 'nav-admin': 'لوحة القائد', 'nav-theme': 'المظهر', 'nav-logout': 'خروج', 'stat-users': 'الأعضاء', 'stat-files': 'الملفات', 'lib-title': 'المكتبة الرسمية' },
            en: { 'nav-home': 'Home', 'nav-chat': 'Messages', 'nav-lib': 'Library', 'nav-admin': 'Leader Panel', 'nav-theme': 'Theme', 'nav-logout': 'Logout', 'stat-users': 'Members', 'stat-files': 'Files', 'lib-title': 'Official Library' }
        };

        document.getElementById('uName').addEventListener('input', (e) => {
            const isBelal = e.target.value.toLowerCase().trim() === 'belal';
            document.getElementById('passField').classList.toggle('hidden', !isBelal);
            document.getElementById('regHint').classList.toggle('hidden', isBelal);
        });

        function handleAuth() {
            const name = document.getElementById('uName').value.trim();
            const pass = document.getElementById('uPass').value;
            if(!name) return;

            if(name.toLowerCase() === 'belal') {
                if(pass === '159078@1#') {
                    localStorage.setItem('alg_session', JSON.stringify({name: 'Belal', role: 'ADMIN'}));
                    location.reload();
                } else { alert('كلمة سر القائد خاطئة!'); }
            } else {
                if(!registered.includes(name)) { registered.push(name); localStorage.setItem('alg_registered', JSON.stringify(registered)); }
                localStorage.setItem('alg_session', JSON.stringify({name: name, role: 'USER'}));
                location.reload();
            }
        }

        function updateUI() {
            if(!session) return;
            document.getElementById('welcomeMsg').innerText = (currentLang==='ar'?'أهلاً بك، ':'Welcome, ') + session.name;
            document.getElementById('newsDisplay').innerText = `[${session.name}] - ${customNews}`;
            if(session.role === 'ADMIN') {
                document.getElementById('adminLink').classList.remove('hidden');
                document.getElementById('uploadSection').classList.remove('hidden');
            }
            document.getElementById('sUsersCount').innerText = registered.length + 1;
            document.getElementById('langLabel').innerText = currentLang === 'ar' ? 'English' : 'العربية';
            
            document.querySelectorAll('[data-key]').forEach(el => {
                el.innerText = dict[currentLang][el.getAttribute('data-key')];
            });
            renderFiles(); renderChat();
        }

        function toggleLang() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            localStorage.setItem('alg_lang', currentLang);
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            updateUI();
        }

        function sendMsg() {
            const txt = document.getElementById('chatInput').value;
            if(!txt) return;
            msgs.push({user: session.name, text: txt, isLeader: session.role === 'ADMIN'});
            localStorage.setItem('alg_msgs_v8', JSON.stringify(msgs));
            document.getElementById('chatInput').value = ''; renderChat();
        }

        function renderChat() {
            const box = document.getElementById('chatBox');
            if(!box) return;
            box.innerHTML = msgs.map(m => `
                <div class="p-3 glass rounded-2xl ${m.user === session.name ? 'mr-auto border-r-2 border-blue-500' : 'ml-auto border-r-2 border-slate-500'}">
                    <div class="flex items-center text-[10px] font-bold mb-1">
                        ${m.isLeader ? '<span class="leader-badge">القائد</span>' : ''}
                        <span class="text-blue-400">${m.user}</span>
                    </div>
                    <p class="text-sm">${m.text}</p>
                </div>
            `).join('');
            box.scrollTop = box.scrollHeight;
        }

        function uploadPDF() {
            const f = document.getElementById('pdfInput').files[0];
            if(f) { files.push({name: f.name}); localStorage.setItem('alg_files_v8', JSON.stringify(files)); renderFiles(); }
        }

        function renderFiles() {
            const list = document.getElementById('fileList');
            list.innerHTML = files.map(f => `<div class="glass p-4 rounded-xl flex justify-between border-r-4 border-red-500"><span>${f.name}</span> <i class="fas fa-file-pdf text-red-500"></i></div>`).join('');
            document.getElementById('fCount').innerText = files.length;
        }

        function updateNews() {
            localStorage.setItem('alg_news', document.getElementById('newsInput').value);
            location.reload();
        }

        function showPage(id) { document.querySelectorAll('.page').forEach(p=>p.classList.remove('active-page')); document.getElementById('p-'+id).classList.add('active-page'); }
        function toggleTheme() { document.body.classList.toggle('light-mode'); }
        function logout() { localStorage.removeItem('alg_session'); location.reload(); }

        if(session) {
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            updateUI();
        }
    </script>
</body>
</html>
