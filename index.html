<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الخوارزمية - V30.1 Ultimate</title>
    <script src="https://tailwindcss.com"></script>
    <script src="https://jsdelivr.net"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        @import url('https://googleapis.com');
        :root { --bg: #020617; --card: #0f172a; --text: #f8fafc; --accent: #3b82f6; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); height: 100vh; overflow: hidden; margin: 0; }
        .glass { background: var(--card); border: 1px solid rgba(255,255,255,0.05); }
        .page { display: none; height: 100%; flex-direction: column; padding: 1.5rem; overflow-y: auto; }
        .active-page { display: flex; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .sidebar-btn { width: 100%; text-align: right; padding: 1rem; border-radius: 1rem; display: flex; align-items: center; gap: 1rem; cursor: pointer; transition: 0.3s; }
        .sidebar-btn:hover, .sidebar-btn.active { background: var(--accent); color: white; }
    </style>
</head>
<body class="flex">

    <!-- صفحة الدخول -->
    <div id="authPage" class="fixed inset-0 z-[500] bg-slate-950 flex items-center justify-center p-4">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-md text-center border-blue-500/30 border shadow-2xl">
            <h2 id="authTitle" class="text-2xl font-bold mb-6 text-blue-500">الخوارزمية - دخول</h2>
            <div class="space-y-4">
                <input type="text" id="uName" placeholder="اسم المستخدم" class="w-full p-4 rounded-xl text-center bg-slate-900 border border-white/10 outline-none text-white">
                <input type="password" id="uPass" placeholder="كلمة السر" class="w-full p-4 rounded-xl text-center bg-slate-900 border border-white/10 outline-none text-white">
                <button onclick="handleAuth()" id="authMainBtn" class="w-full bg-blue-600 p-4 rounded-xl font-bold hover:bg-blue-700 transition text-white">دخول</button>
                <button onclick="toggleAuthMode()" id="toggleAuthBtn" class="text-blue-400 text-xs mt-2 underline">إنشاء حساب جديد</button>
            </div>
        </div>
    </div>

    <!-- التطبيق الرئيسي -->
    <div id="mainApp" class="hidden flex w-full h-full">
        <aside class="w-64 glass flex flex-col p-4 border-l border-white/5">
            <div class="mb-8 px-2 flex items-center gap-3">
                <i class="fas fa-terminal text-2xl text-blue-500"></i>
                <h1 class="font-bold text-xl text-white">الخوارزمية</h1>
            </div>
            <nav class="flex-1 space-y-1">
                <button onclick="showPage('dashboard')" id="btn-dashboard" class="sidebar-btn active"><i class="fas fa-home"></i> الرئيسية</button>
                <button onclick="showPage('chat')" id="btn-chat" class="sidebar-btn"><i class="fas fa-comments"></i> المحادثة</button>
                <button onclick="logout()" class="w-full p-3 bg-red-500/10 text-red-500 rounded-xl font-bold mt-10">خروج</button>
            </nav>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <!-- الصفحة الرئيسية -->
            <div id="p-dashboard" class="page active-page">
                <h2 id="helloUser" class="text-3xl font-bold mb-8 text-white"></h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="glass p-8 rounded-3xl border-r-8 border-blue-500">
                        <p class="opacity-60 font-bold mb-2">عدد أعضاء الفريق</p>
                        <p id="userCount" class="text-6xl font-black">0</p>
                    </div>
                </div>
            </div>

            <!-- صفحة الشات -->
            <div id="p-chat" class="page">
                <h2 class="text-2xl font-bold mb-4">المحادثة السحابية</h2>
                <div class="flex-1 glass rounded-2xl p-4 mb-4 overflow-y-auto" id="chatBox">
                    <!-- الرسايل هتظهر هنا -->
                </div>
                <div class="flex gap-2">
                    <input type="text" id="chatInput" class="flex-1 bg-slate-800 p-4 rounded-xl outline-none" placeholder="اكتب رسالة...">
                    <button onclick="alert('قريباً: ربط الشات بالسيرفر')" class="bg-blue-600 px-6 rounded-xl"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- إعدادات Supabase (عدل البيانات دي من صورك) ---
        const supabaseUrl = 'حط_الرابط_بتاعك_هنا'; 
        const supabaseKey = 'حط_مفتاح_anon_هنا';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        let isLoginMode = true;

        // تبديل الواجهة
        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('authTitle').innerText = isLoginMode ? "الخوارزمية - دخول" : "الخوارزمية - حساب جديد";
            document.getElementById('authMainBtn').innerText = isLoginMode ? "دخول" : "إنشاء حساب";
        }

        // تسجيل الدخول أو الاشتراك
        async function handleAuth() {
            const user = document.getElementById('uName').value;
            const pass = document.getElementById('uPass').value;

            if (!user || !pass) return alert("اكتب البيانات يا بطل");

            if (isLoginMode) {
                const { data, error } = await _supabase
                    .from('users')
                    .select('*')
                    .eq('username', user)
                    .eq('password', pass)
                    .single();

                if (data) loginSuccess(data);
                else alert("خطأ في الاسم أو الباسورد");
            } else {
                const { error } = await _supabase
                    .from('users')
                    .insert([{ username: user, password: pass }]);

                if (!error) {
                    alert("تم التسجيل بنجاح! سجل دخولك الآن");
                    toggleAuthMode();
                } else {
                    alert("الاسم ده موجود قبل كدة أو فيه مشكلة");
                }
            }
        }

        function loginSuccess(userData) {
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('helloUser').innerText = `أهلاً، ${userData.username} 👋`;
            updateStats();
        }

        async function updateStats() {
            const { count } = await _supabase.from('users').select('*', { count: 'exact', head: true });
            document.getElementById('userCount').innerText = count || 0;
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('p-' + pageId).classList.add('active-page');
            document.getElementById('btn-' + pageId).classList.add('active');
        }

        function logout() { location.reload(); }
    </script>
</body>
</html>
