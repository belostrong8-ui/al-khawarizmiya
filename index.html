```html
<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatHub Ultimate System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .win11-card { background: rgba(30, 30, 30, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .toast { transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#121212] text-white h-screen flex font-sans overflow-hidden">

    <!-- نظام الإشعارات -->
    <div id="toast-container" class="fixed top-5 right-5 z-[100] flex flex-col gap-3"></div>

    <!-- شاشة الدخول والاشتراك -->
    <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-[#121212]">
        <div class="win11-card p-8 rounded-2xl w-96 text-center shadow-2xl">
            <h1 id="auth-title" class="text-2xl font-bold mb-6">تسجيل الدخول</h1>
            <form id="auth-form" class="space-y-4">
                <input type="text" id="username-input" placeholder="اسم المستخدم" class="hidden w-full bg-[#2d2d2d] p-3 rounded-lg border border-gray-600 outline-none">
                <input type="email" placeholder="البريد الإلكتروني" class="w-full bg-[#2d2d2d] p-3 rounded-lg border border-gray-600 outline-none" required dir="ltr">
                <input type="password" placeholder="كلمة المرور" class="w-full bg-[#2d2d2d] p-3 rounded-lg border border-gray-600 outline-none" required dir="ltr">
                <button type="submit" id="auth-btn" class="w-full bg-blue-600 p-3 rounded-lg font-bold hover:bg-blue-700">دخول</button>
            </form>
            <p class="mt-4 text-sm text-gray-400" id="toggle-text">ليس لديك حساب؟ <button onclick="toggleAuth()" class="text-blue-400 font-bold">أنشئ حساباً</button></p>
        </div>
    </div>

    <!-- واجهة التطبيق الرئيسية -->
    <div id="app-content" class="hidden flex w-full">
        <nav class="w-64 bg-[#1c1c1c] p-4 flex flex-col gap-4 border-l border-gray-800">
            <div class="flex items-center gap-3 p-2 bg-[#2d2d2d] rounded-lg">
                <img id="user-avatar" src="https://api.dicebear.com/7.x/avataaars/svg?seed=123" class="w-10 h-10 rounded-full border-2 border-blue-500">
                <div>
                    <div id="display-name" class="font-bold">المستخدم</div>
                    <div class="text-xs text-green-400">متصل الآن</div>
                </div>
            </div>
            <button onclick="switchView('chat')" class="text-right p-3 hover:bg-[#333] rounded-lg"><i class="fa-solid fa-comments ml-3"></i> المحادثات</button>
            <button onclick="switchView('library')" class="text-right p-3 hover:bg-[#333] rounded-lg"><i class="fa-solid fa-folder-open ml-3"></i> المكتبة (Files)</button>
            <button onclick="location.reload()" class="mt-auto text-right p-3 hover:bg-red-900 rounded-lg text-red-400"><i class="fa-solid fa-right-from-bracket ml-3"></i> تسجيل الخروج</button>
        </nav>

        <main class="flex-1 p-8 overflow-y-auto">
            <!-- صفحة المحادثة -->
            <div id="chat-view">
                <h2 class="text-2xl font-bold mb-4">غرفة الدردشة العامة</h2>
                <div class="win11-card h-[60vh] p-4 rounded-xl overflow-y-auto" id="msg-box"></div>
                <input type="text" id="msg-input" placeholder="اكتب رسالتك..." class="w-full mt-4 bg-[#2d2d2d] p-3 rounded-lg outline-none">
            </div>

            <!-- صفحة المكتبة -->
            <div id="library-view" class="hidden">
                <h2 class="text-2xl font-bold mb-4">المكتبة (Files)</h2>
                <div class="win11-card rounded-xl p-6">
                    <input type="file" id="file-picker" class="hidden" onchange="uploadFile(event)">
                    <button onclick="document.getElementById('file-picker').click()" class="bg-blue-600 px-4 py-2 rounded-lg mb-4 hover:bg-blue-700">رفع ملف جديد</button>
                    <div id="file-list" class="space-y-2"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // التبديل بين الدخول والاشتراك
        let isLogin = true;
        function toggleAuth() {
            isLogin = !isLogin;
            document.getElementById('auth-title').innerText = isLogin ? "تسجيل الدخول" : "إنشاء حساب";
            document.getElementById('auth-btn').innerText = isLogin ? "دخول" : "تسجيل";
            document.getElementById('username-input').classList.toggle('hidden');
            document.getElementById('toggle-text').innerHTML = isLogin ? 'ليس لديك حساب؟ <button onclick="toggleAuth()" class="text-blue-400 font-bold">أنشئ حساباً</button>' : 'لديك حساب؟ <button onclick="toggleAuth()" class="text-blue-400 font-bold">سجل دخولك</button>';
        }

        // تسجيل الدخول
        document.getElementById('auth-form').onsubmit = (e) => {
            e.preventDefault();
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-content').classList.remove('hidden');
            showNotification("تم تسجيل الدخول بنجاح!", "success");
        };

        // نظام الإشعارات
        function showNotification(msg, type) {
            const toast = document.createElement('div');
            toast.className = `toast win11-card p-4 rounded-xl border-r-4 ${type === 'success' ? 'border-green-500' : 'border-blue-500'} flex items-center gap-3`;
            toast.innerHTML = `<i class="fa-solid fa-bell"></i> <span>${msg}</span>`;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // التبديل بين الصفحات
        function switchView(view) {
            document.getElementById('chat-view').classList.toggle('hidden', view !== 'chat');
            document.getElementById('library-view').classList.toggle('hidden', view !== 'library');
        }

        // رفع الملفات
        function uploadFile(e) {
            const file = e.target.files[0];
            if(file) {
                const list = document.getElementById('file-list');
                list.innerHTML += `<div class="p-3 bg-[#2d2d2d] rounded-lg flex justify-between"><span>${file.name}</span><span>${(file.size/1024).toFixed(1)} KB</span></div>`;
                showNotification("تم رفع الملف بنجاح: " + file.name, "success");
            }
        }
    </script>
</body>
</html>

```
