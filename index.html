<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الخوارزمية - V25 Stable</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #020617; --card: #0f172a; --text: #f8fafc; --accent: #3b82f6; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); height: 100vh; overflow: hidden; margin: 0; }
        .glass { background: var(--card); border: 1px solid rgba(255,255,255,0.05); }
        .page { display: none; height: 100%; flex-direction: column; padding: 1.5rem; overflow-y: auto; }
        .active-page { display: flex; animation: fadeIn 0.1s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .sidebar-btn { width: 100%; text-align: right; padding: 1rem; border-radius: 1rem; display: flex; align-items: center; gap: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .sidebar-btn:hover, .sidebar-btn.active { background: var(--accent); color: white; }
    </style>
</head>
<body class="flex">

    <div id="authPage" class="fixed inset-0 z-[500] bg-slate-950 flex items-center justify-center p-4">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-md text-center border-blue-500/30 border shadow-2xl">
            <h2 id="authTitle" class="text-2xl font-bold mb-6 text-blue-500">الخوارزمية - دخول</h2>
            <div class="space-y-4">
                <input type="text" id="uName" placeholder="اسم المستخدم" class="w-full p-4 rounded-xl text-center bg-slate-900 border border-white/10 outline-none">
                <input type="password" id="uPass" placeholder="كلمة السر" class="w-full p-4 rounded-xl text-center bg-slate-900 border border-white/10 outline-none">
                <button onclick="handleAuth()" id="authBtn" class="w-full bg-blue-600 p-4 rounded-xl font-bold hover:bg-blue-700 transition">دخول</button>
                <button onclick="toggleAuthMode()" id="toggleAuthBtn" class="text-blue-400 text-xs mt-2 underline">ليس لديك حساب؟ إنشاء حساب جديد</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden flex w-full h-full">
        <aside class="w-64 glass flex flex-col p-4 border-l border-white/5">
            <div class="mb-10 px-2 flex items-center gap-3">
                <i class="fas fa-terminal text-2xl text-blue-500"></i>
                <h1 class="font-bold text-xl">الخوارزمية</h1>
            </div>
            <nav class="flex-1 space-y-1">
                <button onclick="showPage('dashboard')" id="btn-dashboard" class="sidebar-btn active"><i class="fas fa-home"></i> الرئيسية</button>
                <button onclick="showPage('chat')" id="btn-chat" class="sidebar-btn"><i class="fas fa-comments"></i> المحادثة</button>
                <button onclick="showPage('members')" id="btn-members" class="sidebar-btn"><i class="fas fa-users"></i> الأعضاء</button>
                <button onclick="showPage('library')" id="btn-library" class="sidebar-btn"><i class="fas fa-book"></i> المكتبة</button>
                <button id="adminLink" onclick="showPage('admin')" class="hidden sidebar-btn text-yellow-500"><i class="fas fa-crown"></i> لوحة القائد</button>
            </nav>
            <button onclick="logout()" class="w-full p-3 bg-red-500/10 text-red-500 rounded-xl font-bold mt-4">خروج</button>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <div id="p-dashboard" class="page active-page">
                <h2 id="helloUser" class="text-3xl font-bold mb-8"></h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="glass p-8 rounded-3xl border-r-8 border-red-500">
                        <p class="opacity-60 font-bold">الملفات المرفوعة</p>
                        <p id="fileCount" class="text-6xl font-black">0</p>
                    </div>
                </div>
            </div>

            <div id="p-chat" class="page">
                <div class="flex gap-4 h-full overflow-hidden">
                    <div class="w-48 glass rounded-2xl p-3 overflow-y-auto hidden md:block">
                        <h3 class="text-[10px] font-bold mb-3 opacity-40">اختر عضواً</h3>
                        <div id="chatUserList" class="flex flex-col gap-2"></div>
                    </div>
                    <div class="flex-1 flex flex-col overflow-hidden">
                        <div id="chatBox" class="flex-1 glass rounded-2xl p-4 mb-4 overflow-y-auto flex flex-col gap-3"></div>
                        <div class="flex gap-2 p-2 glass rounded-2xl">
                            <input type="file" id="chatFile" accept="application/pdf" class="hidden" onchange="uploadAction()">
                            <button id="chatMediaBtn" onclick="document.getElementById('chatFile').click()" class="hidden bg-slate-700 h-12 w-12 rounded-xl"><i class="fas fa-paperclip"></i></button>
                            <input type="text" id="chatInput" class="flex-1 bg-transparent p-4 outline-none" placeholder="اكتب رسالتك...">
                            <button onclick="sendMsg()" class="bg-blue-600 h-12 w-12 rounded-xl"><i class="fas fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="p-library" class="page">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold">المكتبة الرقمية</h2>
                    <button id="libUploadBtn" onclick="document.getElementById('chatFile').click()" class="hidden bg-blue-600 px-6 py-2 rounded-xl font-bold">رفع PDF</button>
                </div>
                <div id="fileList" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
            </div>

            <div id="p-members" class="page">
                <h2 class="text-2xl font-bold mb-4">سجل الفريق</h2>
                <div class="glass rounded-2xl overflow-hidden">
                    <table class="w-full text-right"><thead class="bg-white/5 opacity-50"><tr><th class="p-4">الاسم</th><th class="p-4">إجراء</th></tr></thead><tbody id="memberTableBody"></tbody></table>
                </div>
            </div>

            <div id="p-admin" class="page">
                <h2 class="text-2xl font-bold text-yellow-500 mb-6">لوحة القائد</h2>
                <div class="glass p-6 rounded-3xl">
                    <h3 class="font-bold mb-4">تحديث الخبر</h3>
                    <input type="text" id="newsInput" class="w-full p-4 rounded-xl bg-slate-900 border border-white/10 mb-4" placeholder="اكتب الخبر...">
                    <button onclick="alert('تم التحديث')" class="bg-blue-600 px-8 py-3 rounded-xl font-bold">تحديث</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        let users = JSON.parse(localStorage.getItem('alg_db_v25') || '[{"name":"belal","pass":"159078@1#","role":"ADMIN"}]');
        let session = JSON.parse(localStorage.getItem('alg_session_v25') || 'null');
        let msgs = JSON.parse(localStorage.getItem('alg_msgs_v25') || '[]');
        let files = JSON.parse(localStorage.getItem('alg_files_v25') || '[]');
        let isLogin = true;

        function toggleAuthMode() {
            isLogin = !isLogin;
            document.getElementById('authTitle').innerText = isLogin ? 'دخول' : 'حساب جديد';
            document.getElementById('authBtn').innerText = isLogin ? 'دخول' : 'إنشاء حساب';
            document.getElementById('toggleAuthBtn').innerText = isLogin ? 'ليس لديك حساب؟ إنشاء حساب جديد' : 'لديك حساب بالفعل؟ سجل دخولك';
        }

        function handleAuth() {
            const n = document.getElementById('uName').value.trim().toLowerCase();
            const p = document.getElementById('uPass').value;
            if(isLogin) {
                const u = users.find(x => x.name === n && x.pass === p);
                if(u) { localStorage.setItem('alg_session_v25', JSON.stringify(u)); location.reload(); }
                else alert('خطأ!');
            } else {
                if(users.find(x => x.name === n)) return alert('الاسم موجود!');
                users.push({name: n, pass: p, role: 'USER'});
                localStorage.setItem('alg_db_v25', JSON.stringify(users));
                toggleAuthMode();
            }
        }

        function updateUI() {
            if(!session) return;
            document.getElementById('helloUser').innerText = `أهلاً يا ${session.name}`;
            document.getElementById('fileCount').innerText = files.length;
            if(session.role === 'ADMIN') {
                document.getElementById('adminLink').classList.remove('hidden');
                document.getElementById('chatMediaBtn').classList.remove('hidden');
                document.getElementById('libUploadBtn').classList.remove('hidden');
            }
            renderChat(); renderMembers(); renderFiles(); renderChatUsers();
        }

        function renderChatUsers() {
            document.getElementById('chatUserList').innerHTML = users.map(u => `<button onclick="mention('${u.name}')" class="p-2 glass rounded-lg text-right truncate text-xs font-bold w-full hover:bg-blue-600/20">${u.name}</button>`).join('');
        }

        function mention(n) { document.getElementById('chatInput').value = `@${n} : `; document.getElementById('chatInput').focus(); }

        function uploadAction() {
            const f = document.getElementById('chatFile').files[0];
            if(f) {
                files.push({id: Date.now(), name: f.name});
                msgs.push({id: Date.now(), user: session.name, text: `📎 ملف: ${f.name}`, isFile: true});
                localStorage.setItem('alg_files_v25', JSON.stringify(files));
                localStorage.setItem('alg_msgs_v25', JSON.stringify(msgs));
                updateUI(); alert('تم الرفع!');
            }
        }

        function sendMsg() {
            const t = document.getElementById('chatInput').value.trim();
            if(!t) return;
            msgs.push({id: Date.now(), user: session.name, text: t});
            localStorage.setItem('alg_msgs_v25', JSON.stringify(msgs));
            document.getElementById('chatInput').value = ''; renderChat();
        }

        function renderChat() {
            const b = document.getElementById('chatBox');
            b.innerHTML = msgs.map(m => `
                <div class="p-3 glass rounded-xl ${m.user === session.name ? 'mr-auto bg-blue-500/10' : 'ml-auto'} max-w-[80%]">
                    <span class="text-[10px] font-bold text-blue-400">${m.user}</span>
                    <p class="text-sm ${m.isFile?'text-green-400':''}">${m.text}</p>
                </div>
            `).join('');
            b.scrollTop = b.scrollHeight;
        }

        function renderFiles() { document.getElementById('fileList').innerHTML = files.map(f => `<div class="glass p-4 rounded-xl border-r-4 border-red-500">📄 ${f.name}</div>`).join(''); }
        function renderMembers() { document.getElementById('memberTableBody').innerHTML = users.map(u => `<tr class="border-b border-white/5"><td class="p-4">${u.name}</td><td class="p-4">${u.name!=='belal' && session.role==='ADMIN' ? `<button onclick="delU('${u.name}')" class="text-red-500">حذف</button>`:'-'}</td></tr>`).join(''); }
        function delU(n) { users = users.filter(x => x.name !== n); localStorage.setItem('alg_db_v25', JSON.stringify(users)); renderMembers(); renderChatUsers(); }
        function showPage(id) { document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page')); document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active')); document.getElementById('p-'+id).classList.add('active-page'); document.getElementById('btn-'+id).classList.add('active'); }
        function logout() { localStorage.removeItem('alg_session_v25'); location.reload(); }
        if(session) { document.getElementById('authPage').classList.add('hidden'); document.getElementById('mainApp').classList.remove('hidden'); updateUI(); }
    </script>
</body>
</html>
