<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخوارزمية - V20 ULTIMATE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        :root { --bg: #020617; --card: #0f172a; --text: #f8fafc; --accent: #3b82f6; }
        body { font-family: 'Tajawal', sans-serif; background-color: var(--bg); color: var(--text); height: 100vh; overflow: hidden; margin: 0; }
        .glass { background: var(--card); border: 1px solid rgba(255,255,255,0.05); }
        .page { display: none; height: 100%; flex-direction: column; padding: 1.5rem; overflow-y: auto; }
        .active-page { display: flex; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .sidebar-btn { width: 100%; text-align: right; padding: 1rem; border-radius: 1rem; display: flex; align-items: center; gap: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .sidebar-btn:hover { background: rgba(59, 130, 246, 0.1); color: var(--accent); }
        .sidebar-btn.active { background: var(--accent); color: white; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .animate-marquee { display: inline-block; animation: marquee 15s linear infinite; white-space: nowrap; width: 100%; }
    </style>
</head>
<body class="flex">

    <div id="authPage" class="fixed inset-0 z-[500] bg-slate-950 flex items-center justify-center p-4">
        <div class="glass p-8 rounded-[2.5rem] w-full max-w-md text-center border-blue-500/30 border shadow-2xl">
            <h2 id="authTitle" class="text-2xl font-bold mb-6 text-blue-500">الخوارزمية - دخول</h2>
            <div class="space-y-4">
                <input type="text" id="uName" placeholder="اسم المستخدم" class="w-full p-4 rounded-xl text-center bg-slate-900 border border-white/10 outline-none">
                <input type="password" id="uPass" placeholder="كلمة السر" class="w-full p-4 rounded-xl text-center bg-slate-900 border border-white/10 outline-none">
                <button onclick="handleAuth()" id="mainBtn" class="w-full bg-blue-600 p-4 rounded-xl font-bold hover:bg-blue-700 transition">دخول</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden flex w-full h-full">
        <aside class="w-64 glass flex flex-col p-4 border-l border-white/5">
            <div class="mb-10 flex items-center gap-3 px-2">
                <i class="fas fa-terminal text-2xl text-blue-500"></i>
                <h1 class="font-bold text-xl">الخوارزمية</h1>
            </div>
            <nav class="flex-1 space-y-1">
                <button onclick="showPage('dashboard')" id="btn-dashboard" class="sidebar-btn"><i class="fas fa-home"></i> الرئيسية</button>
                <button onclick="showPage('chat')" id="btn-chat" class="sidebar-btn"><i class="fas fa-comments"></i> المراسلات</button>
                <button onclick="showPage('members')" id="btn-members" class="sidebar-btn"><i class="fas fa-users"></i> الأعضاء</button>
                <button onclick="showPage('library')" id="btn-library" class="sidebar-btn"><i class="fas fa-book"></i> المكتبة</button>
                <button id="adminLink" onclick="showPage('admin')" class="hidden sidebar-btn text-yellow-500"><i class="fas fa-crown"></i> لوحة القائد</button>
            </nav>
            <button onclick="logout()" class="w-full p-3 bg-red-500/10 text-red-500 rounded-xl font-bold mt-4">خروج</button>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <div id="p-dashboard" class="page active-page">
                <div class="bg-blue-600/10 border border-blue-500/20 p-4 rounded-2xl mb-8 overflow-hidden">
                    <div id="newsDisplay" class="animate-marquee font-bold text-blue-400"></div>
                </div>
                <h2 id="helloUser" class="text-3xl font-bold mb-4"></h2>
                <div class="glass p-6 rounded-3xl border-r-4 border-blue-500 w-fit">
                    <p class="opacity-50 text-xs">إجمالي الأعضاء</p>
                    <p id="userCount" class="text-4xl font-black mt-1">0</p>
                </div>
            </div>

            <div id="p-chat" class="page">
                <div class="flex gap-4 h-full overflow-hidden">
                    <div class="w-48 glass rounded-2xl p-3 overflow-y-auto">
                        <h3 class="text-[10px] font-bold mb-3 opacity-40">الأعضاء</h3>
                        <div id="chatUserList" class="flex flex-col gap-2"></div>
                    </div>
                    <div class="flex-1 flex flex-col overflow-hidden">
                        <div id="chatBox" class="flex-1 glass rounded-2xl p-4 mb-4 overflow-y-auto flex flex-col gap-3"></div>
                        <div class="flex gap-2 p-2 glass rounded-2xl">
                            <input type="text" id="chatInput" class="flex-1 bg-transparent p-4 outline-none" placeholder="اكتب رسالة...">
                            <button onclick="sendMsg()" class="bg-blue-600 h-12 w-12 rounded-xl"><i class="fas fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="p-members" class="page">
                <h2 class="text-2xl font-bold mb-4 text-blue-400">سجل الفريق</h2>
                <div class="glass p-4 rounded-2xl overflow-x-auto">
                    <table class="w-full text-right text-sm">
                        <thead><tr class="opacity-40 border-b border-white/5"><th>الاسم</th><th>كلمة السر</th><th id="adminHead" class="hidden">حذف</th></tr></thead>
                        <tbody id="memberTableBody"></tbody>
                    </table>
                </div>
            </div>

            <div id="p-library" class="page">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-2xl font-bold">المكتبة الرقمية</h2>
                    <div id="leaderUpload" class="hidden">
                        <input type="file" id="pdfFile" accept="application/pdf" class="hidden" onchange="doUpload()">
                        <button onclick="document.getElementById('pdfFile').click()" class="bg-blue-600 px-6 py-3 rounded-2xl font-bold flex items-center gap-2 hover:bg-blue-700 transition">
                            <i class="fas fa-file-upload"></i> رفع ملف PDF
                        </button>
                    </div>
                </div>
                <div id="fileList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>

            <div id="p-admin" class="page">
                <h2 class="text-2xl font-bold text-yellow-500 mb-6">لوحة القائد</h2>
                <div class="glass p-6 rounded-2xl">
                    <h3 class="font-bold mb-4">تحديث شريط الأخبار</h3>
                    <div class="flex gap-2">
                        <input type="text" id="newsInput" class="flex-1 p-4 rounded-xl bg-slate-900 border border-white/10" placeholder="اكتب الخبر الجديد...">
                        <button onclick="updateNews()" class="bg-blue-600 px-8 rounded-xl font-bold">نشر</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        let users = JSON.parse(localStorage.getItem('alg_db_v20') || '[{"name":"belal","pass":"159078@1#","role":"ADMIN"}]');
        let session = JSON.parse(localStorage.getItem('alg_session_v20') || 'null');
        let msgs = JSON.parse(localStorage.getItem('alg_msgs_v20') || '[]');
        let files = JSON.parse(localStorage.getItem('alg_files_v20') || '[]');
        let newsText = localStorage.getItem('alg_news_v20') || "مرحباً بكم في منصة الخوارزمية الخاصة بك يا بلال";

        function handleAuth() {
            const name = document.getElementById('uName').value.trim().toLowerCase();
            const pass = document.getElementById('uPass').value;
            const user = users.find(u => u.name === name && u.pass === pass);
            if(user) { localStorage.setItem('alg_session_v20', JSON.stringify(user)); location.reload(); }
            else alert('بيانات خاطئة!');
        }

        function updateUI() {
            if(!session) return;
            document.getElementById('newsDisplay').innerText = newsText;
            document.getElementById('helloUser').innerText = `أهلاً يا ${session.name}`;
            document.getElementById('userCount').innerText = users.length;
            if(session.role === 'ADMIN') {
                document.getElementById('adminLink').classList.remove('hidden');
                document.getElementById('adminHead').classList.remove('hidden');
                document.getElementById('leaderUpload').classList.remove('hidden');
            }
            renderMembers(); renderChat(); renderChatUsers(); renderFiles();
        }

        function doUpload() {
            const file = document.getElementById('pdfFile').files[0];
            if(file) {
                files.push({id: Date.now(), name: file.name, date: new Date().toLocaleDateString()});
                localStorage.setItem('alg_files_v20', JSON.stringify(files));
                alert('تم رفع الملف بنجاح!'); renderFiles();
            }
        }

        function renderFiles() {
            const list = document.getElementById('fileList');
            list.innerHTML = files.map(f => `
                <div class="glass p-5 rounded-2xl flex items-center justify-between border-r-4 border-blue-500 group">
                    <div class="flex items-center gap-4 truncate">
                        <i class="fas fa-file-pdf text-3xl text-red-500"></i>
                        <div class="truncate">
                            <p class="font-bold text-sm truncate">${f.name}</p>
                            <p class="text-[10px] opacity-40">${f.date}</p>
                        </div>
                    </div>
                    ${session.role === 'ADMIN' ? `<button onclick="deleteFile(${f.id})" class="text-red-500 opacity-0 group-hover:opacity-100 transition"><i class="fas fa-trash"></i></button>` : ''}
                </div>
            `).join('');
        }

        function deleteFile(id) {
            if(confirm('مسح الملف من المكتبة؟')) {
                files = files.filter(f => f.id !== id);
                localStorage.setItem('alg_files_v20', JSON.stringify(files)); renderFiles();
            }
        }

        function renderChatUsers() {
            const list = document.getElementById('chatUserList');
            list.innerHTML = users.map(u => `
                <button onclick="mention('${u.name}')" class="p-2 text-[11px] glass rounded-lg hover:bg-blue-600/20 text-right truncate">
                    ${u.name} ${u.role==='ADMIN'?'👑':''}
                </button>
            `).join('');
        }

        function renderMembers() {
            const body = document.getElementById('memberTableBody');
            body.innerHTML = users.map(u => `
                <tr class="border-b border-white/5">
                    <td class="p-3 font-bold text-blue-400 cursor-pointer" onclick="mention('${u.name}')">${u.name}</td>
                    <td class="p-3 opacity-60">${u.pass}</td>
                    <td class="p-3">${(session.role==='ADMIN' && u.name!=='belal') ? `<button onclick="deleteUser('${u.name}')" class="text-red-500"><i class="fas fa-user-minus"></i></button>` : '-'}</td>
                </tr>
            `).join('');
        }

        function sendMsg() {
            const txt = document.getElementById('chatInput').value.trim();
            if(!txt) return;
            msgs.push({id: Date.now(), user: session.name, text: txt, isLeader: session.role==='ADMIN'});
            localStorage.setItem('alg_msgs_v20', JSON.stringify(msgs));
            document.getElementById('chatInput').value = ''; renderChat();
        }

        function renderChat() {
            const box = document.getElementById('chatBox');
            box.innerHTML = msgs.map(m => `
                <div class="p-3 glass rounded-xl ${m.user === session.name ? 'mr-auto bg-blue-500/10' : 'ml-auto'} max-w-[85%] relative group">
                    <div class="flex justify-between gap-4">
                        <span class="text-[10px] font-bold text-blue-400 cursor-pointer" onclick="mention('${m.user}')">${m.user} ${m.isLeader?'👑':''}</span>
                        ${session.role==='ADMIN' ? `<button onclick="deleteMsg(${m.id})" class="text-red-500 opacity-0 group-hover:opacity-100 text-xs"><i class="fas fa-times"></i></button>` : ''}
                    </div>
                    <p class="text-sm mt-1">${m.text}</p>
                </div>
            `).join('');
            box.scrollTop = box.scrollHeight;
        }

        function deleteMsg(id) {
            msgs = msgs.filter(m => m.id !== id);
            localStorage.setItem('alg_msgs_v20', JSON.stringify(msgs)); renderChat();
        }
        function deleteUser(name) {
            users = users.filter(u => u.name !== name);
            localStorage.setItem('alg_db_v20', JSON.stringify(users)); renderMembers(); renderChatUsers();
        }
        function updateNews() {
            localStorage.setItem('alg_news_v20', document.getElementById('newsInput').value);
            location.reload();
        }
        function mention(name) {
            document.getElementById('chatInput').value = `@${name} : `;
            showPage('chat'); document.getElementById('chatInput').focus();
        }
        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('p-'+id).classList.add('active-page');
            document.getElementById('btn-'+id).classList.add('active');
        }
        function logout() { localStorage.removeItem('alg_session_v20'); location.reload(); }

        if(session) {
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            updateUI();
        }
    </script>
</body>
</html>
